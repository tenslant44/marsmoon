<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sudoku</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #181b24;
    --board-bg: #20242f;
    --line: #3a3f4d;
    --line-strong: #6b7280;
    --given: #e6e8ee;
    --user: #6cb3ff;
    --sel: rgba(108, 179, 255, 0.28);
    --rel: rgba(108, 179, 255, 0.10);
    --same: rgba(108, 179, 255, 0.18);
    --bad: #ff6b6b;
    --accent: #4f8fe8;
    --text: #d5d9e2;
    --dim: #8a90a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 18px 10px 30px;
    -webkit-user-select: none;
    user-select: none;
  }
  #app { width: min(94vw, 480px); display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 2px; }
  .controls { display: flex; gap: 8px; align-items: center; }
  select, button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.12); }
  #status { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); min-height: 18px; }
  #msg { color: var(--user); }
  #msg.err { color: var(--bad); }
  #msg.ok { color: #6fe3a0; }

  #board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    background: var(--board-bg);
    border: 2px solid var(--line-strong);
    border-radius: 6px;
    overflow: hidden;
    aspect-ratio: 1;
  }
  .cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(18px, 5.2vw, 28px);
    cursor: pointer;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .cell.c3 { border-right: 2px solid var(--line-strong); }
  .cell.c8 { border-right: none; }
  .cell.r3 { border-bottom: 2px solid var(--line-strong); }
  .cell.r8 { border-bottom: none; }
  .cell .v { color: var(--user); font-weight: 500; }
  .cell.given .v { color: var(--given); font-weight: 600; }
  .cell.related { background: var(--rel); }
  .cell.same { background: var(--same); }
  .cell.sel { background: var(--sel); }
  .cell.conflict .v { color: var(--bad); }
  .cell.flash { animation: flash .5s ease 2; }
  @keyframes flash { 50% { background: rgba(255,107,107,0.4); } }
  .cell.hint { animation: hint 1s ease 1; }
  @keyframes hint { 0% { background: rgba(111,227,160,0.45); } 100% { background: transparent; } }

  .notes {
    position: absolute; inset: 2px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    font-size: clamp(7px, 2vw, 10px);
    color: var(--dim);
    pointer-events: none;
  }
  .notes span { display: flex; align-items: center; justify-content: center; }

  #pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
  #pad button { padding: 12px 0; font-size: 18px; font-weight: 600; color: var(--user); }
  #toolrow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  #toolrow button.active { border-color: var(--accent); color: var(--user); background: rgba(79,143,232,0.15); }

  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 30px 40px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card h2 { font-size: 26px; color: #6fe3a0; }
  .card p { color: var(--dim); font-size: 14px; }
</style>

<style>

body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{touch-action:none}

</style>

<script>
/*AAA-INJECT-SFX*/
window.__gsfx = (function(){
  var ctx=null;
  function ac(){ if(ctx===null){var A=window.AudioContext||window.webkitAudioContext;ctx=A?new A():false;} if(ctx&&ctx.state==='suspended')ctx.resume().catch(function(){}); return ctx||null; }
  function ok(){ return localStorage.getItem('aaa_sfx')!=='0'; }
  function tone(f,d,type,v,slide,when){ if(!ok())return; var c=ac(); if(!c)return; try{ var t=c.currentTime+(when||0); var o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d); g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(v||0.08,t+0.012); g.gain.exponentialRampToValueAtTime(0.0006,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.03);}catch(e){} }
  function noise(dur,v,fq,when,type){ if(!ok())return; var c=ac(); if(!c)return; try{ var t=c.currentTime+(when||0),n=Math.floor(c.sampleRate*dur); var b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0); for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n); var s=c.createBufferSource(); s.buffer=b; var f=c.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=fq||1200; var g=c.createGain(); g.gain.value=v||0.1; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);}catch(e){} }
  var api={
    unlock:ac, tone:tone, noise:noise,
    tap:function(){tone(520,0.05,'triangle',0.05);},
    key:function(){tone(680+Math.random()*60,0.035,'triangle',0.04);},
    deal:function(){noise(0.09,0.09,2600,0,'highpass');tone(300,0.06,'sine',0.04);},
    flip:function(){noise(0.07,0.08,3200,0,'highpass');},
    chip:function(){tone(1900,0.04,'square',0.03);tone(2400,0.03,'square',0.025,null,0.03);noise(0.04,0.05,5000,0,'highpass');},
    clack:function(){noise(0.045,0.1,1600);tone(220,0.05,'triangle',0.07,150);},
    step:function(){tone(330,0.04,'triangle',0.045,280);},
    slide:function(){noise(0.08,0.06,900);tone(260,0.07,'sine',0.045,200);},
    pop:function(i){i=i||0;tone(500+i*80,0.07,'sine',0.07,900+i*120);noise(0.03,0.04,3000,0,'highpass');},
    shoot:function(){tone(700,0.09,'sawtooth',0.05,1400);},
    thud:function(){tone(120,0.12,'sine',0.12,60);noise(0.07,0.08,600);},
    sonar:function(){tone(880,0.35,'sine',0.06);tone(880,0.2,'sine',0.03,null,0.18);},
    splash:function(){noise(0.3,0.1,1200);},
    boom:function(){tone(80,0.5,'sine',0.2,35);noise(0.4,0.16,400);},
    coin:function(){tone(1318,0.06,'square',0.05);tone(1760,0.12,'square',0.05,null,0.06);},
    ding:function(){tone(1046,0.15,'triangle',0.07);tone(1568,0.18,'triangle',0.06,null,0.08);},
    good:function(){tone(659,0.08,'triangle',0.06);tone(880,0.1,'triangle',0.06,null,0.06);},
    bad:function(){tone(180,0.12,'square',0.05,120);},
    win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,0.2,'triangle',0.08,null,i*0.09);});},
    lose:function(){[392,330,262,196].forEach(function(f,i){tone(f,0.26,'sawtooth',0.05,f*0.92,i*0.13);});},
    chord:function(){tone(523,0.14,'sine',0.05);tone(659,0.14,'sine',0.045,null,0.01);tone(784,0.16,'sine',0.04,null,0.02);}
  };
  function unl(){ac();}
  window.addEventListener('pointerdown',unl,{passive:true});
  window.addEventListener('keydown',unl);
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest?e.target.closest('button'):null; if(b&&!b.disabled)api.tap();},true);
  return api;
})();
</script>
</head>
<body>
<div id="app">
  <header>
    <h1>SUDOKU</h1>
    <div class="controls">
      <select id="diff">
        <option value="42">Easy</option>
        <option value="34" selected>Medium</option>
        <option value="28">Hard</option>
      </select>
      <button class="primary" id="newBtn">New Game</button>
    </div>
  </header>

  <div id="status">
    <span id="timer">00:00</span>
    <span id="msg"></span>
    <span id="mistakes">Mistakes: 0</span>
  </div>

  <div id="board"></div>

  <div id="pad"></div>

  <div id="toolrow">
    <button id="eraseBtn">Erase</button>
    <button id="notesBtn">Notes: Off</button>
    <button id="checkBtn">Check</button>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <h2>You Win!</h2>
    <p id="winStats"></p>
    <button class="primary" id="againBtn">Play Again</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Sudoku generation ----------

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function rowOf(i) { return (i / 9) | 0; }
  function colOf(i) { return i % 9; }
  function boxOf(i) { return ((rowOf(i) / 3) | 0) * 3 + ((colOf(i) / 3) | 0); }

  function candidates(b, i) {
    const used = new Set();
    const r = rowOf(i), c = colOf(i);
    for (let k = 0; k < 9; k++) {
      used.add(b[r * 9 + k]);
      used.add(b[k * 9 + c]);
    }
    const br = r - (r % 3), bc = c - (c % 3);
    for (let dr = 0; dr < 3; dr++)
      for (let dc = 0; dc < 3; dc++)
        used.add(b[(br + dr) * 9 + bc + dc]);
    const out = [];
    for (let v = 1; v <= 9; v++) if (!used.has(v)) out.push(v);
    return out;
  }

  function fillSolution(b) {
    const i = b.indexOf(0);
    if (i === -1) return true;
    for (const v of shuffled([1, 2, 3, 4, 5, 6, 7, 8, 9])) {
      if (candidates(b, i).indexOf(v) !== -1) {
        b[i] = v;
        if (fillSolution(b)) return true;
        b[i] = 0;
      }
    }
    return false;
  }

  function countSolutions(b, limit) {
    let count = 0;
    (function rec() {
      if (count >= limit) return;
      let best = -1, bestCands = null;
      for (let i = 0; i < 81; i++) {
        if (b[i] === 0) {
          const c = candidates(b, i);
          if (c.length === 0) return;
          if (bestCands === null || c.length < bestCands.length) {
            best = i; bestCands = c;
            if (c.length === 1) break;
          }
        }
      }
      if (best === -1) { count++; return; }
      for (const v of bestCands) {
        b[best] = v;
        rec();
        b[best] = 0;
        if (count >= limit) return;
      }
    })();
    return count;
  }

  function generate(targetGivens) {
    const b = new Array(81).fill(0);
    fillSolution(b);
    const sol = b.slice();

    // Remove cells in rotationally symmetric pairs, keeping a unique solution.
    const seen = new Set();
    const pairs = [];
    for (let i = 0; i < 81; i++) {
      if (seen.has(i)) continue;
      const j = 80 - i;
      seen.add(i); seen.add(j);
      pairs.push(i === j ? [i] : [i, j]);
    }
    let givens = 81;
    for (const p of shuffled(pairs)) {
      if (givens - p.length < targetGivens) continue;
      const backup = p.map(i => b[i]);
      p.forEach(i => (b[i] = 0));
      if (countSolutions(b, 2) !== 1) {
        p.forEach((i, k) => (b[i] = backup[k]));
      } else {
        givens -= p.length;
      }
      if (givens <= targetGivens) break;
    }
    return { puzzle: b, solution: sol };
  }

  // ---------- Game state ----------

  const boardEl = document.getElementById("board");
  const padEl = document.getElementById("pad");
  const timerEl = document.getElementById("timer");
  const msgEl = document.getElementById("msg");
  const mistakesEl = document.getElementById("mistakes");
  const overlayEl = document.getElementById("overlay");
  const winStatsEl = document.getElementById("winStats");

  let solution, board, givens, notes;
  let selected = -1;
  let mistakes = 0;
  let noteMode = false;
  let finished = false;
  let seconds = 0, timerId = null;

  const cells = [];
  for (let i = 0; i < 81; i++) {
    const d = document.createElement("div");
    d.className = "cell";
    const r = rowOf(i), c = colOf(i);
    if (c % 3 === 2) d.classList.add("c3");
    if (c === 8) d.classList.add("c8");
    if (r % 3 === 2) d.classList.add("r3");
    if (r === 8) d.classList.add("r8");
    const v = document.createElement("span");
    v.className = "v";
    d.appendChild(v);
    const n = document.createElement("div");
    n.className = "notes";
    for (let k = 0; k < 9; k++) n.appendChild(document.createElement("span"));
    d.appendChild(n);
    d.addEventListener("click", () => select(i));
    boardEl.appendChild(d);
    cells.push(d);
  }

  for (let v = 1; v <= 9; v++) {
    const btn = document.createElement("button");
    btn.textContent = v;
    btn.addEventListener("click", () => input(v));
    padEl.appendChild(btn);
  }

  function select(i) {
    selected = i;
    if (window.__gsfx) __gsfx.key();
    render();
  }

  function peersConflict(i) {
    const v = board[i];
    if (v === 0) return false;
    const r = rowOf(i), c = colOf(i), bx = boxOf(i);
    for (let k = 0; k < 81; k++) {
      if (k === i || board[k] !== v) continue;
      if (rowOf(k) === r || colOf(k) === c || boxOf(k) === bx) return true;
    }
    return false;
  }

  function render() {
    const selVal = selected >= 0 ? board[selected] : 0;
    const sr = selected >= 0 ? rowOf(selected) : -1;
    const sc = selected >= 0 ? colOf(selected) : -1;
    const sb = selected >= 0 ? boxOf(selected) : -1;
    for (let i = 0; i < 81; i++) {
      const d = cells[i];
      const v = board[i];
      d.classList.toggle("given", givens.has(i));
      d.classList.toggle("sel", i === selected);
      d.classList.toggle("related",
        selected >= 0 && i !== selected &&
        (rowOf(i) === sr || colOf(i) === sc || boxOf(i) === sb));
      d.classList.toggle("same", selVal !== 0 && v === selVal && i !== selected);
      d.classList.toggle("conflict", !givens.has(i) && v !== 0 && peersConflict(i));
      d.querySelector(".v").textContent = v === 0 ? "" : v;
      const ns = notes[i];
      const kids = d.querySelector(".notes").children;
      for (let k = 0; k < 9; k++) kids[k].textContent = v === 0 && ns.has(k + 1) ? k + 1 : "";
    }
    mistakesEl.textContent = "Mistakes: " + mistakes;
  }

  function msg(text, cls) {
    msgEl.textContent = text;
    msgEl.className = cls || "";
  }

  function fmt(s) {
    return String((s / 60) | 0).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  function startTimer() {
    clearInterval(timerId);
    seconds = 0;
    timerEl.textContent = "00:00";
    timerId = setInterval(() => {
      if (!finished) {
        seconds++;
        timerEl.textContent = fmt(seconds);
      }
    }, 1000);
  }

  function newGame() {
    const target = parseInt(document.getElementById("diff").value, 10);
    msg("Generating...", "");
    overlayEl.classList.remove("show");
    setTimeout(() => {
      const g = generate(target);
      solution = g.solution;
      board = g.puzzle.slice();
      givens = new Set();
      for (let i = 0; i < 81; i++) if (g.puzzle[i] !== 0) givens.add(i);
      notes = Array.from({ length: 81 }, () => new Set());
      selected = -1;
      mistakes = 0;
      noteMode = false;
      finished = false;
      document.getElementById("notesBtn").textContent = "Notes: Off";
      document.getElementById("notesBtn").classList.remove("active");
      msg("", "");
      startTimer();
      render();
    }, 30);
  }

  function input(v) {
    if (finished || selected < 0 || givens.has(selected)) return;
    if (noteMode) {
      if (board[selected] !== 0) return;
      const s = notes[selected];
      s.has(v) ? s.delete(v) : s.add(v);
      if (window.__gsfx) __gsfx.key();
      render();
      return;
    }
    if (board[selected] === v) return;
    board[selected] = v;
    notes[selected].clear();
    const wrongNow = v !== solution[selected];
    if (wrongNow) mistakes++;
    if (window.__gsfx) {
      if (wrongNow) __gsfx.bad();
      else { __gsfx.good(); if (peersConflict(selected) === false && board.filter((x, i) => i !== selected && x === v).length === 8) __gsfx.ding(); }
    }
    render();
    checkWin();
  }

  function erase() {
    if (finished || selected < 0 || givens.has(selected)) return;
    board[selected] = 0;
    notes[selected].clear();
    if (window.__gsfx) __gsfx.tone(300, 0.05, 'triangle', 0.04, 200);
    render();
  }

  function checkWin() {
    for (let i = 0; i < 81; i++) {
      if (board[i] !== solution[i]) return;
    }
    finished = true;
    const diffKey = document.getElementById("diff").value;
    let bests = {};
    try { bests = JSON.parse(localStorage.getItem("sd_best") || "{}"); } catch (e) {}
    let rec = "";
    if (!bests[diffKey] || seconds < bests[diffKey]) {
      bests[diffKey] = seconds;
      rec = "  ·  NEW BEST!";
      try { localStorage.setItem("sd_best", JSON.stringify(bests)); } catch (e) {}
    }
    winStatsEl.textContent =
      "Time " + fmt(seconds) + "  ·  Mistakes " + mistakes + "  ·  " +
      document.getElementById("diff").selectedOptions[0].textContent +
      "  ·  Best " + fmt(bests[diffKey]) + rec;
    if (window.__gsfx) { __gsfx.win(); if (rec) __gsfx.coin(); }
    overlayEl.classList.add("show");
  }

  function checkBoard() {
    if (finished) return;
    let wrong = 0, empty = 0;
    cells.forEach(c => c.classList.remove("flash", "hint"));
    for (let i = 0; i < 81; i++) {
      if (board[i] === 0) empty++;
      else if (board[i] !== solution[i]) {
        wrong++;
        cells[i].classList.add("flash");
      }
    }
    if (wrong === 0 && empty === 0) { checkWin(); return; }
    if (wrong === 0) msg("All correct so far — " + empty + " to go", "ok");
    else msg(wrong + " incorrect, " + empty + " empty", "err");
  }

  function move(dr, dc) {
    if (selected < 0) { select(0); return; }
    const r = Math.min(8, Math.max(0, rowOf(selected) + dr));
    const c = Math.min(8, Math.max(0, colOf(selected) + dc));
    select(r * 9 + c);
  }

  document.getElementById("newBtn").addEventListener("click", newGame);
  document.getElementById("againBtn").addEventListener("click", newGame);
  document.getElementById("eraseBtn").addEventListener("click", erase);
  document.getElementById("checkBtn").addEventListener("click", checkBoard);
  document.getElementById("notesBtn").addEventListener("click", function () {
    noteMode = !noteMode;
    this.textContent = "Notes: " + (noteMode ? "On" : "Off");
    this.classList.toggle("active", noteMode);
  });
  document.getElementById("diff").addEventListener("change", newGame);

  document.addEventListener("keydown", e => {
    if (e.key >= "1" && e.key <= "9") input(parseInt(e.key, 10));
    else if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") erase();
    else if (e.key === "ArrowUp") { move(-1, 0); e.preventDefault(); }
    else if (e.key === "ArrowDown") { move(1, 0); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { move(0, -1); e.preventDefault(); }
    else if (e.key === "ArrowRight") { move(0, 1); e.preventDefault(); }
    else if (e.key === "n" || e.key === "N") document.getElementById("notesBtn").click();
  });

  newGame();
})();
</script>
