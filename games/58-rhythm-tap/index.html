<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rhythm Tap</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 800px at 50% -10%,#16203a 0%,#0a0e17 60%);color:#eaf2ff;font-family:"Cascadia Mono",Consolas,"Segoe UI",monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
#game{position:relative;width:min(480px,96vw)}
#hud{display:flex;justify-content:space-between;align-items:baseline;padding:6px 6px;letter-spacing:.06em}
#hud .lbl{font-size:11px;color:#7f8db3;text-transform:uppercase}
#score{font-size:22px;font-weight:700}
#hint{font-size:11px;color:#7f8db3}
#stage{position:relative}
canvas{width:100%;height:min(70vh,660px);display:block;border-radius:14px;background:linear-gradient(#0d1322,#0a0f1d);box-shadow:0 0 0 1px #223052,0 18px 60px rgba(0,0,0,.55);touch-action:none}
#judgment{position:absolute;left:0;right:0;top:58%;text-align:center;font-size:38px;font-weight:800;letter-spacing:.08em;pointer-events:none;opacity:0;text-shadow:0 0 18px currentColor}
#judgment.pop{animation:pop .55s ease-out}
@keyframes pop{0%{opacity:1;transform:scale(1.3)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.95)}}
#combo{position:absolute;left:0;right:0;top:13%;text-align:center;pointer-events:none}
#combo b{font-size:34px;text-shadow:0 0 14px rgba(41,199,255,.8)}
#combo span{display:block;font-size:11px;letter-spacing:.35em;color:#7f8db3}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(6,9,16,.88);border-radius:14px;text-align:center;padding:24px;z-index:5}
.overlay.hidden{display:none}
h1{font-size:32px;letter-spacing:.12em;background:linear-gradient(90deg,#29c7ff,#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.overlay p{color:#aebadd;font-size:13px;line-height:1.7;max-width:340px}
kbd{display:inline-block;min-width:26px;padding:3px 7px;margin:0 2px;border:1px solid #3b4a6b;border-bottom-width:3px;border-radius:6px;background:#141d33;font-weight:700}
button{font:inherit;font-weight:700;letter-spacing:.08em;color:#04101c;background:linear-gradient(90deg,#29c7ff,#7cffb2);border:0;border-radius:10px;padding:12px 26px;cursor:pointer;box-shadow:0 0 22px rgba(41,199,255,.45)}
button:hover{filter:brightness(1.1)}
#stats{font-size:14px;color:#aebadd;line-height:2}
#stats b{color:#eaf2ff}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div><div class="lbl">Score</div><div id="score">0</div></div>
    <div id="hint">D F J K or tap lanes &middot; R restart &middot; Esc pause</div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="judgment"></div>
    <div id="combo"><b id="comboN"></b><span id="comboT" style="visibility:hidden">COMBO</span></div>
    <div class="overlay" id="ovMenu">
      <h1>RHYTHM TAP</h1>
      <p>Notes fall down four lanes. Tap the key the moment a note crosses the glowing line.</p>
      <p><kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd></p>
      <p>PERFECT 300 &middot; GOOD 100 &middot; keep your combo alive</p>
      <button id="btnStart">START</button>
    </div>
    <div class="overlay hidden" id="ovDone">
      <h1>RESULTS</h1>
      <div id="stats"></div>
      <button id="btnRetry">RETRY (R)</button>
    </div>
    <div class="overlay hidden" id="ovPause">
      <h1>PAUSED</h1>
      <p>Press <kbd>Esc</kbd> or click to resume</p>
    </div>
  </div>
</div>
<script>
'use strict';
const $=s=>document.getElementById(s);
const cv=$('cv'),g=cv.getContext('2d');
const scoreEl=$('score'),judgeEl=$('judgment'),comboN=$('comboN'),comboT=$('comboT');
const ovMenu=$('ovMenu'),ovDone=$('ovDone'),ovPause=$('ovPause'),statsEl=$('stats');

const KEYCODES=['KeyD','KeyF','KeyJ','KeyK'];
const KEYLABEL=['D','F','J','K'];
const COLORS=['#29c7ff','#7cffb2','#ffd166','#ff5d8f'];
const BPM=120,BEAT=60/BPM;
const W_PERFECT=0.055,W_GOOD=0.12,W_MISS=0.17;
const APPROACH=1.5,NOTE_H=16,TOTAL_BEATS=72;

let actx=null,master=null,noiseBuf=null;
let state='menu';
let notes=[],music=[],musicIdx=0,songStart=0,schedTimer=null;
let score=0,combo=0,maxCombo=0,counts={p:0,g:0,m:0};
let flash=[0,0,0,0],fx=[];
let dpr=1,stageW=0,stageH=0;
let best=0;
try{best=parseInt(localStorage.getItem('rhythmTapBest'),10)||0;}catch(e){}

/* ---------- audio ---------- */
function initAudio(){
  actx=new(window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain();master.gain.value=0.85;master.connect(actx.destination);
  noiseBuf=actx.createBuffer(1,actx.sampleRate*0.5|0,actx.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function env(gn,t,a,v,dur){gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+a);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);}
function kick(t){const o=actx.createOscillator(),gn=actx.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+0.14);env(gn,t,0.004,0.9,0.22);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+0.25);}
function noise(t,dur,fType,freq,q,v){const s=actx.createBufferSource();s.buffer=noiseBuf;const f=actx.createBiquadFilter();f.type=fType;f.frequency.value=freq;f.Q.value=q;const gn=actx.createGain();env(gn,t,0.002,v,dur);s.connect(f);f.connect(gn);gn.connect(master);s.start(t);s.stop(t+dur+0.05);}
function hat(t,v){noise(t,0.05,'highpass',8000,1,0.16*(v||1));}
function snare(t){noise(t,0.12,'bandpass',1900,0.9,0.4);const o=actx.createOscillator(),gn=actx.createGain();o.type='triangle';o.frequency.value=190;env(gn,t,0.003,0.25,0.09);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+0.12);}
function bass(t,fq){const o=actx.createOscillator(),gn=actx.createGain(),fl=actx.createBiquadFilter();o.type='sawtooth';o.frequency.value=fq;fl.type='lowpass';fl.frequency.value=380;env(gn,t,0.01,0.3,BEAT*0.9);o.connect(fl);fl.connect(gn);gn.connect(master);o.start(t);o.stop(t+BEAT);}
function tapSnd(lane,ok){
  if(!actx)return;const t=actx.currentTime;
  const o=actx.createOscillator(),gn=actx.createGain();
  o.type=ok?'square':'sawtooth';o.frequency.value=ok?[520,620,740,880][lane]:110;
  env(gn,t,0.003,ok?0.2:0.28,ok?0.07:0.18);
  o.connect(gn);gn.connect(master);o.start(t);o.stop(t+0.2);
}

/* ---------- chart & music ---------- */
function buildChart(){
  const seq=[0,1,2,3,1,3,0,2,2,0,3,1,0,3,1,2];
  const OFF=4,a=[];
  for(let bar=0;bar<16;bar++)for(let b=0;b<4;b++){
    const st=bar*4+b,lane=seq[st%16];
    a.push({t:(st+OFF)*BEAT,lane});
    if(bar>=4&&bar<8&&b===2)a.push({t:(st+OFF+0.5)*BEAT,lane:(lane+3)%4});
    if(bar>=8&&(b===1||b===3))a.push({t:(st+OFF+0.5)*BEAT,lane:(lane+2)%4});
    if(bar>=12&&b===0)a.push({t:(st+OFF)*BEAT,lane:(lane+1)%4});
  }
  a.sort((x,y)=>x.t-y.t);
  return a.map(n=>({t:n.t,lane:n.lane,judged:false}));
}
function buildMusic(){
  const m=[],bs=[55,55,65.41,82.41];
  for(let b=0;b<TOTAL_BEATS;b++){
    const t=b*BEAT;
    m.push({t:t,k:'kick'},{t:t,k:'bass',f:bs[b%4]},{t:t+BEAT/2,k:'hat'});
    if(b%4===1||b%4===3)m.push({t:t,k:'snare'});
    if(b>=40){m.push({t:t+BEAT*0.25,k:'hat',v:0.5},{t:t+BEAT*0.75,k:'hat',v:0.5});}
  }
  m.sort((x,y)=>x.t-y.t);return m;
}

/* ---------- flow ---------- */
function now(){return actx?actx.currentTime-songStart:0;}
function scheduler(){
  if(state!=='playing')return;
  const ahead=now()+0.3;
  while(musicIdx<music.length&&music[musicIdx].t<ahead){
    const e=music[musicIdx++],t=songStart+e.t;
    if(e.k==='kick')kick(t);else if(e.k==='hat')hat(t,e.v);
    else if(e.k==='snare')snare(t);else bass(t,e.f);
  }
}
function start(){
  if(!actx)initAudio();
  if(actx.state==='suspended')actx.resume();
  notes=buildChart();music=buildMusic();musicIdx=0;
  score=0;combo=0;maxCombo=0;counts={p:0,g:0,m:0};fx=[];flash=[0,0,0,0];
  songStart=actx.currentTime+1.0;
  scoreEl.textContent='0';comboN.textContent='';comboT.style.visibility='hidden';
  state='playing';hideOverlays();
  clearInterval(schedTimer);schedTimer=setInterval(scheduler,50);
}
function finish(){
  state='done';clearInterval(schedTimer);
  const tot=notes.length,acc=tot?((counts.p*300+counts.g*100)/(tot*300)*100):0;
  const newBest=score>best;
  if(newBest){best=score;try{localStorage.setItem('rhythmTapBest',String(best));}catch(e){}}
  statsEl.innerHTML=
    'SCORE <b>'+score+'</b>'+(newBest?' <b style="color:#ffd166">NEW BEST!</b>':'')+'<br>'+
    'MAX COMBO <b>'+maxCombo+'</b><br>'+
    'PERFECT <b>'+counts.p+'</b> &middot; GOOD <b>'+counts.g+'</b> &middot; MISS <b>'+counts.m+'</b><br>'+
    'ACCURACY <b>'+acc.toFixed(1)+'%</b><br>'+
    'BEST <b>'+best+'</b>';
  if(window.AAA){if(newBest){AAA.sfx.win();AAA.flash(0.22);}else AAA.sfx.level();}
  ovDone.classList.remove('hidden');
}
function hideOverlays(){ovMenu.classList.add('hidden');ovDone.classList.add('hidden');ovPause.classList.add('hidden');}
function togglePause(){
  if(state==='playing'){state='paused';actx.suspend();ovPause.classList.remove('hidden');}
  else if(state==='paused'){state='playing';actx.resume();ovPause.classList.add('hidden');}
}

/* ---------- judging ---------- */
function popJudge(txt,color){
  judgeEl.textContent=txt;judgeEl.style.color=color;
  judgeEl.classList.remove('pop');void judgeEl.offsetWidth;judgeEl.classList.add('pop');
}
function updCombo(){comboN.textContent=combo>1?combo:'';comboT.style.visibility=combo>1?'visible':'hidden';}
function hit(lane){
  const t=now();
  flash[lane]=performance.now();
  let best=null,bd=1e9;
  for(const n of notes){
    if(n.lane!==lane||n.judged)continue;
    const d=Math.abs(n.t-t);
    if(d<bd){bd=d;best=n;}
  }
  if(!best||bd>W_MISS)return;
  best.judged=true;
  if(bd<=W_PERFECT){counts.p++;combo++;score+=300;popJudge('PERFECT','#7cffb2');fx.push({t:t,lane:lane,c:COLORS[lane]});tapSnd(lane,true);}
  else if(bd<=W_GOOD){counts.g++;combo++;score+=100;popJudge('GOOD','#ffd166');fx.push({t:t,lane:lane,c:COLORS[lane]});tapSnd(lane,true);}
  else{counts.m++;combo=0;popJudge('MISS','#ff5d8f');tapSnd(lane,false);}
  maxCombo=Math.max(maxCombo,combo);
  scoreEl.textContent=score;updCombo();
}
function doMiss(n){
  n.judged=true;counts.m++;combo=0;
  popJudge('MISS','#ff5d8f');updCombo();tapSnd(0,false);
}

/* ---------- render ---------- */
function roundRect(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function resize(){
  dpr=devicePixelRatio||1;
  const w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  g.setTransform(dpr,0,0,dpr,0,0);
  stageW=w;stageH=h;
}
function frame(){
  requestAnimationFrame(frame);
  resize();
  const W=stageW,H=stageH,laneW=W/4,hitY=H*0.8,t=now();
  g.clearRect(0,0,W,H);
  g.strokeStyle='rgba(70,90,140,.25)';g.lineWidth=1;
  for(let i=1;i<4;i++){g.beginPath();g.moveTo(i*laneW,0);g.lineTo(i*laneW,H);g.stroke();}
  const pt=performance.now();
  for(let i=0;i<4;i++){
    const age=(pt-flash[i])/1000;
    if(age<0.15){g.fillStyle=hexA(COLORS[i],0.18*(1-age/0.15));g.fillRect(i*laneW,hitY-46,laneW,92);}
  }
  g.shadowColor='#29c7ff';g.shadowBlur=16;
  g.fillStyle='rgba(41,199,255,.9)';g.fillRect(0,hitY-2,W,4);
  g.shadowBlur=0;
  for(let i=0;i<4;i++){
    g.strokeStyle=COLORS[i];g.lineWidth=2;g.globalAlpha=.8;
    roundRect(i*laneW+laneW/2-26,hitY-NOTE_H-6,52,NOTE_H*2+12,8);g.stroke();
    g.globalAlpha=1;
    g.fillStyle='rgba(230,242,255,.65)';g.font='700 15px Consolas,monospace';g.textAlign='center';
    g.fillText(KEYLABEL[i],i*laneW+laneW/2,H-14);
  }
  for(const n of notes){
    if(n.judged)continue;
    if(t-n.t>W_MISS){doMiss(n);continue;}
    const y=hitY-(n.t-t)/APPROACH*(hitY+40);
    if(y<-40)continue;
    g.fillStyle=COLORS[n.lane];g.shadowColor=COLORS[n.lane];g.shadowBlur=12;
    roundRect(n.lane*laneW+8,y-NOTE_H/2,laneW-16,NOTE_H,7);g.fill();
    g.shadowBlur=0;
  }
  fx=fx.filter(e=>t-e.t<0.3);
  for(const e of fx){
    const p=(t-e.t)/0.3;g.globalAlpha=1-p;g.strokeStyle=e.c;g.lineWidth=3;
    g.beginPath();g.arc(e.lane*laneW+laneW/2,hitY,18+p*40,0,7);g.stroke();g.globalAlpha=1;
  }
  if(state==='playing'&&notes.length&&t-notes[notes.length-1].t>1.5)finish();
}

/* ---------- input ---------- */
addEventListener('keydown',e=>{
  if(e.repeat)return;
  const c=e.code;
  if(c==='Space'||c==='Enter')e.preventDefault();
  if(state==='menu'){if(c==='Space'||c==='Enter'||KEYCODES.includes(c))start();return;}
  if(state==='done'){if(c==='KeyR'||c==='Space'||c==='Enter')start();return;}
  if(c==='Escape'||c==='KeyP'){togglePause();return;}
  if(c==='KeyR'){start();return;}
  if(state!=='playing')return;
  const lane=KEYCODES.indexOf(c);
  if(lane>=0)hit(lane);
});
cv.addEventListener('pointerdown',e=>{
  if(state!=='playing')return;
  const r=cv.getBoundingClientRect();
  const lane=Math.min(3,Math.max(0,Math.floor((e.clientX-r.left)/r.width*4)));
  hit(lane);
});
$('btnStart').addEventListener('click',start);
$('btnRetry').addEventListener('click',start);
ovPause.addEventListener('click',togglePause);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')togglePause();});
requestAnimationFrame(frame);
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
