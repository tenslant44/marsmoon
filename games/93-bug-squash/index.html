<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bug Squash</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;color:#fff;font-family:system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:12px;
    background:
      radial-gradient(900px 620px at 50% -10%, rgba(63,98,18,.5), transparent 60%),
      radial-gradient(700px 500px at 90% 110%, rgba(20,40,10,.65), transparent 60%),
      #0c1407;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{position:relative;width:min(580px,100%);display:flex;flex-direction:column;gap:9px}
  .hud{
    display:flex;justify-content:space-between;gap:8px;
    background:rgba(28,49,20,.85);border:1px solid rgba(163,230,53,.3);
    padding:9px 15px;border-radius:13px;font-weight:800;font-size:.92rem;
    box-shadow:0 10px 28px rgba(0,0,0,.45);backdrop-filter:blur(6px);
  }
  .hud .lab{font-size:.58rem;letter-spacing:.15em;color:#9cbb7c;display:block;text-transform:uppercase}
  .hud span{color:#bef264;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(190,242,100,.5)}
  .hud .hp{color:#fda4af;text-shadow:0 0 12px rgba(253,164,175,.5)}
  .hud .cm{color:#fdba74;text-shadow:0 0 12px rgba(253,186,116,.5)}
  canvas{
    width:100%;height:auto;aspect-ratio:560/520;border-radius:15px;display:block;
    border:1px solid rgba(163,230,53,.35);cursor:crosshair;touch-action:none;
    box-shadow:0 20px 55px rgba(0,0,0,.6),0 0 50px -14px rgba(163,230,53,.3);
  }
  .ov{
    position:absolute;inset:56px 0 0 0;border-radius:15px;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:22px;gap:14px;
    background:radial-gradient(ellipse at 50% 40%, rgba(45,70,20,.55), rgba(9,16,6,.92) 75%);
    backdrop-filter:blur(4px);transition:opacity .3s,visibility .3s;
  }
  .ov.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .title{
    font-size:clamp(2rem,8vw,3rem);font-weight:900;letter-spacing:.04em;line-height:.95;
    background:linear-gradient(180deg,#fff,#bef264 55%,#4d7c0f);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(163,230,53,.45));
  }
  .title.hot{background:linear-gradient(180deg,#fff,#fda4af 55%,#dc2626);filter:drop-shadow(0 0 22px rgba(220,38,38,.45))}
  .ov p{color:#cfe3b5;max-width:340px;font-size:.93rem;line-height:1.55}
  .statline{display:flex;gap:18px;font-weight:800;font-size:1.02rem}
  .statline b{color:#fde047}
  .btn{
    padding:13px 36px;border:none;border-radius:999px;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg,#bef264,#4ade80);color:#0f1f0a;
    font-weight:900;font-size:1rem;letter-spacing:.05em;
    box-shadow:0 12px 30px -8px rgba(163,230,53,.55),inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .12s;
  }
  .btn:active{transform:scale(.96)}
  .hint{font-size:.75rem;color:#7d9a63;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div><span class="lab">Score</span><span id="score">0</span></div>
    <div><span class="lab">Wave</span><span id="wave">1</span></div>
    <div><span class="lab">Combo</span><span class="cm" id="combo">x1</span></div>
    <div><span class="lab">Picnic</span><span class="hp" id="hp"></span></div>
  </div>
  <canvas id="c" width="560" height="520"></canvas>
  <div class="ov" id="ov">
    <h1 class="title" id="ovT">BUG<br>SQUASH!</h1>
    <p id="ovP">Crawlies are swarming your picnic! Tap or click to squash them before they reach the basket. Chain fast kills for a <b style="color:#fdba74">combo multiplier</b>.</p>
    <div class="statline" id="ovStats" style="display:none"></div>
    <button class="btn" id="startBtn">DEFEND PICNIC</button>
    <div class="hint">Ants are quick · beetles take 2 hits · spiders sprint</div>
  </div>
</div>
<script>
(() => {
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const W = c.width, H = c.height, CX = W/2, CY = H/2;
  const scoreEl = document.getElementById('score'), waveEl = document.getElementById('wave'), hpEl = document.getElementById('hp'), comboEl = document.getElementById('combo');
  const HEART_SVG = '<svg viewBox="0 0 24 24" style="width:1em;height:1em;vertical-align:-.14em"><path d="M12 21C6.4 16.2 3 12.7 3 9.1A5.1 5.1 0 0 1 12 5.7 5.1 5.1 0 0 1 21 9.1c0 3.6-3.4 7.1-9 11.9z" fill="#fda4af" stroke="#fb7185" stroke-width="1"/></svg>';
  const hearts = n => HEART_SVG.repeat(n);
  hpEl.innerHTML = hearts(5);
  const ov = document.getElementById('ov'), ovT = document.getElementById('ovT'), ovP = document.getElementById('ovP'), ovStats = document.getElementById('ovStats'), startBtn = document.getElementById('startBtn');

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);return this;};
  }

  let ac = null;
  const audio = () => { const A = window.AudioContext || window.webkitAudioContext; if (!ac && A) ac = new A(); if (ac && ac.state === 'suspended') ac.resume().catch(()=>{}); return ac; };
  const sfxOn = () => localStorage.getItem('aaa_sfx') !== '0';
  function tone(f, d, type='sine', vol=0.06, slide=null){
    if (!sfxOn()) return; const x = audio(); if (!x) return;
    try {
      const t = x.currentTime, o = x.createOscillator(), g = x.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
      g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0006, t + d);
      o.connect(g); g.connect(x.destination); o.start(t); o.stop(t + d + 0.03);
    } catch {}
  }
  function squish(){
    const x = audio(); if (!x || !sfxOn()) return;
    try {
      const n = x.createBufferSource(), b = x.createBuffer(1, x.sampleRate * .12, x.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 2.6);
      n.buffer = b;
      const f = x.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1600;
      const g = x.createGain(); g.gain.value = .22;
      n.connect(f); f.connect(g); g.connect(x.destination); n.start();
      tone(220, .09, 'triangle', .07, 90);
    } catch {}
  }

  let best = Number(localStorage.getItem('bug_best') || 0);
  let state = 'idle', bugs = [], splats = [], parts = [], score = 0, hp = 5, wave = 1, spawnTimer = 0, kills = 0;
  let combo = 0, comboT = 0, banner = '', bannerT = 0, flash = 0, grassBlades = [];

  for (let i = 0; i < 130; i++) grassBlades.push({ x: Math.random()*W, y: Math.random()*H, a: Math.random()*Math.PI, l: 4 + Math.random()*7 });

  const TYPES = [
    { kind:'ant',    speed: 60,  pts: 10, r: 15, hp: 1 },
    { kind:'beetle', speed: 44,  pts: 20, r: 19, hp: 2 },
    { kind:'spider', speed: 95,  pts: 25, r: 15, hp: 1 },
    { kind:'roach',  speed: 70,  pts: 35, r: 17, hp: 2 }
  ];

  function spawnBug() {
    const side = Math.floor(Math.random()*4);
    let x, y;
    if (side === 0) { x = Math.random()*W; y = -24; }
    else if (side === 1) { x = W + 24; y = Math.random()*H; }
    else if (side === 2) { x = Math.random()*W; y = H + 24; }
    else { x = -24; y = Math.random()*H; }
    const avail = wave >= 3 ? 4 : wave >= 2 ? 3 : 2;
    const t = TYPES[Math.floor(Math.random() * avail)];
    bugs.push({ x, y, kind: t.kind, speed: t.speed + wave * 8, pts: t.pts, r: t.r, hp: t.hp, maxHp: t.hp, wob: Math.random()*6, ang: 0 });
  }

  function reset() {
    bugs = []; splats = []; parts = []; score = 0; hp = 5; wave = 1; kills = 0; spawnTimer = .3;
    combo = 0; comboT = 0; banner = ''; flash = 0;
    scoreEl.textContent = '0'; waveEl.textContent = '1'; comboEl.textContent = 'x1';
    hpEl.innerHTML = hearts(5);
    state = 'play';
    ov.classList.add('hidden');
    audio();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.04, (now - last) / 1000);
    last = now;
    if (state === 'play') update(dt, now / 1000);
    draw(now / 1000);
    requestAnimationFrame(loop);
  }

  function update(dt, t) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnBug();
      spawnTimer = Math.max(.3, 1.3 - wave * .13);
    }
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) { combo = 0; comboEl.textContent = 'x1'; } }
    if (bannerT > 0) bannerT -= dt;
    if (flash > 0) flash -= dt * 2.4;

    for (let i = bugs.length - 1; i >= 0; i--) {
      const b = bugs[i];
      b.ang = Math.atan2(CY - b.y, CX - b.x);
      const wob = Math.sin(t * 8 + b.wob) * .28;
      b.x += Math.cos(b.ang + wob) * b.speed * dt;
      b.y += Math.sin(b.ang + wob) * b.speed * dt;
      if (Math.hypot(CX - b.x, CY - b.y) < 38) {
        bugs.splice(i, 1);
        hp--;
        hpEl.innerHTML = hp > 0 ? hearts(hp) : '—';
        flash = 1;
        tone(150, .3, 'sawtooth', .1, 60);
        if (hp <= 0) {
          state = 'over';
          if (score > best) { best = score; localStorage.setItem('bug_best', String(best)); }
          setTimeout(() => {
            ovT.textContent = 'PICNIC RUINED!';
            ovT.classList.add('hot');
            ovP.innerHTML = 'The swarm reached your basket.';
            ovStats.style.display = 'flex';
            ovStats.innerHTML = `<div>Score <b>${score}</b></div><div>Kills <b>${kills}</b></div><div>Best <b>${best}</b></div>`;
            startBtn.textContent = 'PLAY AGAIN';
            ov.classList.remove('hidden');
          }, 550);
        }
      }
    }
    for (let i = splats.length - 1; i >= 0; i--) {
      splats[i].life -= dt;
      if (splats[i].life <= 0) splats.splice(i, 1);
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 380 * dt; p.t -= dt;
      if (p.t <= 0) parts.splice(i, 1);
    }
  }

  // ---------- drawn bugs ----------
  function drawAnt(b, t) {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang);
    const leg = Math.sin(t * 18 + b.wob) * 3;
    ctx.strokeStyle = '#7c2d12'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(i * 5, -2); ctx.lineTo(i * 5 + leg, -10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(i * 5, 2); ctx.lineTo(i * 5 - leg, 10); ctx.stroke();
    }
    ctx.fillStyle = '#b45309';
    ctx.beginPath(); ctx.ellipse(-8, 0, 6, 4.5, 0, 0, Math.PI*2); ctx.fill(); // abdomen
    ctx.beginPath(); ctx.ellipse(0, 0, 4, 3.4, 0, 0, Math.PI*2); ctx.fill();  // thorax
    ctx.beginPath(); ctx.ellipse(7, 0, 4.5, 4, 0, 0, Math.PI*2); ctx.fill(); // head
    ctx.strokeStyle = '#7c2d12'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(10, -2); ctx.lineTo(15, -6); ctx.moveTo(10, 2); ctx.lineTo(15, 6); ctx.stroke();
    ctx.restore();
  }
  function drawBeetle(b, t) {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang);
    const leg = Math.sin(t * 14 + b.wob) * 3;
    ctx.strokeStyle = '#052e16'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(i * 7, -4); ctx.lineTo(i * 7 + leg, -14); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(i * 7, 4); ctx.lineTo(i * 7 - leg, 14); ctx.stroke();
    }
    const g = ctx.createLinearGradient(0, -12, 0, 12);
    g.addColorStop(0, '#22c55e'); g.addColorStop(1, '#14532d');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(-2, 0, 13, 11, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#052e16'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-2, -11); ctx.lineTo(-2, 11); ctx.stroke();
    ctx.fillStyle = '#052e16';
    ctx.beginPath(); ctx.ellipse(10, 0, 5.5, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(-6, -4, 4, 2.5, -.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawSpider(b, t) {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang);
    const leg = Math.sin(t * 22 + b.wob) * 4;
    ctx.strokeStyle = '#1e1b4b'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const ly = -8 + i * 5;
      ctx.beginPath(); ctx.moveTo(-2, ly * .5); ctx.lineTo(-14 - (i%2?leg:0), ly); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(2, ly * .5); ctx.lineTo(14 + (i%2?leg:0), ly); ctx.stroke();
    }
    ctx.fillStyle = '#312e81';
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(9, 0, 5.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f43f5e'; // hourglass mark
    ctx.beginPath(); ctx.arc(-2, 0, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(11, -2, 1.4, 0, Math.PI*2); ctx.arc(11, 2, 1.4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawRoach(b, t) {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang);
    const leg = Math.sin(t * 20 + b.wob) * 3;
    ctx.strokeStyle = '#431407'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(i * 7, -4); ctx.lineTo(i * 7 + leg, -13); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(i * 7, 4); ctx.lineTo(i * 7 - leg, 13); ctx.stroke();
    }
    ctx.strokeStyle = '#78350f'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(12, -2); ctx.quadraticCurveTo(22, -10, 24, -14); ctx.moveTo(12, 2); ctx.quadraticCurveTo(22, 10, 24, 14); ctx.stroke();
    const g = ctx.createLinearGradient(0, -10, 0, 10);
    g.addColorStop(0, '#92400e'); g.addColorStop(1, '#451a03');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#431407'; ctx.lineWidth = 1.2;
    for (let i = -8; i <= 8; i += 4) { ctx.beginPath(); ctx.moveTo(i, -8); ctx.lineTo(i, 8); ctx.stroke(); }
    ctx.fillStyle = '#431407';
    ctx.beginPath(); ctx.ellipse(12, 0, 5, 5.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  const BUG_DRAW = { ant: drawAnt, beetle: drawBeetle, spider: drawSpider, roach: drawRoach };

  function drawBasket(t) {
    ctx.save(); ctx.translate(CX, CY);
    // blanket
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = '#dc2626';
    ctx.beginPath(); ctx.roundRect(-62, -62, 124, 124, 10); ctx.fill();
    ctx.fillStyle = 'rgba(254,242,242,.85)';
    for (let i = -2; i <= 1; i++) for (let j = -2; j <= 1; j++)
      if ((i + j) % 2 === 0) ctx.fillRect(i * 31 + 1, j * 31 + 1, 29, 29);
    ctx.rotate(-Math.PI / 4);
    // basket body
    ctx.fillStyle = '#a16207';
    ctx.beginPath(); ctx.roundRect(-26, -16, 52, 34, 7); ctx.fill();
    ctx.strokeStyle = '#713f12'; ctx.lineWidth = 2;
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(-26, i * 9); ctx.lineTo(26, i * 9); ctx.stroke(); }
    // handle
    ctx.strokeStyle = '#713f12'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, -14, 20, Math.PI, 0); ctx.stroke();
    // contents
    ctx.fillStyle = '#4ade80'; ctx.beginPath(); ctx.arc(-10, -14, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(8, -16, 7, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function draw(t) {
    // grass
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#3f6212'); g.addColorStop(1, '#2d4a10');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // grass blades
    ctx.strokeStyle = 'rgba(190,242,100,.16)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    for (const bl of grassBlades) {
      ctx.beginPath(); ctx.moveTo(bl.x, bl.y);
      ctx.lineTo(bl.x + Math.cos(bl.a) * bl.l, bl.y - bl.l);
      ctx.stroke();
    }
    // light patch under blanket
    const lg = ctx.createRadialGradient(CX, CY, 30, CX, CY, 130);
    lg.addColorStop(0, 'rgba(0,0,0,.22)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(CX, CY, 130, 0, Math.PI*2); ctx.fill();

    drawBasket(t);

    // splats
    for (const s of splats) {
      const a = Math.min(1, s.life * 1.6);
      ctx.fillStyle = `rgba(101,163,13,${a * .55})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, 15 * (1.4 - a * .4), 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = `rgba(163,230,53,${a * .5})`;
      ctx.beginPath(); ctx.arc(s.x + 6, s.y - 4, 6, 0, Math.PI*2); ctx.arc(s.x - 7, s.y + 5, 5, 0, Math.PI*2); ctx.fill();
    }

    // bugs
    for (const b of bugs) {
      (BUG_DRAW[b.kind] || drawAnt)(b, t);
      if (b.maxHp > 1 && b.hp < b.maxHp) {
        ctx.fillStyle = 'rgba(0,0,0,.5)';
        ctx.fillRect(b.x - 11, b.y - 20, 22, 4);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(b.x - 10, b.y - 19, 20 * (b.hp / b.maxHp), 2.5);
      }
    }

    // squash particles
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.t * 2.4);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // wave banner
    if (bannerT > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, bannerT * 2);
      ctx.font = '900 34px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fef9c3';
      ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 12;
      ctx.fillText(banner, CX, H * .3);
      ctx.restore();
    }

    // damage flash
    if (flash > 0) {
      ctx.fillStyle = `rgba(220,38,38,${flash * .22})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function squishAt(mx, my) {
    for (let i = bugs.length - 1; i >= 0; i--) {
      const b = bugs[i];
      if (Math.hypot(mx - b.x, my - b.y) <= b.r + 12) {
        b.hp--;
        squish();
        splats.push({ x: b.x, y: b.y, life: .8 });
        const col = b.kind === 'spider' ? '#818cf8' : b.kind === 'beetle' ? '#4ade80' : '#fbbf24';
        for (let k = 0; k < 12; k++) {
          const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 160;
          parts.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, r: 2 + Math.random() * 3, t: .5, col });
        }
        if (b.hp <= 0) {
          combo = Math.min(8, combo + 1); comboT = 2.4;
          comboEl.textContent = 'x' + Math.max(1, combo);
          score += b.pts * Math.max(1, combo);
          kills++;
          const newWave = 1 + Math.floor(kills / 10);
          if (newWave !== wave) { wave = newWave; banner = 'WAVE ' + wave + '!'; bannerT = 1.4; tone(523,.18,'square',.06,1046); }
          scoreEl.textContent = score;
          waveEl.textContent = wave;
          bugs.splice(i, 1);
        }
        return true;
      }
    }
    return false;
  }

  c.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    e.preventDefault();
    const r = c.getBoundingClientRect();
    const mx = (e.clientX - r.left) * W / r.width;
    const my = (e.clientY - r.top) * H / r.height;
    if (!squishAt(mx, my)) {
      // miss: small dust puff
      for (let k = 0; k < 5; k++) parts.push({ x: mx, y: my, vx: (Math.random()-.5)*80, vy: -Math.random()*60, r: 2, t: .3, col: '#d9f99d' });
    }
  });
  startBtn.onclick = () => { ovT.classList.remove('hot'); ovStats.style.display = 'none'; reset(); };
  draw(0);
  requestAnimationFrame(loop);
})();
