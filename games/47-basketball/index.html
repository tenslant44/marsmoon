<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Basketball Shootout</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1220;
    font-family:'Segoe UI',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  canvas{display:block;touch-action:none;cursor:crosshair;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="aaa-score" class="sr">0</div>
<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;

// ---- tuning ----
const G=0.55,BR=14,TIP=5,SUB=3,MAXPULL=210,POWER=0.16,TIME_LIMIT=60;

// ---- layout ----
let floorY=0,rimY=0,board=null,rimL=null,rimR=null,threePtX=0,spawnMin=70,spawnMax=300;

// ---- state ----
let ball=null,drag=null,flying=false,state='play';
let score=0,shots=0,makes=0,best=0,timeLeft=TIME_LIMIT;
let respawnT=0,restT=0,flyT=0,scored=false,touched=false,shotX=0;
let floaters=[];
try{best=parseInt(localStorage.getItem('bb_best')||'0',10)||0;}catch(e){}

// ---- audio (tiny WebAudio blips; honors overlay prefs) ----
let AC=null;
function sfxOn(){try{return localStorage.getItem('aaa_sfx')!=='0'}catch(e){return true}}
function bgmOn(){try{return localStorage.getItem('aaa_bgm')!=='0'}catch(e){return true}}
function tone(f,d,type,g){
  if(!sfxOn())return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),gn=AC.createGain();
    o.type=type||'sine';o.frequency.value=f;
    gn.gain.setValueAtTime(g||0.1,AC.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
    o.connect(gn);gn.connect(AC.destination);
    o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}
function ensureAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function nz(d,v,f,q,ty,t){if(!sfxOn())return;ensureAudio();const c=AC;if(!c)return;try{const n=c.currentTime+(t||0),L=Math.ceil(c.sampleRate*d),b=c.createBuffer(1,L,c.sampleRate),dd=b.getChannelData(0);for(let i=0;i<L;i++)dd[i]=(Math.random()*2-1)*(1-i/L);const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type=ty||'bandpass';fl.frequency.value=f||1400;fl.Q.value=q||.8;const g=c.createGain();g.gain.setValueAtTime(v||.1,n);g.gain.exponentialRampToValueAtTime(.0006,n+d);s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(n)}catch(e){}}
function stinger(w){(w?[523,659,784,1047]:[392,349,311,262]).forEach((f,i)=>setTimeout(()=>tone(f,w?.2:.26,w?'triangle':'sawtooth',w?.1:.05),i*(w?100:120)))}
// arena crowd murmur bed + heartbeat kick
let crowdOn=false,bgmI=0;
setInterval(()=>{
  const want=bgmOn()&&state==='play';
  if(want&&!crowdOn){
    crowdOn=true;
    try{ensureAudio();const c=AC;if(!c)return;
      const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),dd=b.getChannelData(0);
      for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*.5;
      const s=c.createBufferSource();s.buffer=b;s.loop=true;
      const fl=c.createBiquadFilter();fl.type='bandpass';fl.frequency.value=420;fl.Q.value=.4;
      const g=c.createGain();g.gain.value=.013;
      s.connect(fl);fl.connect(g);g.connect(c.destination);s.start();
      window.__bbCrowd={s,g};
    }catch(e){}
  }else if(!want&&crowdOn){crowdOn=false;try{window.__bbCrowd.s.stop()}catch(e){}window.__bbCrowd=null}
  if(bgmOn()&&state==='play'){
    bgmI++;
    if(bgmI%8===0)tone(95,.14,'sine',.07);
  }
},500);
const scoreChip=document.getElementById('aaa-score');
let prevSec=TIME_LIMIT,flashT=0,netSway=0,confetti=[];
const trail=[];

function layout(){
  floorY=H-64;
  rimY=Math.round(H*0.33);
  const bh=Math.max(90,H*0.16);
  const bx=W-Math.max(64,W*0.09);
  board={x:bx,y:rimY-bh+14,w:9,h:bh};
  rimR={x:bx-7,y:rimY};
  rimL={x:rimR.x-54,y:rimY};
  threePtX=Math.min(W*0.52,rimL.x-110);
  spawnMin=60;
  spawnMax=Math.max(spawnMin+40,Math.min(rimL.x-70,W*0.62));
  if(ball&&!flying){ball.y=floorY-BR;ball.x=Math.min(Math.max(ball.x,spawnMin),spawnMax);}
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
window.addEventListener('resize',resize);
resize();

function spawnBall(){
  const x=spawnMin+Math.random()*(spawnMax-spawnMin);
  ball={x:x,y:floorY-BR,vx:0,vy:0,ang:Math.random()*6};
  flying=false;scored=false;touched=false;restT=0;flyT=0;trail.length=0;
}
function restart(){
  score=0;shots=0;makes=0;timeLeft=TIME_LIMIT;state='play';
  floaters=[];drag=null;respawnT=0;spawnBall();
}

// ---- input ----
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{
  ensureAudio();
  if(state==='over'){restart();return;}
  if(flying)return;
  const p=pt(e);
  drag={x0:p.x,y0:p.y,x:p.x,y:p.y};
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  const p=pt(e);drag.x=p.x;drag.y=p.y;
});
window.addEventListener('pointerup',()=>{
  if(!drag)return;
  const v=shotVec(drag);
  if(Math.hypot(v.x,v.y)>2)launch(v);
  drag=null;
});
window.addEventListener('pointercancel',()=>{drag=null;});
window.addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'){ensureAudio();restart();}
});
function shotVec(d){
  let dx=d.x-d.x0,dy=d.y-d.y0;
  const len=Math.hypot(dx,dy);
  if(len>MAXPULL){dx*=MAXPULL/len;dy*=MAXPULL/len;}
  return{x:dx*POWER,y:dy*POWER};
}
function launch(v){
  ball.vx=v.x;ball.vy=v.y;
  flying=true;shots++;shotX=ball.x;flyT=0;restT=0;scored=false;touched=false;
  tone(500,0.05,'square',0.04);
}

// ---- physics ----
function scheduleRespawn(){if(respawnT===0)respawnT=28;}
function collide(prevY){
  const b=ball;
  // basket: crossing rim plane downward between the tips
  if(!scored&&b.vy>0&&prevY<rimY&&b.y>=rimY&&b.x>rimL.x+6&&b.x<rimR.x-6){
    scored=true;makes++;
    const pts=shotX<threePtX?3:2;
    score+=pts;
    if(scoreChip)scoreChip.textContent=score;
    floaters.push({x:(rimL.x+rimR.x)/2,y:rimY-12,t:0,text:'+'+pts+(touched?'':'  SWISH!')});
    if(!touched)nz(.25,.14,3200,.7,'highpass');           // swish
    else nz(.12,.1,500,1,'lowpass');                      // rim-and-in
    tone(700,0.09,'sine',0.12);
    setTimeout(()=>tone(1050,0.15,'sine',0.12),80);
    if(pts===3){tone(1318,.2,'sine',.08);for(let i=0;i<40;i++)confetti.push({x:(rimL.x+rimR.x)/2,y:rimY,vx:(Math.random()-.5)*9,vy:-Math.random()*8-2,t:0,c:['#ffd34d','#ff6b81','#4dd0e1','#7ee787'][i%4]});}
    flashT=14;netSway=1;
  }
  if(scored&&b.y>rimY&&b.y<rimY+34){b.vx*=0.82;b.vy*=0.86;}  // net drag
  // floor
  if(b.y+BR>floorY){
    b.y=floorY-BR;
    if(b.vy>1.6)tone(160,0.05,'triangle',Math.min(0.09,b.vy*0.008));
    if(b.vy>0)b.vy*=-0.62;
    b.vx*=0.86;
    if(Math.abs(b.vy)<0.7)b.vy=0;
  }
  if(b.y-BR<0){b.y=BR;if(b.vy<0)b.vy*=-0.5;}
  if(b.x-BR<0){b.x=BR;if(b.vx<0)b.vx*=-0.6;}
  if(b.x+BR>W){b.x=W-BR;if(b.vx>0)b.vx*=-0.6;}
  // backboard (circle vs rect)
  let dx,dy,d2;
  {
    const cx=Math.max(board.x,Math.min(b.x,board.x+board.w));
    const cy=Math.max(board.y,Math.min(b.y,board.y+board.h));
    dx=b.x-cx;dy=b.y-cy;d2=dx*dx+dy*dy;
    if(d2<BR*BR){
      touched=true;
      const d=Math.sqrt(d2)||0.001,nx=dx/d,ny=dy/d;
      b.x=cx+nx*BR;b.y=cy+ny*BR;
      const vn=b.vx*nx+b.vy*ny;
      if(vn<0){b.vx-=1.6*vn*nx;b.vy-=1.6*vn*ny;b.vx*=0.98;tone(220,0.05,'triangle',0.06);}
    }
  }
  // rim tips (circle vs circle)
  for(const t of [rimL,rimR]){
    dx=b.x-t.x;dy=b.y-t.y;d2=dx*dx+dy*dy;
    const rr=BR+TIP;
    if(d2<rr*rr){
      touched=true;
      const d=Math.sqrt(d2)||0.001,nx=dx/d,ny=dy/d;
      b.x=t.x+nx*rr;b.y=t.y+ny*rr;
      const vn=b.vx*nx+b.vy*ny;
      if(vn<0){b.vx-=1.55*vn*nx;b.vy-=1.55*vn*ny;tone(300,0.04,'triangle',0.05);if(vn<-3)tone(2350,.09,'square',.03);}
    }
  }
}
function tick(){
  if(state==='play'){
    timeLeft-=1/60;
    const s=Math.ceil(timeLeft);
    if(s!==prevSec&&s<=5&&s>0)tone(920,.05,'square',.05);
    prevSec=s;
    if(timeLeft<=0){
      timeLeft=0;state='over';
      const nb=score>best;
      if(nb){best=score;try{localStorage.setItem('bb_best',''+best);}catch(e){}}
      tone(340,0.5,'sawtooth',0.1);setTimeout(()=>tone(230,.7,'sawtooth',.1),200);
      stinger(nb);
    }
  }
  if(flashT>0)flashT--;
  if(netSway>0)netSway*=0.9;
  for(let i=confetti.length-1;i>=0;i--){const p=confetti[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.5;p.t++;if(p.y>H+10||p.t>140)confetti.splice(i,1);}
  if(flying){
    flyT++;
    const dt=1/SUB;
    for(let i=0;i<SUB;i++){
      const prevY=ball.y;
      ball.vy+=G*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
      collide(prevY);
    }
    trail.push({x:ball.x,y:ball.y});
    if(trail.length>22)trail.shift();
    ball.ang+=ball.vx*0.015;
    const sp=Math.hypot(ball.vx,ball.vy);
    if(ball.y+BR>=floorY-0.5&&sp<1.4)restT++;else restT=0;
    if(scored&&ball.y>rimY+80)scheduleRespawn();
    if(restT>40||flyT>300||ball.x<-80||ball.x>W+80)scheduleRespawn();
  }
  if(respawnT>0){respawnT--;if(respawnT===0)spawnBall();}
  for(const f of floaters)f.t+=1/60;
  floaters=floaters.filter(f=>f.t<1);
}

// ---- drawing ----
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function preview(v){
  let x=ball.x,y=ball.y,vx=v.x,vy=v.y;
  ctx.save();ctx.fillStyle='#fff';
  for(let i=0;i<80;i++){
    vy+=G;x+=vx;y+=vy;
    if(y>floorY)break;
    if(i%3===0){
      ctx.globalAlpha=Math.max(0.15,1-i/80);
      ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();
    }
  }
  ctx.restore();
}
function drawCourt(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0e1730');g.addColorStop(0.65,'#1c2a55');g.addColorStop(1,'#0b1126');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // hoop spotlight
  const rg=ctx.createRadialGradient(rimR.x,rimY,10,rimR.x,rimY,W*0.4);
  rg.addColorStop(0,'rgba(255,190,90,0.16)');rg.addColorStop(1,'rgba(255,190,90,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  // floor
  const fg=ctx.createLinearGradient(0,floorY,0,H);
  fg.addColorStop(0,'#d19a5b');fg.addColorStop(1,'#a8713a');
  ctx.fillStyle=fg;ctx.fillRect(0,floorY,W,H-floorY);
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(0,floorY,W,3);
  // floor boards
  ctx.strokeStyle='rgba(90,50,20,0.25)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=46){ctx.beginPath();ctx.moveTo(x,floorY+3);ctx.lineTo(x,H);ctx.stroke();}
  // 3pt marker
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.setLineDash([6,8]);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(threePtX,floorY);ctx.lineTo(threePtX,rimY+60);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.font='700 13px system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText('3PT',threePtX,floorY+22);
}
function drawHoop(back){
  if(back){
    // pole + arm
    ctx.strokeStyle='#556';ctx.lineWidth=8;
    ctx.beginPath();ctx.moveTo(W-22,floorY);ctx.lineTo(W-22,board.y+14);
    ctx.lineTo(board.x+board.w,board.y+14);ctx.stroke();
    // backboard
    ctx.fillStyle='#f4f6fb';ctx.strokeStyle='#c8cede';ctx.lineWidth=2;
    rr(board.x,board.y,board.w,board.h,3);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#e0522e';ctx.lineWidth=2;
    ctx.strokeRect(board.x-1,rimY-46,board.w-6,34);
    // net (sways after a make)
    const sw=Math.sin(performance.now()*.03)*netSway*9;
    ctx.strokeStyle='rgba(240,240,255,0.85)';ctx.lineWidth=1.6;
    const nl=rimL.x+3,nr=rimR.x-3,bl=(rimL.x+rimR.x)/2-9+sw*.6,brc=(rimL.x+rimR.x)/2+9+sw*.6,by=rimY+40+sw*.3;
    ctx.beginPath();
    ctx.moveTo(nl,rimY+2);ctx.lineTo(bl,by);
    ctx.moveTo(nr,rimY+2);ctx.lineTo(brc,by);
    ctx.moveTo(nl+13,rimY+2);ctx.lineTo(brc-2,by);
    ctx.moveTo(nr-13,rimY+2);ctx.lineTo(bl+2,by);
    ctx.moveTo(nl,rimY+15);ctx.lineTo(nr,rimY+15);
    ctx.moveTo(bl,rimY+28);ctx.lineTo(brc,rimY+28);
    ctx.stroke();
  }else{
    // rim front
    ctx.strokeStyle='#e0522e';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(rimL.x,rimY);ctx.lineTo(rimR.x,rimY);ctx.stroke();
    ctx.fillStyle='#e0522e';
    ctx.beginPath();ctx.arc(rimL.x,rimY,TIP,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(rimR.x,rimY,TIP,0,7);ctx.fill();
  }
}
function drawBall(){
  const b=ball;
  // floor shadow
  const shH=Math.max(0,1-(floorY-b.y)/500);
  ctx.fillStyle='rgba(0,0,0,'+(0.28*shH).toFixed(3)+')';
  ctx.beginPath();ctx.ellipse(b.x,floorY+14,BR*(0.5+0.5*shH),4,0,0,7);ctx.fill();
  // motion trail
  ctx.fillStyle='rgba(247,162,74,.5)';
  for(let i=0;i<trail.length;i+=3){ctx.globalAlpha=i/trail.length*.35;ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,4,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(b.x,b.y);
  const g=ctx.createRadialGradient(-4,-5,2,0,0,BR+2);
  g.addColorStop(0,'#f7a24a');g.addColorStop(1,'#d96d1e');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,BR,0,7);ctx.fill();
  ctx.strokeStyle='rgba(60,20,0,0.85)';ctx.lineWidth=1.4;
  ctx.rotate(b.ang);
  ctx.beginPath();ctx.moveTo(-BR,0);ctx.lineTo(BR,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-BR);ctx.lineTo(0,BR);ctx.stroke();
  ctx.beginPath();ctx.arc(-BR*1.6,0,BR*1.35,-0.7,0.7);ctx.stroke();
  ctx.beginPath();ctx.arc(BR*1.6,0,BR*1.35,Math.PI-0.7,Math.PI+0.7);ctx.stroke();
  ctx.restore();
}
function drawHUD(){
  ctx.textAlign='left';ctx.fillStyle='#fff';
  ctx.font='800 30px system-ui,sans-serif';
  ctx.fillText(''+score,24,44);
  ctx.font='600 13px system-ui,sans-serif';ctx.fillStyle='rgba(255,255,255,0.65)';
  ctx.fillText('SCORE',24,62);
  ctx.fillText('MAKES '+makes+'/'+shots,24,82);
  // time
  const t=Math.ceil(timeLeft);
  ctx.textAlign='center';
  ctx.fillStyle=t<=10?'#ff5a4e':'#fff';
  ctx.font='800 34px system-ui,sans-serif';
  ctx.fillText(t+'',W/2,46);
  ctx.font='600 13px system-ui,sans-serif';ctx.fillStyle='rgba(255,255,255,0.65)';
  ctx.fillText('TIME',W/2,64);
  // best
  ctx.textAlign='right';ctx.fillStyle='#fff';
  ctx.font='800 24px system-ui,sans-serif';
  ctx.fillText(''+best,W-24,42);
  ctx.font='600 13px system-ui,sans-serif';ctx.fillStyle='rgba(255,255,255,0.65)';
  ctx.fillText('BEST',W-24,60);
  // shot value tag on ball
  if(!flying&&ball){
    ctx.textAlign='center';ctx.font='700 12px system-ui,sans-serif';
    ctx.fillStyle=ball.x<threePtX?'#ffd34d':'rgba(255,255,255,0.7)';
    ctx.fillText(ball.x<threePtX?'3PT SHOT':'2PT SHOT',ball.x,ball.y-BR-10);
  }
  if(state==='play'&&shots<3){
    ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.font='600 15px system-ui,sans-serif';
    ctx.fillText('Drag anywhere to aim — release to shoot   ·   R to restart',W/2,H-18);
  }
}
function drawFloaters(){
  for(const f of floaters){
    ctx.save();
    ctx.globalAlpha=1-f.t;
    ctx.textAlign='center';ctx.fillStyle='#ffd34d';
    ctx.font='800 26px system-ui,sans-serif';
    ctx.fillText(f.text,f.x,f.y-f.t*46);
    ctx.restore();
  }
}
function drawDrag(){
  if(!drag)return;
  const v=shotVec(drag);
  ctx.save();
  // pull line
  ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=2;ctx.setLineDash([5,6]);
  ctx.beginPath();ctx.moveTo(drag.x0,drag.y0);ctx.lineTo(drag.x,drag.y);ctx.stroke();
  ctx.setLineDash([]);
  // direction arrow from ball
  const len=Math.hypot(v.x,v.y);
  if(len>2){
    const nx=v.x/len,ny=v.y/len;
    ctx.strokeStyle='#ffd34d';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(ball.x,ball.y);
    ctx.lineTo(ball.x+nx*40,ball.y+ny*40);ctx.stroke();
    preview(v);
    // power meter
    const p=Math.min(1,Math.hypot(drag.x-drag.x0,drag.y-drag.y0)/MAXPULL);
    ctx.fillStyle='rgba(255,255,255,0.25)';
    rr(ball.x-26,ball.y+BR+12,52,7,3);ctx.fill();
    ctx.fillStyle=p>0.85?'#ff5a4e':'#ffd34d';
    rr(ball.x-26,ball.y+BR+12,52*p,7,3);ctx.fill();
  }
  ctx.restore();
}
function drawOver(){
  ctx.fillStyle='rgba(6,10,22,0.72)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.fillStyle='#fff';
  ctx.font='800 52px system-ui,sans-serif';
  ctx.fillText("TIME'S UP!",W/2,H/2-70);
  ctx.font='700 30px system-ui,sans-serif';ctx.fillStyle='#ffd34d';
  ctx.fillText('Score: '+score,W/2,H/2-16);
  ctx.font='600 18px system-ui,sans-serif';ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.fillText('Makes '+makes+' / '+shots+'   ·   Best '+best,W/2,H/2+18);
  ctx.font='600 17px system-ui,sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('Click or press R to play again',W/2,H/2+62);
}
function draw(){
  drawCourt();
  drawHoop(true);
  drawDrag();
  if(ball)drawBall();
  drawHoop(false);
  // make-flash on the rim
  if(flashT>0){
    ctx.fillStyle='rgba(255,220,120,'+(flashT/14*.3).toFixed(3)+')';
    ctx.beginPath();ctx.arc((rimL.x+rimR.x)/2,rimY,60*(1.6-flashT/14),0,7);ctx.fill();
  }
  // confetti
  for(const p of confetti){ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.t*.1);ctx.fillRect(-3,-2,6,4);ctx.restore();}
  drawFloaters();
  drawHUD();
  if(state==='over')drawOver();
}

// ---- main loop ----
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(now-last,100);last=now;
  while(acc>=1000/60){tick();acc-=1000/60;}
  draw();
  requestAnimationFrame(frame);
}
spawnBall();
requestAnimationFrame(frame);
</script>
