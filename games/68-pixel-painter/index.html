<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Painter</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #22252d;
    --border: #343845;
    --text: #e8eaef;
    --muted: #9aa0ae;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #10131c;
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: -20%; z-index: -2;
    background:
      radial-gradient(40% 50% at 18% 22%, rgba(91,140,255,.14), transparent 70%),
      radial-gradient(42% 52% at 82% 20%, rgba(163,73,164,.12), transparent 70%),
      radial-gradient(50% 55% at 50% 85%, rgba(34,177,76,.08), transparent 70%),
      linear-gradient(150deg, #16181d, #141826 55%, #10131c);
    animation: aurora 22s ease-in-out infinite alternate;
  }
  @keyframes aurora { from { transform: rotate(-2deg) scale(1); } to { transform: rotate(2deg) scale(1.07); } }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(0,0,0,.45));
  }
  .app {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    width: 200px;
    flex-shrink: 0;
  }
  h1 {
    font-size: 20px; margin-bottom: 14px; letter-spacing: 2px; font-weight: 800;
    background: linear-gradient(90deg, #5b8cff, #a349a4 60%, #ff7f27);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 14px 0 8px;
  }
  h2:first-of-type { margin-top: 0; }

  .canvas-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    line-height: 0;
  }
  #canvas {
    image-rendering: pixelated;
    border-radius: 4px;
    cursor: crosshair;
    touch-action: none;
    max-width: 100%;
    height: auto;
    box-shadow: 0 0 0 1px var(--border), 0 10px 40px rgba(0,0,0,.45), 0 0 30px rgba(91,140,255,.08);
  }

  .tools { display: flex; gap: 8px; }
  .tool-btn {
    flex: 1;
    padding: 8px 0;
    background: #2b2f3a;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .tool-btn:hover { background: #333847; }
  .tool-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .swatches {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
  }
  .swatch {
    aspect-ratio: 1;
    border-radius: 6px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.08s;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 1px #000; }

  .custom-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  input[type="color"] {
    width: 36px;
    height: 36px;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    border-radius: 6px;
  }
  .hex { font-size: 12px; color: var(--muted); font-family: monospace; }

  .current {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .current-box {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  select {
    width: 100%;
    padding: 7px 8px;
    background: #2b2f3a;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }

  .actions { display: flex; flex-direction: column; gap: 8px; }
  .btn {
    padding: 9px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #2b2f3a;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s;
  }
  .btn:hover { background: #333847; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger:hover { background: #54252b; border-color: #7a3038; }

  .hint { font-size: 11px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
  kbd {
    background: #2b2f3a;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0 5px;
    font-size: 10px;
    font-family: monospace;
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>Pixel Painter</h1>

    <h2>Tool</h2>
    <div class="tools">
      <button class="tool-btn active" id="btn-paint" title="Paint (B)">Paint</button>
      <button class="tool-btn" id="btn-erase" title="Erase (E)">Erase</button>
      <button class="tool-btn" id="btn-picker" title="Pick color (I)">Pick</button>
    </div>

    <h2>Palette</h2>
    <div class="swatches" id="swatches"></div>
    <div class="custom-row">
      <input type="color" id="color-picker" value="#5b8cff" title="Custom color">
      <span class="hex" id="color-hex">#5b8cff</span>
    </div>
    <div class="current">
      <div class="current-box" id="current-box"></div>
      <span id="current-label">Painting</span>
    </div>

    <h2>Grid size</h2>
    <select id="grid-size">
      <option value="16">16 × 16</option>
      <option value="24">24 × 24</option>
      <option value="32" selected>32 × 32</option>
      <option value="48">48 × 48</option>
      <option value="64">64 × 64</option>
    </select>

    <h2>Actions</h2>
    <div class="actions">
      <button class="btn primary" id="btn-export">Export PNG</button>
      <button class="btn" id="btn-fill">Fill</button>
      <button class="btn danger" id="btn-clear">Clear</button>
    </div>

    <p class="hint">
      <kbd>B</kbd> paint &nbsp;<kbd>E</kbd> erase &nbsp;<kbd>I</kbd> pick<br>
      Right-drag erases. Grid lines hidden on export.
    </p>
  </aside>

  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- procedural SFX (respects the overlay's speaker preference) ---------- */
  var Sfx = (function () {
    var actx = null;
    function ac() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
      return actx;
    }
    function on() { try { return localStorage.getItem('aaa_sfx') !== '0'; } catch (e) { return true; } }
    function tone(f, d, type, vol, slide, delay) {
      if (!on()) return;
      var c = ac(); if (!c) return;
      try {
        var t = c.currentTime + (delay || 0);
        var o = c.createOscillator(), g = c.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(Math.max(30, f), t);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol || 0.05, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0006, t + d);
        o.connect(g); g.connect(c.destination);
        o.start(t); o.stop(t + d + 0.05);
      } catch (e) {}
    }
    var lastDab = 0;
    return {
      unlock: ac,
      dab: function (erase) {
        var now = performance.now();
        if (now - lastDab < 55) return;
        lastDab = now;
        tone(erase ? 320 + Math.random() * 60 : 500 + Math.random() * 140, .035, 'triangle', .028);
      },
      pick: function () { tone(700, .07, 'sine', .04, 950); },
      tool: function () { tone(480, .05, 'triangle', .035, 560); },
      fill: function () { tone(280, .18, 'sine', .05, 640); },
      clear: function () { tone(500, .2, 'triangle', .045, 160); },
      export: function () { [523, 659, 784].forEach(function (f, i) { tone(f, .16, 'triangle', .05, null, i * .08); }); }
    };
  })();

  var DISPLAY_PX = 512; // on-screen canvas size
  var PALETTE = [
    "#000000", "#ffffff", "#7f7f7f", "#c3c3c3", "#880015", "#ed1c24",
    "#ff7f27", "#fff200", "#22b14c", "#00a2e8", "#3f48cc", "#a349a4",
    "#b97a57", "#ffaec9", "#ffc90e", "#efe4b0", "#b5e61d", "#99d9ea"
  ];

  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");
  var swatchWrap = document.getElementById("swatches");
  var colorPicker = document.getElementById("color-picker");
  var colorHex = document.getElementById("color-hex");
  var currentBox = document.getElementById("current-box");
  var currentLabel = document.getElementById("current-label");
  var gridSelect = document.getElementById("grid-size");

  var size = 32;
  var cells = []; // [y][x] -> color string or null
  var tool = "paint";
  var color = PALETTE[5];
  var painting = false;
  var eraseStroke = false;
  var ART_KEY = "pixelPainter68_art";
  var persistTimer = null;

  function persist() {
    clearTimeout(persistTimer);
    persistTimer = setTimeout(function () {
      try { localStorage.setItem(ART_KEY, JSON.stringify({ size: size, cells: cells })); } catch (e) {}
    }, 400);
  }

  function loadArt() {
    var data = null;
    try { data = JSON.parse(localStorage.getItem(ART_KEY) || "null"); } catch (e) {}
    if (!data || !data.cells) return false;
    var n = parseInt(data.size, 10);
    if (!n || data.cells.length !== n) return false;
    size = n;
    gridSelect.value = String(size);
    cells = data.cells.map(function (row) { return row.slice(0, size); });
    return true;
  }

  function resetCells() {
    cells = [];
    for (var y = 0; y < size; y++) {
      var row = [];
      for (var x = 0; x < size; x++) row.push(null);
      cells.push(row);
    }
  }

  function draw() {
    var cell = DISPLAY_PX / size;
    canvas.width = DISPLAY_PX;
    canvas.height = DISPLAY_PX;
    ctx.clearRect(0, 0, DISPLAY_PX, DISPLAY_PX);

    // transparent checkerboard
    var step = cell < 8 ? 2 * cell : cell;
    for (var cy = 0; cy * step < DISPLAY_PX; cy++) {
      for (var cx = 0; cx * step < DISPLAY_PX; cx++) {
        ctx.fillStyle = (cx + cy) % 2 ? "#2a2d36" : "#23262e";
        ctx.fillRect(cx * step, cy * step, step, step);
      }
    }

    // cells
    for (var y = 0; y < size; y++) {
      for (var x = 0; x < size; x++) {
        if (cells[y][x]) {
          ctx.fillStyle = cells[y][x];
          ctx.fillRect(x * cell, y * cell, cell, cell);
        }
      }
    }

    // grid lines (only when cells are big enough)
    if (cell >= 8) {
      ctx.strokeStyle = "rgba(255,255,255,0.07)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var i = 1; i < size; i++) {
        ctx.moveTo(i * cell + 0.5, 0);
        ctx.lineTo(i * cell + 0.5, DISPLAY_PX);
        ctx.moveTo(0, i * cell + 0.5);
        ctx.lineTo(DISPLAY_PX, i * cell + 0.5);
      }
      ctx.stroke();
    }
  }

  function cellFromEvent(e) {
    var rect = canvas.getBoundingClientRect();
    var px = (e.clientX - rect.left) / rect.width * size;
    var py = (e.clientY - rect.top) / rect.height * size;
    var x = Math.floor(px), y = Math.floor(py);
    if (x < 0 || y < 0 || x >= size || y >= size) return null;
    return { x: x, y: y };
  }

  function applyTool(pos) {
    if (tool === "picker") {
      var picked = cells[pos.y][pos.x];
      if (picked) { setColor(picked); Sfx.pick(); }
      setTool("paint");
      return;
    }
    var erasing = tool === "erase" || eraseStroke;
    var prev = cells[pos.y][pos.x];
    var next = erasing ? null : color;
    if (prev !== next) {
      cells[pos.y][pos.x] = next;
      Sfx.dab(erasing);
      draw();
      persist();
    }
  }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    Sfx.unlock();
    canvas.setPointerCapture(e.pointerId);
    var pos = cellFromEvent(e);
    if (!pos) return;
    painting = true;
    eraseStroke = (e.button === 2);
    applyTool(pos);
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!painting) return;
    var pos = cellFromEvent(e);
    if (pos) applyTool(pos);
  });
  ["pointerup", "pointercancel"].forEach(function (ev) {
    canvas.addEventListener(ev, function () {
      painting = false;
      eraseStroke = false;
    });
  });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  function setTool(t) {
    if (t !== tool) Sfx.tool();
    tool = t;
    document.getElementById("btn-paint").classList.toggle("active", t === "paint");
    document.getElementById("btn-erase").classList.toggle("active", t === "erase");
    document.getElementById("btn-picker").classList.toggle("active", t === "picker");
    currentLabel.textContent = t === "erase" ? "Erasing" : t === "picker" ? "Picking" : "Painting";
  }

  function setColor(c) {
    color = c;
    colorPicker.value = c;
    colorHex.textContent = c;
    currentBox.style.background = c;
    var swatches = swatchWrap.children;
    for (var i = 0; i < swatches.length; i++) {
      swatches[i].classList.toggle("active", swatches[i].dataset.color === c);
    }
    if (tool !== "paint") setTool("paint");
  }

  PALETTE.forEach(function (c) {
    var d = document.createElement("button");
    d.className = "swatch";
    d.style.background = c;
    d.dataset.color = c;
    d.title = c;
    d.addEventListener("click", function () { setColor(c); });
    swatchWrap.appendChild(d);
  });

  colorPicker.addEventListener("input", function () { setColor(colorPicker.value); });

  document.getElementById("btn-paint").addEventListener("click", function () { setTool("paint"); });
  document.getElementById("btn-erase").addEventListener("click", function () { setTool("erase"); });
  document.getElementById("btn-picker").addEventListener("click", function () { setTool("picker"); });

  document.getElementById("btn-fill").addEventListener("click", function () {
    for (var y = 0; y < size; y++)
      for (var x = 0; x < size; x++)
        cells[y][x] = color;
    Sfx.fill();
    draw();
    persist();
  });

  document.getElementById("btn-clear").addEventListener("click", function () {
    resetCells();
    Sfx.clear();
    draw();
    persist();
  });

  gridSelect.addEventListener("change", function () {
    size = parseInt(gridSelect.value, 10);
    resetCells();
    draw();
    persist();
  });

  document.getElementById("btn-export").addEventListener("click", function () {
    var scale = Math.max(1, Math.floor(512 / size));
    var out = document.createElement("canvas");
    out.width = size * scale;
    out.height = size * scale;
    var octx = out.getContext("2d");
    octx.imageSmoothingEnabled = false;
    for (var y = 0; y < size; y++) {
      for (var x = 0; x < size; x++) {
        if (cells[y][x]) {
          octx.fillStyle = cells[y][x];
          octx.fillRect(x * scale, y * scale, scale, scale);
        }
      }
    }
    var a = document.createElement("a");
    a.download = "pixel-art-" + size + "x" + size + ".png";
    a.href = out.toDataURL("image/png");
    a.click();
    Sfx.export();
    if (window.AAA) { var cr = canvas.getBoundingClientRect(); AAA.burst(cr.left + cr.width / 2, cr.top + cr.height / 2, '#5b8cff', 18); AAA.flash(0.14); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    var k = e.key.toLowerCase();
    if (k === "b") setTool("paint");
    else if (k === "e") setTool("erase");
    else if (k === "i") setTool("picker");
  });

  if (!loadArt()) resetCells();
  setColor(PALETTE[5]);
  setTool("paint");
  draw();
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
