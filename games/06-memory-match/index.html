<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Memory Match</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,209,102,.14), transparent 50%),
      radial-gradient(ellipse at 85% 90%, rgba(120,90,255,.16), transparent 55%),
      linear-gradient(160deg, #1c2647 0%, #0d1122 70%);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }

  h1 {
    font-size: clamp(1.5rem, 6vw, 2.1rem);
    letter-spacing: 3px;
    margin-bottom: 14px;
    text-shadow: 0 0 24px rgba(255,209,102,.35), 0 2px 8px rgba(0,0,0,.5);
    font-weight: 800;
  }
  h1 span {
    color: #ffd166;
    text-shadow: 0 0 22px rgba(255,209,102,.6);
  }

  .hud {
    display: flex;
    gap: 14px;
    align-items: center;
    margin-bottom: 18px;
    font-size: 1.05rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .hud .stat {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 12px;
    padding: 8px 16px;
    min-width: 92px;
    text-align: center;
    box-shadow: inset 0 0 14px rgba(0,0,0,.3);
  }
  .hud .label {
    display: block;
    font-size: .65rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #8fa3d8;
  }
  .hud .value { font-weight: 700; font-variant-numeric: tabular-nums; }
  #streak.value { color: #ff9de2; text-shadow: 0 0 10px rgba(255,157,226,.6); }

  #restartBtn {
    background: linear-gradient(135deg, #ffd166, #ffb84d);
    color: #141a2e;
    border: none;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: .95rem;
    font-weight: 800;
    letter-spacing: .5px;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(255,209,102,.4), 0 3px 0 #c78a1e;
    transition: transform .12s;
  }
  #restartBtn:hover { transform: scale(1.05); }
  #restartBtn:active { transform: translateY(2px); }

  #board {
    display: grid;
    grid-template-columns: repeat(4, min(20vw, 96px));
    gap: min(2.4vw, 12px);
  }

  .card {
    aspect-ratio: 1;
    perspective: 600px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .38s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped .card-inner,
  .card.matched .card-inner { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .face.back {
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.18), transparent 45%),
      linear-gradient(135deg, #4a5f9e, #27335c);
    border: 2px solid rgba(160,190,255,.35);
    box-shadow: 0 6px 18px rgba(0,0,0,.4), inset 0 0 18px rgba(0,0,0,.25);
  }
  .face.back svg { opacity: .5; }
  .card:not(.flipped):not(.matched):active .face.back { filter: brightness(1.25); }
  @media (hover: hover) {
    .card:not(.flipped):not(.matched):hover .face.back { filter: brightness(1.2); }
  }
  .face.front {
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.9), rgba(214,226,246,.92));
    transform: rotateY(180deg);
    border: 2px solid #fff;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  .face.front svg { width: 62%; height: 62%; }
  .card.matched { cursor: default; }
  .card.matched .face.front {
    background: linear-gradient(135deg, #b8f5c8, #6fdc96);
    border-color: #d9ffe3;
    box-shadow: 0 0 22px rgba(120,240,160,.55);
    animation: pop .45s ease;
  }
  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.14); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  .card.wrong .face.front { animation: shake .35s ease; }
  @keyframes shake {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-6px); }
    75% { transform: rotateY(180deg) translateX(6px); }
  }

  #winOverlay {
    position: fixed;
    inset: 0;
    background: rgba(8,10,22,.85);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #winOverlay.show { display: flex; }
  .win-box {
    background: linear-gradient(160deg, #28365f, #131a30);
    border: 1px solid rgba(255,209,102,.4);
    border-radius: 20px;
    padding: 38px 46px;
    text-align: center;
    box-shadow: 0 24px 70px rgba(0,0,0,.65), 0 0 40px rgba(255,209,102,.15);
    animation: rise .35s ease;
    max-width: 92vw;
  }
  @keyframes rise {
    from { transform: translateY(24px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .win-box h2 { font-size: clamp(1.6rem, 6vw, 2.2rem); margin-bottom: 6px; color: #ffd166; text-shadow: 0 0 22px rgba(255,209,102,.5); }
  .win-box .stars { display: flex; gap: 6px; justify-content: center; margin: 8px 0 12px; }
  .win-box .stars svg { width: 34px; height: 34px; }
  .win-box p { font-size: 1.05rem; margin-bottom: 8px; color: #cdd8f0; }
  .win-box .best-line { font-size: .85rem; color: #8fa3d8; margin-bottom: 22px; }
  .win-box button {
    background: linear-gradient(135deg, #ffd166, #ffb84d);
    color: #141a2e;
    border: none;
    border-radius: 999px;
    padding: 13px 34px;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,209,102,.4);
    transition: transform .12s;
  }
  .win-box button:hover { transform: scale(1.05); }

  @media (max-width: 420px) {
    .hud { gap: 8px; }
    .hud .stat { min-width: 76px; padding: 6px 10px; }
  }
</style>
</head>
<body>

<h1>MEMORY <span>MATCH</span></h1>

<div class="hud">
  <div class="stat"><span class="label">Time</span><span class="value" id="timer">0:00</span></div>
  <div class="stat"><span class="label">Moves</span><span class="value" id="moves">0</span></div>
  <div class="stat"><span class="label">Streak</span><span class="value" id="streak">—</span></div>
  <button id="restartBtn">Restart</button>
</div>

<div id="board"></div>
<canvas id="fx" style="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:5"></canvas>

<div id="winOverlay">
  <div class="win-box">
    <h2>You Win!</h2>
    <div class="stars" id="winStars"></div>
    <p id="winStats"></p>
    <p class="best-line" id="winBest"></p>
    <button id="playAgainBtn">Play Again</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Hand-drawn SVG icons (no emoji) — each with a distinct silhouette + color
  var ICONS = {
    bolt:  '<svg viewBox="0 0 48 48"><path d="M26 4 L12 28 h10 L20 44 L36 18 H25 Z" fill="#f2b500" stroke="#8a5a00" stroke-width="2" stroke-linejoin="round"/></svg>',
    heart: '<svg viewBox="0 0 48 48"><path d="M24 42 C12 30 6 23 6 15 C6 9 10 5 15 5 C19 5 22 7 24 11 C26 7 29 5 33 5 C38 5 42 9 42 15 C42 23 36 30 24 42 Z" fill="#ff5f7a" stroke="#a02a42" stroke-width="2"/></svg>',
    star:  '<svg viewBox="0 0 48 48"><path d="M24 5 L30 18 L44 19 L33 28 L37 42 L24 34 L11 42 L15 28 L4 19 L18 18 Z" fill="#ffd94d" stroke="#a07718" stroke-width="2" stroke-linejoin="round"/></svg>',
    drop:  '<svg viewBox="0 0 48 48"><path d="M24 4 C24 4 10 22 10 30 C10 38 16 44 24 44 C32 44 38 38 38 30 C38 22 24 4 24 4 Z" fill="#4db8ff" stroke="#1e6ea8" stroke-width="2"/><ellipse cx="19" cy="30" rx="4" ry="7" fill="rgba(255,255,255,.5)" transform="rotate(-18 19 30)"/></svg>',
    leaf:  '<svg viewBox="0 0 48 48"><path d="M40 8 C40 8 16 10 10 22 C5 32 12 42 22 40 C34 38 40 20 40 8 Z" fill="#4ed07a" stroke="#1f7a42" stroke-width="2"/><path d="M14 36 C20 26 28 18 36 12" stroke="#1f7a42" stroke-width="2" fill="none"/></svg>',
    moon:  '<svg viewBox="0 0 48 48"><path d="M30 5 C18 8 10 18 11 29 C12 39 21 45 31 43 C25 39 21 32 22 24 C23 15 26 9 30 5 Z" fill="#c9b8ff" stroke="#6a52b8" stroke-width="2" stroke-linejoin="round"/><circle cx="34" cy="14" r="2.4" fill="#efe8ff"/><circle cx="39" cy="24" r="1.7" fill="#efe8ff"/></svg>',
    gem:   '<svg viewBox="0 0 48 48"><path d="M14 6 h20 l8 12 L24 42 L6 18 Z" fill="#7df0e6" stroke="#1e8a84" stroke-width="2" stroke-linejoin="round"/><path d="M6 18 h36 M14 6 L18 18 L24 42 M34 6 L30 18 L24 42" stroke="#1e8a84" stroke-width="1.6" fill="none"/></svg>',
    flame: '<svg viewBox="0 0 48 48"><path d="M24 4 C28 12 36 16 36 26 C36 35 31 43 24 43 C17 43 12 35 12 26 C12 20 16 16 18 12 C20 16 22 18 24 18 C26 14 24 8 24 4 Z" fill="#ff8c42" stroke="#a8500f" stroke-width="2" stroke-linejoin="round"/><path d="M24 24 C27 28 30 30 30 34 C30 38 27 41 24 41 C21 41 18 38 18 34 C18 30 21 28 24 24 Z" fill="#ffd94d"/></svg>'
  };
  var ICON_KEYS = Object.keys(ICONS);
  var BACK_SVG = '<svg width="46%" height="46%" viewBox="0 0 48 48"><path d="M24 6 L30 19 L43 24 L30 29 L24 42 L18 29 L5 24 L18 19 Z" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.5" stroke-linejoin="round"/></svg>';

  var FLIP_BACK_DELAY = 800;

  var board = document.getElementById('board');
  var timerEl = document.getElementById('timer');
  var movesEl = document.getElementById('moves');
  var streakEl = document.getElementById('streak');
  var winOverlay = document.getElementById('winOverlay');
  var winStats = document.getElementById('winStats');
  var winStars = document.getElementById('winStars');
  var winBest = document.getElementById('winBest');
  var fxCanvas = document.getElementById('fx');
  var fxCtx = fxCanvas.getContext('2d');

  var firstCard = null;
  var lockBoard = false;
  var matchedPairs = 0;
  var moves = 0;
  var seconds = 0;
  var timerId = null;
  var timerStarted = false;
  var streak = 0;

  var bestStats = null;
  try { bestStats = JSON.parse(localStorage.getItem('memory_best') || 'null'); } catch (e) {}

  // ---------- AAA audio ----------
  var ACX = null;
  function ac() {
    try {
      if (!ACX) ACX = new (window.AudioContext || window.webkitAudioContext)();
      if (ACX.state === 'suspended') ACX.resume();
    } catch (e) {}
    return ACX;
  }
  function tone(f, d, type, v, slide, delay) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + (delay || 0);
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v || 0.05, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + d + 0.03);
    } catch (e) {}
  }
  var sfx = {
    flip:    function () { tone(520, 0.06, 'triangle', 0.045, 700); },
    match:   function (st) { var f = 523 * Math.pow(1.12, Math.min(st - 1, 7)); tone(f, 0.12, 'triangle', 0.07); tone(f * 1.5, 0.18, 'sine', 0.06, null, 0.07); },
    wrong:   function () { tone(190, 0.18, 'sawtooth', 0.045, 120); },
    win:     function () { [523, 659, 784, 1047, 1319, 1568].forEach(function (f, i) { tone(f, 0.16, 'triangle', 0.07, null, i * 0.08); }); },
    restart: function () { tone(660, 0.08, 'sine', 0.05, 990); }
  };
  // dreamy pad BGM (very quiet)
  var bgm = {
    t: null, step: 0,
    pad: [261.6, 329.6, 392, 493.9, 392, 329.6, 293.7, 349.2],
    start: function () {
      this.stop(); this.step = 0; var self = this;
      this.t = setInterval(function () { self.tickB(); }, 640);
    },
    tickB: function () {
      var c = ac(); if (!c || c.state !== 'running') return;
      try { if (localStorage.getItem('aaa_bgm') === '1') return; } catch (e) {}
      var n = this.pad[this.step++ % 8];
      tone(n, 0.55, 'sine', 0.02);
      tone(n * 1.5, 0.45, 'sine', 0.012, null, 0.1);
    },
    stop: function () { if (this.t) clearInterval(this.t); this.t = null; }
  };

  // confetti / spark particles on fx canvas
  var parts = [];
  var fxOn = false;
  function sizeFx() { fxCanvas.width = innerWidth; fxCanvas.height = innerHeight; }
  window.addEventListener('resize', sizeFx);
  sizeFx();
  function fxBurst(x, y, colors, n, spread) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = 40 + Math.random() * (spread || 160);
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
        life: 0.6 + Math.random() * 0.6, max: 1.2, color: colors[i % colors.length], r: 2 + Math.random() * 3 });
    }
    if (!fxOn) { fxOn = true; requestAnimationFrame(fxStep); }
  }
  var fxLast = performance.now();
  function fxStep(now) {
    var dt = Math.min(0.05, (now - fxLast) / 1000); fxLast = now;
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      fxCtx.globalAlpha = Math.max(0, p.life / p.max * 1.6);
      fxCtx.fillStyle = p.color;
      fxCtx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r * 1.6);
    }
    fxCtx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(fxStep); else fxOn = false;
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function formatTime(s) {
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function startTimer() {
    if (timerStarted) return;
    timerStarted = true;
    bgm.start();
    timerId = setInterval(function () {
      seconds++;
      timerEl.textContent = formatTime(seconds);
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerId);
    timerId = null;
    bgm.stop();
  }

  function buildBoard() {
    board.innerHTML = '';
    var deck = shuffle(ICON_KEYS.concat(ICON_KEYS));
    deck.forEach(function (key) {
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.icon = key;
      card.innerHTML =
        '<div class="card-inner">' +
          '<div class="face back">' + BACK_SVG + '</div>' +
          '<div class="face front">' + ICONS[key] + '</div>' +
        '</div>';
      card.addEventListener('click', onCardClick);
      board.appendChild(card);
    });
  }

  function cardCenter(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function onCardClick() {
    if (lockBoard || this.classList.contains('flipped') || this.classList.contains('matched')) return;
    ac();
    startTimer();
    this.classList.add('flipped');
    sfx.flip();

    if (!firstCard) {
      firstCard = this;
      return;
    }

    moves++;
    movesEl.textContent = moves;

    if (firstCard.dataset.icon === this.dataset.icon) {
      firstCard.classList.add('matched');
      this.classList.add('matched');
      streak++;
      streakEl.textContent = '×' + streak;
      sfx.match(streak);
      var c = cardCenter(this);
      fxBurst(c.x, c.y, ['#7dffb0', '#ffd166', '#ff9de2', '#7df0ff'], 16);
      firstCard = null;
      matchedPairs++;
      if (matchedPairs === ICON_KEYS.length) onWin();
    } else {
      var a = firstCard, b = this;
      firstCard = null;
      lockBoard = true;
      streak = 0;
      streakEl.textContent = '—';
      sfx.wrong();
      a.classList.add('wrong');
      b.classList.add('wrong');
      setTimeout(function () {
        a.classList.remove('flipped', 'wrong');
        b.classList.remove('flipped', 'wrong');
        lockBoard = false;
      }, FLIP_BACK_DELAY);
    }
  }

  var STAR_ON = '<svg viewBox="0 0 48 48"><path d="M24 5 L30 18 L44 19 L33 28 L37 42 L24 34 L11 42 L15 28 L4 19 L18 18 Z" fill="#ffd94d" stroke="#a07718" stroke-width="2" stroke-linejoin="round"/></svg>';
  var STAR_OFF = '<svg viewBox="0 0 48 48"><path d="M24 5 L30 18 L44 19 L33 28 L37 42 L24 34 L11 42 L15 28 L4 19 L18 18 Z" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.3)" stroke-width="2" stroke-linejoin="round"/></svg>';

  function onWin() {
    stopTimer();
    var stars = moves <= 12 ? 3 : moves <= 18 ? 2 : 1;
    winStars.innerHTML = (stars >= 1 ? STAR_ON : STAR_OFF) + (stars >= 2 ? STAR_ON : STAR_OFF) + (stars >= 3 ? STAR_ON : STAR_OFF);
    winStats.textContent = 'Completed in ' + formatTime(seconds) + ' with ' + moves + ' moves.';
    var isBest = !bestStats || moves < bestStats.moves || (moves === bestStats.moves && seconds < bestStats.seconds);
    if (isBest) {
      bestStats = { moves: moves, seconds: seconds };
      try { localStorage.setItem('memory_best', JSON.stringify(bestStats)); } catch (e) {}
    }
    winBest.textContent = isBest ? 'NEW BEST!' : 'Best: ' + bestStats.moves + ' moves in ' + formatTime(bestStats.seconds);
    sfx.win();
    setTimeout(function () {
      winOverlay.classList.add('show');
      for (var i = 0; i < 5; i++) {
        setTimeout(function () {
          fxBurst(Math.random() * innerWidth, innerHeight * 0.25, ['#ffd166', '#ff9de2', '#7df0ff', '#b8f5c8'], 24, 220);
        }, i * 180);
      }
    }, 600);
  }

  function reset() {
    stopTimer();
    firstCard = null;
    lockBoard = false;
    matchedPairs = 0;
    moves = 0;
    seconds = 0;
    streak = 0;
    timerStarted = false;
    timerEl.textContent = '0:00';
    movesEl.textContent = '0';
    streakEl.textContent = '—';
    winOverlay.classList.remove('show');
    buildBoard();
    sfx.restart();
  }

  document.getElementById('restartBtn').addEventListener('click', function () { ac(); reset(); });
  document.getElementById('playAgainBtn').addEventListener('click', reset);

  buildBoard();
})();
</script>


<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
