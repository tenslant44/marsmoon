<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Air Hockey vs AI — First to 7</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #05060a; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas {
    border-radius: 14px; touch-action: none; cursor: none;
    box-shadow: 0 0 80px rgba(70, 130, 255, .16), 0 0 0 1px rgba(255,255,255,.07);
  }
  #restartBtn {
    position: fixed; top: 14px; right: 14px; z-index: 2;
    background: rgba(255,255,255,.08); color: #cfe0ff;
    border: 1px solid rgba(255,255,255,.18); border-radius: 8px;
    padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  #restartBtn:hover { background: rgba(255,255,255,.17); }
</style>

<style>
/*AAA-INJECT-CSS*/
html{touch-action:manipulation}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{touch-action:none}
button,input,select,textarea{touch-action:manipulation}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:2147483000;background:radial-gradient(ellipse at 50% 40%,transparent 58%,rgba(0,0,0,.28) 100%)}
</style>

<script>
/*AAA-INJECT-SFX*/
window.__gsfx = (function(){
  var ctx=null;
  function ac(){ if(ctx===null){var A=window.AudioContext||window.webkitAudioContext;ctx=A?new A():false;} if(ctx&&ctx.state==='suspended')ctx.resume().catch(function(){}); return ctx||null; }
  function ok(){ return localStorage.getItem('aaa_sfx')!=='0'; }
  function tone(f,d,type,v,slide,when){ if(!ok())return; var c=ac(); if(!c)return; try{ var t=c.currentTime+(when||0); var o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d); g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(v||0.08,t+0.012); g.gain.exponentialRampToValueAtTime(0.0006,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.03);}catch(e){} }
  function noise(dur,v,fq,when,type){ if(!ok())return; var c=ac(); if(!c)return; try{ var t=c.currentTime+(when||0),n=Math.floor(c.sampleRate*dur); var b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0); for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n); var s=c.createBufferSource(); s.buffer=b; var f=c.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=fq||1200; var g=c.createGain(); g.gain.value=v||0.1; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);}catch(e){} }
  var api={
    unlock:ac, tone:tone, noise:noise,
    tap:function(){tone(520,0.05,'triangle',0.05);},
    key:function(){tone(680+Math.random()*60,0.035,'triangle',0.04);},
    deal:function(){noise(0.09,0.09,2600,0,'highpass');tone(300,0.06,'sine',0.04);},
    flip:function(){noise(0.07,0.08,3200,0,'highpass');},
    chip:function(){tone(1900,0.04,'square',0.03);tone(2400,0.03,'square',0.025,null,0.03);noise(0.04,0.05,5000,0,'highpass');},
    clack:function(){noise(0.045,0.1,1600);tone(220,0.05,'triangle',0.07,150);},
    step:function(){tone(330,0.04,'triangle',0.045,280);},
    slide:function(){noise(0.08,0.06,900);tone(260,0.07,'sine',0.045,200);},
    pop:function(i){i=i||0;tone(500+i*80,0.07,'sine',0.07,900+i*120);noise(0.03,0.04,3000,0,'highpass');},
    shoot:function(){tone(700,0.09,'sawtooth',0.05,1400);},
    thud:function(){tone(120,0.12,'sine',0.12,60);noise(0.07,0.08,600);},
    sonar:function(){tone(880,0.35,'sine',0.06);tone(880,0.2,'sine',0.03,null,0.18);},
    splash:function(){noise(0.3,0.1,1200);},
    boom:function(){tone(80,0.5,'sine',0.2,35);noise(0.4,0.16,400);},
    coin:function(){tone(1318,0.06,'square',0.05);tone(1760,0.12,'square',0.05,null,0.06);},
    ding:function(){tone(1046,0.15,'triangle',0.07);tone(1568,0.18,'triangle',0.06,null,0.08);},
    good:function(){tone(659,0.08,'triangle',0.06);tone(880,0.1,'triangle',0.06,null,0.06);},
    bad:function(){tone(180,0.12,'square',0.05,120);},
    win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,0.2,'triangle',0.08,null,i*0.09);});},
    lose:function(){[392,330,262,196].forEach(function(f,i){tone(f,0.26,'sawtooth',0.05,f*0.92,i*0.13);});},
    chord:function(){tone(523,0.14,'sine',0.05);tone(659,0.14,'sine',0.045,null,0.01);tone(784,0.16,'sine',0.04,null,0.02);}
  };
  function unl(){ac();}
  window.addEventListener('pointerdown',unl,{passive:true});
  window.addEventListener('keydown',unl);
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest?e.target.closest('button'):null; if(b&&!b.disabled)api.tap();},true);
  return api;
})();
</script>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<button id="restartBtn">Restart (R)</button>
<script>
(() => {
'use strict';

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

const W = 480, H = 800;
const GOAL = 170;                      // goal mouth width (px)
const POST_L = W / 2 - GOAL / 2, POST_R = W / 2 + GOAL / 2;
const PUCK_R = 13, MAL_R = 27;
const WIN = 7;
const STEP = 1 / 120;                  // fixed physics step (s)
const REST_WALL = 0.86, REST_MAL = 0.95;
const PUCK_MAX = 1500;                 // px/s
const AI_SPEED = 470;                  // px/s
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const puck = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
const pl   = { x: W / 2, y: H * 0.82, vx: 0, vy: 0 };   // player (bottom, cyan)
const ai   = { x: W / 2, y: 110,      vx: 0, vy: 0 };   // AI (top, red)
const mouse = { x: pl.x, y: pl.y, seen: false };

let state, score, serveT, flash, hitPulse, winner, trail;

// ---------- audio (tiny, synthesized) ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(freq, dur, type, gain) {
  try { if (localStorage.getItem('aaa_sfx') === '0') return; } catch (e) {}
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(gain, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
addEventListener('pointermove', () => ac(), { once: true });
addEventListener('pointerdown', () => ac(), { once: true });

// ---------- game state ----------
function restart() {
  score = { you: 0, ai: 0 };
  winner = null;
  flash = 0; hitPulse = 0;
  trail = [];
  serve(W / 2, H / 2);
}
function serve(x, y) {
  puck.x = x; puck.y = y; puck.vx = 0; puck.vy = 0;
  ai.x = W / 2; ai.y = 110;
  pl.x = W / 2; pl.y = H * 0.82;
  serveT = 0.9;
  state = 'serve';
}
function goal(who) {
  score[who === 'you' ? 'you' : 'ai']++;
  flash = 1;
  beep(520, 0.12, 'square', 0.10);
  setTimeout(() => beep(780, 0.18, 'square', 0.10), 110);
  if (score.you >= WIN || score.ai >= WIN) {
    winner = who;
    state = 'over';
    try { if (window.__gsfx) (who === 'you' ? __gsfx.win : __gsfx.lose)(); } catch (e) {}
  } else {
    // conceding side gets the puck
    serve(W / 2, who === 'you' ? H * 0.30 : H * 0.70);
  }
}

// ---------- physics ----------
function hitMallet(m) {
  const dx = puck.x - m.x, dy = puck.y - m.y;
  const d = Math.hypot(dx, dy), min = PUCK_R + MAL_R;
  if (d >= min || d === 0) return;
  const nx = dx / d, ny = dy / d;
  puck.x = m.x + nx * min;
  puck.y = m.y + ny * min;
  const rvn = (puck.vx - m.vx) * nx + (puck.vy - m.vy) * ny;
  if (rvn < 0) {
    puck.vx -= (1 + REST_MAL) * rvn * nx;
    puck.vy -= (1 + REST_MAL) * rvn * ny;
    puck.vx += m.vx * 0.12;
    puck.vy += m.vy * 0.12;
    const s = Math.hypot(puck.vx, puck.vy);
    if (s > PUCK_MAX) { puck.vx *= PUCK_MAX / s; puck.vy *= PUCK_MAX / s; }
    hitPulse = 0.14;
    beep(150, 0.05, 'triangle', 0.12);
  }
}

function step(h) {
  if (!mouse.seen) return;               // wait for player to grab their mallet
  // player mallet follows mouse instantly (clamped to own half + walls)
  {
    const tx = clamp(mouse.x, MAL_R + 6, W - MAL_R - 6);
    const ty = clamp(mouse.y, H / 2 + 2, H - MAL_R - 6);
    pl.vx = (tx - pl.x) / h; pl.vy = (ty - pl.y) / h;
    pl.x = tx; pl.y = ty;
  }

  // AI mallet
  {
    let tx, ty;
    const comingHome = puck.y < 170 && puck.vy < 0;
    if (comingHome) {                     // emergency block
      tx = puck.x; ty = Math.min(puck.y - 20, 150);
    } else if (puck.y < H / 2 + 60) {     // attack: get behind puck, aim at player goal
      const dx = W / 2 - puck.x, dy = H - puck.y;
      const L = Math.hypot(dx, dy) || 1;
      tx = puck.x - dx / L * (MAL_R + PUCK_R - 6);
      ty = puck.y - dy / L * (MAL_R + PUCK_R - 6);
    } else {                              // hold defensive position
      tx = W / 2 + (puck.x - W / 2) * 0.45;
      ty = 95;
    }
    const pax = ai.x, pay = ai.y;
    const dx = tx - ai.x, dy = ty - ai.y, d = Math.hypot(dx, dy);
    if (d > 0) { const s = Math.min(d, AI_SPEED * h) / d; ai.x += dx * s; ai.y += dy * s; }
    ai.x = clamp(ai.x, MAL_R + 6, W - MAL_R - 6);
    ai.y = clamp(ai.y, MAL_R + 6, H / 2 - 2);
    ai.vx = (ai.x - pax) / h; ai.vy = (ai.y - pay) / h;
  }

  if (state !== 'play') return;

  // puck
  puck.x += puck.vx * h;
  puck.y += puck.vy * h;
  const fr = Math.exp(-0.45 * h);
  puck.vx *= fr; puck.vy *= fr;

  hitMallet(pl);
  hitMallet(ai);

  // side walls
  if (puck.x < PUCK_R)     { puck.x = PUCK_R;     puck.vx =  Math.abs(puck.vx) * REST_WALL; beep(220, .03, 'square', .05); }
  if (puck.x > W - PUCK_R) { puck.x = W - PUCK_R; puck.vx = -Math.abs(puck.vx) * REST_WALL; beep(220, .03, 'square', .05); }

  // top end (AI goal — player scores here)
  if (puck.y < PUCK_R) {
    const inMouth = puck.x > POST_L + PUCK_R && puck.x < POST_R - PUCK_R;
    if (inMouth) {
      puck.x = clamp(puck.x, POST_L + PUCK_R, POST_R - PUCK_R);
      if (puck.y < 0) return goal('you');
    } else {
      puck.y = PUCK_R; puck.vy = Math.abs(puck.vy) * REST_WALL;
      beep(220, .03, 'square', .05);
    }
  }
  // bottom end (player goal — AI scores here)
  if (puck.y > H - PUCK_R) {
    const inMouth = puck.x > POST_L + PUCK_R && puck.x < POST_R - PUCK_R;
    if (inMouth) {
      puck.x = clamp(puck.x, POST_L + PUCK_R, POST_R - PUCK_R);
      if (puck.y > H) return goal('ai');
    } else {
      puck.y = H - PUCK_R; puck.vy = -Math.abs(puck.vy) * REST_WALL;
      beep(220, .03, 'square', .05);
    }
  }

  trail.push({ x: puck.x, y: puck.y, a: 0.35 });
  if (trail.length > 14) trail.shift();
}

// ---------- rendering ----------
function line(x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function mallet(m, color, glow) {
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = 22;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(m.x, m.y, MAL_R, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.arc(m.x, m.y, MAL_R * 0.55, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(m.x, m.y, MAL_R * 0.30, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function draw() {
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);

  // table
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#182642'); g.addColorStop(.5, '#0d1526'); g.addColorStop(1, '#182642');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // walls
  ctx.strokeStyle = 'rgba(130,180,255,.4)'; ctx.lineWidth = 3;
  line(2, 0, 2, H); line(W - 2, 0, W - 2, H);
  line(0, 2, POST_L, 2); line(POST_R, 2, W, 2);
  line(0, H - 2, POST_L, H - 2); line(POST_R, H - 2, W, H - 2);

  // goal mouths
  ctx.fillStyle = 'rgba(255,95,95,.30)'; ctx.fillRect(POST_L, 0, GOAL, 7);
  ctx.fillStyle = 'rgba(90,205,255,.30)'; ctx.fillRect(POST_L, H - 7, GOAL, 7);

  // center line + circle
  ctx.strokeStyle = 'rgba(160,200,255,.16)';
  line(0, H / 2, W, H / 2);
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 62, 0, Math.PI * 2); ctx.stroke();

  // scores (faint, mid-field)
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 72px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,120,120,.10)';
  ctx.fillText(score.ai, W / 2, H * 0.24);
  ctx.fillStyle = 'rgba(120,210,255,.10)';
  ctx.fillText(score.you, W / 2, H * 0.76);
  ctx.font = '600 14px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,120,120,.25)';
  ctx.fillText('CPU', W / 2, H * 0.24 + 52);
  ctx.fillStyle = 'rgba(120,210,255,.25)';
  ctx.fillText('YOU', W / 2, H * 0.76 - 52);

  // puck trail
  for (const t of trail) {
    t.a *= 0.90;
    ctx.fillStyle = `rgba(220,235,255,${t.a * 0.5})`;
    ctx.beginPath(); ctx.arc(t.x, t.y, PUCK_R * t.a, 0, Math.PI * 2); ctx.fill();
  }

  // puck
  ctx.save();
  ctx.shadowColor = '#dfeeff'; ctx.shadowBlur = 18 + hitPulse * 80;
  ctx.fillStyle = '#eaf2ff';
  ctx.beginPath(); ctx.arc(puck.x, puck.y, PUCK_R, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(60,90,140,.8)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(puck.x, puck.y, PUCK_R - 2, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  mallet(ai, '#ff5f5f');
  mallet(pl, '#5fcdff');

  // goal flash
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,200,${flash * 0.25})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = flash;
    ctx.font = '800 54px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#fff7c0';
    ctx.shadowColor = '#ffd75e'; ctx.shadowBlur = 30;
    ctx.fillText('GOAL!', W / 2, H / 2 - 10);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  // start hint
  if (!mouse.seen && state !== 'over') {
    ctx.fillStyle = 'rgba(10,15,28,.55)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#cfe2ff';
    ctx.font = '700 26px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('AIR HOCKEY', W / 2, H / 2 - 40);
    ctx.font = '500 16px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(207,226,255,.8)';
    ctx.fillText('Move your mouse to control the blue mallet', W / 2, H / 2 + 4);
    ctx.fillText('First to 7 goals wins — press R to restart', W / 2, H / 2 + 30);
  }

  // game over overlay
  if (state === 'over') {
    ctx.fillStyle = 'rgba(5,8,16,.72)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = '800 52px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = winner === 'you' ? '#6ee7ff' : '#ff7b7b';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 26;
    ctx.fillText(winner === 'you' ? 'YOU WIN!' : 'CPU WINS', W / 2, H / 2 - 30);
    ctx.shadowBlur = 0;
    ctx.font = '600 22px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#dfe8ff';
    ctx.fillText(`${score.you} — ${score.ai}`, W / 2, H / 2 + 18);
    ctx.font = '500 15px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(223,232,255,.75)';
    ctx.fillText('Click or press R to play again', W / 2, H / 2 + 58);
  }
}

// ---------- input ----------
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  mouse.x = (cx - r.left) * W / r.width;
  mouse.y = (cy - r.top) * H / r.height;
}
addEventListener('mousemove', e => { mouse.seen = true; toLogical(e); });
cv.addEventListener('touchmove', e => { e.preventDefault(); mouse.seen = true; toLogical(e); }, { passive: false });
cv.addEventListener('touchstart', e => { mouse.seen = true; toLogical(e); if (state === 'over') restart(); }, { passive: true });
cv.addEventListener('click', () => { if (state === 'over') restart(); });
addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') restart(); });
document.getElementById('restartBtn').addEventListener('click', restart);

// ---------- resize ----------
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.96;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
}
addEventListener('resize', resize);

// ---------- main loop ----------
let last = performance.now(), acc = 0;
function frame(t) {
  requestAnimationFrame(frame);
  let dt = (t - last) / 1000; last = t;
  if (dt > 0.05) dt = 0.05;
  if (state === 'serve') {
    serveT -= dt;
    if (serveT <= 0) state = 'play';
  }
  if (flash > 0) flash = Math.max(0, flash - dt * 1.4);
  if (hitPulse > 0) hitPulse = Math.max(0, hitPulse - dt);
  acc += dt;
  while (acc >= STEP) { step(STEP); acc -= STEP; }
  draw();
}

resize();
restart();
requestAnimationFrame(frame);
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
