<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Stack Tower</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b0f2a;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-user-select:none;user-select:none}
  canvas{display:block;touch-action:manipulation;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
'use strict';

var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var W=0,H=0,DPR=1,bgGrad=null;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  bgGrad=ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#0d1330');
  bgGrad.addColorStop(0.6,'#1c1f4d');
  bgGrad.addColorStop(1,'#3a2358');
}
window.addEventListener('resize',resize);
resize();

var BLOCK_H=26;
var BASE_W=240;
var GROUND=90;
var GAP=BLOCK_H*3.2;
var GRAV=3000;
var PERFECT=5;
var FONT='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';

var state='ready';
var tower=[],mover=null,debris=[],pops=[];
var camY=0,shake=0,score=0,best=0,tNow=0;
var stars=[];

try{best=parseInt(localStorage.getItem('stackTowerBest')||'0',10)||0;}catch(e){}
for(var i=0;i<110;i++)
  stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.5+0.4,p:Math.random()*6.283});

// ---------- Audio ----------
var ACX=null;
function ac(){
  try{
    if(!ACX)ACX=new(window.AudioContext||window.webkitAudioContext)();
    if(ACX.state==='suspended')ACX.resume();
  }catch(e){}
  return ACX;
}
function tone(f,d,type,v,slide,delay){
  var c=ac();if(!c)return;
  d=d||0.1;type=type||'sine';v=v||0.05;
  var t=c.currentTime+(delay||0);
  try{
    var o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(24,slide),t+d);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(v,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+d+0.04);
  }catch(e){}
}
function noiseSfx(d,v,fc){
  var c=ac();if(!c)return;
  try{
    var n=Math.floor(c.sampleRate*(d||0.3));
    var b=c.createBuffer(1,n,c.sampleRate),ch=b.getChannelData(0);
    for(var i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
    var s=c.createBufferSource();s.buffer=b;
    var f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||1200;
    var g=c.createGain();g.gain.value=v||0.1;
    s.connect(f);f.connect(g);g.connect(c.destination);s.start();
  }catch(e){}
}
var sfx={
  whoosh:function(){noiseSfx(0.16,0.05,1600);tone(300,0.14,'sine',0.03,140);},
  land:function(){tone(180,0.1,'triangle',0.08,120);noiseSfx(0.08,0.05,700);},
  perfect:function(st){
    var base=660*Math.pow(1.09,Math.min(10,st-1));
    tone(base,0.09,'triangle',0.07);
    tone(base*1.5,0.14,'sine',0.05,null,0.05);
  },
  over:function(){noiseSfx(0.4,0.2,600);tone(160,0.4,'sawtooth',0.08,50);[330,262,196].forEach(function(f,i){tone(f,0.2,'triangle',0.05,null,0.1+i*0.12);});},
  blip:function(){tone(740,0.05,'sine',0.045,960);}
};
// gentle pulse BGM while playing — ducks when overlay music is enabled
var bgm={
  t:null,step:0,
  roots:[130.8,110,98,116.5],
  start:function(){this.stop();this.step=0;var self=this;
    this.t=setInterval(function(){self.tick();},260);},
  tick:function(){
    var c=ac();if(!c||c.state!=='running')return;
    try{if(localStorage.getItem('aaa_bgm')==='1')return;}catch(e){}
    var st=this.step++;
    if(st%2===0)tone(this.roots[Math.floor(st/8)%4]/2,0.22,'triangle',0.04);
    if(st%8===6)tone(523+st%4*66,0.08,'square',0.011);
  },
  stop:function(){if(this.t)clearInterval(this.t);this.t=null;}
};
var perfStreak=0;

function hueAt(n){return (205+n*7)%360;}
function topBlock(){return tower[tower.length-1];}
function topY(){return tower.length*BLOCK_H;}
function wy2s(wy){return H-GROUND-wy+camY;}
function hsla(h,s,l,a){return 'hsla('+h+','+s+'%,'+l+'%,'+a+')';}

function saveBest(){try{localStorage.setItem('stackTowerBest',String(best));}catch(e){}}

function reset(){
  tower=[{x:Math.round((W-BASE_W)/2),w:BASE_W,hue:hueAt(0)}];
  debris=[];pops=[];camY=0;shake=0;score=0;perfStreak=0;
  spawnMover();
}

function spawnMover(){
  var top=topBlock();
  var w=Math.max(1,Math.round(top.w));
  var fromLeft=(tower.length%2===1);
  mover={
    w:w,
    dir:fromLeft?1:-1,
    speed:Math.min(640,250+tower.length*14),
    y:topY()+GAP,
    vy:null,
    x:fromLeft?-w-30:W+30,
    hue:hueAt(tower.length)
  };
}

function drop(){
  if(state!=='playing'||!mover||mover.vy!==null)return;
  mover.vy=0;
  sfx.whoosh();
}

function land(){
  var top=topBlock();
  var left=Math.max(mover.x,top.x);
  var right=Math.min(mover.x+mover.w,top.x+top.w);
  var ov=right-left;
  var ly=topY();

  if(ov<=0){
    var mx=mover.x+mover.w/2;
    debris.push({x:mover.x,w:mover.w,y:mover.y,vy:mover.vy,vx:mover.dir*60,hue:mover.hue,a:1});
    mover=null;
    state='over';
    shake=12;
    perfStreak=0;
    bgm.stop();
    sfx.over();
    if(window.AAA){AAA.flash(0.26);AAA.shockwave(mx,wy2s(ly),'#ff6a5e',120);}
    if(score>best){best=score;saveBest();}
    return;
  }

  var nx=left,nw=ov;
  var perfect=(mover.w-ov)<=PERFECT;
  if(perfect){
    nx=top.x;nw=top.w;
    perfStreak++;
    pops.push({x:top.x+top.w/2,y:ly+BLOCK_H+16,text:perfStreak>1?'PERFECT x'+perfStreak:'PERFECT',t:0});
    sfx.perfect(perfStreak);
    if(window.AAA){
      AAA.burst(top.x+top.w/2,wy2s(ly),'#ffe27a',10+perfStreak*2);
      if(perfStreak>=2)AAA.popup(top.x+top.w/2,wy2s(ly)-46,'x'+perfStreak+' STREAK','#f472b6');
    }
  }else{
    perfStreak=0;
    sfx.land();
  }
  if(mover.x<left-0.5)
    debris.push({x:mover.x,w:left-mover.x,y:ly,vy:0,vx:-70,hue:mover.hue,a:1});
  if(mover.x+mover.w>right+0.5)
    debris.push({x:right,w:(mover.x+mover.w)-right,y:ly,vy:0,vx:70,hue:mover.hue,a:1});

  tower.push({x:nx,w:nw,hue:hueAt(tower.length)});
  score=tower.length-1;
  if(score>best){best=score;saveBest();}
  shake=perfect?7:4;
  spawnMover();
}

function action(){
  ac();
  if(state==='over'){reset();state='playing';sfx.blip();bgm.start();return;}
  if(state==='ready'){state='playing';sfx.blip();bgm.start();return;}
  drop();
}

canvas.addEventListener('pointerdown',function(e){e.preventDefault();action();});
window.addEventListener('keydown',function(e){
  if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowDown'){
    e.preventDefault();action();
  }
});

function update(dt){
  if(mover){
    if(mover.vy===null){
      mover.x+=mover.dir*mover.speed*dt;
      if(mover.x<0){mover.x=0;mover.dir=1;}
      else if(mover.x+mover.w>W){mover.x=W-mover.w;mover.dir=-1;}
    }else{
      mover.vy+=GRAV*dt;
      mover.y-=mover.vy*dt;
      if(mover.y<=topY()){mover.y=topY();land();}
    }
  }
  for(var i=debris.length-1;i>=0;i--){
    var d=debris[i];
    d.vy+=GRAV*dt;d.y-=d.vy*dt;d.x+=d.vx*dt;d.a-=dt*0.9;
    if(d.a<=0||wy2s(d.y)>H+80)debris.splice(i,1);
  }
  for(var j=pops.length-1;j>=0;j--){
    var p=pops[j];p.t+=dt;p.y+=30*dt;
    if(p.t>1)pops.splice(j,1);
  }
  var target=Math.max(0,topY()+GAP-H*0.52);
  camY+=(target-camY)*Math.min(1,dt*6);
  shake=Math.max(0,shake-dt*40);
}

function drawBlock(x,y,w,hue,a){
  if(w<=0)return;
  var sy=wy2s(y),ty=sy-BLOCK_H;
  ctx.globalAlpha=a;
  var g=ctx.createLinearGradient(0,ty,0,sy);
  g.addColorStop(0,hsla(hue,66,60,1));
  g.addColorStop(1,hsla(hue,60,38,1));
  ctx.fillStyle=g;
  ctx.fillRect(x,ty,w,BLOCK_H);
  ctx.fillStyle=hsla(hue,85,78,0.95);
  ctx.fillRect(x,ty,w,3);
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.fillRect(x,sy-4,w,4);
  ctx.globalAlpha=1;
}

function draw(){
  ctx.fillStyle=bgGrad;
  ctx.fillRect(0,0,W,H);

  var i,s,yy;
  ctx.fillStyle='#fff';
  for(i=0;i<stars.length;i++){
    s=stars[i];
    yy=((s.y*(H+60)+camY*0.25)%(H+60))-30;
    ctx.globalAlpha=0.25+0.3*Math.abs(Math.sin(tNow*1.6+s.p));
    ctx.beginPath();ctx.arc(s.x*W,yy,s.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  var gy=wy2s(0);
  if(gy<H+50){
    var pw=BASE_W+140;
    ctx.fillStyle='#141737';
    ctx.fillRect((W-pw)/2,gy,pw,H-gy+4);
    ctx.fillStyle='rgba(255,255,255,0.14)';
    ctx.fillRect((W-pw)/2,gy,pw,3);
  }

  if(mover&&mover.vy===null&&state==='playing'){
    ctx.fillStyle='rgba(255,255,255,0.07)';
    ctx.fillRect(mover.x,wy2s(topY()),mover.w,wy2s(mover.y)-wy2s(topY())-BLOCK_H+BLOCK_H);
  }

  for(i=0;i<tower.length;i++)drawBlock(tower[i].x,i*BLOCK_H,tower[i].w,tower[i].hue,1);
  for(i=0;i<debris.length;i++){
    var d=debris[i];
    drawBlock(d.x,d.y,d.w,d.hue,Math.max(0,d.a));
  }
  if(mover)drawBlock(mover.x,mover.y,mover.w,mover.hue,1);

  ctx.textAlign='center';
  for(i=0;i<pops.length;i++){
    var p=pops[i];
    ctx.globalAlpha=1-p.t;
    ctx.font='800 20px '+FONT;
    ctx.fillStyle='#ffe27a';
    ctx.fillText(p.text,p.x,wy2s(p.y));
  }
  ctx.globalAlpha=1;
  ctx.restore();

  ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=8;
  ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.font='800 52px '+FONT;
  ctx.fillText(String(score),W/2,66);
  ctx.shadowBlur=0;
  ctx.font='600 13px '+FONT;
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.fillText('B E S T   '+best,W/2,90);

  if(state==='ready'){
    ctx.fillStyle='rgba(8,10,28,0.55)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffffff';
    ctx.font='800 54px '+FONT;
    ctx.fillText('STACK TOWER',W/2,H*0.42);
    ctx.font='600 18px '+FONT;
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.fillText('Click, tap or press SPACE to drop each block',W/2,H*0.42+42);
    ctx.font='500 14px '+FONT;
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.fillText('Line it up — the overhang gets sliced off. Miss and it\u2019s over.',W/2,H*0.42+70);
  }else if(state==='over'){
    ctx.fillStyle='rgba(8,10,28,0.62)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffffff';
    ctx.font='800 46px '+FONT;
    ctx.fillText('GAME OVER',W/2,H*0.40);
    ctx.font='700 26px '+FONT;
    ctx.fillStyle='#ffd76a';
    ctx.fillText('Height: '+score+(score>=best&&score>0?'   NEW BEST!':''),W/2,H*0.40+44);
    ctx.font='600 16px '+FONT;
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.fillText('Click or press SPACE to restart',W/2,H*0.40+80);
  }
}

var last=performance.now();
function frame(now){
  var dt=Math.min(0.033,(now-last)/1000);
  last=now;tNow=now/1000;
  update(dt);draw();
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
