<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Simon Says</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(120,140,255,.14), transparent 55%),
      linear-gradient(160deg, #181d33 0%, #0a0d1a 75%);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }

  h1 {
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    letter-spacing: 5px;
    font-weight: 800;
    margin-bottom: 6px;
    text-shadow: 0 0 24px rgba(120,140,255,.45);
  }

  .hud { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 12px;
    padding: 7px 16px;
    min-width: 84px;
    text-align: center;
    box-shadow: inset 0 0 14px rgba(0,0,0,.3);
  }
  .stat .label { display: block; font-size: .6rem; text-transform: uppercase; letter-spacing: 1.5px; color: #8fa3d8; }
  .stat .value { font-weight: 800; font-variant-numeric: tabular-nums; }
  #best .value { color: #ffd166; }

  #device {
    position: relative;
    width: min(88vw, 380px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #33395c, #181d33 70%);
    box-shadow: 0 24px 60px rgba(0,0,0,.65), inset 0 0 30px rgba(0,0,0,.5);
    padding: 5.5%;
  }
  #device.strict .ring { box-shadow: 0 0 14px rgba(255,80,100,.8); }

  #pads {
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 4.5%;
    border-radius: 50%;
    overflow: hidden;
  }

  .pad {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: filter .1s, transform .08s;
    position: relative;
  }
  .pad::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.22), transparent 60%);
    opacity: 0;
    transition: opacity .1s;
  }
  .pad:active::after, .pad.lit::after { opacity: 1; }
  .pad.lit { filter: brightness(1.65) saturate(1.3); }
  .pad.g0 { background: linear-gradient(145deg, #1e9e4a, #157a38); border-radius: 100% 8% 8% 8%; }
  .pad.g1 { background: linear-gradient(145deg, #e04444, #b23030); border-radius: 8% 100% 8% 8%; }
  .pad.g2 { background: linear-gradient(145deg, #e8c832, #c0a020); border-radius: 8% 8% 8% 100%; }
  .pad.g3 { background: linear-gradient(145deg, #3878e0, #2860b8); border-radius: 8% 8% 100% 8%; }
  .pad.g0.lit { box-shadow: 0 0 50px #3ce06a, inset 0 0 40px #3ce06a; }
  .pad.g1.lit { box-shadow: 0 0 50px #ff6a6a, inset 0 0 40px #ff6a6a; }
  .pad.g2.lit { box-shadow: 0 0 50px #ffe86a, inset 0 0 40px #ffe86a; }
  .pad.g3.lit { box-shadow: 0 0 50px #6aa8ff, inset 0 0 40px #6aa8ff; }

  #center {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 42%; height: 42%;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #3a4270, #161a30 75%);
    border: 5px solid #0e1224;
    box-shadow: 0 8px 24px rgba(0,0,0,.6), inset 0 0 20px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 3;
    pointer-events: none;
  }
  #center .ring {
    position: absolute;
    inset: -9px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.12);
  }
  #round-num {
    font-size: clamp(1.7rem, 8vw, 2.4rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 16px rgba(140,160,255,.6);
  }
  #center .cap { font-size: .62rem; letter-spacing: 2px; color: #8fa3d8; text-transform: uppercase; }

  #status {
    margin-top: 18px;
    font-size: 1.05rem;
    font-weight: 700;
    color: #cdd8f0;
    min-height: 1.4em;
    text-align: center;
  }
  #status.err { color: #ff9aa8; }
  #status.good { color: #7de88a; }

  #startBtn {
    margin-top: 14px;
    background: linear-gradient(135deg, #7888ff, #5a6ae8);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 34px;
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(120,140,255,.45), 0 3px 0 #3a449e;
    transition: transform .12s;
  }
  #startBtn:hover { transform: scale(1.05); }
  #startBtn:active { transform: translateY(2px); }
  #startBtn.playing { opacity: .4; pointer-events: none; }
</style>
</head>
<body>

<h1>SIMON SAYS</h1>
<div class="hud">
  <div class="stat"><span class="label">Round</span><span class="value" id="round">—</span></div>
  <div class="stat" id="best"><span class="label">Best</span><span class="value" id="bestV">0</span></div>
</div>

<div id="device">
  <div id="pads">
    <div class="pad g0" data-p="0"></div>
    <div class="pad g1" data-p="1"></div>
    <div class="pad g2" data-p="2"></div>
    <div class="pad g3" data-p="3"></div>
  </div>
  <div id="center">
    <div class="ring"></div>
    <div id="round-num">—</div>
    <div class="cap">SIMON</div>
  </div>
</div>

<div id="status">Watch the pattern, repeat it back.</div>
<button id="startBtn">START</button>

<script>
(function () {
  'use strict';

  var pads = Array.prototype.slice.call(document.querySelectorAll('.pad'));
  var statusEl = document.getElementById('status');
  var roundEl = document.getElementById('round');
  var roundNum = document.getElementById('round-num');
  var bestEl = document.getElementById('bestV');
  var startBtn = document.getElementById('startBtn');

  var seq = [], userIdx = 0, playing = false, showing = false;
  var best = 0;
  try { best = parseInt(localStorage.getItem('simon_best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  // Classic Simon frequencies
  var FREQ = [392.0, 329.6, 261.6, 196.0];

  var ACX = null;
  function ac() {
    try {
      if (!ACX) ACX = new (window.AudioContext || window.webkitAudioContext)();
      if (ACX.state === 'suspended') ACX.resume();
    } catch (e) {}
    return ACX;
  }

  function padTone(i, dur) {
    var c = ac(); if (!c) return;
    var t = c.currentTime;
    try {
      var o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain();
      o.type = 'triangle'; o.frequency.value = FREQ[i];
      o2.type = 'sine'; o2.frequency.value = FREQ[i] * 2;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.09, t + 0.015);
      g.gain.setValueAtTime(0.09, t + dur * 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      var g2 = c.createGain(); g2.gain.value = 0.3;
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.05);
      o2.start(t); o2.stop(t + dur + 0.05);
    } catch (e) {}
  }

  function buzz() {
    var c = ac(); if (!c) return;
    var t = c.currentTime;
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(140, t);
      o.frequency.linearRampToValueAtTime(90, t + 0.6);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.11, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.75);
    } catch (e) {}
  }

  function tone(f, d, type, v, delay) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + (delay || 0);
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v || 0.05, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + d + 0.03);
    } catch (e) {}
  }

  function lightPad(i, dur) {
    pads[i].classList.add('lit');
    padTone(i, dur);
    setTimeout(function () { pads[i].classList.remove('lit'); }, dur * 1000 * 0.85);
  }

  function playbackSpeed() {
    // ramp: faster playback each few rounds
    return Math.max(0.28, 0.62 - seq.length * 0.022);
  }

  function showSequence() {
    showing = true;
    userIdx = 0;
    statusEl.className = '';
    statusEl.textContent = 'Watch…';
    var dur = playbackSpeed();
    seq.forEach(function (p, i) {
      setTimeout(function () { lightPad(p, dur * 0.8); }, i * dur * 1000 + 500);
    });
    setTimeout(function () {
      showing = false;
      statusEl.textContent = 'Your turn!';
    }, seq.length * dur * 1000 + 600);
  }

  function nextRound() {
    seq.push(Math.floor(Math.random() * 4));
    var r = seq.length;
    roundEl.textContent = r;
    roundNum.textContent = r;
    if (r > best) { best = r; bestEl.textContent = best; try { localStorage.setItem('simon_best', String(best)); } catch (e) {} }
    showSequence();
  }

  function gameOver() {
    playing = false;
    showing = false;
    startBtn.classList.remove('playing');
    startBtn.textContent = 'RETRY';
    buzz();
    statusEl.className = 'err';
    statusEl.textContent = 'Wrong! Reached round ' + seq.length + ' — best ' + best + '.';
    // flash all pads
    pads.forEach(function (p) { p.classList.add('lit'); });
    setTimeout(function () { pads.forEach(function (p) { p.classList.remove('lit'); }); }, 500);
  }

  function start() {
    ac();
    seq = [];
    playing = true;
    startBtn.classList.add('playing');
    startBtn.textContent = 'PLAYING';
    [523, 659, 784].forEach(function (f, i) { tone(f, 0.12, 'triangle', 0.06, i * 0.08); });
    nextRound();
  }

  pads.forEach(function (pad) {
    pad.addEventListener('pointerdown', function () {
      if (!playing || showing) return;
      var i = +pad.dataset.p;
      padTone(i, 0.3);
      pad.classList.add('lit');
      setTimeout(function () { pad.classList.remove('lit'); }, 240);
      if (i === seq[userIdx]) {
        userIdx++;
        if (userIdx === seq.length) {
          statusEl.className = 'good';
          statusEl.textContent = 'Correct!';
          tone(880, 0.1, 'sine', 0.05, 0.1);
          showing = true;
          setTimeout(nextRound, 900);
        }
      } else {
        gameOver();
      }
    });
  });

  startBtn.addEventListener('click', function () { if (!playing) start(); });
  document.addEventListener('keydown', function (e) {
    if ((e.code === 'Space' || e.code === 'Enter') && !playing) { start(); e.preventDefault(); }
    var kmap = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, KeyQ: 0, KeyW: 1, KeyA: 2, KeyS: 3 };
    if (playing && !showing && e.code in kmap) {
      pads[kmap[e.code]].dispatchEvent(new PointerEvent('pointerdown'));
    }
  });
})();
</script>


<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
