<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Guess the Number</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #eee;
    padding: 20px;
  }
  h1 { font-size: 2rem; margin-bottom: 8px; letter-spacing: 2px; }
  .subtitle { color: #8899aa; margin-bottom: 16px; font-size: 0.95rem; }
  #game {
    background: #0f1526;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    padding: 28px;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  #tries {
    font-size: 0.9rem;
    color: #8899aa;
    letter-spacing: 1px;
  }
  #tries b { color: #ffd166; }
  #inputRow { display: flex; gap: 10px; width: 100%; }
  #guessInput {
    flex: 1;
    background: #223055;
    border: 1px solid #445;
    border-radius: 8px;
    color: #eee;
    font-size: 1.3rem;
    padding: 10px 14px;
    text-align: center;
    outline: none;
    transition: border-color 0.15s;
  }
  #guessInput:focus { border-color: #ffd166; }
  #guessInput:disabled { opacity: 0.4; }
  button {
    background: #2a3a5a;
    color: #eee;
    border: 1px solid #445;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }
  button:hover { background: #3a4d75; }
  button:active { transform: scale(0.97); }
  #guessBtn { background: #2d6a4f; border-color: #40916c; font-weight: 600; }
  #guessBtn:hover { background: #40916c; }
  #guessBtn:disabled { background: #2a3a5a; border-color: #445; opacity: 0.4; cursor: default; }
  #hint {
    font-size: 1.15rem;
    font-weight: 600;
    min-height: 3.2em;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }
  #hint .dir { font-size: 0.9rem; font-weight: 400; color: #8899aa; }
  #history {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    min-height: 40px;
  }
  .chip {
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.95rem;
    font-weight: 600;
    animation: pop 0.15s ease-out;
  }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .chip small { font-weight: 400; opacity: 0.85; margin-left: 4px; }
  .boiling  { background: #b91c1c; }
  .veryhot  { background: #dc4a11; }
  .hot      { background: #d97706; }
  .warm     { background: #a3870a; }
  .cool     { background: #1d6fa5; }
  .cold     { background: #1e3a8a; }
  .freezing { background: #312e81; }
  .exact    { background: #15803d; }
  .tempbar { width: 100%; height: 10px; background: #0a0f1f; border-radius: 6px; overflow: hidden; }
  .tempbar > div {
    height: 100%;
    width: 0%;
    border-radius: 6px;
    background: linear-gradient(90deg, #3b82f6, #eab308, #ef4444);
    transition: width 0.25s;
  }
  #restartBtn { display: none; background: #6d28d9; border-color: #8b5cf6; font-weight: 600; }
  #restartBtn:hover { background: #8b5cf6; }
  #restartBtn.visible { display: block; }
  .shake { animation: shake 0.3s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
</style>

<style>
/*AAA-INJECT-CSS*/
html{touch-action:manipulation}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{touch-action:none}
button,input,select,textarea{touch-action:manipulation}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:2147483000;background:radial-gradient(ellipse at 50% 40%,transparent 58%,rgba(0,0,0,.28) 100%)}
</style>

<script>
/*AAA-INJECT-SFX*/
window.__gsfx = (function(){
  var ctx=null;
  function ac(){ if(ctx===null){var A=window.AudioContext||window.webkitAudioContext;ctx=A?new A():false;} if(ctx&&ctx.state==='suspended')ctx.resume().catch(function(){}); return ctx||null; }
  function ok(){ return localStorage.getItem('aaa_sfx')!=='0'; }
  function tone(f,d,type,v,slide,when){ if(!ok())return; var c=ac(); if(!c)return; try{ var t=c.currentTime+(when||0); var o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d); g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(v||0.08,t+0.012); g.gain.exponentialRampToValueAtTime(0.0006,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.03);}catch(e){} }
  function noise(dur,v,fq,when,type){ if(!ok())return; var c=ac(); if(!c)return; try{ var t=c.currentTime+(when||0),n=Math.floor(c.sampleRate*dur); var b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0); for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n); var s=c.createBufferSource(); s.buffer=b; var f=c.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=fq||1200; var g=c.createGain(); g.gain.value=v||0.1; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);}catch(e){} }
  var api={
    unlock:ac, tone:tone, noise:noise,
    tap:function(){tone(520,0.05,'triangle',0.05);},
    key:function(){tone(680+Math.random()*60,0.035,'triangle',0.04);},
    deal:function(){noise(0.09,0.09,2600,0,'highpass');tone(300,0.06,'sine',0.04);},
    flip:function(){noise(0.07,0.08,3200,0,'highpass');},
    chip:function(){tone(1900,0.04,'square',0.03);tone(2400,0.03,'square',0.025,null,0.03);noise(0.04,0.05,5000,0,'highpass');},
    clack:function(){noise(0.045,0.1,1600);tone(220,0.05,'triangle',0.07,150);},
    step:function(){tone(330,0.04,'triangle',0.045,280);},
    slide:function(){noise(0.08,0.06,900);tone(260,0.07,'sine',0.045,200);},
    pop:function(i){i=i||0;tone(500+i*80,0.07,'sine',0.07,900+i*120);noise(0.03,0.04,3000,0,'highpass');},
    shoot:function(){tone(700,0.09,'sawtooth',0.05,1400);},
    thud:function(){tone(120,0.12,'sine',0.12,60);noise(0.07,0.08,600);},
    sonar:function(){tone(880,0.35,'sine',0.06);tone(880,0.2,'sine',0.03,null,0.18);},
    splash:function(){noise(0.3,0.1,1200);},
    boom:function(){tone(80,0.5,'sine',0.2,35);noise(0.4,0.16,400);},
    coin:function(){tone(1318,0.06,'square',0.05);tone(1760,0.12,'square',0.05,null,0.06);},
    ding:function(){tone(1046,0.15,'triangle',0.07);tone(1568,0.18,'triangle',0.06,null,0.08);},
    good:function(){tone(659,0.08,'triangle',0.06);tone(880,0.1,'triangle',0.06,null,0.06);},
    bad:function(){tone(180,0.12,'square',0.05,120);},
    win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,0.2,'triangle',0.08,null,i*0.09);});},
    lose:function(){[392,330,262,196].forEach(function(f,i){tone(f,0.26,'sawtooth',0.05,f*0.92,i*0.13);});},
    chord:function(){tone(523,0.14,'sine',0.05);tone(659,0.14,'sine',0.045,null,0.01);tone(784,0.16,'sine',0.04,null,0.02);}
  };
  function unl(){ac();}
  window.addEventListener('pointerdown',unl,{passive:true});
  window.addEventListener('keydown',unl);
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest?e.target.closest('button'):null; if(b&&!b.disabled)api.tap();},true);
  return api;
})();
</script>
</head>
<body>
<h1>Guess the Number</h1>
<p class="subtitle">I'm thinking of a number between 1 and 100</p>
<div id="game">
  <div id="tries">Guesses left: <b>10</b></div>
  <div id="inputRow">
    <input id="guessInput" type="number" min="1" max="100" placeholder="?" autocomplete="off">
    <button id="guessBtn">Guess</button>
  </div>
  <div class="tempbar"><div id="tempFill"></div></div>
  <div id="hint">Make your first guess!</div>
  <div id="history"></div>
  <div id="best" style="font-size:.75rem;color:#8899aa;letter-spacing:.14em;min-height:1.2em"></div>
  <button id="restartBtn">Play Again</button>
</div>

<script>
(function () {
  'use strict';

  var MAX_TRIES = 10;
  var RANGE_MIN = 1, RANGE_MAX = 100;

  var target, triesLeft, guesses, gameOver;

  var input = document.getElementById('guessInput');
  var guessBtn = document.getElementById('guessBtn');
  var restartBtn = document.getElementById('restartBtn');
  var hintEl = document.getElementById('hint');
  var triesEl = document.getElementById('tries');
  var historyEl = document.getElementById('history');
  var tempFill = document.getElementById('tempFill');
  var bestEl = document.getElementById('best');
  var best = 0;
  try { best = +localStorage.getItem('gn_best') || 0; } catch (e) {}
  function showBest() {
    bestEl.innerHTML = best ? 'FEWEST GUESSES: <b style="color:#ffd166">' + best + '</b>' : '';
  }

  function newGame() {
    target = Math.floor(Math.random() * (RANGE_MAX - RANGE_MIN + 1)) + RANGE_MIN;
    triesLeft = MAX_TRIES;
    guesses = [];
    gameOver = false;
    input.disabled = false;
    guessBtn.disabled = false;
    input.value = '';
    historyEl.innerHTML = '';
    tempFill.style.width = '0%';
    hintEl.innerHTML = 'Make your first guess!';
    restartBtn.classList.remove('visible');
    updateTries();
    showBest();
    input.focus();
  }

  function updateTries() {
    triesEl.innerHTML = 'Guesses left: <b>' + triesLeft + '</b>';
  }

  // Closeness tier: name, css class, temperature bar % (100 = exact)
  function tierFor(distance) {
    if (distance === 0)  return { label: 'Exact!', cls: 'exact',    temp: 100 };
    if (distance <= 3)   return { label: 'Boiling', cls: 'boiling',  temp: 95 };
    if (distance <= 6)   return { label: 'Very hot', cls: 'veryhot', temp: 82 };
    if (distance <= 10)  return { label: 'Hot', cls: 'hot',          temp: 68 };
    if (distance <= 16)  return { label: 'Warm', cls: 'warm',        temp: 52 };
    if (distance <= 25)  return { label: 'Cool', cls: 'cool',        temp: 36 };
    if (distance <= 40)  return { label: 'Cold', cls: 'cold',        temp: 20 };
    return { label: 'Freezing', cls: 'freezing', temp: 6 };
  }

  // Compare with previous guess to say warmer/colder
  function trendFor(distance) {
    if (guesses.length < 2) return '';
    var prevDist = guesses[guesses.length - 2].distance;
    if (distance < prevDist) return ' — getting warmer';
    if (distance > prevDist) return ' — getting colder';
    return ' — same distance';
  }

  function addChip(guess, tier) {
    var chip = document.createElement('span');
    chip.className = 'chip ' + tier.cls;
    chip.innerHTML = guess + '<small>' + tier.label + '</small>';
    historyEl.appendChild(chip);
  }

  function endGame(won) {
    gameOver = true;
    input.disabled = true;
    guessBtn.disabled = true;
    restartBtn.classList.add('visible');
    if (won) {
      var n = guesses.length;
      var extra = '';
      if (!best || n < best) {
        best = n;
        try { localStorage.setItem('gn_best', best); } catch (e) {}
        extra = ' NEW BEST!';
        showBest();
      }
      hintEl.innerHTML = 'You got it! The number was ' + target + '.' +
        '<span class="dir">Solved in ' + n + (n === 1 ? ' guess' : ' guesses') + '.' + extra + '</span>';
      if (window.__gsfx) { __gsfx.win(); if (extra) __gsfx.coin(); }
    } else {
      hintEl.innerHTML = 'Out of guesses! The number was ' + target + '.' +
        '<span class="dir">Better luck next time.</span>';
      if (window.__gsfx) __gsfx.lose();
    }
    restartBtn.focus();
  }

  function submitGuess() {
    if (gameOver) return;
    var raw = input.value.trim();
    var guess = Number(raw);

    if (raw === '' || !isFinite(guess) || Math.floor(guess) !== guess ||
        guess < RANGE_MIN || guess > RANGE_MAX) {
      hintEl.innerHTML = 'Enter a whole number between ' + RANGE_MIN + ' and ' + RANGE_MAX + '.';
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('shake');
      input.select();
      if (window.__gsfx) __gsfx.bad();
      return;
    }

    var distance = Math.abs(guess - target);
    var tier = tierFor(distance);
    guesses.push({ value: guess, distance: distance });
    triesLeft--;
    updateTries();
    addChip(guess, tier);
    tempFill.style.width = tier.temp + '%';
    if (window.__gsfx && tier.temp < 100) {
      __gsfx.tone(180 + tier.temp * 6.5, 0.18, 'sine', 0.075, (180 + tier.temp * 6.5) * 1.15);
      if (tier.temp >= 82) __gsfx.ding();
    }

    if (guess === target) {
      endGame(true);
    } else if (triesLeft <= 0) {
      endGame(false);
    } else {
      var dir = guess < target ? 'Go higher' : 'Go lower';
      hintEl.innerHTML = tier.label + trendFor(distance) + '!' +
        '<span class="dir">' + dir + ' &mdash; ' + triesLeft +
        (triesLeft === 1 ? ' guess' : ' guesses') + ' left.</span>';
    }

    input.value = '';
    input.focus();
  }

  guessBtn.addEventListener('click', submitGuess);
  restartBtn.addEventListener('click', newGame);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitGuess();
  });

  newGame();
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
