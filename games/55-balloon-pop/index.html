<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Pop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background: linear-gradient(180deg, #1a2a6c 0%, #3a6fd8 55%, #7ec8f2 100%);
    cursor: crosshair;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 22px;
    pointer-events: none;
    z-index: 50;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.45);
  }

  .hud-box { display: flex; flex-direction: column; }
  .hud-label { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; opacity: .8; }
  .hud-value { font-size: 34px; font-weight: 800; line-height: 1; }
  #timer.low { color: #ff5252; animation: blink .5s infinite alternate; }
  @keyframes blink { from { opacity: 1; } to { opacity: .4; } }

  /* ---------- Balloons ---------- */
  .balloon {
    position: absolute;
    width: 64px;
    height: 82px;
    border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%;
    cursor: pointer;
    will-change: transform;
    z-index: 10;
  }

  .balloon::before {          /* highlight */
    content: '';
    position: absolute;
    top: 14%;
    left: 18%;
    width: 22%;
    height: 28%;
    border-radius: 50%;
    background: rgba(255,255,255,.45);
    transform: rotate(-18deg);
  }

  .balloon::after {           /* knot */
    content: '';
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 8px solid currentColor;
  }

  .string {
    position: absolute;
    bottom: -58px;
    left: 50%;
    width: 2px;
    height: 52px;
    background: rgba(255,255,255,.55);
    transform: translateX(-50%);
    border-radius: 2px;
  }

  .balloon.golden {
    background: radial-gradient(circle at 35% 30%, #ffe98a, #ffc400 60%, #d99a00) !important;
    color: #d99a00;
    box-shadow: 0 0 22px 6px rgba(255, 215, 0, .55);
  }

  /* ---------- Pop effects ---------- */
  .pop {
    position: absolute;
    font-size: 46px;
    font-weight: 800;
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: popFade .45s ease-out forwards;
    z-index: 20;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  .pop.gold { color: #ffd700; }
  @keyframes popFade {
    0%   { transform: translate(-50%,-50%) scale(1.5); opacity: 1; }
    100% { transform: translate(-50%,-90%) scale(.8); opacity: 0; }
  }

  .burst {
    position: absolute;
    width: 90px; height: 90px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.8);
    transform: translate(-50%,-50%);
    pointer-events: none;
    animation: burst .3s ease-out forwards;
    z-index: 20;
  }
  @keyframes burst {
    from { transform: translate(-50%,-50%) scale(.3); opacity: 1; }
    to   { transform: translate(-50%,-50%) scale(1.6); opacity: 0; }
  }

  /* ---------- Overlay screens ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 18, 45, .72);
    backdrop-filter: blur(4px);
    color: #fff;
    z-index: 100;
    text-align: center;
  }

  .overlay h1 { font-size: 58px; margin-bottom: 8px; letter-spacing: 2px; }
  .overlay p  { font-size: 18px; opacity: .85; margin-bottom: 6px; }
  .overlay .big { font-size: 42px; font-weight: 800; margin: 12px 0 26px; color: #ffd700; }

  .btn {
    margin-top: 18px;
    padding: 14px 44px;
    font-size: 20px;
    font-weight: 700;
    color: #1a2a6c;
    background: #ffd700;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 6px 0 #b8960a, 0 10px 22px rgba(0,0,0,.35);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:hover  { transform: translateY(-2px); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8960a; }

  .hidden { display: none !important; }

  .hint { font-size: 14px; opacity: .65; margin-top: 22px; }

  /* ---------- ambient clouds ---------- */
  .cloud {
    position: fixed;
    width: var(--w, 160px);
    height: calc(var(--w, 160px) * .36);
    background: rgba(255,255,255,.28);
    border-radius: 999px;
    filter: blur(1px);
    z-index: 1;
    pointer-events: none;
    animation: drift var(--t, 70s) linear infinite;
    animation-delay: var(--d, 0s);
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }
  .cloud::before { width: 45%; height: 160%; top: -90%; left: 14%; }
  .cloud::after  { width: 32%; height: 120%; top: -58%; left: 52%; }
  @keyframes drift {
    from { transform: translateX(-30vw); }
    to   { transform: translateX(115vw); }
  }

  /* ---------- score pop shimmer ---------- */
  #score { display: inline-block; transition: transform .08s; }
  #score.bump { transform: scale(1.18); }
  #bestLine { font-size: 13px; opacity: .8; margin-top: 4px; letter-spacing: 1px; }
</style>
</head>
<body>

  <div class="cloud" style="--w:190px;top:14%;--t:85s"></div>
  <div class="cloud" style="--w:120px;top:32%;--t:60s;--d:-22s;opacity:.7"></div>
  <div class="cloud" style="--w:230px;top:8%;--t:110s;--d:-48s;opacity:.55"></div>
  <div class="cloud" style="--w:140px;top:55%;--t:75s;--d:-60s;opacity:.5"></div>

  <div id="hud">
    <div class="hud-box">
      <span class="hud-label">Score</span>
      <span class="hud-value" id="score">0</span>
    </div>
    <div class="hud-box" style="text-align:center">
      <span class="hud-label">Time</span>
      <span class="hud-value" id="timer">45</span>
    </div>
    <div class="hud-box" style="text-align:right">
      <span class="hud-label">Popped</span>
      <span class="hud-value" id="popped">0</span>
    </div>
  </div>

  <div class="overlay" id="startScreen">
    <h1>Balloon Pop</h1>
    <p>Pop the balloons before they float away!</p>
    <p>Golden balloons are worth <b style="color:#ffd700">5 points</b>.</p>
    <button class="btn" id="startBtn">Start</button>
    <div class="hint">You have 45 seconds. Click or tap to pop.</div>
    <div id="bestLine"></div>
  </div>

  <div class="overlay hidden" id="endScreen">
    <h1>Time's Up!</h1>
    <div class="big"><span id="finalScore">0</span> points</div>
    <p id="finalStats"></p>
    <button class="btn" id="restartBtn">Play Again</button>
  </div>

<script>
(function () {
  'use strict';

  var GAME_TIME   = 45;       // seconds
  var GOLD_CHANCE = 0.12;     // 12% golden balloons
  var GOLD_POINTS = 5;
  var NORMAL_POINTS = 1;

  var scoreEl   = document.getElementById('score');
  var timerEl   = document.getElementById('timer');
  var poppedEl  = document.getElementById('popped');
  var startScr  = document.getElementById('startScreen');
  var endScr    = document.getElementById('endScreen');
  var finalScore = document.getElementById('finalScore');
  var finalStats = document.getElementById('finalStats');

  var COLORS = [
    ['#ff6b8a', '#e8305f'],
    ['#6bc5ff', '#2b7fe0'],
    ['#7ee87e', '#2fb34c'],
    ['#ff9e5e', '#ee6410'],
    ['#c78bff', '#8a3de0'],
    ['#ff8bd4', '#e03da5'],
    ['#5ee8d8', '#12a896']
  ];

  var balloons  = [];          // { el, x, y, speed, sway, swayPhase, golden }
  var score     = 0;
  var popped    = 0;
  var escaped   = 0;
  var timeLeft  = GAME_TIME;
  var running   = false;
  var lastFrame = 0;
  var spawnTimer = 0;
  var clockTimer = null;
  var rafId     = null;
  var best      = 0;
  var lastTickSfx = -1;

  try { best = parseInt(localStorage.getItem('balloonPopBest'), 10) || 0; } catch (e) {}
  if (best > 0) document.getElementById('bestLine').textContent = 'Best score: ' + best;

  function rand(min, max) { return min + Math.random() * (max - min); }

  function spawnBalloon() {
    var golden = Math.random() < GOLD_CHANCE;
    var el = document.createElement('div');
    el.className = 'balloon' + (golden ? ' golden' : '');

    if (!golden) {
      var c = COLORS[(Math.random() * COLORS.length) | 0];
      el.style.background = 'radial-gradient(circle at 35% 30%, ' + c[0] + ', ' + c[1] + ' 70%)';
      el.style.color = c[1];
    }

    var string = document.createElement('div');
    string.className = 'string';
    el.appendChild(string);

    var scale = rand(0.75, 1.35);
    var w = 64 * scale;
    var x = rand(10, Math.max(20, window.innerWidth - w - 10));
    var y = window.innerHeight + 20;

    // Difficulty: speed rises as the clock runs down; golds are faster
    var elapsed = GAME_TIME - timeLeft;
    var speed = rand(60, 110) + elapsed * 2.2;
    if (golden) speed *= 1.35;

    var b = {
      el: el, x: x, y: y,
      speed: speed,
      scale: scale,
      sway: rand(18, 42),
      swayPhase: rand(0, Math.PI * 2),
      swaySpeed: rand(1.5, 3),
      golden: golden,
      dead: false
    };

    el.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + scale + ')';
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (b.dead || !running) return;
      popBalloon(b, e.clientX, e.clientY);
    });

    document.body.appendChild(el);
    balloons.push(b);
  }

  function popBalloon(b, cx, cy) {
    b.dead = true;
    var pts = b.golden ? GOLD_POINTS : NORMAL_POINTS;
    score += pts;
    popped++;
    scoreEl.textContent = score;
    poppedEl.textContent = popped;
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');

    var rect = b.el.getBoundingClientRect();
    var px = rect.left + rect.width / 2;
    var py = rect.top + rect.height / 2;

    if (window.AAA) {
      AAA.sfx.pop();
      if (b.golden) { AAA.sfx.coin(); AAA.burst(px, py, '#ffd700', 14); }
      else AAA.burst(px, py, b.el.style.color || '#fff', 8);
    }

    var burst = document.createElement('div');
    burst.className = 'burst';
    burst.style.left = px + 'px';
    burst.style.top = py + 'px';
    if (b.golden) burst.style.borderColor = '#ffd700';
    document.body.appendChild(burst);
    setTimeout(function () { burst.remove(); }, 320);

    var txt = document.createElement('div');
    txt.className = 'pop' + (b.golden ? ' gold' : '');
    txt.textContent = '+' + pts;
    txt.style.left = px + 'px';
    txt.style.top = py + 'px';
    document.body.appendChild(txt);
    setTimeout(function () { txt.remove(); }, 480);

    b.el.remove();
  }

  function tick(now) {
    if (!running) return;
    var dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;

    // spawn balloons; faster spawn rate late in the game
    spawnTimer -= dt * 1000;
    var elapsed = GAME_TIME - timeLeft;
    var interval = Math.max(280, 900 - elapsed * 14);
    if (spawnTimer <= 0) {
      spawnBalloon();
      if (elapsed > 25 && Math.random() < 0.35) spawnBalloon();
      spawnTimer = interval;
    }

    var h = window.innerHeight;
    for (var i = balloons.length - 1; i >= 0; i--) {
      var b = balloons[i];
      if (b.dead) { balloons.splice(i, 1); continue; }

      b.y -= b.speed * dt;
      b.swayPhase += b.swaySpeed * dt;
      var sx = b.x + Math.sin(b.swayPhase) * b.sway;

      if (b.y < -160) {   // escaped off the top
        escaped++;
        b.el.remove();
        balloons.splice(i, 1);
        continue;
      }
      b.el.style.transform = 'translate(' + sx + 'px,' + b.y + 'px) scale(' + b.scale + ')';
    }

    rafId = requestAnimationFrame(tick);
  }

  function startGame() {
    // clear leftovers
    for (var i = 0; i < balloons.length; i++) balloons[i].el.remove();
    balloons = [];
    score = 0; popped = 0; escaped = 0;
    timeLeft = GAME_TIME;

    scoreEl.textContent = '0';
    poppedEl.textContent = '0';
    timerEl.textContent = timeLeft;
    timerEl.classList.remove('low');

    startScr.classList.add('hidden');
    endScr.classList.add('hidden');

    running = true;
    lastFrame = performance.now();
    spawnTimer = 200;
    rafId = requestAnimationFrame(tick);

    clockTimer = setInterval(function () {
      timeLeft--;
      timerEl.textContent = Math.max(0, timeLeft);
      if (timeLeft <= 10) {
        timerEl.classList.add('low');
        if (window.AAA && timeLeft !== lastTickSfx && timeLeft > 0) { lastTickSfx = timeLeft; AAA.sfx.tick(); }
      }
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    running = false;
    clearInterval(clockTimer);
    cancelAnimationFrame(rafId);

    for (var i = 0; i < balloons.length; i++) balloons[i].el.remove();
    balloons = [];

    var newBest = score > best;
    if (newBest) {
      best = score;
      try { localStorage.setItem('balloonPopBest', String(best)); } catch (e) {}
      document.getElementById('bestLine').textContent = 'Best score: ' + best;
    }
    finalScore.textContent = score;
    finalStats.textContent =
      'You popped ' + popped + ' balloon' + (popped === 1 ? '' : 's') +
      ' — ' + escaped + ' escaped.' +
      (newBest ? ' NEW BEST!' : ' Best: ' + best + '.');
    if (window.AAA) { newBest ? AAA.sfx.win() : AAA.sfx.over(); if (newBest) AAA.flash(0.22); }
    endScr.classList.remove('hidden');
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
