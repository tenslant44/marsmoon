<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gravity Flip Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0b0e1a;
    overflow: hidden;
    font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #0b0e1a;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  /* ---------- procedural SFX (respects the overlay's speaker preference) ---------- */
  var Sfx = (function () {
    var actx = null;
    function ac() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
      return actx;
    }
    function on() { try { return localStorage.getItem('aaa_sfx') !== '0'; } catch (e) { return true; } }
    function tone(f, d, type, vol, slide, delay) {
      if (!on()) return;
      var c = ac(); if (!c) return;
      try {
        var t = c.currentTime + (delay || 0);
        var o = c.createOscillator(), g = c.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(Math.max(30, f), t);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol || 0.05, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0006, t + d);
        o.connect(g); g.connect(c.destination);
        o.start(t); o.stop(t + d + 0.05);
      } catch (e) {}
    }
    function noise(d, vol, freq, delay) {
      if (!on()) return;
      var c = ac(); if (!c) return;
      try {
        var t = c.currentTime + (delay || 0);
        var n = Math.max(64, (c.sampleRate * d) | 0);
        var buf = c.createBuffer(1, n, c.sampleRate);
        var ch = buf.getChannelData(0);
        for (var i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.7);
        var src = c.createBufferSource(); src.buffer = buf;
        var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 900;
        var g = c.createGain(); g.gain.value = vol || 0.07;
        src.connect(f); f.connect(g); g.connect(c.destination);
        src.start(t);
      } catch (e) {}
    }
    return {
      unlock: ac,
      flip: function (dir) { tone(dir > 0 ? 420 : 620, .12, 'sine', .05, dir > 0 ? 720 : 300); },
      land: function () { noise(.07, .05, 500); tone(150, .08, 'triangle', .05, 90); },
      mile: function () { tone(880, .08, 'sine', .035, 1320); },
      start: function () { tone(392, .1, 'triangle', .05, 523); tone(659, .14, 'triangle', .05, null, .09); },
      crash: function () { noise(.35, .14, 700); [330, 262, 196].forEach(function (f, i) { tone(f, .2, 'sawtooth', .05, null, .05 + i * .1); }); }
    };
  })();

  // ---------- Sizing ----------
  var W = 960, H = 540;
  function resize() {
    var scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Constants ----------
  var FLOOR_H = 60;                 // thickness of floor/ceiling bands
  var FLOOR_Y = H - FLOOR_H;        // top edge of floor
  var CEIL_Y = FLOOR_H;             // bottom edge of ceiling
  var PLAYER_SIZE = 26;
  var PLAYER_X = 140;
  var GRAV = 2600;                  // px/s^2
  var BASE_SPEED = 320;             // px/s
  var MAX_SPEED = 780;
  var SPEED_RAMP = 9;               // px/s gained per second

  // ---------- State ----------
  var state = 'title';              // 'title' | 'run' | 'dead'
  var player, obstacles, particles, stars;
  var speed, distance, best = 0, time, spawnTimer, shake;
  var flipFlash = 0, lastMile = 0;

  try { best = parseInt(localStorage.getItem('gfr_best'), 10) || 0; } catch (e) { best = 0; }

  function reset() {
    player = {
      x: PLAYER_X,
      y: FLOOR_Y - PLAYER_SIZE,
      vy: 0,
      gdir: 1,          // 1 = gravity pulls down (floor), -1 = pulls up (ceiling)
      angle: 0,         // visual rotation
      grounded: true,
      dead: false
    };
    obstacles = [];
    particles = [];
    speed = BASE_SPEED;
    distance = 0;
    time = 0;
    spawnTimer = 1.1;
    shake = 0;
    flipFlash = 0;
    lastMile = 0;
    newBestFlag = false;
    initStars();
  }

  function initStars() {
    stars = [];
    for (var i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * W,
        y: CEIL_Y + Math.random() * (FLOOR_Y - CEIL_Y),
        r: Math.random() * 1.8 + 0.4,
        p: 0.15 + Math.random() * 0.45   // parallax factor
      });
    }
  }

  // ---------- Spawning ----------
  function spawnObstacle() {
    var roll = Math.random();
    var diff = Math.min(1, distance / 1500);   // difficulty 0..1

    if (roll < 0.55) {
      // Single spike on floor or ceiling
      var onCeil = Math.random() < 0.5;
      var w = 26 + Math.random() * 22;
      var h = 34 + Math.random() * (30 + diff * 30);
      obstacles.push({ type: 'spike', x: W + 20, w: w, h: h, side: onCeil ? -1 : 1 });
    } else if (roll < 0.8) {
      // Block on floor or ceiling
      var onCeilB = Math.random() < 0.5;
      var bw = 30 + Math.random() * 30;
      var bh = 40 + Math.random() * (40 + diff * 40);
      obstacles.push({ type: 'block', x: W + 20, w: bw, h: bh, side: onCeilB ? -1 : 1 });
    } else {
      // Double: obstacles on BOTH sides, one taller — must pick the right side
      var bigSide = Math.random() < 0.5 ? -1 : 1;
      var bigH = 130 + Math.random() * (60 + diff * 60);
      var smallH = 30 + Math.random() * 40;
      obstacles.push({ type: 'spike', x: W + 20, w: 34, h: bigH, side: bigSide });
      obstacles.push({ type: 'spike', x: W + 20, w: 30, h: smallH, side: -bigSide });
    }

    // Next spawn gap shrinks as speed rises
    var base = 0.75 + Math.random() * 0.7;
    spawnTimer = base * (BASE_SPEED + 220) / speed;
  }

  // ---------- Particles ----------
  function burst(x, y, dir, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 60 + Math.random() * 220;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp - speed * 0.4,
        vy: Math.sin(a) * sp + dir * 80,
        life: 0.4 + Math.random() * 0.5,
        maxLife: 0.9,
        size: 2 + Math.random() * 4,
        color: color
      });
    }
  }

  // ---------- Input ----------
  function flip() {
    if (state === 'title') { state = 'run'; reset(); Sfx.start(); return; }
    if (state === 'dead') {
      // small debounce so accidental keypress after dying doesn't skip the screen
      if (time - deathTime > 0.5) { state = 'run'; reset(); Sfx.start(); }
      return;
    }
    player.gdir *= -1;
    player.grounded = false;
    flipFlash = 0.18;
    Sfx.flip(player.gdir);
    burst(player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2, -player.gdir, '#7fd4ff', 8);
  }

  var deathTime = -10;

  window.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'KeyW') {
      e.preventDefault();
      flip();
    } else if (e.code === 'KeyR') {
      state = 'run'; reset();
    }
  });
  canvas.addEventListener('mousedown', function (e) { e.preventDefault(); flip(); });
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); flip(); }, { passive: false });

  // ---------- Update ----------
  function update(dt) {
    if (state !== 'run') {
      // still drift stars on menus for ambience
      for (var s = 0; s < stars.length; s++) {
        stars[s].x -= 30 * stars[s].p * dt;
        if (stars[s].x < -4) { stars[s].x = W + 4; stars[s].y = CEIL_Y + Math.random() * (FLOOR_Y - CEIL_Y); }
      }
      return;
    }

    time += dt;
    speed = Math.min(MAX_SPEED, speed + SPEED_RAMP * dt);
    distance += speed * dt / 40;   // "meters"
    shake = Math.max(0, shake - dt * 6);
    var mile = Math.floor(distance / 100);
    if (mile > lastMile) { lastMile = mile; Sfx.mile(); }
    flipFlash = Math.max(0, flipFlash - dt);

    // stars
    for (var s = 0; s < stars.length; s++) {
      stars[s].x -= speed * stars[s].p * dt;
      if (stars[s].x < -4) { stars[s].x = W + 4; stars[s].y = CEIL_Y + Math.random() * (FLOOR_Y - CEIL_Y); }
    }

    // player physics
    player.vy += GRAV * player.gdir * dt;
    player.vy = Math.max(-1400, Math.min(1400, player.vy));
    player.y += player.vy * dt;

    var floorTop = FLOOR_Y - PLAYER_SIZE;
    var ceilBot = CEIL_Y;
    player.grounded = false;
    if (player.gdir === 1 && player.y >= floorTop) {
      if (player.vy > 500) { burst(player.x + PLAYER_SIZE / 2, FLOOR_Y, -1, '#8ef0c8', 6); Sfx.land(); }
      player.y = floorTop; player.vy = 0; player.grounded = true;
    } else if (player.gdir === -1 && player.y <= ceilBot) {
      if (player.vy < -500) { burst(player.x + PLAYER_SIZE / 2, CEIL_Y, 1, '#8ef0c8', 6); Sfx.land(); }
      player.y = ceilBot; player.vy = 0; player.grounded = true;
    }
    // landed on the wrong surface (was falling toward it after flip)
    if (player.y > floorTop) { player.y = floorTop; player.vy = 0; }
    if (player.y < ceilBot) { player.y = ceilBot; player.vy = 0; }

    // visual rotation: upright on floor, upside-down on ceiling; tilt while airborne
    var target = player.gdir === 1 ? 0 : Math.PI;
    if (!player.grounded) target += player.gdir * -0.35;
    var d = target - player.angle;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    player.angle += d * Math.min(1, dt * 14);

    // running dust
    if (player.grounded && Math.random() < dt * 20) {
      var dustY = player.gdir === 1 ? FLOOR_Y : CEIL_Y;
      particles.push({
        x: player.x + 4, y: dustY,
        vx: -80 - Math.random() * 60, vy: (Math.random() - 0.5) * 40 - player.gdir * 30,
        life: 0.35, maxLife: 0.35, size: 2 + Math.random() * 2, color: '#5a6b8f'
      });
    }

    // obstacles
    spawnTimer -= dt;
    if (spawnTimer <= 0) spawnObstacle();
    for (var i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].x -= speed * dt;
      if (obstacles[i].x + obstacles[i].w < -40) obstacles.splice(i, 1);
    }

    // particles
    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(p, 1);
    }

    // collision (shrunken hitbox = forgiving)
    var px = player.x + 4, py = player.y + 4, ps = PLAYER_SIZE - 8;
    for (var o = 0; o < obstacles.length; o++) {
      var ob = obstacles[o];
      var oy = ob.side === 1 ? FLOOR_Y - ob.h : CEIL_Y;
      // shrink spike hitbox extra
      var ox = ob.x + (ob.type === 'spike' ? 6 : 2);
      var ow = ob.w - (ob.type === 'spike' ? 12 : 4);
      var oh = ob.h - (ob.type === 'spike' ? 8 : 4);
      var oyy = ob.side === 1 ? oy + 6 : oy + 2;
      if (px < ox + ow && px + ps > ox && py < oyy + oh && py + ps > oyy) {
        die();
        break;
      }
    }
  }

  function die() {
    state = 'dead';
    deathTime = time;
    shake = 1;
    Sfx.crash();
    burst(player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2, 0, '#ff5f7a', 26);
    var d = Math.floor(distance);
    if (d > best) {
      best = d;
      newBestFlag = true;
      try { localStorage.setItem('gfr_best', String(best)); } catch (e) {}
    }
    if (window.AAA) {
      var r = canvas.getBoundingClientRect();
      var sx = r.width / W, sy = r.height / H;
      AAA.flash(0.28);
      AAA.burst(r.left + (player.x + PLAYER_SIZE / 2) * sx, r.top + (player.y + PLAYER_SIZE / 2) * sy, '#ff5f7a', 18);
    }
  }
  var newBestFlag = false;

  // ---------- Drawing ----------
  function drawBackground() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#12182e');
    g.addColorStop(0.5, '#0b0e1a');
    g.addColorStop(1, '#12182e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // drifting nebula glows (parallax with the run)
    var drift = (state === 'run' ? distance * 2.2 : performance.now() * 0.02) % (W + 600);
    var nebs = [
      { x: W * 0.75 - drift * 0.5, y: H * 0.28, r: 240, c: 'rgba(124,58,237,0.10)' },
      { x: W * 1.3 - drift * 0.35, y: H * 0.7, r: 200, c: 'rgba(56,189,248,0.09)' },
      { x: W * 1.8 - drift * 0.6, y: H * 0.45, r: 170, c: 'rgba(244,114,182,0.07)' }
    ];
    for (var n = 0; n < nebs.length; n++) {
      var nb = nebs[n];
      var nx = ((nb.x % (W + 600)) + W + 600) % (W + 600) - 300;
      var rg = ctx.createRadialGradient(nx, nb.y, 0, nx, nb.y, nb.r);
      rg.addColorStop(0, nb.c);
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.fillStyle = '#ffffff';
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      ctx.globalAlpha = 0.25 + st.p * 0.7;
      ctx.fillRect(st.x, st.y, st.r, st.r);
    }
    ctx.globalAlpha = 1;
  }

  function drawSurface(y, isFloor, t) {
    // solid band
    var g = ctx.createLinearGradient(0, isFloor ? y : 0, 0, isFloor ? H : y);
    g.addColorStop(0, '#2a3b5f');
    g.addColorStop(1, '#1a2540');
    ctx.fillStyle = g;
    ctx.fillRect(0, isFloor ? y : 0, W, FLOOR_H);

    // glowing edge
    ctx.fillStyle = isFloor ? '#8ef0c8' : '#7fd4ff';
    ctx.globalAlpha = 0.9;
    ctx.fillRect(0, isFloor ? y : y - 3, W, 3);
    ctx.globalAlpha = 0.25;
    ctx.fillRect(0, isFloor ? y + 3 : y - 8, W, 5);
    ctx.globalAlpha = 1;

    // scrolling stripes
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    var off = (state === 'run' ? (distance * 40) : 0) % 60;
    for (var x = -off; x < W; x += 60) {
      ctx.fillRect(x, isFloor ? y + 22 : 22, 26, 8);
    }
  }

  function drawObstacle(ob) {
    var baseY = ob.side === 1 ? FLOOR_Y : CEIL_Y;
    ctx.save();
    if (ob.type === 'spike') {
      ctx.fillStyle = '#ff5f7a';
      ctx.strokeStyle = '#ff92a6';
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (ob.side === 1) {
        ctx.moveTo(ob.x, baseY);
        ctx.lineTo(ob.x + ob.w / 2, baseY - ob.h);
        ctx.lineTo(ob.x + ob.w, baseY);
      } else {
        ctx.moveTo(ob.x, baseY);
        ctx.lineTo(ob.x + ob.w / 2, baseY + ob.h);
        ctx.lineTo(ob.x + ob.w, baseY);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      var y = ob.side === 1 ? baseY - ob.h : baseY;
      ctx.fillStyle = '#c25cff';
      ctx.strokeStyle = '#e2a9ff';
      ctx.lineWidth = 2;
      ctx.fillRect(ob.x, y, ob.w, ob.h);
      ctx.strokeRect(ob.x + 1, y + 1, ob.w - 2, ob.h - 2);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(ob.x + 4, y + 4, ob.w - 8, 5);
    }
    ctx.restore();
  }

  function drawPlayer() {
    var cx = player.x + PLAYER_SIZE / 2;
    var cy = player.y + PLAYER_SIZE / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(player.angle);

    // glow
    ctx.shadowColor = '#7fd4ff';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#4da6ff';
    ctx.fillRect(-PLAYER_SIZE / 2, -PLAYER_SIZE / 2, PLAYER_SIZE, PLAYER_SIZE);
    ctx.shadowBlur = 0;

    ctx.strokeStyle = '#bfe6ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(-PLAYER_SIZE / 2 + 1, -PLAYER_SIZE / 2 + 1, PLAYER_SIZE - 2, PLAYER_SIZE - 2);

    // eye looking forward (up = direction of gravity pull visually)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(2, -7, 8, 8);
    ctx.fillStyle = '#0b0e1a';
    ctx.fillRect(6, -5, 3, 4);

    ctx.restore();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var pt = particles[i];
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    ctx.font = 'bold 30px "Segoe UI", sans-serif';
    ctx.fillText(Math.floor(distance) + ' m', 20, 44);
    ctx.font = '15px "Segoe UI", sans-serif';
    ctx.fillStyle = '#8a9bbd';
    ctx.fillText('BEST ' + best + ' m', 22, 66);

    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = '13px "Segoe UI", sans-serif';
    ctx.fillText('TAP / SPACE — flip gravity', W - 18, 30);
    ctx.textAlign = 'left';
  }

  function drawTitle() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 52px "Segoe UI", sans-serif';
    ctx.fillText('GRAVITY FLIP', W / 2, H / 2 - 60);
    ctx.fillStyle = '#7fd4ff';
    ctx.font = 'bold 30px "Segoe UI", sans-serif';
    ctx.fillText('RUNNER', W / 2, H / 2 - 20);

    ctx.fillStyle = '#aab8d8';
    ctx.font = '18px "Segoe UI", sans-serif';
    ctx.fillText('Tap or press SPACE to flip between floor and ceiling.', W / 2, H / 2 + 26);
    ctx.fillText('Dodge the spikes and blocks. Don\'t stop running.', W / 2, H / 2 + 52);

    ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + 0.45 * Math.sin(performance.now() / 300)) + ')';
    ctx.font = 'bold 20px "Segoe UI", sans-serif';
    ctx.fillText('— TAP OR PRESS SPACE TO START —', W / 2, H / 2 + 100);
    ctx.textAlign = 'left';
  }

  function drawDead() {
    ctx.fillStyle = 'rgba(10,12,24,0.55)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff5f7a';
    ctx.font = 'bold 46px "Segoe UI", sans-serif';
    ctx.fillText('CRASHED!', W / 2, H / 2 - 40);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 28px "Segoe UI", sans-serif';
    ctx.fillText(Math.floor(distance) + ' m', W / 2, H / 2 + 4);

    if (newBestFlag) {
      ctx.fillStyle = '#ffd75f';
      ctx.font = 'bold 18px "Segoe UI", sans-serif';
      ctx.fillText('NEW BEST!', W / 2, H / 2 + 34);
    } else {
      ctx.fillStyle = '#8a9bbd';
      ctx.font = '17px "Segoe UI", sans-serif';
      ctx.fillText('best ' + best + ' m', W / 2, H / 2 + 34);
    }

    ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + 0.45 * Math.sin(performance.now() / 300)) + ')';
    ctx.font = 'bold 18px "Segoe UI", sans-serif';
    ctx.fillText('TAP / R — run again', W / 2, H / 2 + 78);
    ctx.textAlign = 'left';
  }

  function render() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);
    }

    drawBackground();

    // flip flash ring
    if (flipFlash > 0) {
      ctx.globalAlpha = flipFlash * 2.4;
      ctx.strokeStyle = '#7fd4ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2, 30 + (0.18 - flipFlash) * 160, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    for (var i = 0; i < obstacles.length; i++) drawObstacle(obstacles[i]);
    drawParticles();
    if (state !== 'dead') drawPlayer();
    drawSurface(FLOOR_Y, true, time);
    drawSurface(CEIL_Y, false, time);
    ctx.restore();

    drawHUD();
    if (state === 'title') drawTitle();
    if (state === 'dead') drawDead();
  }

  // ---------- Main loop ----------
  reset();   // sets up stars/player for the title screen backdrop
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
