<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(74,222,128,.12), transparent 55%),
      radial-gradient(ellipse at 50% 115%, rgba(56,189,248,.1), transparent 55%),
      #07090f;
    color: #e6e6e6;
    font-family: 'Segoe UI', system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    touch-action: none;
    padding: 8px;
  }
  h1 {
    font-size: clamp(1.3rem, 5vw, 1.7rem);
    letter-spacing: 0.35em;
    margin-bottom: 8px;
    color: #4ade80;
    text-shadow: 0 0 18px rgba(74,222,128,.55), 0 0 40px rgba(74,222,128,.2);
  }
  #scoreboard {
    font-size: clamp(0.95rem, 3.5vw, 1.1rem);
    margin-bottom: 12px;
    color: #8b93a7;
  }
  #scoreboard span { color: #4ade80; font-weight: bold; text-shadow: 0 0 10px rgba(74,222,128,.5); }
  #scoreboard .best { color: #38bdf8; text-shadow: 0 0 10px rgba(56,189,248,.5); }
  #wrap {
    position: relative;
    width: min(92vw, 62dvh, 420px);
    aspect-ratio: 1;
  }
  canvas {
    background: #0c111c;
    border: 1px solid rgba(74,222,128,.35);
    border-radius: 10px;
    display: block;
    width: 100%;
    height: 100%;
    box-shadow: 0 0 30px rgba(74,222,128,.12), 0 0 90px rgba(56,189,248,.07), inset 0 0 40px rgba(0,0,0,.5);
    touch-action: none;
  }
  /* CRT vignette */
  #wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 10px;
    pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.38) 100%);
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(7, 10, 16, 0.82);
    backdrop-filter: blur(3px);
    border-radius: 10px;
    text-align: center;
    z-index: 2;
  }
  #overlay.hidden { display: none; }
  #overlay h2 {
    font-size: clamp(1.4rem, 6vw, 2rem);
    color: #f87171;
    margin-bottom: 10px;
    letter-spacing: 0.1em;
    text-shadow: 0 0 20px rgba(248,113,113,.5);
  }
  #overlay h2.title { color: #4ade80; text-shadow: 0 0 20px rgba(74,222,128,.55); }
  #overlay p { margin-bottom: 16px; color: #aab2c8; }
  #overlay button {
    padding: 12px 34px;
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: #06110a;
    background: linear-gradient(135deg, #4ade80, #22c55e);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 0 22px rgba(74,222,128,.45), 0 4px 0 #15803d;
    transition: transform .12s, box-shadow .12s;
  }
  #overlay button:hover { transform: translateY(-2px); }
  #overlay button:active { transform: translateY(2px); box-shadow: 0 0 22px rgba(74,222,128,.45); }
  #hint { margin-top: 12px; font-size: 0.8rem; color: #525b72; letter-spacing: 0.06em; text-align: center; }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="scoreboard">SCORE <span id="score">0</span> &nbsp;·&nbsp; BEST <span id="best" class="best">0</span></div>
  <div id="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay" class="hidden">
      <h2 id="overlayTitle">Game Over</h2>
      <p id="overlayText">Score: 0</p>
      <button id="restartBtn">PLAY</button>
    </div>
  </div>
  <div id="hint">Arrows / WASD &middot; swipe on mobile &middot; Space to start</div>

<script>
(function () {
  'use strict';

  var GRID = 20;
  var SIZE = 400;
  var CELL = SIZE / GRID;
  var TICK0 = 115, TICK_MIN = 62;

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlayTitle');
  var overlayText = document.getElementById('overlayText');
  var restartBtn = document.getElementById('restartBtn');

  var snake, dir, nextDir, food, score, best = 0, running = false, timer = null;
  var tick = TICK0, particles = [], eatPulse = 0, deadFlash = 0, animT = 0, lastTail = null;

  try { best = parseInt(localStorage.getItem('snake_best'), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  // ---------- AAA audio ----------
  var ACX = null;
  function ac() {
    try {
      if (!ACX) ACX = new (window.AudioContext || window.webkitAudioContext)();
      if (ACX.state === 'suspended') ACX.resume();
    } catch (e) {}
    return ACX;
  }
  function tone(f, d, type, v, slide, delay) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + (delay || 0);
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v || 0.05, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + d + 0.03);
    } catch (e) {}
  }
  function noiseSfx(d, v, fc) {
    var c = ac(); if (!c) return;
    try {
      var n = Math.floor(c.sampleRate * d), b = c.createBuffer(1, n, c.sampleRate), ch = b.getChannelData(0);
      for (var i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var s = c.createBufferSource(); s.buffer = b;
      var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc;
      var g = c.createGain(); g.gain.value = v;
      s.connect(f); f.connect(g); g.connect(c.destination); s.start();
    } catch (e) {}
  }
  var sfx = {
    eat:   function () { tone(500, 0.07, 'square', 0.06, 780); tone(1040, 0.1, 'sine', 0.05, null, 0.05); },
    die:   function () { noiseSfx(0.3, 0.2, 600); tone(220, 0.5, 'sawtooth', 0.07, 60); },
    start: function () { [392, 523, 659, 784].forEach(function (f, i) { tone(f, 0.1, 'triangle', 0.06, null, i * 0.07); }); },
    turn:  function () { tone(300, 0.03, 'sine', 0.022, 380); }
  };
  var bgm = {
    t: null, step: 0,
    bass: [65.4, 65.4, 82.4, 65.4, 98.0, 65.4, 82.4, 110.0],
    arp:  [0, 523, 0, 659, 0, 784, 659, 880],
    start: function () {
      this.stop(); this.step = 0; var self = this;
      this.t = setInterval(function () { self.tickB(); }, 190);
    },
    tickB: function () {
      var c = ac(); if (!c || c.state !== 'running') return;
      try { if (localStorage.getItem('aaa_bgm') === '1') return; } catch (e) {}
      var st = this.step++;
      tone(this.bass[st % 8], 0.3, 'sawtooth', 0.028);
      var n = this.arp[st % 8];
      if (n && (st % 2 || tick < 90)) tone(n, 0.1, 'square', 0.015);
    },
    stop: function () { if (this.t) clearInterval(this.t); this.t = null; }
  };

  function reset() {
    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    tick = TICK0;
    particles = [];
    eatPulse = 0;
    deadFlash = 0;
    lastTail = null;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    while (true) {
      var f = {x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID)};
      var onSnake = snake.some(function (s) { return s.x === f.x && s.y === f.y; });
      if (!onSnake) { food = f; return; }
    }
  }

  function burst(cx, cy) {
    for (var i = 0; i < 14; i++) {
      var a = Math.random() * Math.PI * 2, s = 0.5 + Math.random() * 2.2;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.3 });
    }
  }

  function step() {
    dir = nextDir;
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      gameOver();
      return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      eatPulse = 1;
      sfx.eat();
      burst(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2);
      // speed ramp: faster every 30 pts
      var nt = Math.max(TICK_MIN, TICK0 - Math.floor(score / 30) * 7);
      if (nt !== tick) {
        tick = nt;
        clearInterval(timer);
        timer = setInterval(step, tick);
      }
      placeFood();
    } else {
      lastTail = snake.pop();
    }
    draw();
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    animT += 0.08;
    ctx.fillStyle = '#0c111c';
    ctx.fillRect(0, 0, SIZE, SIZE);

    // subtle grid
    ctx.strokeStyle = 'rgba(120,160,255,0.05)';
    ctx.lineWidth = 1;
    for (var i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, SIZE); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(SIZE, i * CELL); ctx.stroke();
    }

    // particles
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life -= 0.03;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life * 1.5;
      ctx.fillStyle = '#ff8a8a';
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.4 * p.life + 0.8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // food: hand-drawn apple with pulse
    eatPulse = Math.max(0, eatPulse - 0.05);
    var fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
    var pulse = 1 + Math.sin(animT) * 0.08 + eatPulse * 0.4;
    ctx.save();
    ctx.translate(fx, fy);
    ctx.scale(pulse, pulse);
    ctx.shadowColor = 'rgba(255,80,90,0.9)';
    ctx.shadowBlur = 12;
    var ag = ctx.createRadialGradient(-3, -3, 1, 0, 0, 9);
    ag.addColorStop(0, '#ff9d9d');
    ag.addColorStop(0.5, '#f0434f');
    ag.addColorStop(1, '#b81f33');
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.arc(-2.5, 1, 5.5, 0, Math.PI * 2);
    ctx.arc(2.5, 1, 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // stem + leaf
    ctx.strokeStyle = '#6b4226';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, -3); ctx.quadraticCurveTo(1, -7, 3, -8); ctx.stroke();
    ctx.fillStyle = '#4ade80';
    ctx.beginPath();
    ctx.ellipse(4.5, -7, 3.4, 1.8, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // snake: glowing gradient body
    for (var i = snake.length - 1; i >= 0; i--) {
      var s = snake[i];
      var t = i / Math.max(1, snake.length - 1);
      var l = 62 - t * 28;
      var isHead = i === 0;
      ctx.save();
      if (isHead) { ctx.shadowColor = 'rgba(74,222,128,0.9)'; ctx.shadowBlur = 14; }
      ctx.fillStyle = 'hsl(142,' + (72 - t * 18) + '%,' + (isHead ? 68 : l) + '%)';
      var inset = isHead ? 1 : 1.8;
      rr(s.x * CELL + inset, s.y * CELL + inset, CELL - inset * 2, CELL - inset * 2, 5);
      ctx.fill();
      ctx.restore();
    }
    // head details: eyes + tongue toward dir
    var h = snake[0], hx = h.x * CELL, hy = h.y * CELL;
    var ex1, ex2;
    if (dir.x === 1) { ex1 = [hx + 14, hy + 5]; ex2 = [hx + 14, hy + 15]; }
    else if (dir.x === -1) { ex1 = [hx + 6, hy + 5]; ex2 = [hx + 6, hy + 15]; }
    else if (dir.y === -1) { ex1 = [hx + 5, hy + 6]; ex2 = [hx + 15, hy + 6]; }
    else { ex1 = [hx + 5, hy + 14]; ex2 = [hx + 15, hy + 14]; }
    ctx.fillStyle = '#06130a';
    ctx.beginPath(); ctx.arc(ex1[0], ex1[1], 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2[0], ex2[1], 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex1[0] - 0.7, ex1[1] - 0.7, 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2[0] - 0.7, ex2[1] - 0.7, 0.9, 0, Math.PI * 2); ctx.fill();

    // fade-out tail trail segment
    if (lastTail) {
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = 'hsl(142,60%,40%)';
      rr(lastTail.x * CELL + 2, lastTail.y * CELL + 2, CELL - 4, CELL - 4, 4);
      ctx.fill();
      ctx.globalAlpha = 1;
      lastTail = null;
    }

    if (deadFlash > 0) {
      ctx.fillStyle = 'rgba(248,113,113,' + (deadFlash * 0.35).toFixed(3) + ')';
      ctx.fillRect(0, 0, SIZE, SIZE);
      deadFlash -= 0.04;
    }
  }

  function start() {
    ac();
    if (timer) clearInterval(timer);
    reset();
    overlay.classList.add('hidden');
    running = true;
    sfx.start();
    bgm.start();
    draw();
    timer = setInterval(step, tick);
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    timer = null;
    sfx.die();
    bgm.stop();
    deadFlash = 1;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('snake_best', best); } catch (e) {}
    }
    overlayTitle.textContent = 'Game Over';
    overlayTitle.className = '';
    overlayText.textContent = 'Score: ' + score + (score >= best && score > 0 ? '  —  New best!' : '');
    restartBtn.textContent = 'RETRY';
    draw();
    setTimeout(function () { overlay.classList.remove('hidden'); }, 350);
  }

  document.addEventListener('keydown', function (e) {
    var key = e.key;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(key) !== -1) {
      e.preventDefault();
    }
    if (!running) {
      if (key === ' ' || key === 'Enter') start();
      return;
    }
    var d = null;
    if (key === 'ArrowUp' || key === 'w' || key === 'W') d = {x: 0, y: -1};
    else if (key === 'ArrowDown' || key === 's' || key === 'S') d = {x: 0, y: 1};
    else if (key === 'ArrowLeft' || key === 'a' || key === 'A') d = {x: -1, y: 0};
    else if (key === 'ArrowRight' || key === 'd' || key === 'D') d = {x: 1, y: 0};
    if (d && (d.x !== -dir.x || d.y !== -dir.y)) {
      if (d.x !== nextDir.x || d.y !== nextDir.y) sfx.turn();
      nextDir = d;
    }
  });

  // touch: swipe to steer, tap to start/restart
  var tsX = 0, tsY = 0, swiped = false;
  canvas.addEventListener('touchstart', function (e) {
    tsX = e.touches[0].clientX; tsY = e.touches[0].clientY;
    swiped = false;
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (swiped) return;
    var dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    swiped = true;
    var d = Math.abs(dx) > Math.abs(dy)
      ? (dx > 0 ? {x: 1, y: 0} : {x: -1, y: 0})
      : (dy > 0 ? {x: 0, y: 1} : {x: 0, y: -1});
    if (running && (d.x !== -dir.x || d.y !== -dir.y)) { sfx.turn(); nextDir = d; }
  }, { passive: false });
  canvas.addEventListener('touchend', function (e) {
    e.preventDefault();
    if (!swiped && !running) start();
  }, { passive: false });
  canvas.addEventListener('click', function () { if (!running) start(); });

  restartBtn.addEventListener('click', start);

  // attract screen
  reset();
  draw();
  overlayTitle.textContent = 'Snake';
  overlayTitle.className = 'title';
  overlayText.textContent = 'Eat the apples. Don\'t bite yourself.';
  restartBtn.textContent = 'PLAY';
  overlay.classList.remove('hidden');
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
