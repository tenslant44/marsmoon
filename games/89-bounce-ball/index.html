<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bounce Ball</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 15%, #182250, #05060e 72%);
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    user-select: none; -webkit-user-select: none;
    overflow: hidden;
  }
  canvas {
    display: block;
    border-radius: 12px;
    box-shadow: 0 22px 70px rgba(0, 0, 0, .72), 0 0 0 1px rgba(255, 255, 255, .07);
    touch-action: none;
    height: min(96vh, 760px);
    width: auto;
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="720"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width;
  var H = canvas.height;
  var TAU = Math.PI * 2;

  // --- tuning ---
  var GRAV = 0.55;
  var BOUNCE = 14.6;
  var SPRING = 18.2;
  var ACC = 0.80;
  var MAX_VX = 6.0;
  var DRAG = 0.90;
  var R = 13;
  var STEP = 1000 / 60;
  var PX_PER_M = 10;

  var keys = { left: false, right: false };
  var ball, plats, parts, trail, stars;
  var camY, topY, lastSafeX, dead, deadT, shake, squash, rot, best, newBest, ticks;

  best = 0;
  try { best = +localStorage.getItem('bb-best') || 0; } catch (e) { best = 0; }

  stars = [];
  for (var i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * 2600,
      r: 0.4 + Math.random() * 1.5,
      a: 0.18 + Math.random() * 0.55,
      tw: Math.random() * TAU
    });
  }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  function rrect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    var nx = clamp(cx, rx, rx + rw);
    var ny = clamp(cy, ry, ry + rh);
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function mix(a, b, k) {
    var ar = parseInt(a.substr(1, 2), 16), ag = parseInt(a.substr(3, 2), 16), ab = parseInt(a.substr(5, 2), 16);
    var br = parseInt(b.substr(1, 2), 16), bg = parseInt(b.substr(3, 2), 16), bb = parseInt(b.substr(5, 2), 16);
    return 'rgb(' + Math.round(ar + (br - ar) * k) + ',' + Math.round(ag + (bg - ag) * k) + ',' + Math.round(ab + (bb - ab) * k) + ')';
  }

  // --- audio (no assets, tiny synth) ---
  var actx = null;
  function sfx(freq, dur, type, vol) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
      var t0 = actx.currentTime;
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      o.frequency.exponentialRampToValueAtTime(freq * 1.55, t0 + dur);
      g.gain.setValueAtTime(vol || 0.06, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(actx.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.03);
    } catch (e) {}
  }

  // --- state ---
  function meters() {
    return Math.max(0, Math.floor(-camY / PX_PER_M));
  }

  function difficulty() {
    return Math.min(1, Math.max(0, -camY) / 3200);
  }

  function reset() {
    ball = { x: W / 2, y: H - 300, vx: 0, vy: 0 };
    plats = [];
    parts = [];
    trail = [];
    camY = 0;
    topY = 0;
    lastSafeX = W / 2;
    dead = false;
    deadT = 0;
    shake = 0;
    squash = 0;
    rot = 0;
    newBest = false;
    ticks = 0;
    keys.left = keys.right = false;

    var start = { x: W / 2 - 70, y: H - 210, w: 140, h: 16, type: 'normal', vx: 0, spring: false, hit: 0 };
    plats.push(start);
    topY = start.y;
    for (var i = 0; i < 16; i++) genBand();
  }

  function makePlat(x, y, w, type) {
    return {
      x: x, y: y, w: w, h: 16, type: type,
      vx: type === 'moving' ? rand(0.8, 1.9) * (Math.random() < 0.5 ? -1 : 1) : 0,
      spring: type === 'normal' && Math.random() < 0.085,
      hit: 0
    };
  }

  function genBand() {
    var d = difficulty();
    var gap = 98 + 30 * d + rand(-12, 14);
    var y = topY - gap;
    topY = y;

    var prevSafe = lastSafeX;
    var spikeOK = -y > 620;
    var count = 1 + (Math.random() < 0.45 ? 1 : 0) + (Math.random() < 0.32 * d ? 1 : 0);
    var safeW = 108 - 34 * d + rand(-10, 10);
    var placed = [];

    for (var i = 0; i < count; i++) {
      var isSafe = i === 0;
      var w = isSafe ? safeW : rand(54, 96);
      var type = 'normal';

      if (isSafe) {
        if (Math.random() < 0.32 * d) type = 'moving';
      } else if (spikeOK && Math.random() < 0.16 + 0.44 * d) {
        type = 'spike';
        w = rand(46, 78);
      } else if (Math.random() < 0.34) {
        type = 'moving';
      }

      var x = null;
      for (var k = 0; k < 26; k++) {
        var cx = rand(8, W - w - 8);
        if (type === 'spike' && Math.abs(cx + w / 2 - prevSafe) < 76) continue;
        var ok = true;
        for (var j = 0; j < placed.length; j++) {
          var q = placed[j];
          if (cx < q.x + q.w + 40 && cx + w + 40 > q.x) { ok = false; break; }
        }
        if (ok) { x = cx; break; }
      }
      if (x === null) {
        if (isSafe) {
          x = clamp(prevSafe - safeW / 2 + rand(-30, 30), 8, W - w - 8);
        } else {
          continue;
        }
      }

      var np = makePlat(x, y, w, type);
      placed.push(np);
      plats.push(np);
      if (isSafe) lastSafeX = x + w / 2;
    }
  }

  function land(p) {
    ball.y = p.y - R;
    ball.vy = p.spring ? -SPRING : -BOUNCE;
    squash = 1;
    p.hit = 1;
    burst(ball.x, p.y, p.spring ? 12 : 6, p.spring ? '#ffd166' : '#7ef0d0');
    if (p.spring) {
      shake = Math.max(shake, 4);
      sfx(540, 0.16, 'triangle', 0.07);
    } else {
      sfx(330, 0.08, 'sine', 0.05);
    }
  }

  function die(fell) {
    if (dead) return;
    dead = true;
    deadT = 0;
    if (!fell) {
      shake = 18;
      ball.vy = -7.5;
      ball.vx = rand(-2.5, 2.5);
      burst(ball.x, ball.y, 28, ['#ff6b6b', '#ffb347', '#ffe9a8']);
      sfx(180, 0.35, 'sawtooth', 0.08);
    } else {
      sfx(120, 0.3, 'sawtooth', 0.06);
    }
    var m = meters();
    if (m > best) {
      best = m;
      newBest = true;
      try { localStorage.setItem('bb-best', best); } catch (e) {}
    }
  }

  function burst(x, y, n, colors) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * TAU;
      var s = 0.6 + Math.random() * 3.6;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 1.2,
        life: 1,
        decay: 0.02 + Math.random() * 0.026,
        r: 1.4 + Math.random() * 3,
        c: typeof colors === 'string' ? colors : colors[(Math.random() * colors.length) | 0]
      });
    }
  }

  function updateParts() {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.14;
      p.vx *= 0.98;
      p.life -= p.decay;
      if (p.life <= 0) parts.splice(i, 1);
    }
  }

  function update() {
    ticks++;
    squash *= 0.86;
    if (shake > 0) shake *= 0.9;
    updateParts();

    if (dead) {
      deadT++;
      ball.vy += GRAV;
      ball.y += ball.vy;
      ball.x = clamp(ball.x + ball.vx, R, W - R);
      ball.rot += 0.07;
      return;
    }

    if (keys.left) ball.vx -= ACC;
    if (keys.right) ball.vx += ACC;
    if (!keys.left && !keys.right) ball.vx *= DRAG;
    ball.vx = clamp(ball.vx, -MAX_VX, MAX_VX);

    ball.x += ball.vx;
    if (ball.x < R) { ball.x = R; ball.vx = 0; }
    else if (ball.x > W - R) { ball.x = W - R; ball.vx = 0; }

    var prevBottom = ball.y + R;
    ball.vy += GRAV;
    ball.y += ball.vy;
    ball.rot += ball.vx * 0.045 + 0.012;

    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 12) trail.shift();

    for (var i = 0; i < plats.length; i++) {
      var p = plats[i];
      if (p.type === 'moving') {
        p.x += p.vx;
        if (p.x < 6) { p.x = 6; p.vx = Math.abs(p.vx); }
        else if (p.x + p.w > W - 6) { p.x = W - 6 - p.w; p.vx = -Math.abs(p.vx); }
      }
      if (p.hit > 0) p.hit *= 0.87;
    }

    if (ball.vy > 0) {
      for (i = 0; i < plats.length; i++) {
        p = plats[i];
        if (p.type === 'spike') continue;
        if (prevBottom <= p.y + 3 && ball.y + R >= p.y &&
            ball.x + R * 0.7 > p.x && ball.x - R * 0.7 < p.x + p.w) {
          land(p);
          break;
        }
      }
    }

    for (i = 0; i < plats.length; i++) {
      p = plats[i];
      if (p.type !== 'spike') continue;
      if (circleRect(ball.x, ball.y, R * 0.8, p.x + 2, p.y - 11, p.w - 4, p.h + 11)) {
        die(false);
        return;
      }
    }

    var target = ball.y - H * 0.44;
    if (target < camY) camY += (target - camY) * 0.3;

    var keep = [];
    for (i = 0; i < plats.length; i++) {
      if (plats[i].y < camY + H + 260) keep.push(plats[i]);
    }
    plats = keep;

    var guard = 0;
    while (topY > camY - 700 && guard++ < 40) genBand();

    if (ball.y - R > camY + H + 20) die(true);
  }

  // --- drawing ---
  function drawBg() {
    var alt = Math.max(0, -camY);
    var k = Math.min(1, alt / 9000);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, mix('#0e1636', '#04030c', k));
    g.addColorStop(0.55, mix('#1c2c60', '#0a0a20', k));
    g.addColorStop(1, mix('#2d4180', '#121034', k));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var sy = ((s.y - camY * 0.35) % 2600 + 2600) % 2600 - 260;
      if (sy < -12 || sy > H + 12) continue;
      ctx.globalAlpha = s.a * (0.62 + 0.38 * Math.sin(ticks * 0.04 + s.tw));
      ctx.fillStyle = '#dfe9ff';
      ctx.beginPath();
      ctx.arc(s.x, sy, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawGuides() {
    var step = 500;
    var first = Math.floor((camY - 200) / step) * step;
    ctx.font = '11px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    for (var wy = first; wy < camY + H + step; wy += step) {
      var sy = wy - camY;
      if (sy < -20 || sy > H + 20) continue;
      ctx.strokeStyle = 'rgba(150,180,255,.10)';
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 10]);
      ctx.beginPath();
      ctx.moveTo(0, sy);
      ctx.lineTo(W, sy);
      ctx.stroke();
      ctx.setLineDash([]);
      var m = Math.round(-wy / PX_PER_M);
      if (m > 0) {
        ctx.fillStyle = 'rgba(170,195,255,.32)';
        ctx.fillText(m + ' m', 10, sy - 4);
      }
    }
  }

  function drawPlat(p) {
    var sy = p.y - camY;
    if (sy < -70 || sy > H + 70) return;

    if (p.type === 'spike') {
      rrect(p.x, sy, p.w, p.h, 4);
      ctx.fillStyle = '#3a2745';
      ctx.fill();
      ctx.strokeStyle = '#20142a';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      var n = Math.max(2, Math.round(p.w / 14));
      var tw = p.w / n;
      var tg = ctx.createLinearGradient(0, sy - 13, 0, sy + 2);
      tg.addColorStop(0, '#ff8f8f');
      tg.addColorStop(1, '#b52a44');
      for (var i = 0; i < n; i++) {
        var bx = p.x + i * tw;
        ctx.beginPath();
        ctx.moveTo(bx + 0.6, sy + 2);
        ctx.lineTo(bx + tw / 2, sy - 13);
        ctx.lineTo(bx + tw - 0.6, sy + 2);
        ctx.closePath();
        ctx.fillStyle = tg;
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,130,150,.22)';
      ctx.fillRect(p.x + 2, sy + p.h - 4, p.w - 4, 3);
      return;
    }

    var lift = p.hit * 3;
    var top = sy - lift;
    var fill, edge;
    if (p.type === 'moving') { fill = '#6f8cff'; edge = '#3b4fc0'; }
    else { fill = '#3bd9b4'; edge = '#1c8d78'; }

    rrect(p.x, top, p.w, p.h, 7);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = edge;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,.42)';
    rrect(p.x + 6, top + 3, p.w - 12, 4, 2);
    ctx.fill();

    if (p.spring) {
      var cx = p.x + p.w / 2;
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(cx - 8, top);
      ctx.lineTo(cx + 8, top - 3);
      ctx.lineTo(cx - 8, top - 6);
      ctx.lineTo(cx + 8, top - 9);
      ctx.lineTo(cx - 8, top - 12);
      ctx.stroke();
      rrect(cx - 12, top - 18, 24, 6, 3);
      ctx.fillStyle = '#ffd166';
      ctx.fill();
    }
  }

  function drawParts() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y - camY, p.r * p.life, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawTrail() {
    for (var i = 0; i < trail.length; i++) {
      var a = (i + 1) / trail.length;
      ctx.globalAlpha = a * 0.22;
      ctx.fillStyle = '#ffb347';
      ctx.beginPath();
      ctx.arc(trail[i].x, trail[i].y - camY, R * (0.3 + a * 0.6), 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawBall() {
    var sy = ball.y - camY;
    if (sy < -90 || sy > H + 90) return;
    ctx.save();
    ctx.translate(ball.x, sy);
    ctx.scale(1 + squash * 0.35, 1 - squash * 0.32);
    ctx.rotate(rot);

    var g = ctx.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.15, 0, 0, R * 1.05);
    g.addColorStop(0, '#fff6cf');
    g.addColorStop(0.45, '#ffc44d');
    g.addColorStop(1, '#e8701f');
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, TAU);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(96,42,8,.6)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = 'rgba(150,66,12,.45)';
    ctx.beginPath(); ctx.arc(R * 0.45, 0, 2.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-R * 0.45, 0, 2.6, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawHud() {
    var m = String(meters());
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.6)';
    ctx.shadowBlur = 8;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#eaf2ff';
    ctx.font = 'bold 40px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(m, 18, 14);
    var w = ctx.measureText(m).width;
    ctx.fillStyle = 'rgba(200,220,255,.65)';
    ctx.font = 'bold 16px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('m', 24 + w, 38);

    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(190,210,255,.55)';
    ctx.font = 'bold 14px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('BEST ' + best + ' m', W - 18, 22);

    if (!dead && ticks < 300) {
      var a = Math.min(1, ticks / 45) * clamp((300 - ticks) / 80, 0, 1);
      ctx.globalAlpha = a * 0.8;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#cfdcff';
      ctx.font = '15px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('\u2190 \u2192  or  A / D  to steer', W / 2, H - 42);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawOver() {
    var a = Math.min(1, deadT / 24);
    ctx.fillStyle = 'rgba(6,8,20,' + (0.74 * a).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var cy = H * 0.4;

    ctx.fillStyle = '#ff7b7b';
    ctx.font = 'bold 44px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('GAME OVER', W / 2, cy - 64);

    ctx.fillStyle = '#eaf2ff';
    ctx.font = 'bold 60px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(meters() + ' m', W / 2, cy + 8);

    if (newBest) {
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 18px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('NEW BEST!', W / 2, cy + 58);
    } else {
      ctx.fillStyle = 'rgba(190,210,255,.6)';
      ctx.font = '16px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('best ' + best + ' m', W / 2, cy + 58);
    }

    ctx.fillStyle = 'rgba(232,240,255,' + (0.55 + 0.35 * Math.sin(ticks * 0.09)).toFixed(3) + ')';
    ctx.font = 'bold 16px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('press R / SPACE  or  click to retry', W / 2, cy + 128);
    ctx.restore();
  }

  function draw() {
    drawBg();

    ctx.save();
    if (shake > 0.4) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

    drawGuides();
    for (var i = 0; i < plats.length; i++) drawPlat(plats[i]);
    drawParts();
    if (!dead) drawTrail();
    drawBall();

    ctx.restore();

    drawHud();
    if (dead) drawOver();
  }

  // --- input ---
  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = true;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === ' ') e.preventDefault();
    if (dead && (k === 'r' || k === 'R' || k === ' ' || k === 'Enter')) reset();
  });

  window.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });

  window.addEventListener('blur', function () { keys.left = keys.right = false; });

  function steer(e) {
    var r = canvas.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width;
    keys.left = x < 0.5;
    keys.right = x >= 0.5;
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (e.preventDefault) e.preventDefault();
    if (dead) { reset(); return; }
    steer(e);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (e.buttons && !dead) steer(e);
  });
  window.addEventListener('pointerup', function () { keys.left = keys.right = false; });
  canvas.addEventListener('pointercancel', function () { keys.left = keys.right = false; });

  // --- loop ---
  var acc = 0, last = 0;
  function loop(ts) {
    if (!last) last = ts;
    var dt = ts - last;
    last = ts;
    if (dt < 0) dt = 0;
    if (dt > 100) dt = 100;
    acc += dt;
    var guard = 0;
    while (acc >= STEP && guard++ < 6) {
      update();
      acc -= STEP;
    }
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
