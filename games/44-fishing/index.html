<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fishing Frenzy</title>
<style>
  html,body{margin:0;height:100%;background:#0a1420;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;user-select:none;-webkit-user-select:none;overflow:hidden;touch-action:none;overscroll-behavior:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #wrap{position:relative;line-height:0}
  canvas{display:block;max-width:98vw;max-height:98vh;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.65);touch-action:none}
  #end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(5,16,28,.87);border-radius:10px;color:#eaf6ff;text-align:center;line-height:1.5}
  #end h1{margin:0 0 4px;font-size:46px;letter-spacing:1px}
  #end .sub{font-size:15px;opacity:.75;margin:0 0 14px}
  #final{font-size:25px;margin:0}
  #end button{margin-top:24px;font-size:19px;padding:12px 42px;border:0;border-radius:999px;background:#ffb42c;color:#2a1800;font-weight:800;cursor:pointer;letter-spacing:.5px}
  #end button:hover{background:#ffca5f}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="aaa-score" class="sr">0</div>
  <div id="end">
    <h1>Time's Up!</h1>
    <p class="sub">The lake closes at dusk.</p>
    <p id="final"></p>
    <p id="endbest" class="sub"></p>
    <button id="again">Fish Again</button>
  </div>
</div>
<script>
"use strict";
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const W=cvs.width,H=cvs.height,WY=392;          // water surface y
const TIP={x:236,y:296};                      // rod tip
const CAST_RANGE=560,CAST_X0=TIP.x+40;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

// ---------- sound (generated, no assets; honors overlay prefs) ----------
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function sfxOn(){try{return localStorage.getItem('aaa_sfx')!=='0'}catch(e){return true}}
function bgmOn(){try{return localStorage.getItem('aaa_bgm')!=='0'}catch(e){return true}}
function tone(f,dur,type,g,slide){
  if(!sfxOn())return;
  try{
    const c=ac();if(!c)return;
    const o=c.createOscillator(),v=c.createGain(),t=c.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
    v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(v).connect(c.destination);o.start();o.stop(t+dur);
  }catch(e){}
}
const sndCast =()=>tone(300,.18,'sine',.10,-180);
const sndSplash=()=>tone(150,.25,'triangle',.16,-95);
const sndBite =()=>{tone(880,.09,'square',.11);setTimeout(()=>tone(880,.09,'square',.11),120)};
const sndCatch=()=>{tone(523,.1,'sine',.12);setTimeout(()=>tone(659,.1,'sine',.12),90);setTimeout(()=>tone(784,.16,'sine',.12),180)};
const sndBad  =()=>tone(190,.3,'sawtooth',.09,-80);
function mtone(f,d,ty,v,sl,t){const c=ac();if(!c)return;try{const n=c.currentTime+(t||0),o=c.createOscillator(),g=c.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,sl),n+d);g.gain.setValueAtTime(.0008,n);g.gain.linearRampToValueAtTime(v||.05,n+.02);g.gain.exponentialRampToValueAtTime(.0006,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.05)}catch(e){}}
function stinger(w){(w?[523,659,784,1047]:[392,349,311,262]).forEach(function(f,i){if(!sfxOn())return;mtone(f,w?.2:.26,w?'triangle':'sawtooth',w?.09:.05,null,i*(w?.1:.12))})}
// lazy lake ambient: warm pads + occasional bubble blips
let bgmI=0,bgmNext=-1;const BSTEP=60/92/2;const ROOTS=[110,98,87.31,73.42];
setInterval(()=>{if(!bgmOn()){bgmNext=-1;return}const c=ac();if(!c||c.state!=='running')return;if(bgmNext<0)bgmNext=c.currentTime+.06;const a=c.currentTime+.32;while(bgmNext<a){const s=bgmI%16,t=bgmNext,R=ROOTS[(bgmI>>4)%4];
  if(s===0){mtone(R,2.6,'sine',.034,null,t);mtone(R*1.5,2.6,'sine',.02,null,t);mtone(R*2,2.6,'sine',.013,null,t)}
  if(s===4&&Math.random()<.5)mtone(R*4,.5,'sine',.012,null,t);
  if(s===8&&Math.random()<.7)mtone(rand(260,520),.4,'sine',.018,rand(700,1400),t);
  if(s===12&&Math.random()<.4)mtone(rand(500,900),.25,'triangle',.012,rand(1100,1800),t);
  bgmNext+=BSTEP;bgmI++}},80);
const scoreChip=document.getElementById('aaa-score');
function chipUpdate(v){if(scoreChip)scoreChip.textContent=v}

// ---------- fish tables ----------
// fish tables: [name, bodyColor, kgMin, kgMax] — drawn with canvas shapes, no emoji
const ZONES=[
 {d:0.4 ,label:'SHALLOWS'  ,fish:[['Minnow','#9fc4d8',.3,1.0],['Bluegill','#6fb0c0',.5,1.5],['Perch','#a8c86a',.4,1.3]]},
 {d:0.75,label:'MID WATER' ,fish:[['Bass','#5f8f70',1.5,3.5],['Trout','#c98a6a',1.0,2.8],['Pike','#4a7a5a',1.8,4.5]]},
 {d:9   ,label:'DEEP WATER',fish:[['Catfish','#7a6a8a',3,7],['Arapaima','#b05a4a',4,9],['Golden Koi','#ffb42c',5,12],['Shark','#8a9aad',7,15]]},
];
const JUNK=[['Old Boot','boot'],['Tin Can','can'],['Driftwood','log']];
function pickFish(d){
  if(Math.random()<0.09){const j=JUNK[(Math.random()*JUNK.length)|0];return{name:j[0],kind:j[1],kg:0,pts:2,junk:true}}
  const z=ZONES.find(z=>d<z.d)||ZONES[2],f=z.fish[(Math.random()*z.fish.length)|0];
  const kg=+rand(f[2],f[3]).toFixed(1);
  return{name:f[0],col:f[1],kg,pts:Math.round(kg*10)};
}

// ---------- state ----------
let G,ambient=[],rings=[],popups=[],clouds=[];
let best=0;try{best=+localStorage.ff_best||0}catch(e){}
function newGame(){
  G={state:'ready',score:0,catches:0,time:75,t:0,
     power:0,dir:1,castT:0,lastD:0,
     from:{x:TIP.x,y:TIP.y},to:{x:0,y:0},
     bob:{x:TIP.x+16,y:WY+6},bobHome:true,
     waitDur:0,biteAt:0,fakeAt:0,fakeUntil:0,graceUntil:0,
     biteT:0,biteT0:0,biter:null,
     res:null,resT0:0,endPending:false,msg:''};
  rings.length=0;popups.length=0;
}
for(let i=0;i<6;i++)ambient.push({x:rand(80,W-40),y:rand(WY+55,H-32),v:rand(16,44)*(Math.random()<.5?-1:1),r:rand(11,24),ph:rand(0,6)});
for(let i=0;i<4;i++)clouds.push({x:rand(0,W),y:rand(30,140),s:rand(.6,1.4),v:rand(4,10)});
newGame();

// ---------- actions ----------
function press(){
  if(G.state==='ready'){G.state='charging';G.power=0;G.dir=1}
  else if(G.state==='waiting'&&G.t>=G.graceUntil){resolveCast('early')}
  else if(G.state==='bite'){hook()}
  else if(G.state==='resolve'&&G.t>G.resT0+0.35){finishResolve()}
}
function release(){
  if(G.state==='charging')doCast();
}
function doCast(){
  G.lastD=clamp(0.12+0.88*G.power/100,0,1);
  G.from={x:TIP.x,y:TIP.y};
  G.to={x:CAST_X0+G.lastD*CAST_RANGE,y:WY+rand(0,10)};
  G.castT=0;G.state='flight';sndCast();
}
function landCast(){
  G.bob={x:G.to.x,y:G.to.y};G.bobHome=false;
  sndSplash();
  rings.push({x:G.bob.x,r:6,v:85,a:.7},{x:G.bob.x,r:16,v:60,a:.5});
  G.state='waiting';
  G.waitDur=rand(1.7,4.3);
  G.biteAt=G.t+G.waitDur;
  G.fakeAt=Math.random()<0.6?G.biteAt-rand(0.6,1.5):Infinity;
  G.graceUntil=G.t+0.4;
  const sx=G.bob.x+rand(160,300)*(Math.random()<.5?-1:1),sy=rand(WY+60,H-40);
  G.biter={x0:sx,y0:sy,x:sx,y:sy};
}
function hook(){
  const el=G.t-G.biteT0,perfect=el<0.28;
  const f=pickFish(G.lastD);
  if(perfect)f.pts=Math.max(2,Math.round(f.pts*1.5));
  G.score+=f.pts;G.catches++;chipUpdate(G.score);
  G.res={kind:'caught',fish:f,perfect};G.resT0=G.t;G.state='resolve';
  sndCatch();
  if(perfect)stinger(true);
  rings.push({x:G.bob.x,r:8,v:115,a:.7});
  popups.push({x:G.bob.x,y:G.bob.y-48,txt:'+'+f.pts+' pts',t:0,c:perfect?'#ffd34d':'#ffffff'});
  if(perfect)popups.push({x:G.bob.x,y:G.bob.y-74,txt:'PERFECT ×1.5 ('+el.toFixed(2)+'s)',t:0,c:'#ffd34d'});
  G.msg=(perfect?'PERFECT! ':'')+f.name+(f.junk?'':' — '+f.kg+' kg')+' · +'+f.pts+' pts';
}
function resolveCast(kind){
  G.res={kind};G.resT0=G.t;G.state='resolve';
  G.msg=kind==='early'?'Too soon — the fish scattered!':'It got away…';
  sndBad();
}
function finishResolve(){
  G.biter=null;
  if(G.endPending)return gameOver();
  G.state='ready';G.bobHome=true;G.bob={x:TIP.x+16,y:WY+6};
}
function gameOver(){
  G.state='over';
  const newBest=G.score>best;
  if(newBest){best=G.score;try{localStorage.ff_best=best}catch(e){}}
  stinger(newBest);
  document.getElementById('final').textContent='Score: '+G.score+'  ·  Fish caught: '+G.catches;
  document.getElementById('endbest').textContent='Best score: '+best;
  document.getElementById('end').style.display='flex';
}

// ---------- update ----------
function update(dt){
  G.t+=dt;
  for(const f of ambient){f.x+=f.v*dt;if(f.x<-60)f.x=W+60;if(f.x>W+60)f.x=-60}
  for(const c of clouds){c.x+=c.v*dt;if(c.x>W+90)c.x=-90}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=r.v*dt;r.a-=dt*1.5;if(r.a<=0)rings.splice(i,1)}
  for(let i=popups.length-1;i>=0;i--){const p=popups[i];p.y-=26*dt;p.t+=dt;if(p.t>1.1)popups.splice(i,1)}
  if(G.state==='over')return;
  G.time-=dt;
  if(G.time<=5&&Math.ceil(G.time)!==Math.ceil(G.time+dt)&&G.time>0)tone(920,.05,'square',.05);
  if(G.time<=0){G.time=0;
    if(G.state==='bite'||G.state==='resolve')G.endPending=true;
    else return gameOver();
  }
  switch(G.state){
    case 'charging':
      G.power+=G.dir*dt*130;
      if(G.power>=100){G.power=100;G.dir=-1}
      if(G.power<=0){G.power=0;G.dir=1}
      break;
    case 'flight':
      G.castT+=dt/0.55;
      if(G.castT>=1)landCast();
      break;
    case 'waiting':{
      const b=G.biter,p=clamp(1-(G.biteAt-G.t)/G.waitDur,0,1);
      b.x=lerp(b.x0,G.bob.x,p);b.y=lerp(b.y0,G.bob.y+30,p)+Math.sin(G.t*5)*4;
      if(G.t>=G.fakeAt){G.fakeAt=Infinity;G.fakeUntil=G.t+0.3;rings.push({x:G.bob.x,r:5,v:55,a:.45})}
      if(G.t>=G.biteAt){
        G.state='bite';G.biteT=0.85;G.biteT0=G.t;sndBite();
        for(let i=0;i<3;i++)rings.push({x:G.bob.x,r:8+i*12,v:95,a:.6});
      }
      break;}
    case 'bite':
      G.biteT-=dt;
      if(G.biteT<=0)resolveCast('escaped');
      break;
  }
}
function bobY(){
  if(G.state==='bite')return G.bob.y+16;
  if(G.state==='waiting'){
    let y=G.bob.y+Math.sin(G.t*2.3)*3;
    if(G.t<G.fakeUntil)y+=7*Math.abs(Math.sin(G.t*28));
    return y;
  }
  if(G.state==='resolve'&&G.res&&G.res.kind==='caught')return G.bob.y-6;
  return G.bob.y+Math.sin(G.t*2.3)*3;
}
function tipY(){return TIP.y+(G.state==='charging'?G.power*0.14:0)}

// ---------- draw ----------
function fishShape(x,y,r,dir,a){
  ctx.save();ctx.translate(x,y);ctx.scale(dir,1);ctx.globalAlpha=a;
  ctx.fillStyle='#0a2c3f';
  ctx.beginPath();ctx.ellipse(0,0,r,r*0.42,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(-r*0.9,0);ctx.lineTo(-r*1.5,-r*0.45);ctx.lineTo(-r*1.5,r*0.45);ctx.closePath();ctx.fill();
  ctx.restore();
}
// hand-drawn catch art (replaces emoji)
function drawCatchShape(x,y,s,f,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  if(f.junk){
    if(f.kind==='boot'){ctx.fillStyle='#6a4a2e';ctx.beginPath();ctx.moveTo(-s*.45,-s*.85);ctx.lineTo(-s*.05,-s*.85);ctx.lineTo(-s*.05,-s*.1);ctx.lineTo(s*.55,-s*.1);ctx.lineTo(s*.7,s*.2);ctx.lineTo(s*.7,s*.45);ctx.lineTo(-s*.45,s*.45);ctx.closePath();ctx.fill();ctx.fillStyle='#4a3420';ctx.fillRect(-s*.5,s*.4,s*1.25,s*.18);ctx.fillStyle='#8a6a48';ctx.fillRect(-s*.45,-s*.85,s*.4,s*.16);}
    else if(f.kind==='can'){ctx.fillStyle='#a8b0ba';rr(-s*.4,-s*.6,s*.8,s*1.15,s*.12);ctx.fill();ctx.strokeStyle='#6a7680';ctx.lineWidth=s*.07;ctx.stroke();ctx.fillStyle='#c0564a';ctx.fillRect(-s*.4,-s*.05,s*.8,s*.35);ctx.fillStyle='#8a959f';ctx.beginPath();ctx.ellipse(0,-s*.6,s*.4,s*.1,0,0,7);ctx.fill();}
    else{ctx.fillStyle='#8a6a42';rr(-s,-s*.22,s*2,s*.44,s*.15);ctx.fill();ctx.strokeStyle='#5f4728';ctx.lineWidth=s*.05;ctx.beginPath();ctx.moveTo(-s*.8,0);ctx.lineTo(s*.8,0);ctx.stroke();ctx.fillStyle='#6a4e2c';ctx.beginPath();ctx.arc(-s*.4,0,s*.07,0,7);ctx.arc(s*.35,0,s*.05,0,7);ctx.fill();}
    ctx.restore();return;
  }
  const col=f.col||'#9fc4d8';
  ctx.shadowColor=col;ctx.shadowBlur=10;
  ctx.fillStyle=col;
  ctx.beginPath();ctx.ellipse(0,0,s,s*.44,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(-s*.85,0);ctx.lineTo(-s*1.5,-s*.45);ctx.lineTo(-s*1.5,s*.45);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-s*.1,-s*.4);ctx.lineTo(s*.15,-s*.72);ctx.lineTo(s*.32,-s*.34);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.ellipse(-s*.05,-s*.14,s*.55,s*.16,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='#0e2a3a';ctx.beginPath();ctx.arc(s*.48,-s*.08,s*.09,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*.5,-s*.1,s*.03,0,7);ctx.fill();
  ctx.restore();
}
function drawBobber(x,y){
  ctx.fillStyle='#333';ctx.fillRect(x-1.5,y-15,3,7);
  ctx.beginPath();ctx.arc(x,y,9,Math.PI,0);ctx.fillStyle='#e63946';ctx.fill();
  ctx.beginPath();ctx.arc(x,y,9,0,Math.PI);ctx.fillStyle='#f1faee';ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.stroke();
}
function banner(txt,big){
  ctx.font=(big?'800 30px':'700 21px')+' "Segoe UI",system-ui,sans-serif';
  const w=ctx.measureText(txt).width+40,h=big?48:38;
  ctx.fillStyle='rgba(5,20,35,.72)';rr(W/2-w/2,60,w,h,h/2);ctx.fill();
  ctx.fillStyle=big?'#ffd34d':'#eaf6ff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(txt,W/2,60+h/2+1);
}
function draw(){
  // sky
  const sky=ctx.createLinearGradient(0,0,0,WY);
  sky.addColorStop(0,'#8fd0ef');sky.addColorStop(1,'#e8f7ff');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,WY);
  ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(W-120,88,42,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)';
  for(const c of clouds){ctx.save();ctx.translate(c.x,c.y);ctx.scale(c.s,c.s);
    ctx.beginPath();ctx.ellipse(0,0,34,13,0,0,7);ctx.ellipse(24,4,26,11,0,0,7);ctx.ellipse(-26,5,24,10,0,0,7);ctx.fill();ctx.restore()}
  // hills
  ctx.fillStyle='#69a884';
  ctx.beginPath();ctx.moveTo(0,WY);ctx.quadraticCurveTo(300,WY-90,560,WY-18);ctx.quadraticCurveTo(760,WY-70,W,WY-24);ctx.lineTo(W,WY);ctx.closePath();ctx.fill();
  ctx.fillStyle='#4c8a68';
  ctx.beginPath();ctx.moveTo(480,WY);ctx.quadraticCurveTo(680,WY-110,880,WY-40);ctx.lineTo(W,WY-52);ctx.lineTo(W,WY);ctx.closePath();ctx.fill();
  // water
  const wg=ctx.createLinearGradient(0,WY,0,H);
  wg.addColorStop(0,'#2a8db5');wg.addColorStop(1,'#0a3d57');
  ctx.fillStyle=wg;ctx.fillRect(0,WY,W,H-WY);
  // zone tints + labels
  ctx.fillStyle='rgba(255,255,255,.045)';
  ctx.fillRect(CAST_X0,WY,0.4*CAST_RANGE,H-WY);
  ctx.fillRect(CAST_X0+0.75*CAST_RANGE,WY,0.25*CAST_RANGE,H-WY);
  ctx.setLineDash([5,7]);ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1;
  for(const zd of[0.4,0.75]){const zx=CAST_X0+zd*CAST_RANGE;ctx.beginPath();ctx.moveTo(zx,WY+4);ctx.lineTo(zx,H);ctx.stroke()}
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,.30)';ctx.font='700 11px "Segoe UI"';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('SHALLOWS',CAST_X0+0.20*CAST_RANGE,WY+16);
  ctx.fillText('MID WATER',CAST_X0+0.575*CAST_RANGE,WY+16);
  ctx.fillText('DEEP WATER',CAST_X0+0.875*CAST_RANGE,WY+16);
  // ambient fish
  for(const f of ambient)fishShape(f.x,f.y+Math.sin(G.t*2+f.ph)*5,f.r,Math.sign(f.v)||1,.38);
  // biter shadow
  if(G.biter&&(G.state==='waiting'||G.state==='bite'||G.state==='resolve')){
    const bx=G.state==='waiting'?G.biter.x:G.bob.x+Math.sin(G.t*30)*4;
    const by=G.state==='waiting'?G.biter.y:G.bob.y+28;
    fishShape(bx,by,17,Math.sin(G.t*30)>0?1:-1,.6);
  }
  // surface waves
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;
  for(let k=0;k<3;k++){ctx.globalAlpha=.5-k*.13;ctx.beginPath();
    for(let x=0;x<=W;x+=8){const y=WY+4+k*9+Math.sin(x*0.045+G.t*(1.6+k*0.4)+k*2)*2.4;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.stroke()}
  ctx.globalAlpha=1;
  // rings
  for(const r of rings){ctx.globalAlpha=Math.max(0,r.a);ctx.strokeStyle='#dff4ff';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(r.x,WY+6,r.r,r.r*0.32,0,0,7);ctx.stroke()}
  ctx.globalAlpha=1;
  // dock
  ctx.fillStyle='#6b4d2e';ctx.fillRect(18,364,12,86);ctx.fillRect(148,364,12,96);
  ctx.fillStyle='#8a6a45';ctx.fillRect(0,352,176,14);
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;
  for(let x=20;x<176;x+=22){ctx.beginPath();ctx.moveTo(x,352);ctx.lineTo(x,366);ctx.stroke()}
  // bucket
  ctx.fillStyle='#a0522d';ctx.beginPath();ctx.moveTo(66,352);ctx.lineTo(86,352);ctx.lineTo(83,330);ctx.lineTo(69,330);ctx.closePath();ctx.fill();
  // fisher
  const fy=352;
  ctx.strokeStyle='#23303d';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(114,fy);ctx.lineTo(116,fy-14);ctx.lineTo(118,fy-26);ctx.stroke(); // legs+body
  ctx.beginPath();ctx.moveTo(118,fy-22);ctx.lineTo(136,fy-22);ctx.lineTo(142,fy-19);ctx.stroke(); // arm
  ctx.fillStyle='#23303d';ctx.beginPath();ctx.arc(118,fy-34,9,0,7);ctx.fill(); // head
  ctx.fillStyle='#8a5a2b';ctx.beginPath();ctx.ellipse(118,fy-40,13,4.5,0,0,7);ctx.fill();ctx.fillRect(110,fy-48,16,8); // hat
  // rod
  const ty=tipY();
  ctx.strokeStyle='#5b3a1e';ctx.lineWidth=3.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(138,fy-21);ctx.lineTo(TIP.x,ty);ctx.stroke();
  // fishing line + bobber
  let bobX,bobDrawY;
  if(G.state==='flight'){
    const p=clamp(G.castT,0,1);
    bobX=lerp(G.from.x,G.to.x,p);
    bobDrawY=lerp(G.from.y,G.to.y,p)-Math.sin(p*Math.PI)*165;
  }else{bobX=G.bob.x;bobDrawY=bobY()}
  ctx.strokeStyle='rgba(240,248,255,.8)';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(TIP.x,ty);
  ctx.quadraticCurveTo((TIP.x+bobX)/2,(ty+bobDrawY)/2+24,bobX,bobDrawY-13);ctx.stroke();
  drawBobber(bobX,bobDrawY);
  // bite "!"
  if(G.state==='bite'){
    ctx.font='900 40px "Segoe UI"';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#ff9f1c';ctx.strokeStyle='#7a3c00';ctx.lineWidth=5;
    const by=bobY()-42+Math.sin(G.t*22)*3;
    ctx.strokeText('!',bobX,by);ctx.fillText('!',bobX,by);
    // window shrinking bar
    ctx.fillStyle='rgba(5,20,35,.6)';rr(bobX-40,bobDrawY+22,80,8,4);ctx.fill();
    ctx.fillStyle='#ff9f1c';rr(bobX-40,bobDrawY+22,80*clamp(G.biteT/0.85,0,1),8,4);ctx.fill();
  }
  // caught fish flying to bucket
  if(G.state==='resolve'&&G.res&&G.res.kind==='caught'){
    const p=clamp((G.t-G.resT0)/0.85,0,1);
    const fx=lerp(G.bob.x,76,p),fy2=lerp(G.bob.y,330,p)-Math.sin(p*Math.PI)*150;
    drawCatchShape(fx,fy2,(G.res.fish.junk?20:16+G.res.fish.kg*2.4)*(1-p*.3),G.res.fish,Math.sin(p*14)*0.4);
    if(Math.random()<.3)rings.push({x:fx,r:3,v:30,a:.3});
  }
  // popups
  for(const p of popups){ctx.globalAlpha=clamp(1-p.t/1.1,0,1);
    ctx.font='800 20px "Segoe UI"';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=p.c;ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=4;
    ctx.strokeText(p.txt,p.x,p.y);ctx.fillText(p.txt,p.x,p.y)}
  ctx.globalAlpha=1;
  // power meter
  if(G.state==='charging'){
    const mx=20,my=H-44,mw=260,mh=18;
    ctx.fillStyle='rgba(5,20,35,.65)';rr(mx-9,my-9,mw+18,mh+18,11);ctx.fill();
    const g=ctx.createLinearGradient(mx,0,mx+mw,0);
    g.addColorStop(0,'#2dc653');g.addColorStop(.55,'#ffd23f');g.addColorStop(1,'#ef476f');
    ctx.fillStyle=g;if(G.power>1){rr(mx,my,mw*G.power/100,mh,9);ctx.fill()}
    ctx.fillStyle='rgba(255,255,255,.9)';
    for(const zd of[0.4,0.75]){const zx=mx+((zd-0.12)/0.88)*mw;ctx.fillRect(zx,my-4,2,mh+8)}
    ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.5;rr(mx,my,mw,mh,9);ctx.stroke();
  }
  // HUD
  ctx.fillStyle='rgba(5,20,35,.55)';ctx.fillRect(0,0,W,44);
  ctx.font='800 18px "Segoe UI"';ctx.textBaseline='middle';
  ctx.textAlign='left';ctx.fillStyle='#fff';
  ctx.fillText('SCORE  '+G.score,16,23);
  ctx.fillText('FISH  '+G.catches,168,23);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.fillText('BEST  '+best,W-170,23);
  const s=Math.ceil(G.time);
  ctx.fillStyle=G.time<10?'#ff6b6b':'#fff';
  ctx.fillText('TIME  '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),W-16,23);
  // context banner
  if(G.state==='ready')banner('HOLD to charge your cast — RELEASE to throw');
  else if(G.state==='charging')banner('Release to cast! Farther = bigger fish');
  else if(G.state==='waiting')banner(G.t<G.fakeUntil?'…':'Shhh… wait for the plunge!');
  else if(G.state==='bite')banner('CLICK NOW!',true);
  else if(G.state==='resolve'&&G.msg)banner(G.msg);
}

// ---------- input ----------
cvs.addEventListener('pointerdown',e=>{e.preventDefault();press()});
window.addEventListener('pointerup',()=>release());
cvs.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();
    if(G.state==='over'){restart()}else press()}
});
window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter')release()});
function restart(){document.getElementById('end').style.display='none';newGame()}
document.getElementById('again').addEventListener('click',restart);

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

<script src="../assets/aaa-arcade.js" defer></script>
