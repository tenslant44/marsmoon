<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ghost Catch</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;color:#fff;font-family:system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:12px;
    background:
      radial-gradient(900px 620px at 50% -10%, rgba(49,46,129,.45), transparent 60%),
      radial-gradient(700px 500px at 90% 110%, rgba(20,20,50,.6), transparent 60%),
      #050510;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{position:relative;width:min(580px,100%);display:flex;flex-direction:column;gap:9px}
  .hud{
    display:flex;justify-content:space-between;gap:8px;
    background:rgba(18,18,40,.85);border:1px solid rgba(116,192,252,.3);
    padding:9px 15px;border-radius:13px;font-weight:800;font-size:.92rem;
    box-shadow:0 10px 28px rgba(0,0,0,.45);backdrop-filter:blur(6px);
  }
  .hud .lab{font-size:.58rem;letter-spacing:.15em;color:#7f8fb8;display:block;text-transform:uppercase}
  .hud span{color:#7dd3fc;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(125,211,252,.5)}
  .hud .b{color:#fde047;text-shadow:0 0 12px rgba(253,224,71,.5)}
  .hud .tm{color:#fda4af;text-shadow:0 0 12px rgba(253,164,175,.5)}
  canvas{
    width:100%;height:auto;aspect-ratio:560/480;border-radius:15px;display:block;
    border:1px solid rgba(116,192,252,.3);cursor:none;touch-action:none;
    box-shadow:0 20px 55px rgba(0,0,0,.6),0 0 50px -14px rgba(116,140,252,.3);
  }
  .ov{
    position:absolute;inset:56px 0 0 0;border-radius:15px;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:22px;gap:14px;
    background:radial-gradient(ellipse at 50% 40%, rgba(30,34,70,.55), rgba(5,5,16,.93) 75%);
    backdrop-filter:blur(4px);transition:opacity .3s,visibility .3s;
  }
  .ov.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .title{
    font-size:clamp(2rem,8vw,3rem);font-weight:900;letter-spacing:.04em;line-height:.95;
    background:linear-gradient(180deg,#fff,#a5b4fc 55%,#6366f1);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(129,140,248,.5));
  }
  .ov p{color:#c3cdf0;max-width:340px;font-size:.93rem;line-height:1.55}
  .statline{display:flex;gap:18px;font-weight:800;font-size:1.02rem}
  .statline b{color:#fde047}
  .btn{
    padding:13px 36px;border:none;border-radius:999px;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg,#818cf8,#22d3ee);color:#060614;
    font-weight:900;font-size:1rem;letter-spacing:.05em;
    box-shadow:0 12px 30px -8px rgba(129,140,248,.6),inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .12s;
  }
  .btn:active{transform:scale(.96)}
  .hint{font-size:.75rem;color:#5f6d99;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div><span class="lab">Caught</span><span id="score">0</span></div>
    <div><span class="lab">Combo</span><span id="combo">x1</span></div>
    <div><span class="lab">Best</span><span class="b" id="best">0</span></div>
    <div><span class="lab">Time</span><span class="tm" id="time">45s</span></div>
  </div>
  <canvas id="c" width="560" height="480"></canvas>
  <div class="ov" id="ov">
    <h1 class="title" id="ovT">GHOST<br>CATCH</h1>
    <p id="ovP">Sweep your flashlight across the haunted room — ghosts only show inside the beam. Click or tap a lit ghost to trap it. Golden phantoms are worth triple!</p>
    <div class="statline" id="ovStats" style="display:none"></div>
    <button class="btn" id="startBtn">ENTER ROOM</button>
    <div class="hint">45 seconds · chain captures for combo points</div>
  </div>
</div>
<script>
(() => {
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), timeEl = document.getElementById('time'), comboEl = document.getElementById('combo');
  const ov = document.getElementById('ov'), ovT = document.getElementById('ovT'), ovP = document.getElementById('ovP'), ovStats = document.getElementById('ovStats'), startBtn = document.getElementById('startBtn');

  let ac = null;
  const audio = () => { const A = window.AudioContext || window.webkitAudioContext; if (!ac && A) ac = new A(); if (ac && ac.state === 'suspended') ac.resume().catch(()=>{}); return ac; };
  const sfxOn = () => localStorage.getItem('aaa_sfx') !== '0';
  function tone(f, d, type='sine', vol=0.06, slide=null){
    if (!sfxOn()) return; const x = audio(); if (!x) return;
    try {
      const t = x.currentTime, o = x.createOscillator(), g = x.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
      g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0006, t + d);
      o.connect(g); g.connect(x.destination); o.start(t); o.stop(t + d + 0.03);
    } catch {}
  }

  let best = Number(localStorage.getItem('ghost_best') || 0);
  bestEl.textContent = best;

  let state = 'idle', light = { x: W/2, y: H/2 }, beam = { x: W/2, y: H/2, ang: -Math.PI/2 }, ghosts = [], pops = [], wisps = [], score = 0, timeLeft = 45;
  let combo = 0, comboT = 0;
  for (let i = 0; i < 8; i++) wisps.push({ x: Math.random()*W, y: Math.random()*H, s: 30 + Math.random()*50, ph: Math.random()*6 });

  function spawnGhost() {
    const roll = Math.random();
    const gold = roll < .18;
    const bat = !gold && roll < .45;
    ghosts.push({
      x: 40 + Math.random()*(W - 80),
      y: 40 + Math.random()*(H - 80),
      vx: (Math.random()*2 - 1) * (gold ? 145 : bat ? 110 : 72),
      vy: (Math.random()*2 - 1) * (gold ? 145 : bat ? 110 : 72),
      r: gold ? 17 : 21,
      pts: gold ? 3 : 1,
      kind: gold ? 'gold' : bat ? 'bat' : 'ghost',
      ph: Math.random()*6, lit: false
    });
  }

  function reset() {
    ghosts = []; pops = []; score = 0; timeLeft = 45; combo = 0; comboT = 0;
    for (let i = 0; i < 6; i++) spawnGhost();
    scoreEl.textContent = '0'; timeEl.textContent = '45s'; comboEl.textContent = 'x1';
    state = 'play';
    ov.classList.add('hidden');
    audio();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.04, (now - last) / 1000);
    last = now;
    if (state === 'play') update(dt);
    draw(now / 1000);
    requestAnimationFrame(loop);
  }

  function update(dt) {
    timeLeft -= dt;
    timeEl.textContent = Math.max(0, Math.ceil(timeLeft)) + 's';
    if (timeLeft <= 0) {
      state = 'over';
      if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('ghost_best', String(best)); }
      setTimeout(() => {
        ovT.textContent = 'DAWN BREAKS!';
        ovP.innerHTML = 'The spirits fade with the night.';
        ovStats.style.display = 'flex';
        ovStats.innerHTML = `<div>Caught <b>${score}</b></div><div>Best <b>${best}</b></div>`;
        startBtn.textContent = 'HUNT AGAIN';
        ov.classList.remove('hidden');
      }, 400);
      return;
    }
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) { combo = 0; comboEl.textContent = 'x1'; } }

    // beam lags behind pointer for feel
    beam.x += (light.x - beam.x) * Math.min(1, dt * 12);
    beam.y += (light.y - beam.y) * Math.min(1, dt * 12);
    const tAng = Math.atan2(light.y - beam.y, light.x - beam.x);
    if (Math.hypot(light.x - beam.x, light.y - beam.y) > 4) beam.ang = tAng;

    for (const g of ghosts) {
      g.x += g.vx * dt; g.y += g.vy * dt;
      if (g.x < 28 || g.x > W - 28) g.vx *= -1;
      if (g.y < 28 || g.y > H - 28) g.vy *= -1;
      // lit if inside beam circle OR beam cone
      const d = Math.hypot(g.x - beam.x, g.y - beam.y);
      const ga = Math.atan2(g.y - beam.y, g.x - beam.x);
      let dd = Math.abs(ga - beam.ang);
      while (dd > Math.PI) dd = Math.abs(dd - Math.PI * 2);
      g.lit = d < 95 || (d < 210 && dd < .5);
    }
    for (let i = pops.length - 1; i >= 0; i--) {
      pops[i].t -= dt;
      if (pops[i].t <= 0) pops.splice(i, 1);
    }
    // difficulty: faster ghosts in last 15s
    if (timeLeft < 15 && Math.random() < dt * .5 && ghosts.length < 9) spawnGhost();
  }

  // ---------- drawn sprites ----------
  function drawGhost(g, t) {
    const bob = Math.sin(t * 4 + g.ph) * 4;
    ctx.save(); ctx.translate(g.x, g.y + bob);
    if (g.kind === 'bat') {
      const flap = Math.sin(t * 14 + g.ph) * .5;
      ctx.fillStyle = '#4c1d95';
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
      ctx.save(); ctx.rotate(-.3 - flap * .3);
      ctx.beginPath(); ctx.moveTo(-6, 0); ctx.quadraticCurveTo(-22, -14, -30, -4); ctx.quadraticCurveTo(-20, -2, -24, 6); ctx.quadraticCurveTo(-14, 6, -6, 4); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.rotate(.3 + flap * .3);
      ctx.beginPath(); ctx.moveTo(6, 0); ctx.quadraticCurveTo(22, -14, 30, -4); ctx.quadraticCurveTo(20, -2, 24, 6); ctx.quadraticCurveTo(14, 6, 6, 4); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath(); ctx.arc(-3, -2, 1.8, 0, Math.PI*2); ctx.arc(3, -2, 1.8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#4c1d95';
      ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(-8, -15); ctx.lineTo(-2, -10); ctx.moveTo(6, -8); ctx.lineTo(8, -15); ctx.lineTo(2, -10); ctx.fill();
    } else {
      const gold = g.kind === 'gold';
      const body = gold ? '#fde047' : '#e2e8f0';
      const shade = gold ? '#f59e0b' : '#94a3b8';
      ctx.fillStyle = body;
      ctx.shadowColor = gold ? '#fde047' : '#a5b4fc'; ctx.shadowBlur = g.lit ? 18 : 0;
      ctx.beginPath();
      ctx.moveTo(-14, 14);
      ctx.lineTo(-14, -2);
      ctx.arc(0, -2, 14, Math.PI, 0);
      ctx.lineTo(14, 14);
      const wob = Math.sin(t * 6 + g.ph) * 3;
      ctx.lineTo(9, 9 + wob); ctx.lineTo(4, 14); ctx.lineTo(0, 9 - wob); ctx.lineTo(-5, 14); ctx.lineTo(-9, 9);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = shade;
      ctx.beginPath(); ctx.ellipse(0, 12, 10, 3, 0, 0, Math.PI); ctx.fill();
      ctx.fillStyle = '#1e1b4b';
      ctx.beginPath(); ctx.arc(-5, -4, 2.6, 0, Math.PI*2); ctx.arc(5, -4, 2.6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 3, gold ? 3.4 : 2.2, 0, Math.PI); ctx.fill();
      if (gold) {
        ctx.strokeStyle = '#fef9c3'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(0, -2, 19, 0, Math.PI*2); ctx.setLineDash([4, 6]); ctx.lineDashOffset = -t * 30; ctx.stroke(); ctx.setLineDash([]);
      }
    }
    ctx.restore();
  }

  function draw(t) {
    // room
    ctx.fillStyle = '#0a0a1c';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // drifting fog wisps
    for (const w of wisps) {
      const wx = (w.x + t * w.s) % (W + 160) - 80;
      const wy = w.y + Math.sin(t * .6 + w.ph) * 14;
      const g = ctx.createRadialGradient(wx, wy, 4, wx, wy, 46);
      g.addColorStop(0, 'rgba(99,102,241,.06)'); g.addColorStop(1, 'rgba(99,102,241,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(wx, wy, 46, 0, Math.PI*2); ctx.fill();
    }

    // ghosts (dim unless lit)
    for (const g of ghosts) {
      ctx.save();
      ctx.globalAlpha = g.lit ? .97 : .07;
      drawGhost(g, t);
      ctx.restore();
    }

    // beam cone + pool
    const bx = beam.x, by = beam.y;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // cone
    const coneLen = 240, spread = .42;
    const cg = ctx.createRadialGradient(bx, by, 10, bx, by, coneLen);
    cg.addColorStop(0, 'rgba(254,249,195,.30)');
    cg.addColorStop(.55, 'rgba(147,197,253,.10)');
    cg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.arc(bx, by, coneLen, beam.ang - spread, beam.ang + spread);
    ctx.closePath(); ctx.fill();
    // pool
    const pg = ctx.createRadialGradient(bx, by, 8, bx, by, 105);
    pg.addColorStop(0, 'rgba(254,249,195,.4)');
    pg.addColorStop(.65, 'rgba(147,197,253,.13)');
    pg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(bx, by, 105, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // lit ghosts get a rim highlight redrawn brighter on top
    for (const g of ghosts) {
      if (!g.lit) continue;
      ctx.save();
      ctx.globalAlpha = .55;
      ctx.globalCompositeOperation = 'lighter';
      drawGhost(g, t);
      ctx.restore();
    }

    // capture popups
    for (const p of pops) {
      ctx.globalAlpha = Math.min(1, p.t * 2);
      ctx.fillStyle = p.gold ? '#fde047' : '#7dd3fc';
      ctx.font = '900 19px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 6;
      ctx.fillText('+' + p.pts, p.x, p.y - (0.7 - p.t) * 34);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;

    // flashlight reticle
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(light.x, light.y, 13, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(light.x - 19, light.y); ctx.lineTo(light.x - 9, light.y);
    ctx.moveTo(light.x + 9, light.y); ctx.lineTo(light.x + 19, light.y);
    ctx.moveTo(light.x, light.y - 19); ctx.lineTo(light.x, light.y - 9);
    ctx.moveTo(light.x, light.y + 9); ctx.lineTo(light.x, light.y + 19);
    ctx.stroke();
  }

  function setPos(e) {
    const r = c.getBoundingClientRect();
    light.x = Math.max(0, Math.min(W, (e.clientX - r.left) * W / r.width));
    light.y = Math.max(0, Math.min(H, (e.clientY - r.top) * H / r.height));
  }
  c.addEventListener('pointermove', setPos);
  c.addEventListener('pointerdown', e => {
    e.preventDefault();
    setPos(e);
    if (state !== 'play') return;
    for (let i = ghosts.length - 1; i >= 0; i--) {
      const g = ghosts[i];
      if (Math.hypot(light.x - g.x, light.y - g.y) < g.r + 24) {
        if (!g.lit) continue; // must be revealed first
        combo = Math.min(6, combo + 1); comboT = 2.6;
        comboEl.textContent = 'x' + Math.max(1, combo);
        const pts = g.pts * Math.max(1, combo);
        score += pts;
        scoreEl.textContent = score;
        pops.push({ x: g.x, y: g.y, pts, t: .7, gold: g.kind === 'gold' });
        tone(600 + Math.min(6, combo) * 80, .12, 'triangle', .07, 900);
        ghosts.splice(i, 1);
        spawnGhost();
        return;
      }
    }
    tone(240, .06, 'sine', .03);
  });
  startBtn.onclick = () => { ovStats.style.display = 'none'; reset(); };
  draw(0);
  requestAnimationFrame(loop);
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
