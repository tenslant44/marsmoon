<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Volcano Escape</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;color:#fff;font-family:system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;overflow:hidden;
    background:
      radial-gradient(900px 600px at 50% 115%, rgba(194,65,12,.4), transparent 60%),
      radial-gradient(800px 500px at 10% -10%, rgba(69,10,10,.6), transparent 55%),
      #120608;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{position:relative;width:min(460px,100%);display:flex;flex-direction:column;align-items:center;gap:9px}
  .hud{
    width:100%;display:flex;justify-content:space-between;gap:8px;
    background:rgba(34,12,12,.85);border:1px solid rgba(255,120,60,.32);
    padding:9px 15px;border-radius:13px;font-weight:800;font-size:.92rem;
    box-shadow:0 10px 28px rgba(0,0,0,.45);backdrop-filter:blur(6px);
  }
  .hud .lab{font-size:.6rem;letter-spacing:.16em;color:#b98a7a;display:block;text-transform:uppercase}
  .hud span{color:#ffb25e;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(255,140,60,.5)}
  .hud .b{color:#fde047;text-shadow:0 0 12px rgba(253,224,71,.5)}
  .hud .g{color:#7ef3c8;text-shadow:0 0 12px rgba(94,234,212,.5)}
  canvas{
    width:100%;height:auto;max-height:72vh;aspect-ratio:440/600;border-radius:15px;display:block;
    border:1px solid rgba(255,120,60,.35);background:#170a0c;touch-action:none;
    box-shadow:0 20px 55px rgba(0,0,0,.6),0 0 50px -14px rgba(255,90,30,.35);
  }
  .touch{display:none;gap:12px;width:100%;justify-content:space-between}
  @media (pointer:coarse){ .touch{display:flex} }
  .tbtn{
    flex:1;padding:14px;border:none;border-radius:13px;cursor:pointer;user-select:none;
    background:rgba(58,24,22,.85);border:1px solid rgba(255,140,80,.35);color:#ffd0b0;
    font-weight:800;font-size:1.05rem;font-family:inherit;touch-action:none;
  }
  .tbtn:active{background:#ff6b35;color:#14090b}
  .ov{
    position:absolute;inset:47px 0 0 0;border-radius:15px;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:22px;gap:14px;
    background:radial-gradient(ellipse at 50% 40%, rgba(60,16,10,.6), rgba(14,5,6,.92) 75%);
    backdrop-filter:blur(4px);transition:opacity .3s,visibility .3s;
  }
  .ov.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .title{
    font-size:clamp(1.9rem,7.5vw,2.9rem);font-weight:900;letter-spacing:.04em;line-height:.95;
    background:linear-gradient(180deg,#fff,#fdba74 50%,#f97316 80%,#dc2626);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(249,115,22,.5));
  }
  .ov p{color:#e6c4b8;max-width:320px;font-size:.93rem;line-height:1.55}
  .statline{display:flex;gap:18px;font-weight:800;font-size:1.05rem}
  .statline b{color:#fde047}
  .keys{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;color:#a87f72;font-size:.76rem;font-weight:700}
  kbd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-bottom-width:3px;border-radius:7px;padding:2px 8px;font-family:ui-monospace,monospace;font-size:.7rem;font-weight:800;color:#ffe8d6}
  .btn{
    padding:13px 36px;border:none;border-radius:999px;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg,#ffb35e,#ff5e3a 60%,#dc2626);color:#fff;
    font-weight:900;font-size:1rem;letter-spacing:.05em;
    box-shadow:0 12px 30px -8px rgba(255,94,58,.65),inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .12s;
  }
  .btn:active{transform:scale(.96)}
  .hint{font-size:.75rem;color:#8d6055;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div><span class="lab">Height</span><span id="score">0m</span></div>
    <div><span class="lab">Ore</span><span class="g" id="gems">0</span></div>
    <div><span class="lab">Best</span><span class="b" id="best">0m</span></div>
  </div>
  <canvas id="c" width="440" height="600"></canvas>
  <div class="touch">
    <button class="tbtn" id="btnLeft"><svg viewBox="0 0 24 24" style="width:.9em;height:.9em;vertical-align:-.12em"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg> LEFT</button>
    <button class="tbtn" id="btnJump"><svg viewBox="0 0 24 24" style="width:.9em;height:.9em;vertical-align:-.12em"><path d="M5 15l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg> JUMP</button>
    <button class="tbtn" id="btnRight">RIGHT <svg viewBox="0 0 24 24" style="width:.9em;height:.9em;vertical-align:-.12em"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="ov" id="ov">
    <h1 class="title" id="ovTitle">VOLCANO<br>ESCAPE</h1>
    <p id="ovSub">Climb the basalt ledges before the rising magma swallows you. Springs launch you higher, cracked ledges crumble, and <b style="color:#7ef3c8">ore crystals</b> boost your score!</p>
    <div class="statline" id="ovStats" style="display:none"></div>
    <div class="keys"><span><kbd>A</kbd><kbd>D</kbd> or <kbd>Arrows</kbd> move</span><span><kbd>Space</kbd> jump</span></div>
    <button class="btn" id="startBtn">CLIMB NOW</button>
    <div class="hint">P pauses · green ledges crumble fast!</div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), gemsEl = document.getElementById('gems');
  const ov = document.getElementById('ov'), ovTitle = document.getElementById('ovTitle'), ovSub = document.getElementById('ovSub'), ovStats = document.getElementById('ovStats'), startBtn = document.getElementById('startBtn');

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);return this;};
  }

  let ac = null;
  const audio = () => { const A = window.AudioContext || window.webkitAudioContext; if (!ac && A) ac = new A(); if (ac && ac.state === 'suspended') ac.resume().catch(()=>{}); return ac; };
  const sfxOn = () => localStorage.getItem('aaa_sfx') !== '0';
  function tone(f, d, type='sine', vol=0.06, slide=null){
    if (!sfxOn()) return; const x = audio(); if (!x) return;
    try {
      const t = x.currentTime, o = x.createOscillator(), g = x.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
      g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0006, t + d);
      o.connect(g); g.connect(x.destination); o.start(t); o.stop(t + d + 0.03);
    } catch {}
  }

  let best = Number(localStorage.getItem('volcano_best') || 0);
  bestEl.textContent = best + 'm';

  let state = 'idle', player, plats, gems, camY, lavaY, maxHeight, embers, sparks, keys = {}, shake = 0, gemCount = 0, milestone = 0;
  let walls = [];

  function makeWalls() {
    walls = [];
    for (let y = -4000; y < H + 400; y += 46) {
      walls.push({ y, lw: 26 + Math.sin(y * .013) * 16 + Math.random() * 10, rw: 26 + Math.cos(y * .011) * 16 + Math.random() * 10 });
    }
  }

  function addPlat(y) {
    const hard = Math.min(1, Math.max(0, (-y + 400) / 3000));
    const w = 70 + Math.random() * 44 - hard * 12;
    const x = 26 + Math.random() * (W - w - 52);
    const r = Math.random();
    const type = r < .16 + hard * .12 ? 'moving' : r < .3 + hard * .12 ? 'spring' : r < .44 + hard * .26 ? 'crumble' : 'solid';
    plats.push({ x, y, w: Math.max(52, w), h: 13, type, vx: type === 'moving' ? (Math.random() < .5 ? 75 : -75) : 0, crumble: 0, dead: false });
    if (Math.random() < .3) gems.push({ x: x + 10 + Math.random() * (w - 20), y: y - 24, r: 9, ph: Math.random() * 6 });
  }

  function reset() {
    camY = 0; lavaY = H - 25; maxHeight = 0; gemCount = 0; milestone = 0; shake = 0;
    player = { x: W/2 - 13, y: H - 100, w: 24, h: 30, vx: 0, vy: 0, onGround: false, face: 1 };
    plats = [{ x: W/2 - 70, y: H - 60, w: 140, h: 14, type: 'solid', vx: 0, crumble: 0, dead: false }];
    gems = [];
    for (let y = H - 140; y > -6000; y -= 72 + Math.random() * 16) addPlat(y);
    embers = Array.from({length: 34}, () => ({ x: Math.random()*W, y: Math.random()*H, r: 1.2 + Math.random()*2.6, s: 22 + Math.random()*48 }));
    sparks = [];
    makeWalls();
    state = 'play';
    scoreEl.textContent = '0m';
    gemsEl.textContent = '0';
    ov.classList.add('hidden');
    audio();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.035, (now - last) / 1000);
    last = now;
    if (state === 'play') update(dt);
    draw(now / 1000);
    requestAnimationFrame(loop);
  }

  function update(dt) {
    const left = keys.ArrowLeft || keys.KeyA || keys.left;
    const right = keys.ArrowRight || keys.KeyD || keys.right;
    const jump = keys.ArrowUp || keys.KeyW || keys.Space || keys.jump;

    if (left) { player.vx = -258; player.face = -1; }
    else if (right) { player.vx = 258; player.face = 1; }
    else player.vx *= .8;

    if (jump && player.onGround) {
      player.vy = -540;
      player.onGround = false;
      tone(280, .12, 'triangle', .05, 480);
    }

    player.vy += 1180 * dt;
    const prevBottom = player.y + player.h;
    player.x += player.vx * dt;
    player.y += player.vy * dt;

    if (player.x < -player.w/2) player.x = W - player.w/2;
    if (player.x > W - player.w/2) player.x = -player.w/2;

    player.onGround = false;
    for (const p of plats) {
      if (p.dead) continue;
      if (p.vx) {
        p.x += p.vx * dt;
        if (p.x < 30 || p.x + p.w > W - 30) p.vx *= -1;
      }
      if (p.crumble > 0) {
        p.crumble += dt;
        if (p.crumble > .45) { p.dead = true; tone(160, .18, 'sawtooth', .05, 60); continue; }
      }
      if (player.vy >= 0 && prevBottom <= p.y + 9 && player.y + player.h >= p.y &&
          player.x + player.w - 4 > p.x && player.x + 4 < p.x + p.w) {
        player.y = p.y - player.h;
        if (p.type === 'spring') {
          player.vy = -760;
          tone(200, .2, 'square', .06, 900);
          for (let k = 0; k < 8; k++) sparks.push({ x: player.x + 12, y: p.y, vx: (Math.random()-.5)*160, vy: -Math.random()*160, t: .35, col: '#7ef3c8' });
        } else {
          if (player.vy > 620) shake = Math.max(shake, 5);
          player.vy = 0;
          player.onGround = true;
          if (p.type === 'crumble' && !p.crumble) p.crumble = .0001;
        }
      }
    }

    const screenY = player.y - camY;
    if (screenY < H * .42) camY = player.y - H * .42;

    let topY = plats.reduce((m, p) => Math.min(m, p.y), Infinity);
    while (topY > camY - 300) { topY -= 72 + Math.random() * 18; addPlat(topY); }
    plats = plats.filter(p => p.y < camY + H + 140);
    gems = gems.filter(g => g.y < camY + H + 140);

    // gem pickups
    for (let i = gems.length - 1; i >= 0; i--) {
      const g = gems[i];
      if (Math.hypot(player.x + 12 - g.x, player.y + 15 - g.y) < 24) {
        gems.splice(i, 1);
        gemCount++;
        gemsEl.textContent = gemCount;
        tone(880, .1, 'triangle', .06, 1320);
        for (let k = 0; k < 10; k++) sparks.push({ x: g.x, y: g.y, vx: (Math.random()-.5)*170, vy: (Math.random()-.5)*170, t: .4, col: '#7ef3c8' });
      }
    }

    const hMeters = Math.max(0, Math.floor((H - 100 - player.y) / 15)) + gemCount * 4;
    if (hMeters > maxHeight) {
      maxHeight = hMeters;
      scoreEl.textContent = maxHeight + 'm';
      if (maxHeight > best) {
        best = maxHeight;
        bestEl.textContent = best + 'm';
        localStorage.setItem('volcano_best', String(best));
      }
      const ms = Math.floor(maxHeight / 100);
      if (ms > milestone) { milestone = ms; tone(520, .25, 'square', .05, 1040); }
    }

    const lavaSpeed = 50 + Math.min(120, maxHeight * .4);
    lavaY -= lavaSpeed * dt;
    if (lavaY > camY + H + 40) lavaY = camY + H + 40;

    if (player.y + player.h > lavaY + 4) {
      state = 'over';
      shake = 16;
      tone(300, .6, 'sawtooth', .14, 50);
      for (let k = 0; k < 30; k++) {
        const a = -Math.PI/2 + (Math.random()-.5)*2;
        sparks.push({ x: player.x + 12, y: lavaY, vx: Math.cos(a)*(80+Math.random()*200), vy: Math.sin(a)*(80+Math.random()*200), t: .6, col: k%2 ? '#ff9d47' : '#fde047' });
      }
      setTimeout(() => {
        ovTitle.textContent = 'MELTED!';
        ovSub.innerHTML = 'The magma caught you mid-climb.';
        ovStats.style.display = 'flex';
        ovStats.innerHTML = `<div>Height <b>${maxHeight}m</b></div><div>Ore <b>${gemCount}</b></div><div>Best <b>${best}m</b></div>`;
        startBtn.textContent = 'TRY AGAIN';
        ov.classList.remove('hidden');
      }, 650);
      return;
    }

    for (const e of embers) {
      e.y -= e.s * dt;
      if (e.y < camY - 20) { e.y = camY + H + 10; e.x = Math.random()*W; }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 500 * dt; s.t -= dt;
      if (s.t <= 0) sparks.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 30);
  }

  function drawClimber(x, y, t) {
    const p = player;
    ctx.save();
    ctx.translate(x + p.w/2, y);
    ctx.scale(p.face, 1);
    const run = Math.abs(p.vx) > 40 && p.onGround ? Math.sin(t * 16) * 3 : 0;
    // legs
    ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-3, p.h - 12); ctx.lineTo(-5 - run, p.h); ctx.moveTo(3, p.h - 12); ctx.lineTo(5 + run, p.h); ctx.stroke();
    // body (jacket)
    ctx.fillStyle = '#f97316';
    ctx.beginPath(); ctx.roundRect(-9, 8, 18, 17, 6); ctx.fill();
    ctx.fillStyle = '#c2410c'; ctx.fillRect(-9, 16, 18, 4);
    // head + helmet
    ctx.fillStyle = '#fcd7b0'; ctx.beginPath(); ctx.arc(0, 3, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fde047';
    ctx.beginPath(); ctx.arc(0, 1, 7.5, Math.PI, 0); ctx.fill();
    ctx.fillRect(-8.5, -1, 17, 3);
    ctx.fillStyle = '#fef9c3'; ctx.beginPath(); ctx.arc(4, -3, 2.2, 0, Math.PI*2); ctx.fill(); // headlamp
    // backpack
    ctx.fillStyle = '#475569'; ctx.beginPath(); ctx.roundRect(-13, 10, 5, 12, 2); ctx.fill();
    ctx.restore();
  }

  function draw(t) {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#20090e');
    grad.addColorStop(.6, '#2b0d10');
    grad.addColorStop(1, '#3d120c');
    ctx.fillStyle = grad;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // basalt walls (parallax)
    if (walls.length) {
      ctx.fillStyle = '#180607';
      for (const wseg of walls) {
        const sy = wseg.y - camY * .92;
        if (sy < -50 || sy > H + 50) continue;
        ctx.fillRect(0, sy, wseg.lw, 44);
        ctx.fillRect(W - wseg.rw, sy, wseg.rw, 44);
      }
      ctx.fillStyle = 'rgba(255,120,60,.05)';
      for (const wseg of walls) {
        const sy = wseg.y - camY * .92;
        if (sy < -50 || sy > H + 50) continue;
        ctx.fillRect(wseg.lw - 4, sy, 4, 44);
        ctx.fillRect(W - wseg.rw, sy, 4, 44);
      }
    }

    // embers
    if (embers) {
      for (const e of embers) {
        const ey = e.y - camY;
        if (ey < -10 || ey > H + 10) continue;
        ctx.globalAlpha = .3 + .5 * Math.abs(Math.sin(t * 3 + e.x));
        ctx.fillStyle = '#ffab4a';
        ctx.beginPath(); ctx.arc(e.x, ey, e.r, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // platforms
    if (plats) {
      for (const p of plats) {
        if (p.dead) continue;
        let sy = p.y - camY;
        if (sy < -20 || sy > H + 20) continue;
        let px = p.x;
        if (p.crumble > 0) { px += (Math.random()-.5) * 3; sy += Math.sin(p.crumble * 40) * 1.5; }
        const col = p.type === 'spring' ? '#0f766e' : p.type === 'moving' ? '#b45309' : p.type === 'crumble' ? '#5c4038' : '#6c4f4b';
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.roundRect(px, sy, p.w, p.h, 6); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.18)';
        ctx.fillRect(px + 4, sy + 2, p.w - 8, 3);
        if (p.type === 'spring') {
          ctx.strokeStyle = '#7ef3c8'; ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(px + p.w/2 - 12, sy - 2); ctx.lineTo(px + p.w/2 - 4, sy - 10); ctx.lineTo(px + p.w/2 + 4, sy - 2); ctx.lineTo(px + p.w/2 + 12, sy - 10);
          ctx.stroke();
        }
        if (p.type === 'crumble') {
          ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(px + p.w*.3, sy + 2); ctx.lineTo(px + p.w*.45, sy + 11); ctx.moveTo(px + p.w*.6, sy + 3); ctx.lineTo(px + p.w*.72, sy + 12); ctx.stroke();
        }
      }
    }

    // gems (ore crystals)
    if (gems) {
      for (const g of gems) {
        const gy = g.y - camY + Math.sin(t * 3 + g.ph) * 3;
        if (gy < -20 || gy > H + 20) continue;
        ctx.save(); ctx.translate(g.x, gy); ctx.rotate(Math.sin(t * 2 + g.ph) * .2);
        ctx.fillStyle = '#34d399';
        ctx.shadowColor = '#34d399'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(7, 0); ctx.lineTo(0, 10); ctx.lineTo(-7, 0); ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(3, -2); ctx.lineTo(0, 0); ctx.lineTo(-3, -2); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    // lava
    const ly = (lavaY ?? H - 25) - (camY ?? 0);
    if (ly < H + 60) {
      const glow = ctx.createLinearGradient(0, ly - 60, 0, ly);
      glow.addColorStop(0, 'rgba(255,80,20,0)');
      glow.addColorStop(1, 'rgba(255,120,30,.28)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, Math.max(0, ly - 60), W, 60);
      const lgrad = ctx.createLinearGradient(0, ly, 0, H + 60);
      lgrad.addColorStop(0, '#ffe14d');
      lgrad.addColorStop(.18, '#ff621f');
      lgrad.addColorStop(1, '#9c0d09');
      ctx.fillStyle = lgrad;
      ctx.beginPath();
      ctx.moveTo(0, H + 20);
      for (let x = 0; x <= W; x += 14) {
        const wave = Math.sin(x * .05 + t * 5) * 5 + Math.sin(x * .11 + t * 3.2) * 3;
        ctx.lineTo(x, ly + wave);
      }
      ctx.lineTo(W, H + 20);
      ctx.closePath(); ctx.fill();
      // lava bubbles
      for (let i = 0; i < 6; i++) {
        const bx = ((t * 37 + i * 173) % (W + 40)) - 20;
        const by = ly + 12 + (i % 3) * 12 + Math.sin(t * 4 + i) * 4;
        ctx.fillStyle = 'rgba(255,220,90,.5)';
        ctx.beginPath(); ctx.arc(bx, by, 3 + (i % 3), 0, Math.PI*2); ctx.fill();
      }
    }

    // player
    if (player && state !== 'over') drawClimber(player.x, player.y - camY, t);

    // sparks
    if (sparks) {
      for (const s of sparks) {
        ctx.globalAlpha = Math.max(0, s.t * 2.2);
        ctx.fillStyle = s.col;
        ctx.beginPath(); ctx.arc(s.x, s.y - camY, 3, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // danger vignette when lava near player
    if (state === 'play' && player) {
      const dl = (lavaY - (player.y + player.h)) / 200;
      if (dl < 1) {
        ctx.fillStyle = `rgba(255,40,10,${(1 - Math.max(0, dl)) * .22})`;
        ctx.fillRect(0, 0, W, H);
      }
    }
    ctx.restore();
  }

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    if ((e.code === 'Enter' || e.code === 'Space') && state !== 'play') { e.preventDefault(); startBtn.click(); }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  const bindTouch = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); keys[key] = true; });
    el.addEventListener('pointerup', () => keys[key] = false);
    el.addEventListener('pointercancel', () => keys[key] = false);
    el.addEventListener('pointerleave', () => keys[key] = false);
  };
  bindTouch('btnLeft', 'left');
  bindTouch('btnRight', 'right');
  bindTouch('btnJump', 'jump');
  startBtn.onclick = () => { ovStats.style.display = 'none'; reset(); };
  makeWalls();
  requestAnimationFrame(loop);
})();
</script>
