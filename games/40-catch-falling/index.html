<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
<title>Catch Falling Items</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#101826;
       font-family:system-ui,'Segoe UI',sans-serif;overflow:hidden}
  #wrap{position:relative;line-height:0}
  canvas{display:block;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.55);
         width:min(96vw,72vh,480px);height:auto;touch-action:none}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
           justify-content:center;gap:14px;background:rgba(8,14,28,.74);backdrop-filter:blur(3px);
           border-radius:14px;color:#eaf2ff;text-align:center;line-height:1.4;padding:20px}
  #overlay.hidden{display:none}
  #overlay h1{font-size:30px;margin:0}
  #overlay p{margin:0;max-width:82%;color:#b9c7e2;font-size:15px}
  #final{font-size:20px;font-weight:700;color:#ffd76a;min-height:24px}
  #btn{font:inherit;font-size:17px;font-weight:700;padding:12px 34px;border:0;border-radius:999px;
       background:linear-gradient(180deg,#ffd76a,#f5a623);color:#3a2503;cursor:pointer;
       box-shadow:0 6px 20px rgba(245,166,35,.35);transition:transform .12s}
  #btn:hover{transform:translateY(-2px) scale(1.04)}
  .hint{font-size:12.5px;color:#7f92b8}
</style>

<style>
/*AAA-INJECT-CSS*/
html{touch-action:manipulation}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{touch-action:none}
button,input,select,textarea{touch-action:manipulation}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:2147483000;background:radial-gradient(ellipse at 50% 40%,transparent 58%,rgba(0,0,0,.28) 100%)}
</style>

<script>
/*AAA-INJECT-SFX*/
window.__gsfx = (function(){
  var ctx=null;
  function ac(){ if(ctx===null){var A=window.AudioContext||window.webkitAudioContext;ctx=A?new A():false;} if(ctx&&ctx.state==='suspended')ctx.resume().catch(function(){}); return ctx||null; }
  function ok(){ return localStorage.getItem('aaa_sfx')!=='0'; }
  function tone(f,d,type,v,slide,when){ if(!ok())return; var c=ac(); if(!c)return; try{ var t=c.currentTime+(when||0); var o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d); g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(v||0.08,t+0.012); g.gain.exponentialRampToValueAtTime(0.0006,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.03);}catch(e){} }
  function noise(dur,v,fq,when,type){ if(!ok())return; var c=ac(); if(!c)return; try{ var t=c.currentTime+(when||0),n=Math.floor(c.sampleRate*dur); var b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0); for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n); var s=c.createBufferSource(); s.buffer=b; var f=c.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=fq||1200; var g=c.createGain(); g.gain.value=v||0.1; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);}catch(e){} }
  var api={
    unlock:ac, tone:tone, noise:noise,
    tap:function(){tone(520,0.05,'triangle',0.05);},
    key:function(){tone(680+Math.random()*60,0.035,'triangle',0.04);},
    deal:function(){noise(0.09,0.09,2600,0,'highpass');tone(300,0.06,'sine',0.04);},
    flip:function(){noise(0.07,0.08,3200,0,'highpass');},
    chip:function(){tone(1900,0.04,'square',0.03);tone(2400,0.03,'square',0.025,null,0.03);noise(0.04,0.05,5000,0,'highpass');},
    clack:function(){noise(0.045,0.1,1600);tone(220,0.05,'triangle',0.07,150);},
    step:function(){tone(330,0.04,'triangle',0.045,280);},
    slide:function(){noise(0.08,0.06,900);tone(260,0.07,'sine',0.045,200);},
    pop:function(i){i=i||0;tone(500+i*80,0.07,'sine',0.07,900+i*120);noise(0.03,0.04,3000,0,'highpass');},
    shoot:function(){tone(700,0.09,'sawtooth',0.05,1400);},
    thud:function(){tone(120,0.12,'sine',0.12,60);noise(0.07,0.08,600);},
    sonar:function(){tone(880,0.35,'sine',0.06);tone(880,0.2,'sine',0.03,null,0.18);},
    splash:function(){noise(0.3,0.1,1200);},
    boom:function(){tone(80,0.5,'sine',0.2,35);noise(0.4,0.16,400);},
    coin:function(){tone(1318,0.06,'square',0.05);tone(1760,0.12,'square',0.05,null,0.06);},
    ding:function(){tone(1046,0.15,'triangle',0.07);tone(1568,0.18,'triangle',0.06,null,0.08);},
    good:function(){tone(659,0.08,'triangle',0.06);tone(880,0.1,'triangle',0.06,null,0.06);},
    bad:function(){tone(180,0.12,'square',0.05,120);},
    win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,0.2,'triangle',0.08,null,i*0.09);});},
    lose:function(){[392,330,262,196].forEach(function(f,i){tone(f,0.26,'sawtooth',0.05,f*0.92,i*0.13);});},
    chord:function(){tone(523,0.14,'sine',0.05);tone(659,0.14,'sine',0.045,null,0.01);tone(784,0.16,'sine',0.04,null,0.02);}
  };
  function unl(){ac();}
  window.addEventListener('pointerdown',unl,{passive:true});
  window.addEventListener('keydown',unl);
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest?e.target.closest('button'):null; if(b&&!b.disabled)api.tap();},true);
  return api;
})();
</script>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="overlay">
    <h1 id="ovTitle">Catch Falling Items</h1>
    <p id="ovMsg">Catch falling fruit for +10 points.<br>Avoid the bombs &mdash; you have 3 lives!</p>
    <div id="final"></div>
    <button id="btn">Start</button>
    <p class="hint">Move with mouse, touch, or Left/Right (A/D) keys &middot; Space to start</p>
  </div>
</div>
<script>
(() => {
'use strict';
const canvas  = document.getElementById('game');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovMsg   = document.getElementById('ovMsg');
const finalEl = document.getElementById('final');
const btn     = document.getElementById('btn');

const W = 480, H = 640;
const dpr = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * dpr; canvas.height = H * dpr;
ctx.scale(dpr, dpr);

const BASKET_W = 84, BASKET_Y = H - 78;
const R = 20; // item radius
const FRUITS = ['apple','banana','orange','melon','grapes','strawberry','peach','cherries','pineapple','kiwi'];
const FRUIT_COLOR = { apple:'#ff5a5a', banana:'#ffd94d', orange:'#ffa03d', melon:'#4ecb6b',
  grapes:'#a06de8', strawberry:'#ff4d6d', peach:'#ffb37a', cherries:'#e83e5f',
  pineapple:'#f7c948', kiwi:'#8abf4d' };

function sfx(n, ...a) { try { if (window.__gsfx && __gsfx[n]) __gsfx[n](...a); } catch (e) {} }
if (!ctx.roundRect) ctx.roundRect = function (x, y, w, h, r) {
  this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r);
  this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r);
  this.arcTo(x, y, x + w, y, r); this.closePath();
};

/* ---------- hand-drawn sprites (no emoji) ---------- */
function leaf(x, y, s, rot, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = col || '#3fae5a';
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(5, -7, 11, -5);
  ctx.quadraticCurveTo(8, 2, 0, 0);
  ctx.fill(); ctx.restore();
}
function shine(x, y, r) {
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.beginPath(); ctx.ellipse(x, y, r * .34, r * .2, -.6, 0, 6.283); ctx.fill();
}
function drawFruit(kind, r) {
  ctx.lineWidth = 2;
  switch (kind) {
    case 'apple': {
      const g = ctx.createRadialGradient(-r*.3, -r*.35, r*.15, 0, 0, r*1.05);
      g.addColorStop(0, '#ff8a7a'); g.addColorStop(1, '#d92e2e');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 1, r * .92, 0, 6.283); ctx.fill();
      ctx.strokeStyle = '#5c3a21'; ctx.lineCap = 'round'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(0, -r*.8); ctx.quadraticCurveTo(2, -r*1.05, 4, -r*1.15); ctx.stroke();
      leaf(2, -r*.95, r/16, -.35); shine(-r*.3, -r*.3, r); break;
    }
    case 'banana': {
      ctx.strokeStyle = '#e0a92e'; ctx.lineCap = 'round'; ctx.lineWidth = r * .72;
      ctx.beginPath(); ctx.arc(-r*.05, -r*.35, r*.85, .45, Math.PI - .15); ctx.stroke();
      ctx.strokeStyle = '#ffd94d'; ctx.lineWidth = r * .52;
      ctx.beginPath(); ctx.arc(-r*.05, -r*.42, r*.85, .5, Math.PI - .2); ctx.stroke();
      ctx.fillStyle = '#6b4a1f';
      ctx.beginPath(); ctx.arc(-r*.88, -r*.28, 2.4, 0, 6.283); ctx.arc(r*.78, -r*.16, 2.4, 0, 6.283); ctx.fill();
      break;
    }
    case 'orange': {
      const g = ctx.createRadialGradient(-r*.3, -r*.3, r*.1, 0, 0, r);
      g.addColorStop(0, '#ffc46b'); g.addColorStop(1, '#f07f13');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r*.9, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(180,90,10,.25)';
      for (let i = 0; i < 6; i++) { const a = i * 1.05 + .4;
        ctx.beginPath(); ctx.arc(Math.cos(a)*r*.5, Math.sin(a)*r*.5, 1.4, 0, 6.283); ctx.fill(); }
      leaf(0, -r*.85, r/15, -.2); shine(-r*.3, -r*.32, r); break;
    }
    case 'melon': {
      ctx.fillStyle = '#2f9e4f'; ctx.beginPath(); ctx.arc(0, 0, r*.92, 0, 6.283); ctx.fill();
      ctx.strokeStyle = '#1f7a38'; ctx.lineWidth = 3;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.moveTo(i*r*.5, -r*.85);
        ctx.quadraticCurveTo(i*r*.72, 0, i*r*.5, r*.85); ctx.stroke();
      }
      shine(-r*.3, -r*.35, r); break;
    }
    case 'grapes': {
      ctx.fillStyle = '#9b5de5';
      const off = [[-.42,-.1],[0,-.25],[.42,-.1],[-.24,.3],[.24,.3],[0,.68]];
      for (const [ox, oy] of off) {
        ctx.beginPath(); ctx.arc(ox*r, oy*r, r*.34, 0, 6.283); ctx.fill();
        ctx.fillStyle = '#8a4fd0';
      }
      ctx.fillStyle = '#9b5de5';
      for (const [ox, oy] of off) {
        ctx.fillStyle = 'rgba(255,255,255,.22)';
        ctx.beginPath(); ctx.arc(ox*r-2, oy*r-2, r*.1, 0, 6.283); ctx.fill();
      }
      ctx.strokeStyle = '#5c3a21'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, -r*.55); ctx.lineTo(2, -r*.95); ctx.stroke();
      leaf(3, -r*.9, r/16, -.3); break;
    }
    case 'strawberry': {
      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath(); ctx.moveTo(0, r*.95);
      ctx.quadraticCurveTo(-r*1.05, r*.2, -r*.75, -r*.35);
      ctx.quadraticCurveTo(-r*.4, -r*.9, 0, -r*.75);
      ctx.quadraticCurveTo(r*.4, -r*.9, r*.75, -r*.35);
      ctx.quadraticCurveTo(r*1.05, r*.2, 0, r*.95); ctx.fill();
      ctx.fillStyle = '#ffe08a';
      for (const [ox, oy] of [[-.45,-.1],[0,-.25],[.45,-.1],[-.25,.3],[.25,.3],[0,.6]])
        { ctx.beginPath(); ctx.ellipse(ox*r, oy*r, 1.5, 2.2, 0, 0, 6.283); ctx.fill(); }
      ctx.fillStyle = '#3fae5a';
      for (let i = -2; i <= 2; i++) {
        ctx.save(); ctx.translate(i*r*.18, -r*.72); ctx.rotate(i*.4);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-3.4, -r*.3); ctx.lineTo(3.4, -r*.3);
        ctx.closePath(); ctx.fill(); ctx.restore();
      }
      shine(-r*.28, -r*.3, r); break;
    }
    case 'peach': {
      const g = ctx.createRadialGradient(-r*.25, -r*.3, r*.1, 0, 0, r);
      g.addColorStop(0, '#ffd0a0'); g.addColorStop(1, '#ff8f5e');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r*.9, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(200,90,60,.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -r*.82); ctx.quadraticCurveTo(r*.3, 0, 0, r*.82); ctx.stroke();
      leaf(2, -r*.9, r/14, -.35); shine(-r*.3, -r*.3, r); break;
    }
    case 'cherries': {
      ctx.strokeStyle = '#3f7a3f'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-r*.45, r*.35); ctx.quadraticCurveTo(-r*.2, -r*.6, r*.28, -r*.9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r*.5, r*.3); ctx.quadraticCurveTo(r*.55, -r*.4, r*.28, -r*.9); ctx.stroke();
      for (const cx of [-r*.45, r*.5]) {
        const g = ctx.createRadialGradient(cx-3, r*.45-3, 1, cx, r*.45, r*.48);
        g.addColorStop(0, '#ff7a94'); g.addColorStop(1, '#c9184a');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, r*.45, r*.42, 0, 6.283); ctx.fill();
      }
      shine(-r*.52, r*.32, r*.5); shine(r*.43, r*.32, r*.5); break;
    }
    case 'pineapple': {
      ctx.fillStyle = '#f7c948';
      ctx.beginPath(); ctx.ellipse(0, r*.18, r*.66, r*.78, 0, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(160,110,20,.55)'; ctx.lineWidth = 1.6;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath(); ctx.moveTo(-r*.66, i*r*.3); ctx.lineTo(r*.66, i*r*.3 + r*.3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(r*.66, i*r*.3); ctx.lineTo(-r*.66, i*r*.3 + r*.3); ctx.stroke();
      }
      ctx.fillStyle = '#3fae5a';
      for (let i = -2; i <= 2; i++) {
        ctx.save(); ctx.translate(i*2.5, -r*.55); ctx.rotate(i*.38);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-3.5, -r*.45); ctx.lineTo(3.5, -r*.45);
        ctx.closePath(); ctx.fill(); ctx.restore();
      }
      shine(-r*.2, -r*.05, r*.7); break;
    }
    case 'kiwi': {
      ctx.fillStyle = '#8a6238'; ctx.beginPath(); ctx.arc(0, 0, r*.9, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#8abf4d'; ctx.beginPath(); ctx.arc(0, 0, r*.68, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#eef3d8'; ctx.beginPath(); ctx.arc(0, 0, r*.26, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#3c4a1e';
      for (let i = 0; i < 10; i++) { const a = i * .628;
        ctx.beginPath(); ctx.arc(Math.cos(a)*r*.46, Math.sin(a)*r*.46, 1.3, 0, 6.283); ctx.fill(); }
      break;
    }
    case 'bomb': {
      const g = ctx.createRadialGradient(-r*.3, -r*.3, r*.1, 0, r*.1, r);
      g.addColorStop(0, '#5a5f73'); g.addColorStop(1, '#14161f');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, r*.1, r*.85, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#3a3f52'; ctx.fillRect(-4, -r*.75, 8, 6);
      ctx.strokeStyle = '#c9a05a'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, -r*.75); ctx.quadraticCurveTo(r*.35, -r*1.15, r*.55, -r*1.05); ctx.stroke();
      const sp = performance.now() / 90;
      ctx.fillStyle = (sp | 0) % 2 ? '#ffd23e' : '#ff7847';
      ctx.beginPath(); ctx.arc(r*.55, -r*1.08, 3.4 + Math.sin(sp) * 1.2, 0, 6.283); ctx.fill();
      shine(-r*.28, -r*.18, r); break;
    }
  }
}

function drawBasket(x, y, w) {
  const h = w * .62;
  ctx.save(); ctx.translate(x, y);
  // shadow glow under basket
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#c98d4b'); g.addColorStop(1, '#8a5a28');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-w/2, 0); ctx.lineTo(w/2, 0);
  ctx.lineTo(w*.36, h); ctx.lineTo(-w*.36, h); ctx.closePath(); ctx.fill();
  // weave
  ctx.strokeStyle = 'rgba(70,40,10,.45)'; ctx.lineWidth = 2;
  for (let i = 1; i <= 3; i++) {
    const yy = h * i / 4, ww = w/2 - (w/2 - w*.36) * i / 4;
    ctx.beginPath(); ctx.moveTo(-ww, yy); ctx.lineTo(ww, yy); ctx.stroke();
  }
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(i*w*.19, 2); ctx.lineTo(i*w*.14, h - 2); ctx.stroke();
  }
  // rim
  ctx.fillStyle = '#e8b06a';
  ctx.beginPath(); ctx.roundRect(-w/2 - 4, -7, w + 8, 10, 5); ctx.fill();
  ctx.strokeStyle = '#7a4a1c'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(-w/2 - 4, -7, w + 8, 10, 5); ctx.stroke();
  ctx.restore();
}

function drawHeart(x, y, s, filled) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, 3.2);
  ctx.bezierCurveTo(-5.4, -2.4, -10, 1.4, -10, 5.2);
  ctx.bezierCurveTo(-10, 9.4, -5, 12.2, 0, 16);
  ctx.bezierCurveTo(5, 12.2, 10, 9.4, 10, 5.2);
  ctx.bezierCurveTo(10, 1.4, 5.4, -2.4, 0, 3.2);
  ctx.closePath();
  if (filled) {
    const g = ctx.createLinearGradient(0, -3, 0, 16);
    g.addColorStop(0, '#ff7a94'); g.addColorStop(1, '#e0245e');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1; ctx.stroke();
  } else {
    ctx.fillStyle = 'rgba(20,26,44,.75)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,90,120,.4)'; ctx.lineWidth = 1.2; ctx.stroke();
  }
  ctx.restore();
}

function drawMoon(x, y, r) {
  const t = performance.now() / 1000;
  const g = ctx.createRadialGradient(x, y, r*.3, x, y, r*2.6);
  g.addColorStop(0, 'rgba(255,244,200,.28)'); g.addColorStop(1, 'rgba(255,244,200,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r*2.6, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#f5e9c8';
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#10204a';
  ctx.beginPath(); ctx.arc(x + r*.42, y - r*.18, r*.86, 0, 6.283); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,' + (.5 + .3*Math.sin(t*2)).toFixed(2) + ')';
  ctx.beginPath(); ctx.arc(x - r*.55, y + r*.1, 1.6, 0, 6.283); ctx.fill();
}

let state = 'menu'; // menu | play | over
let score = 0, lives = 3, best = 0;
let elapsed = 0, spawnT = 0, shake = 0, flash = 0;
let items = [], parts = [];
let bx = W / 2, tx = W / 2;
const keys = { l: false, r: false };

try { best = +localStorage.getItem('catchBest') || 0; } catch (e) {}

const stars = Array.from({ length: 70 }, () => ({
  x: Math.random() * W, y: Math.random() * H * .8,
  r: Math.random() * 1.6 + .4, p: Math.random() * 6.28
}));

function reset() {
  score = 0; lives = 3; elapsed = 0; spawnT = 600;
  shake = 0; flash = 0; items = []; parts = [];
  bx = tx = W / 2;
}

function startGame() {
  reset();
  state = 'play';
  overlay.classList.add('hidden');
  btn.blur();
  sfx('good');
}

function gameOver() {
  state = 'over';
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('catchBest', best); } catch (e) {} }
  ovTitle.textContent = 'Game Over';
  finalEl.textContent = 'Score: ' + score + '  ·  Best: ' + best;
  ovMsg.innerHTML = isBest && score > 0 ? 'New best score!' : 'The bomb got you!';
  btn.textContent = 'Play again';
  overlay.classList.remove('hidden');
  sfx('lose');
}

/* ---------- input ---------- */
function ptr(e) {
  const r = canvas.getBoundingClientRect();
  return (e.clientX - r.left) * W / r.width;
}
canvas.addEventListener('pointermove', e => { tx = ptr(e); });
canvas.addEventListener('pointerdown', e => { tx = ptr(e); });

window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.l = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.r = true; e.preventDefault(); }
  else if ((k === ' ' || k === 'Enter') && state !== 'play') { e.preventDefault(); startGame(); }
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false;
});
btn.addEventListener('click', startGame);

/* ---------- game logic ---------- */
function spawn() {
  const bomb = Math.random() < Math.min(.3, .12 + elapsed * .003);
  items.push({
    x: R + Math.random() * (W - 2 * R), y: -R - 10,
    vy: 150 + Math.min(340, elapsed * 6) + Math.random() * 90,
    bomb,
    e: bomb ? 'bomb' : FRUITS[(Math.random() * FRUITS.length) | 0],
    rot: (Math.random() - .5) * .7, vr: (Math.random() - .5) * 3
  });
}

function burst(x, y, c, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = 60 + Math.random() * 260;
    const t = .5 + Math.random() * .4;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120,
                 life: t, t, c, r: 2 + Math.random() * 3 });
  }
}

function update(dt) {
  elapsed += dt;
  const sp = 440;
  if (keys.l) tx -= sp * dt;
  if (keys.r) tx += sp * dt;
  tx = Math.max(BASKET_W / 2, Math.min(W - BASKET_W / 2, tx));
  bx += (tx - bx) * Math.min(1, dt * 20);

  spawnT -= dt * 1000;
  if (spawnT <= 0) { spawn(); spawnT = Math.max(260, 830 - elapsed * 12); }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy * dt; it.rot += it.vr * dt;
    if (it.y > BASKET_Y - 8 && it.y < BASKET_Y + 34 &&
        Math.abs(it.x - bx) < BASKET_W / 2 + R * .45) {
      if (it.bomb) {
        lives--; shake = .4; flash = .45;
        burst(it.x, it.y, '#ff6b5e', 18);
        sfx('boom'); sfx('bad');
        items.splice(i, 1);
        if (lives <= 0) { gameOver(); return; }
      } else {
        score += 10;
        burst(it.x, it.y, FRUIT_COLOR[it.e] || '#ffd76a', 10);
        sfx('pop', Math.min(6, (score / 50) | 0));
        items.splice(i, 1);
      }
      continue;
    }
    if (it.y > H + 40) items.splice(i, 1);
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.vy += 900 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  if (shake > 0) shake -= dt;
  if (flash > 0) flash -= dt;
}

/* ---------- rendering ---------- */
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 24,
                               (Math.random() - .5) * shake * 24);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d1631'); g.addColorStop(.65, '#22457c'); g.addColorStop(1, '#2f5aa0');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);

  const tw = performance.now() / 500;
  ctx.fillStyle = '#cfe0ff';
  for (const s of stars) {
    ctx.globalAlpha = .25 + .55 * (0.5 + 0.5 * Math.sin(tw + s.p));
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  drawMoon(W - 56, 52, 20);

  for (const it of items) {
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
    ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
    drawFruit(it.e, R);
    ctx.restore();
  }

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
  drawBasket(bx, BASKET_Y - 6, BASKET_W);
  ctx.restore();

  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.t);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,60,50,' + (flash * .35).toFixed(3) + ')';
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  ctx.font = '700 22px system-ui,sans-serif';
  ctx.textAlign = 'left'; ctx.fillStyle = '#eaf2ff';
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1;
  ctx.fillText('Score  ' + score, 16, 34);
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  for (let i = 0; i < 3; i++) drawHeart(W - 30 - i * 26, 22, 1, i < lives);

  ctx.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
