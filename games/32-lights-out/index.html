<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lights Out</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at top, #1b2735 0%, #090a0f 100%);
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #e8e6e3;
    user-select: none;
    padding: 20px;
  }

  h1 {
    font-size: 2.2rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 6px;
    color: #ffd76a;
    text-shadow: 0 0 18px rgba(255, 200, 60, 0.45);
  }

  .subtitle {
    font-size: 0.85rem;
    color: #8b93a1;
    margin-bottom: 20px;
    letter-spacing: 0.05em;
  }

  #status {
    display: flex;
    gap: 24px;
    align-items: center;
    margin-bottom: 18px;
    font-size: 1rem;
  }

  #moves {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 6px 14px;
    border-radius: 8px;
    font-variant-numeric: tabular-nums;
  }

  #restart {
    background: rgba(255, 215, 106, 0.12);
    border: 1px solid rgba(255, 215, 106, 0.5);
    color: #ffd76a;
    padding: 7px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  #restart:hover { background: rgba(255, 215, 106, 0.25); }
  #restart:active { transform: scale(0.96); }

  #board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    padding: 14px;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
  }

  .cell {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: background 0.18s, box-shadow 0.18s, transform 0.08s;
  }
  .cell:active { transform: scale(0.92); }

  .cell.on {
    background: radial-gradient(circle at 35% 30%, #fff3c4, #ffd23e 55%, #e8a713);
    box-shadow: 0 0 18px 4px rgba(255, 200, 50, 0.55), inset 0 -3px 6px rgba(120, 70, 0, 0.4);
  }
  .cell.off {
    background: linear-gradient(145deg, #232830, #161a20);
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.7), inset 0 -1px 2px rgba(255,255,255,0.05);
  }

  #win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 12, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #win-overlay.show { display: flex; }

  #win-card {
    background: #141a22;
    border: 1px solid rgba(255, 215, 106, 0.4);
    border-radius: 16px;
    padding: 36px 48px;
    text-align: center;
    box-shadow: 0 0 60px rgba(255, 200, 60, 0.25);
    animation: pop 0.3s ease-out;
  }
  @keyframes pop {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  #win-card h2 {
    color: #ffd76a;
    font-size: 1.8rem;
    margin-bottom: 10px;
    text-shadow: 0 0 14px rgba(255, 200, 60, 0.5);
  }
  #win-card p { color: #aab2c0; margin-bottom: 22px; }

  #win-restart {
    background: #ffd76a;
    color: #1a1405;
    border: none;
    font-weight: 600;
    font-size: 1rem;
    padding: 10px 28px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.15s;
  }
  #win-restart:hover { box-shadow: 0 0 20px rgba(255, 215, 106, 0.5); }
  #win-restart:active { transform: scale(0.95); }

  @media (max-width: 480px) {
    .cell { width: 52px; height: 52px; }
    #board { gap: 8px; }
  }
</style>

<style>
/*AAA-INJECT-CSS*/
html{touch-action:manipulation}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{touch-action:none}
button,input,select,textarea{touch-action:manipulation}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:2147483000;background:radial-gradient(ellipse at 50% 40%,transparent 58%,rgba(0,0,0,.28) 100%)}
</style>

<script>
/*AAA-INJECT-SFX*/
window.__gsfx = (function(){
  var ctx=null;
  function ac(){ if(ctx===null){var A=window.AudioContext||window.webkitAudioContext;ctx=A?new A():false;} if(ctx&&ctx.state==='suspended')ctx.resume().catch(function(){}); return ctx||null; }
  function ok(){ return localStorage.getItem('aaa_sfx')!=='0'; }
  function tone(f,d,type,v,slide,when){ if(!ok())return; var c=ac(); if(!c)return; try{ var t=c.currentTime+(when||0); var o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d); g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(v||0.08,t+0.012); g.gain.exponentialRampToValueAtTime(0.0006,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.03);}catch(e){} }
  function noise(dur,v,fq,when,type){ if(!ok())return; var c=ac(); if(!c)return; try{ var t=c.currentTime+(when||0),n=Math.floor(c.sampleRate*dur); var b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0); for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n); var s=c.createBufferSource(); s.buffer=b; var f=c.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=fq||1200; var g=c.createGain(); g.gain.value=v||0.1; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);}catch(e){} }
  var api={
    unlock:ac, tone:tone, noise:noise,
    tap:function(){tone(520,0.05,'triangle',0.05);},
    key:function(){tone(680+Math.random()*60,0.035,'triangle',0.04);},
    deal:function(){noise(0.09,0.09,2600,0,'highpass');tone(300,0.06,'sine',0.04);},
    flip:function(){noise(0.07,0.08,3200,0,'highpass');},
    chip:function(){tone(1900,0.04,'square',0.03);tone(2400,0.03,'square',0.025,null,0.03);noise(0.04,0.05,5000,0,'highpass');},
    clack:function(){noise(0.045,0.1,1600);tone(220,0.05,'triangle',0.07,150);},
    step:function(){tone(330,0.04,'triangle',0.045,280);},
    slide:function(){noise(0.08,0.06,900);tone(260,0.07,'sine',0.045,200);},
    pop:function(i){i=i||0;tone(500+i*80,0.07,'sine',0.07,900+i*120);noise(0.03,0.04,3000,0,'highpass');},
    shoot:function(){tone(700,0.09,'sawtooth',0.05,1400);},
    thud:function(){tone(120,0.12,'sine',0.12,60);noise(0.07,0.08,600);},
    sonar:function(){tone(880,0.35,'sine',0.06);tone(880,0.2,'sine',0.03,null,0.18);},
    splash:function(){noise(0.3,0.1,1200);},
    boom:function(){tone(80,0.5,'sine',0.2,35);noise(0.4,0.16,400);},
    coin:function(){tone(1318,0.06,'square',0.05);tone(1760,0.12,'square',0.05,null,0.06);},
    ding:function(){tone(1046,0.15,'triangle',0.07);tone(1568,0.18,'triangle',0.06,null,0.08);},
    good:function(){tone(659,0.08,'triangle',0.06);tone(880,0.1,'triangle',0.06,null,0.06);},
    bad:function(){tone(180,0.12,'square',0.05,120);},
    win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,0.2,'triangle',0.08,null,i*0.09);});},
    lose:function(){[392,330,262,196].forEach(function(f,i){tone(f,0.26,'sawtooth',0.05,f*0.92,i*0.13);});},
    chord:function(){tone(523,0.14,'sine',0.05);tone(659,0.14,'sine',0.045,null,0.01);tone(784,0.16,'sine',0.04,null,0.02);}
  };
  function unl(){ac();}
  window.addEventListener('pointerdown',unl,{passive:true});
  window.addEventListener('keydown',unl);
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest?e.target.closest('button'):null; if(b&&!b.disabled)api.tap();},true);
  return api;
})();
</script>
</head>
<body>

<h1>Lights Out</h1>
<p class="subtitle">Click a light to toggle it and its neighbors. Turn them all off.</p>

<div id="status">
  <div id="moves">Moves: <span id="move-count">0</span> &middot; Lv <span id="level-n">1</span></div>
  <button id="restart">Restart</button>
</div>

<div id="board"></div>

<div id="win-overlay">
  <div id="win-card">
    <h2>You Win!</h2>
    <p>Solved in <span id="final-moves">0</span> moves.</p>
    <button id="win-restart">Play Again</button>
  </div>
</div>

<script>
(function () {
  var SIZE = 5;
  var board = document.getElementById('board');
  var moveCountEl = document.getElementById('move-count');
  var winOverlay = document.getElementById('win-overlay');
  var finalMovesEl = document.getElementById('final-moves');

  var lights = [];  // 25 booleans, row-major
  var cells = [];
  var moves = 0;
  var gameOver = false;
  var level = 1, bestMoves = 0;
  try { level = +localStorage.getItem('lo_level') || 1; } catch (e) {}
  try { bestMoves = +localStorage.getItem('lo_best') || 0; } catch (e) {}
  document.getElementById('level-n').textContent = level;

  function idx(r, c) { return r * SIZE + c; }

  function toggleAt(r, c) {
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return;
    var i = idx(r, c);
    lights[i] = !lights[i];
  }

  function press(r, c) {
    toggleAt(r, c);
    toggleAt(r - 1, c);
    toggleAt(r + 1, c);
    toggleAt(r, c - 1);
    toggleAt(r, c + 1);
  }

  function render() {
    for (var i = 0; i < lights.length; i++) {
      cells[i].className = 'cell ' + (lights[i] ? 'on' : 'off');
    }
  }

  function checkWin() {
    for (var i = 0; i < lights.length; i++) {
      if (lights[i]) return false;
    }
    return true;
  }

  function newGame() {
    lights = [];
    for (var i = 0; i < SIZE * SIZE; i++) lights.push(false);

    // Generate a solvable puzzle by pressing random cells from a blank board.
    var presses = Math.min(6 + level * 2, 18) + Math.floor(Math.random() * 4);
    for (var p = 0; p < presses; p++) {
      press(Math.floor(Math.random() * SIZE), Math.floor(Math.random() * SIZE));
    }
    // Edge case: random presses can cancel out to an empty board — redo.
    if (checkWin()) return newGame();

    moves = 0;
    gameOver = false;
    moveCountEl.textContent = '0';
    winOverlay.classList.remove('show');
    render();
  }

  function onCellClick(r, c) {
    if (gameOver) return;
    press(r, c);
    moves++;
    moveCountEl.textContent = String(moves);
    render();
    if (window.__gsfx) {
      var lit = 0;
      for (var i = 0; i < lights.length; i++) if (lights[i]) lit++;
      __gsfx.tone(240 + lit * 22, 0.09, 'triangle', 0.06, 200 + lit * 22);
      __gsfx.chord();
    }
    if (checkWin()) {
      gameOver = true;
      var rec = '';
      if (!bestMoves || moves < bestMoves) {
        bestMoves = moves;
        try { localStorage.setItem('lo_best', bestMoves); } catch (e) {}
        rec = ' NEW BEST!';
      }
      level++;
      try { localStorage.setItem('lo_level', level); } catch (e) {}
      document.getElementById('level-n').textContent = level;
      finalMovesEl.textContent = String(moves);
      document.getElementById('win-card').querySelector('p').innerHTML =
        'Solved in <b>' + moves + '</b> moves (best ' + bestMoves + ').' + rec;
      if (window.__gsfx) { __gsfx.win(); if (rec) __gsfx.coin(); }
      setTimeout(function () { winOverlay.classList.add('show'); }, 250);
    }
  }

  // Build the grid once.
  for (var r = 0; r < SIZE; r++) {
    for (var c = 0; c < SIZE; c++) {
      (function (row, col) {
        var btn = document.createElement('button');
        btn.className = 'cell off';
        btn.setAttribute('aria-label', 'light ' + (idx(row, col) + 1));
        btn.addEventListener('click', function () { onCellClick(row, col); });
        board.appendChild(btn);
        cells.push(btn);
      })(r, c);
    }
  }

  document.getElementById('restart').addEventListener('click', newGame);
  document.getElementById('win-restart').addEventListener('click', newGame);

  newGame();
})();
</script>


<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
