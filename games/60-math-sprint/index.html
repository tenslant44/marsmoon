<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Math Sprint</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1000px 640px at 50% -14%, rgba(46,196,182,.14), transparent 62%),
      radial-gradient(820px 560px at 90% 112%, rgba(230,57,70,.10), transparent 60%),
      radial-gradient(circle at 50% 42%, #34365a 0%, #23243a 75%);
    color: #fff;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    display: flex;
    flex-direction: column;
  }

  /* ---- time bar ---- */
  #timebar {
    height: 8px;
    background: rgba(255,255,255,0.12);
    flex: none;
  }
  #timefill {
    height: 100%;
    width: 100%;
    background: #2ec4b6;
    transition: background 0.2s;
  }
  #timefill.low { background: #e63946; }

  /* ---- HUD ---- */
  #hud {
    flex: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px 4px;
    font-size: clamp(15px, 2.4vw, 20px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .hud-item { min-width: 90px; position: relative; }
  .hud-item.mid { text-align: center; }
  .hud-item.right { text-align: right; }
  .hud-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.55;
  }
  #streak.hot { color: #ffb703; text-shadow: 0 0 14px rgba(255,183,3,.6); }
  #streak .flame { width: .8em; height: .8em; vertical-align: -0.1em; }
  #level { color: #8ecae6; text-shadow: 0 0 12px rgba(142,202,230,.5); }

  /* floating +N popup */
  .float-pts {
    position: absolute;
    top: 100%;
    left: 0;
    font-size: 16px;
    font-weight: 800;
    color: #2ec4b6;
    animation: floatUp 0.7s ease-out forwards;
    pointer-events: none;
  }
  .float-pts.neg { color: #e63946; }
  @keyframes floatUp {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-26px); }
  }

  /* ---- play area ---- */
  #stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 16px;
  }
  #equation {
    font-size: clamp(52px, 13vw, 120px);
    font-weight: 800;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
    text-align: center;
    transition: transform 0.1s, color 0.1s;
  }
  #equation .q { opacity: 0.45; }
  #stage.flash-good #equation { color: #2ec4b6; transform: scale(1.06); }
  #stage.flash-bad  #equation { color: #e63946; animation: shake 0.18s; }
  @keyframes shake {
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  #answers {
    display: grid;
    grid-template-columns: repeat(2, minmax(130px, 220px));
    gap: 14px;
    width: min(92vw, 480px);
  }
  .ans {
    font-family: inherit;
    font-size: clamp(24px, 5.5vw, 40px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #fff;
    background: linear-gradient(160deg, rgba(255,255,255,0.13), rgba(255,255,255,0.06));
    border: 2px solid rgba(255,255,255,0.18);
    border-radius: 14px;
    padding: 18px 8px;
    cursor: pointer;
    transition: transform 0.06s, background 0.06s, box-shadow 0.12s;
    box-shadow: 0 6px 18px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.08);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .ans:hover { background: rgba(255,255,255,0.16); box-shadow: 0 8px 22px rgba(0,0,0,.3), 0 0 18px rgba(46,196,182,.12); }
  .ans:active { transform: scale(0.95); }
  .ans.good { background: linear-gradient(160deg,#35d8c8,#1fae9f); border-color: #2ec4b6; box-shadow: 0 0 24px rgba(46,196,182,.5); }
  .ans.bad  { background: linear-gradient(160deg,#f0566a,#c92a3d); border-color: #e63946; box-shadow: 0 0 24px rgba(230,57,70,.5); }
  .ans .key {
    display: block;
    font-size: 11px;
    font-weight: 600;
    opacity: 0.45;
    margin-bottom: 2px;
  }

  /* ---- overlay screens ---- */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(20,22,39,0.94);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    padding: 24px;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #ov-title {
    font-size: clamp(38px, 8vw, 72px);
    font-weight: 900;
    letter-spacing: 1px;
    filter: drop-shadow(0 0 26px rgba(46,196,182,.3));
  }
  #ov-title .accent { color: #2ec4b6; text-shadow: 0 0 22px rgba(46,196,182,.55); }
  #ov-body {
    font-size: clamp(15px, 2.8vw, 20px);
    opacity: 0.85;
    line-height: 1.6;
    max-width: 560px;
  }
  #ov-stats {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat {
    background: rgba(255,255,255,0.09);
    border-radius: 12px;
    padding: 12px 22px;
    min-width: 110px;
  }
  .stat .v { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.55; }
  #ov-btn {
    font-family: inherit;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 15px 42px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(160deg,#35d8c8,#189a8d);
    color: #0a1a18;
    cursor: pointer;
    transition: transform 0.08s, filter 0.12s;
    box-shadow: 0 8px 26px rgba(46,196,182,.35), inset 0 1px 0 rgba(255,255,255,.35);
    touch-action: manipulation;
  }
  #ov-btn:hover { transform: scale(1.05); filter: brightness(1.08); }
  .hint { font-size: 13px; opacity: 0.5; }

  /* level-up toast */
  #toast {
    position: fixed;
    top: 18%;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(22px, 4.5vw, 36px);
    font-weight: 800;
    color: #ffb703;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  #toast.show { animation: toastPop 0.9s ease-out; }
  @keyframes toastPop {
    0%   { opacity: 0; transform: translateX(-50%) scale(0.6); }
    20%  { opacity: 1; transform: translateX(-50%) scale(1.1); }
    40%  { transform: translateX(-50%) scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>

<div id="timebar"><div id="timefill"></div></div>

<div id="hud">
  <div class="hud-item"><span class="hud-label">Score</span><span id="score">0</span><span id="floatAnchor"></span></div>
  <div class="hud-item mid"><span class="hud-label">Level</span><span id="level">1</span></div>
  <div class="hud-item right"><span class="hud-label">Streak</span><span id="streak">0</span></div>
</div>

<div id="stage">
  <div id="equation">3 + 4 = <span class="q">?</span></div>
  <div id="answers"></div>
</div>

<div id="toast"></div>

<div id="overlay">
  <div id="ov-title">Math <span class="accent">Sprint</span></div>
  <div id="ov-body">
    Solve as many problems as you can in <b>60 seconds</b>.<br>
    Difficulty ramps up every 15s &middot; correct answers build a streak bonus &middot;
    wrong answers cost <b>2 seconds</b>.
  </div>
  <div id="ov-stats"></div>
  <button id="ov-btn">Start</button>
  <div class="hint">Click an answer or press keys 1&ndash;4 &middot; Enter to start</div>
</div>

<script>
(function () {
  var DURATION = 60000;
  var PENALTY = 2000;
  var LEVEL_AT = [0, 15000, 30000, 45000];

  var scoreEl = document.getElementById('score');
  var streakEl = document.getElementById('streak');
  var levelEl = document.getElementById('level');
  var eqEl = document.getElementById('equation');
  var answersEl = document.getElementById('answers');
  var stageEl = document.getElementById('stage');
  var fillEl = document.getElementById('timefill');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title');
  var ovBody = document.getElementById('ov-body');
  var ovStats = document.getElementById('ov-stats');
  var ovBtn = document.getElementById('ov-btn');
  var toastEl = document.getElementById('toast');
  var scoreHud = document.querySelector('.hud-item');

  var score, streak, bestStreak, correct, answered;
  var endTime, timerId, lock, current, level;
  var bestScore = loadBest();

  function loadBest() {
    try { return parseInt(localStorage.getItem('mathSprintBest'), 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('mathSprintBest', String(v)); } catch (e) {}
  }

  function rnd(n) { return Math.floor(Math.random() * n); }
  function pick(arr) { return arr[rnd(arr.length)]; }

  /* ---- question generation: difficulty scales with elapsed time ---- */
  function makeQuestion(lv) {
    var a, b, op, ans;
    if (lv === 0) {            // small add/sub
      op = pick(['+', '+', '-']);
      a = 2 + rnd(11); b = 2 + rnd(11);
      if (op === '-' && b > a) { var t = a; a = b; b = t; }
      ans = op === '+' ? a + b : a - b;
    } else if (lv === 1) {     // bigger add/sub, easy multiply
      op = pick(['+', '-', 'x', 'x']);
      if (op === 'x') { a = 2 + rnd(6); b = 2 + rnd(6); ans = a * b; }
      else {
        a = 5 + rnd(21); b = 3 + rnd(18);
        if (op === '-' && b > a) { var t2 = a; a = b; b = t2; }
        ans = op === '+' ? a + b : a - b;
      }
    } else if (lv === 2) {     // times tables, division, two-digit add/sub
      op = pick(['x', 'x', '/', '+', '-']);
      if (op === 'x') { a = 3 + rnd(10); b = 3 + rnd(10); ans = a * b; }
      else if (op === '/') { b = 2 + rnd(8); ans = 2 + rnd(11); a = b * ans; }
      else {
        a = 15 + rnd(46); b = 12 + rnd(39);
        if (op === '-' && b > a) { var t3 = a; a = b; b = t3; }
        ans = op === '+' ? a + b : a - b;
      }
    } else {                   // lv 3: everything bigger
      op = pick(['x', '/', '+', '-']);
      if (op === 'x') { a = pick([11 + rnd(9), 12 + rnd(14)]); b = 3 + rnd(7); ans = a * b; }
      else if (op === '/') { b = 3 + rnd(10); ans = 6 + rnd(15); a = b * ans; }
      else {
        a = 40 + rnd(60); b = 25 + rnd(75);
        if (op === '-' && b > a) { var t4 = a; a = b; b = t4; }
        ans = op === '+' ? a + b : a - b;
      }
    }
    var glyph = { '+': '+', '-': '−', 'x': '×', '/': '÷' }[op];
    return { text: a + ' ' + glyph + ' ' + b, ans: ans };
  }

  function makeChoices(ans) {
    var set = {}, out = [ans];
    set[ans] = true;
    var offsets = [1, -1, 2, -2, 3, -3, 10, -10, 5, -5, 11, -11, 4, -4, 20, -20];
    var guard = 0;
    while (out.length < 4 && guard++ < 200) {
      var c = ans + pick(offsets);
      if (out.length === 3 && Math.random() < 0.3) c = ans * 2 + pick([1, -1, 0]);
      if (!set[c]) { set[c] = true; out.push(c); }
    }
    while (out.length < 4) { c = ans + 20 + out.length * 7; if (!set[c]) { set[c] = true; out.push(c); } }
    // shuffle
    for (var i = out.length - 1; i > 0; i--) {
      var j = rnd(i + 1), tmp = out[i]; out[i] = out[j]; out[j] = tmp;
    }
    return out;
  }

  function levelFor(elapsed) {
    var lv = 0;
    for (var i = 0; i < LEVEL_AT.length; i++) if (elapsed >= LEVEL_AT[i]) lv = i;
    return lv;
  }

  function nextQuestion() {
    var elapsed = DURATION - (endTime - Date.now());
    var lv = levelFor(Math.max(0, elapsed));
    if (lv !== level) {
      level = lv;
      levelEl.textContent = lv + 1;
      showToast('Level ' + (lv + 1) + ' — faster!');
      if (window.AAA) AAA.sfx.level();
    }
    current = makeQuestion(lv);
    eqEl.innerHTML = current.text + ' = <span class="q">?</span>';
    var choices = makeChoices(current.ans);
    answersEl.innerHTML = '';
    choices.forEach(function (c, i) {
      var btn = document.createElement('button');
      btn.className = 'ans';
      btn.dataset.val = c;
      btn.innerHTML = '<span class="key">' + (i + 1) + '</span>' + c;
      btn.addEventListener('pointerdown', function (e) { e.preventDefault(); answer(btn); });
      answersEl.appendChild(btn);
    });
    lock = false;
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.remove('show');
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
  }

  function floatPts(text, neg) {
    var el = document.createElement('span');
    el.className = 'float-pts' + (neg ? ' neg' : '');
    el.textContent = text;
    scoreHud.appendChild(el);
    setTimeout(function () { el.remove(); }, 750);
  }

  function flash(good) {
    stageEl.classList.remove('flash-good', 'flash-bad');
    void stageEl.offsetWidth;
    stageEl.classList.add(good ? 'flash-good' : 'flash-bad');
    setTimeout(function () { stageEl.classList.remove('flash-good', 'flash-bad'); }, 200);
  }

  var FLAME_SVG = '<svg class="flame" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1c1 3-3 4.5-3 8a3.5 3.5 0 0 0 7 0c0-2-1.2-3-1.7-4.2C9.4 5.6 9 3.6 8 1z" fill="#fb923c"/><path d="M8.6 8c.9 1 .4 2.6-.6 3.2 1.9-.3 2.7-1.9 2.1-3.4-.3 1-1 1.2-1.5.2z" fill="#fde047"/></svg>';

  function updateHud() {
    scoreEl.textContent = score;
    if (streak >= 5) {
      if (streakEl.dataset.flame !== '1') { streakEl.dataset.flame = '1'; streakEl.innerHTML = FLAME_SVG + ' <span id="streakN"></span>'; }
      document.getElementById('streakN').textContent = streak;
    } else {
      if (streakEl.dataset.flame === '1') { streakEl.dataset.flame = ''; streakEl.textContent = ''; }
      streakEl.textContent = streak;
    }
    streakEl.classList.toggle('hot', streak >= 5);
  }

  function answer(btn) {
    if (lock) return;
    lock = true;
    answered++;
    var good = btn.dataset.val === String(current.ans);
    var buttons = answersEl.children;
    for (var k = 0; k < buttons.length; k++) {
      if (buttons[k].dataset.val === String(current.ans)) buttons[k].classList.add('good');
    }
    if (good) {
      var pts = 10 + level * 5 + Math.min(streak, 10) * 2;
      score += pts;
      streak++;
      if (streak > bestStreak) bestStreak = streak;
      correct++;
      flash(true);
      floatPts('+' + pts, false);
      if (window.AAA) { AAA.sfx.coin(); if (streak > 0 && streak % 5 === 0) { AAA.sfx.power(); AAA.flash(0.1); } }
    } else {
      btn.classList.add('bad');
      streak = 0;
      endTime = Math.max(Date.now() + 500, endTime - PENALTY);
      flash(false);
      floatPts('-2s', true);
      if (window.AAA) AAA.sfx.error();
    }
    updateHud();
    setTimeout(nextQuestion, good ? 160 : 420);
  }

  var lastTickSec = -1;
  function tick() {
    var left = endTime - Date.now();
    if (left <= 0) { finish(); return; }
    var pct = left / DURATION * 100;
    fillEl.style.width = pct + '%';
    fillEl.classList.toggle('low', left < 10000);
    var sec = Math.ceil(left / 1000);
    if (left < 10500 && sec !== lastTickSec) {
      lastTickSec = sec;
      if (window.AAA && sec <= 10) AAA.sfx.tick();
    }
    timerId = setTimeout(tick, 50);
  }

  function start() {
    score = 0; streak = 0; bestStreak = 0; correct = 0; answered = 0; level = 0;
    lastTickSec = -1;
    levelEl.textContent = '1';
    endTime = Date.now() + DURATION;
    overlay.classList.add('hidden');
    fillEl.classList.remove('low');
    fillEl.style.width = '100%';
    updateHud();
    nextQuestion();
    tick();
  }

  function finish() {
    clearTimeout(timerId);
    var newBest = score > bestScore;
    if (newBest) { bestScore = score; saveBest(score); }
    if (window.AAA) { if (newBest) { AAA.sfx.win(); AAA.flash(0.25); } else AAA.sfx.over(); }
    var acc = answered ? Math.round(correct / answered * 100) : 0;
    ovTitle.innerHTML = 'Time<span class="accent">!</span>';
    ovBody.innerHTML =
      'You solved <b>' + correct + '</b> of <b>' + answered + '</b> problems.';
    ovStats.innerHTML =
      '<div class="stat"><div class="v">' + score + '</div><div class="k">Score</div></div>' +
      '<div class="stat"><div class="v">' + bestStreak + '</div><div class="k">Best streak</div></div>' +
      '<div class="stat"><div class="v">' + acc + '%</div><div class="k">Accuracy</div></div>' +
      '<div class="stat"><div class="v">' + bestScore + '</div><div class="k">Best score</div></div>';
    ovStats.style.display = 'flex';
    ovBtn.textContent = 'Play again';
    overlay.classList.remove('hidden');
  }

  ovBtn.addEventListener('click', start);

  window.addEventListener('keydown', function (e) {
    if (!overlay.classList.contains('hidden')) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); }
      return;
    }
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4) {
      var btn = answersEl.children[n - 1];
      if (btn) answer(btn);
    }
  });
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
