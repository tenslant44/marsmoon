<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Whack-a-Mole</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(124,214,116,.16), transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(90,160,255,.12), transparent 50%),
      linear-gradient(160deg, #16241c 0%, #0b1410 70%);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
    padding: 14px;
  }

  h1 {
    font-size: clamp(1.5rem, 6vw, 2.1rem);
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(124,214,116,.5);
    font-weight: 800;
  }
  h1 span { color: #7cd674; }

  .hud {
    display: flex;
    gap: 12px;
    margin-bottom: 6px;
    font-size: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .hud .stat {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 12px;
    padding: 6px 14px;
    min-width: 84px;
    text-align: center;
    box-shadow: inset 0 0 14px rgba(0,0,0,.3);
  }
  .hud .label { display:block; font-size: .62rem; text-transform: uppercase; letter-spacing: 1.5px; color: #8fd8a8; }
  .hud .value { font-weight: 700; font-variant-numeric: tabular-nums; }
  #time { color: #ffd166; }

  .misses { display: flex; gap: 5px; margin-bottom: 12px; }
  .miss-dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); transition: all .3s; }
  .miss-dot.lost { background: #ff5f7a; border-color: #ff8ea1; box-shadow: 0 0 10px rgba(255,95,122,.7); }

  #grid {
    display: grid;
    grid-template-columns: repeat(3, min(26vw, 124px));
    gap: min(3vw, 18px);
    cursor: none;
  }
  @media (pointer: coarse) { #grid { cursor: default; } }

  .hole {
    position: relative;
    aspect-ratio: 1;
    overflow: visible;
    cursor: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (pointer: coarse) { .hole { cursor: default; } }

  .hole .dirt {
    position: absolute;
    left: 8%; right: 8%; bottom: 6%;
    height: 34%;
    background:
      radial-gradient(ellipse at 50% 0%, #6b4a2f 0%, #4a2f1c 60%, #33200f 100%);
    border-radius: 50%;
    box-shadow: inset 0 8px 14px rgba(0,0,0,.65), 0 4px 10px rgba(0,0,0,.4);
    z-index: 3;
    pointer-events: none;
  }
  .hole .rim {
    position: absolute;
    left: 4%; right: 4%; bottom: 2%;
    height: 40%;
    background: radial-gradient(ellipse at 50% 30%, #7cd674 0%, #4a8a3f 70%);
    border-radius: 50%;
    box-shadow: 0 4px 12px rgba(0,0,0,.35);
    z-index: 1;
    pointer-events: none;
  }

  .mole {
    position: absolute;
    left: 14%;
    right: 14%;
    bottom: 22%;
    height: 78%;
    transform: translateY(105%);
    transition: transform .16s ease-in;
    z-index: 2;
    pointer-events: none;
  }
  .mole.up {
    transform: translateY(0);
    transition: transform .14s cubic-bezier(.2,1.6,.4,1);
    pointer-events: auto;
  }
  .mole svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  .mole.bonked { transform: translateY(105%); transition: transform .1s ease-in; }

  .bonk {
    position: absolute;
    left: 50%; top: 12%;
    width: 60%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 5;
    pointer-events: none;
    animation: bonkAnim .45s ease-out forwards;
  }
  @keyframes bonkAnim {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 1; }
    30% { transform: translate(-50%, -50%) scale(1.3) rotate(10deg); opacity: 1; }
    100% { transform: translate(-50%, -70%) scale(1) rotate(25deg); opacity: 0; }
  }

  /* Mallet cursor follows the pointer */
  #mallet {
    position: fixed;
    width: 64px; height: 64px;
    pointer-events: none;
    z-index: 50;
    transform: translate(-30%, -30%) rotate(-35deg);
    transform-origin: 75% 80%;
    transition: transform .07s;
    display: none;
    filter: drop-shadow(0 5px 6px rgba(0,0,0,.5));
  }
  #mallet.swing { transform: translate(-30%, -30%) rotate(-100deg); }
  @media (pointer: coarse) { #mallet { display: none !important; } }

  #startOverlay, #overOverlay {
    position: fixed; inset: 0;
    background: rgba(6,10,8,.8);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 40;
  }
  .box {
    background: linear-gradient(160deg, #22392b, #0e1a12);
    border: 1px solid rgba(124,214,116,.4);
    border-radius: 20px;
    padding: 34px 42px;
    text-align: center;
    box-shadow: 0 24px 70px rgba(0,0,0,.7), 0 0 40px rgba(124,214,116,.15);
    animation: rise .35s ease;
    max-width: 92vw;
  }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .box h2 { font-size: clamp(1.6rem, 6vw, 2.1rem); margin-bottom: 10px; color: #7cd674; text-shadow: 0 0 22px rgba(124,214,116,.5); }
  .box p { color: #c8dfc8; margin-bottom: 10px; font-size: 1.02rem; line-height: 1.5; }
  .box .best-line { color: #8fd8a8; font-size: .85rem; margin-bottom: 20px; }
  .box .newbest { color: #ffd166; font-weight: 800; text-shadow: 0 0 14px rgba(255,209,102,.6); }
  .box button {
    background: linear-gradient(135deg, #7cd674, #4fae4a);
    color: #0b1410; border: none; border-radius: 999px;
    padding: 13px 36px; font-size: 1.1rem; font-weight: 800; cursor: pointer;
    box-shadow: 0 0 22px rgba(124,214,116,.4), 0 3px 0 #357a30;
    transition: transform .12s;
  }
  .box button:hover { transform: scale(1.05); }
  .box button:active { transform: translateY(2px); }
</style>
</head>
<body>

<div id="mallet">
  <svg viewBox="0 0 64 64">
    <rect x="30" y="26" width="9" height="36" rx="4" fill="#a06b3a" transform="rotate(30 34 44)"/>
    <rect x="8" y="8" width="34" height="22" rx="8" fill="#c98a4d" stroke="#8a5a2f" stroke-width="2" transform="rotate(30 25 19)"/>
    <rect x="10" y="11" width="30" height="6" rx="3" fill="rgba(255,255,255,.28)" transform="rotate(30 25 19)"/>
  </svg>
</div>

<h1>WHACK-A-<span>MOLE</span></h1>
<div class="hud">
  <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
  <div class="stat"><span class="label">Time</span><span class="value" id="time">30</span></div>
  <div class="stat"><span class="label">Best</span><span class="value" id="best">0</span></div>
</div>
<div class="misses" id="misses"></div>
<div id="grid"></div>

<div id="startOverlay">
  <div class="box">
    <h2>WHACK-A-MOLE</h2>
    <p>Bonk the moles before they hide!<br>Golden moles are worth 3 points.<br>Bombs cost you 2 — don't hit them.<br>Miss 3 moles and it's over.</p>
    <p class="best-line" id="startBest"></p>
    <button id="startBtn">Start (Space)</button>
  </div>
</div>

<div id="overOverlay" style="display:none">
  <div class="box">
    <h2>GAME OVER</h2>
    <p id="overStats"></p>
    <p class="best-line" id="overBest"></p>
    <button id="againBtn">Play Again</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var grid = document.getElementById('grid');
  var scoreEl = document.getElementById('score');
  var timeEl = document.getElementById('time');
  var bestEl = document.getElementById('best');
  var missesEl = document.getElementById('misses');
  var mallet = document.getElementById('mallet');
  var startOverlay = document.getElementById('startOverlay');
  var overOverlay = document.getElementById('overOverlay');
  var overStats = document.getElementById('overStats');
  var overBest = document.getElementById('overBest');
  var startBest = document.getElementById('startBest');

  var GAME_LEN = 30;
  var MAX_MISS = 3;

  var score = 0, timeLeft = GAME_LEN, misses = 0, hits = 0, peeks = 0;
  var playing = false;
  var peekTimer = null, clockTimer = null, hideTimer = null;
  var activeMole = null, activeType = 'normal';

  var best = 0;
  try { best = parseInt(localStorage.getItem('whack_best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;
  startBest.textContent = best > 0 ? 'Best score: ' + best : '';

  var MOLE_SVG =
    '<svg viewBox="0 0 64 64">' +
    '<ellipse cx="20" cy="14" rx="8" ry="9" fill="#8a5a3a"/><ellipse cx="44" cy="14" rx="8" ry="9" fill="#8a5a3a"/>' +
    '<ellipse cx="20" cy="15" rx="4" ry="5" fill="#d8a878"/><ellipse cx="44" cy="15" rx="4" ry="5" fill="#d8a878"/>' +
    '<ellipse cx="32" cy="34" rx="24" ry="26" fill="#a06b42"/>' +
    '<ellipse cx="32" cy="30" rx="20" ry="20" fill="#bb8256"/>' +
    '<circle cx="24" cy="27" r="4" fill="#221"/><circle cx="40" cy="27" r="4" fill="#221"/>' +
    '<circle cx="25.4" cy="25.6" r="1.3" fill="#fff"/><circle cx="41.4" cy="25.6" r="1.3" fill="#fff"/>' +
    '<ellipse cx="32" cy="34" rx="5.5" ry="4" fill="#e88a9a"/>' +
    '<rect x="27" y="39" width="4.6" height="6.5" rx="1.6" fill="#fff" stroke="#ccb" stroke-width="0.6"/>' +
    '<rect x="32.4" y="39" width="4.6" height="6.5" rx="1.6" fill="#fff" stroke="#ccb" stroke-width="0.6"/>' +
    '<path d="M12 34 L24 36 M12 40 L24 39 M52 34 L40 36 M52 40 L40 39" stroke="#5f3f28" stroke-width="1.6" stroke-linecap="round"/>' +
    '</svg>';

  var GOLD_SVG = MOLE_SVG
    .replace(/#a06b42/g, '#e8b83f').replace(/#bb8256/g, '#f2d06b')
    .replace('</svg>', '<circle cx="32" cy="6" r="4" fill="#fff3b0" opacity="0.9"/></svg>');

  var BOMB_SVG =
    '<svg viewBox="0 0 64 64">' +
    '<circle cx="32" cy="38" r="22" fill="#2b2f38" stroke="#14161c" stroke-width="2"/>' +
    '<ellipse cx="24" cy="30" rx="6" ry="4" fill="rgba(255,255,255,.22)" transform="rotate(-25 24 30)"/>' +
    '<rect x="28" y="13" width="8" height="6" rx="2" fill="#555"/>' +
    '<path d="M32 13 C32 8 36 5 41 6" stroke="#8a6a3a" stroke-width="3" fill="none" stroke-linecap="round"/>' +
    '<path d="M41 2 L43 6 L47 6 L44 8.5 L45.5 12.5 L41 10 L36.5 12.5 L38 8.5 L35 6 L39 6 Z" fill="#ffd94d"/>' +
    '</svg>';

  var STAR_SVG =
    '<svg viewBox="0 0 64 64"><path d="M32 8 L38 24 L56 26 L41 37 L46 55 L32 45 L18 55 L23 37 L8 26 L26 24 Z" fill="#ffd94d" stroke="#b8860b" stroke-width="2" stroke-linejoin="round"/></svg>';

  for (var i = 0; i < 9; i++) {
    var hole = document.createElement('div');
    hole.className = 'hole';
    hole.innerHTML = '<div class="rim"></div><div class="mole">' + MOLE_SVG + '</div><div class="dirt"></div>';
    grid.appendChild(hole);
  }
  var holes = Array.prototype.slice.call(grid.querySelectorAll('.hole'));
  var moles = holes.map(function (h) { return h.querySelector('.mole'); });

  for (var m = 0; m < MAX_MISS; m++) {
    var d = document.createElement('div');
    d.className = 'miss-dot';
    missesEl.appendChild(d);
  }
  var missDots = missesEl.querySelectorAll('.miss-dot');

  // ---------- audio ----------
  var ACX = null;
  function ac() {
    try {
      if (!ACX) ACX = new (window.AudioContext || window.webkitAudioContext)();
      if (ACX.state === 'suspended') ACX.resume();
    } catch (e) {}
    return ACX;
  }
  function tone(f, d, type, v, slide, delay) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + (delay || 0);
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v || 0.05, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + d + 0.03);
    } catch (e) {}
  }
  function noiseSfx(d, v, type, f) {
    var c = ac(); if (!c) return;
    var t = c.currentTime;
    var len = Math.floor(c.sampleRate * d);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var ch = buf.getChannelData(0);
    for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = c.createBufferSource(); src.buffer = buf;
    var fl = c.createBiquadFilter(); fl.type = type || 'lowpass'; fl.frequency.value = f || 800;
    var g = c.createGain(); g.gain.setValueAtTime(v || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(fl); fl.connect(g); g.connect(c.destination); src.start(t);
  }
  var sfx = {
    bonk:   function () { tone(300, 0.09, 'square', 0.08, 140); noiseSfx(0.07, 0.06, 'lowpass', 600); },
    gold:   function () { tone(660, 0.08, 'triangle', 0.07); tone(880, 0.1, 'triangle', 0.07, null, 0.06); tone(1320, 0.14, 'sine', 0.06, null, 0.12); },
    bomb:   function () { noiseSfx(0.4, 0.14, 'lowpass', 350); tone(120, 0.35, 'sawtooth', 0.07, 55); },
    miss:   function () { tone(190, 0.12, 'sawtooth', 0.04, 130); },
    pop:    function () { tone(430 + Math.random() * 120, 0.05, 'sine', 0.035, 620); },
    start:  function () { [330, 440, 550].forEach(function (f, i) { tone(f, 0.09, 'triangle', 0.06, null, i * 0.07); }); },
    over:   function () { [440, 370, 300, 220].forEach(function (f, i) { tone(f, 0.18, 'sawtooth', 0.05, null, i * 0.12); }); },
    tick:   function () { tone(900, 0.05, 'sine', 0.05); }
  };
  var bgm = {
    t: null, step: 0,
    bass: [98, 98, 130.8, 98, 98, 146.8, 130.8, 82.4],
    start: function () { this.stop(); this.step = 0; var s = this; this.t = setInterval(function () { s.tickB(); }, 300); },
    tickB: function () {
      var c = ac(); if (!c || c.state !== 'running') return;
      try { if (localStorage.getItem('aaa_bgm') === '1') return; } catch (e) {}
      var n = this.bass[this.step++ % 8];
      tone(n, 0.2, 'triangle', 0.045);
      if (this.step % 4 === 0) tone(n * 4, 0.09, 'sine', 0.018);
    },
    stop: function () { if (this.t) clearInterval(this.t); this.t = null; }
  };

  // ---------- mallet cursor ----------
  grid.addEventListener('pointermove', function (e) {
    mallet.style.display = 'block';
    mallet.style.left = e.clientX + 'px';
    mallet.style.top = e.clientY + 'px';
  });
  grid.addEventListener('pointerleave', function () { mallet.style.display = 'none'; });
  grid.addEventListener('pointerdown', function () {
    mallet.classList.add('swing');
    setTimeout(function () { mallet.classList.remove('swing'); }, 90);
  });

  function moleSvgFor(type) {
    return type === 'gold' ? GOLD_SVG : type === 'bomb' ? BOMB_SVG : MOLE_SVG;
  }

  function peekInterval() {
    // difficulty ramp: faster as time runs out and score grows
    var base = 900 - Math.min(320, (GAME_LEN - timeLeft) * 9) - Math.min(180, score * 2.2);
    return Math.max(420, base);
  }

  function hideMole() {
    if (activeMole) {
      activeMole.mole.classList.remove('up');
      activeMole = null;
    }
  }

  function spawnMole() {
    if (!playing) return;
    hideMole();
    var idx = Math.floor(Math.random() * holes.length);
    var roll = Math.random();
    activeType = roll < 0.12 ? 'gold' : roll < 0.26 ? 'bomb' : 'normal';
    activeMole = holes[idx];
    var mole = activeMole.mole;
    mole.innerHTML = moleSvgFor(activeType);
    mole.dataset.type = activeType;
    mole.classList.add('up');
    peeks++;
    sfx.pop();
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      if (activeMole && activeType !== 'bomb' && mole.classList.contains('up')) {
        // mole escaped unhit
        misses++;
        updateMisses();
        sfx.miss();
      }
      hideMole();
    }, Math.max(650, peekInterval() * 0.9));
    peekTimer = setTimeout(spawnMole, peekInterval());
  }

  function updateMisses() {
    for (var i = 0; i < missDots.length; i++) {
      missDots[i].classList.toggle('lost', i < misses);
    }
    if (misses >= MAX_MISS) endGame();
  }

  function onHoleDown(e) {
    if (!playing) return;
    var mole = e.target.closest('.mole');
    if (!mole || !mole.classList.contains('up')) return;
    e.preventDefault();
    var type = mole.dataset.type;
    var bonk = document.createElement('div');
    bonk.className = 'bonk';
    bonk.innerHTML = STAR_SVG;
    mole.parentElement.appendChild(bonk);
    setTimeout(function () { bonk.remove(); }, 500);
    if (type === 'bomb') {
      score = Math.max(0, score - 2);
      sfx.bomb();
      flashMole(mole, '#ff5f7a');
    } else {
      var pts = type === 'gold' ? 3 : 1;
      score += pts;
      hits++;
      if (type === 'gold') sfx.gold(); else sfx.bonk();
      flashMole(mole, type === 'gold' ? '#ffd94d' : '#7cd674');
    }
    mole.classList.add('bonked');
    mole.classList.remove('up');
    if (activeMole && activeMole.mole === mole) activeMole = null;
    scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; }
  }

  function flashMole(mole, color) {
    mole.style.filter = 'drop-shadow(0 0 14px ' + color + ')';
    setTimeout(function () { mole.style.filter = ''; }, 300);
  }

  grid.addEventListener('pointerdown', onHoleDown);

  function startGame() {
    ac();
    score = 0; timeLeft = GAME_LEN; misses = 0; hits = 0; peeks = 0;
    scoreEl.textContent = '0';
    timeEl.textContent = timeLeft;
    updateMisses();
    playing = true;
    startOverlay.style.display = 'none';
    overOverlay.style.display = 'none';
    sfx.start();
    bgm.start();
    spawnMole();
    clockTimer = setInterval(function () {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 3 && timeLeft > 0) sfx.tick();
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    if (!playing) return;
    playing = false;
    hideMole();
    clearTimeout(peekTimer);
    clearInterval(clockTimer);
    clearTimeout(hideTimer);
    bgm.stop();
    try { localStorage.setItem('whack_best', String(best)); } catch (e) {}
    overStats.textContent = 'Score: ' + score + ' — ' + hits + ' moles bonked.';
    var isBest = score >= best && score > 0;
    overBest.innerHTML = isBest ? '<span class="newbest">NEW BEST!</span>' : 'Best: ' + best;
    sfx.over();
    overOverlay.style.display = 'flex';
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (startOverlay.style.display !== 'none') { startGame(); }
      else if (overOverlay.style.display !== 'none') { startGame(); }
      e.preventDefault();
    }
  });
})();
</script>


<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
