<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Math Blocks</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;color:#fff;font-family:system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:12px;
    background:
      radial-gradient(900px 620px at 50% -10%, rgba(6,95,70,.4), transparent 60%),
      radial-gradient(700px 500px at 92% 110%, rgba(10,40,60,.5), transparent 60%),
      #0f172a;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    position:relative;width:min(480px,100%);
    background:rgba(21,30,48,.92);border:1px solid rgba(94,234,212,.2);
    border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;
    box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 60px -18px rgba(45,212,191,.3);
    backdrop-filter:blur(8px);
  }
  .hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
  .box{background:rgba(6,12,24,.8);padding:7px 4px;border-radius:12px;font-weight:800;font-size:.62rem;color:#7f93b8;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,255,255,.08)}
  .box b{display:block;font-size:1.25rem;color:#38bdf8;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
  .box .t{color:#fde047;text-shadow:0 0 10px rgba(253,224,71,.5)}
  .box .s{color:#4ade80;text-shadow:0 0 10px rgba(74,222,128,.5)}
  .box .tm{color:#fda4af;text-shadow:0 0 10px rgba(253,164,175,.5)}
  .grid{
    display:grid;grid-template-columns:repeat(6,1fr);gap:7px;
    background:rgba(6,12,24,.8);padding:10px;border-radius:14px;
    border:1px solid rgba(255,255,255,.08);touch-action:none;user-select:none;
  }
  .cell{
    position:relative;aspect-ratio:1;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:clamp(1rem,4.6vw,1.35rem);cursor:pointer;
    border:2px solid transparent;color:#0f172a;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.35);
    transition:transform .1s,box-shadow .1s;
  }
  @media (hover:hover){ .cell:hover{transform:scale(1.06)} }
  .cell.sel{
    border-color:#fff;transform:scale(.92);
    box-shadow:0 0 16px rgba(255,255,255,.6),inset 0 -4px 0 rgba(0,0,0,.28);
  }
  .cell.sel::after{
    content:'';position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;
    background:#fff;box-shadow:0 0 6px #fff;
  }
  .cell.pop{animation:cellPop .35s cubic-bezier(.3,1.6,.5,1)}
  @keyframes cellPop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  .cell.vanish{animation:vanish .22s ease forwards}
  @keyframes vanish{to{transform:scale(.1);opacity:0}}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:#a8b6d8;font-weight:700}
  .bar span{flex:1}
  button{padding:9px 14px;border:none;border-radius:10px;font-weight:900;cursor:pointer;font-family:inherit;font-size:.8rem}
  .b-clr{background:#334155;color:#fff}
  .b-res{background:linear-gradient(135deg,#2dd4bf,#38bdf8);color:#04121f;box-shadow:0 8px 20px -8px rgba(45,212,191,.55)}
  button:active{transform:scale(.95)}
  .ov{
    position:absolute;inset:0;border-radius:20px;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:22px;gap:14px;
    background:radial-gradient(ellipse at 50% 40%, rgba(15,60,60,.6), rgba(8,12,24,.95) 75%);
    backdrop-filter:blur(5px);transition:opacity .3s,visibility .3s;
  }
  .ov.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .title{
    font-size:clamp(2rem,8vw,3rem);font-weight:900;letter-spacing:.04em;line-height:.95;
    background:linear-gradient(180deg,#fff,#5eead4 45%,#0d9488);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(45,212,191,.5));
  }
  .ov p{color:#b7d5d0;max-width:330px;font-size:.92rem;line-height:1.55}
  .statline{display:flex;gap:18px;font-weight:800;font-size:1.02rem}
  .statline b{color:#fde047}
  .btn{
    padding:13px 36px;border:none;border-radius:999px;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg,#2dd4bf,#38bdf8);color:#04121f;
    font-weight:900;font-size:1rem;letter-spacing:.05em;
    box-shadow:0 12px 30px -8px rgba(45,212,191,.6),inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .12s;
  }
  .btn:active{transform:scale(.96)}
  .hint{font-size:.75rem;color:#5f8a85;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="box">Target<b class="t" id="target">10</b></div>
    <div class="box">Sum<b class="s" id="sum">0</b></div>
    <div class="box">Score<b id="score">0</b></div>
    <div class="box">Time<b class="tm" id="time">90s</b></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="bar">
    <span id="msg">Drag across touching blocks to hit the target!</span>
    <div style="display:flex;gap:6px">
      <button class="b-clr" id="clrBtn">Clear</button>
      <button class="b-res" id="resBtn">Restart</button>
    </div>
  </div>
  <div class="ov" id="ov">
    <h1 class="title" id="ovT">MATH<br>BLOCKS</h1>
    <p id="ovP">Drag a chain through adjacent number blocks that adds up to the <b style="color:#fde047">TARGET</b>. Longer chains pay more. 90 seconds on the clock!</p>
    <div class="statline" id="ovStats" style="display:none"></div>
    <button class="btn" id="startBtn">START</button>
    <div class="hint">Works with mouse drag or finger swipe</div>
  </div>
</div>
<script>
(() => {
  const ROWS = 6, COLS = 6;
  const COLS_HEX = ['','#f87171','#fb923c','#fde047','#4ade80','#2dd4bf','#60a5fa','#818cf8','#c084fc','#f472b6'];
  const gridEl = document.getElementById('grid'), targetEl = document.getElementById('target'), sumEl = document.getElementById('sum'), scoreEl = document.getElementById('score'), msgEl = document.getElementById('msg'), timeEl = document.getElementById('time');
  const ov = document.getElementById('ov'), ovT = document.getElementById('ovT'), ovP = document.getElementById('ovP'), ovStats = document.getElementById('ovStats'), startBtn = document.getElementById('startBtn'), clrBtn = document.getElementById('clrBtn');

  let ac = null;
  const audio = () => { const A = window.AudioContext || window.webkitAudioContext; if (!ac && A) ac = new A(); if (ac && ac.state === 'suspended') ac.resume().catch(()=>{}); return ac; };
  const sfxOn = () => localStorage.getItem('aaa_sfx') !== '0';
  function tone(f, d, type='sine', vol=0.06, slide=null){
    if (!sfxOn()) return; const x = audio(); if (!x) return;
    try {
      const t = x.currentTime, o = x.createOscillator(), g = x.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
      g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0006, t + d);
      o.connect(g); g.connect(x.destination); o.start(t); o.stop(t + d + 0.03);
    } catch {}
  }

  let best = Number(localStorage.getItem('mathblocks_best') || 0);
  let board = [], selected = [], target = 10, score = 0, timeLeft = 90, timer = null, playing = false, dragging = false, clears = 0;

  const rndVal = () => 1 + Math.floor(Math.random()*9);
  const key = (r, c) => r + ',' + c;

  function newTarget() {
    target = 10 + Math.floor(Math.random()*9);
    targetEl.textContent = target;
  }

  function buildDom() {
    gridEl.innerHTML = '';
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const d = document.createElement('div');
      d.className = 'cell'; d.dataset.r = r; d.dataset.c = c;
      gridEl.appendChild(d);
    }
  }
  const cellEl = (r, c) => gridEl.children[r * COLS + c];

  function render(selSet) {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const d = cellEl(r, c), v = board[r][c];
      const sel = selSet && selSet.has(key(r, c));
      d.className = 'cell' + (sel ? ' sel' : '');
      d.style.background = v > 0 ? COLS_HEX[v] : 'transparent';
      d.textContent = v > 0 ? v : '';
      d.style.pointerEvents = v > 0 ? '' : 'none';
    }
  }

  function init() {
    board = Array.from({ length: ROWS }, () => Array.from({ length: COLS }, rndVal));
    selected = []; score = 0; clears = 0; timeLeft = 90; playing = true;
    scoreEl.textContent = '0'; timeEl.textContent = '90s';
    msgEl.textContent = 'Drag across touching blocks to hit the target!';
    newTarget();
    render();
    ov.classList.add('hidden');
    audio();
    clearInterval(timer);
    timer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = Math.max(0, timeLeft) + 's';
      if (timeLeft <= 10 && timeLeft > 0) tone(440, .06, 'square', .04);
      if (timeLeft <= 0) {
        clearInterval(timer);
        playing = false;
        const isRec = score > best;
        if (isRec) { best = score; localStorage.setItem('mathblocks_best', String(best)); }
        ovT.textContent = 'TIME UP!';
        ovP.innerHTML = isRec ? 'A new personal best!' : 'Blocks tallied.';
        ovStats.style.display = 'flex';
        ovStats.innerHTML = `<div>Score <b>${score}</b></div><div>Clears <b>${clears}</b></div><div>Best <b>${best}</b></div>`;
        startBtn.textContent = 'PLAY AGAIN';
        ov.classList.remove('hidden');
        tone(300, .5, 'sine', .09, 80);
      }
    }, 1000);
  }

  const isAdj = (a, b) => Math.abs(a.r - b.r) <= 1 && Math.abs(a.c - b.c) <= 1 && !(a.r === b.r && a.c === b.c);
  const selSum = () => selected.reduce((s, p) => s + board[p.r][p.c], 0);

  function paintSelection() {
    const selSet = new Set(selected.map(p => key(p.r, p.c)));
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const d = cellEl(r, c);
      d.classList.toggle('sel', selSet.has(key(r, c)));
    }
    sumEl.textContent = selSum();
  }

  function applyGravityAndRefill() {
    const popped = [];
    for (let c = 0; c < COLS; c++) {
      const col = [];
      for (let r = ROWS - 1; r >= 0; r--) if (board[r][c] > 0) col.push(board[r][c]);
      while (col.length < ROWS) col.push(rndVal());
      for (let r = ROWS - 1, idx = 0; r >= 0; r--, idx++) {
        const nv = col[idx];
        if (board[r][c] !== nv) popped.push([r, c]);
        board[r][c] = nv;
      }
    }
    render();
    for (const [r, c] of popped) {
      const d = cellEl(r, c);
      d.classList.add('pop');
    }
  }

  function commit() {
    const total = selSum();
    if (total === target && selected.length >= 2) {
      const pts = target * selected.length;
      score += pts; clears++;
      scoreEl.textContent = score;
      msgEl.textContent = `+${pts} · ${selected.length}-block chain!`;
      const vanish = [...selected];
      tone(520 + Math.min(400, selected.length * 60), .14, 'triangle', .08, 900);
      for (const p of vanish) cellEl(p.r, p.c).classList.add('vanish');
      setTimeout(() => {
        for (const p of vanish) board[p.r][p.c] = 0;
        applyGravityAndRefill();
      }, 180);
      selected = [];
      newTarget();
    } else if (total > target) {
      msgEl.textContent = 'Over the target — chain released.';
      tone(200, .1, 'sine', .05, 140);
      selected = [];
    } else if (selected.length > 0) {
      msgEl.textContent = `${total} — need ${target - total} more.`;
    }
    sumEl.textContent = selSum();
    paintSelection();
  }

  function addCell(r, c) {
    if (board[r][c] <= 0) return;
    const idx = selected.findIndex(s => s.r === r && s.c === c);
    if (idx !== -1) {
      // backtracking over the path trims it
      if (idx < selected.length - 1) {
        selected = selected.slice(0, idx + 1);
        tone(300 + selected.length * 40, .04, 'sine', .035);
        paintSelection();
      }
      return;
    }
    if (selected.length === 0 || isAdj(selected[selected.length - 1], { r, c })) {
      selected.push({ r, c });
      tone(300 + Math.min(500, selSum() * 24), .05, 'sine', .045);
      paintSelection();
      const total = selSum();
      if (total === target && selected.length >= 2) commit();
      else if (total > target) { /* keep drawing until release */ }
    }
  }

  const cellFromPoint = (x, y) => {
    const el = document.elementFromPoint(x, y);
    if (!el || !el.classList || !el.classList.contains('cell')) return null;
    return { r: +el.dataset.r, c: +el.dataset.c };
  };

  gridEl.addEventListener('pointerdown', e => {
    if (!playing) return;
    e.preventDefault();
    const cell = cellFromPoint(e.clientX, e.clientY);
    if (!cell) return;
    dragging = true;
    try { gridEl.setPointerCapture(e.pointerId); } catch {}
    selected = [];
    addCell(cell.r, cell.c);
  });
  gridEl.addEventListener('pointermove', e => {
    if (!dragging || !playing) return;
    const cell = cellFromPoint(e.clientX, e.clientY);
    if (cell) addCell(cell.r, cell.c);
  });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    commit();
  };
  gridEl.addEventListener('pointerup', endDrag);
  gridEl.addEventListener('pointercancel', () => { dragging = false; selected = []; paintSelection(); });
  window.addEventListener('pointerup', endDrag);

  clrBtn.onclick = () => { selected = []; paintSelection(); };
  document.getElementById('resBtn').onclick = init;
  startBtn.onclick = () => { ovStats.style.display = 'none'; init(); };
  buildDom();
  board = Array.from({ length: ROWS }, () => Array.from({ length: COLS }, rndVal));
  render();
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
