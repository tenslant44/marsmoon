<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tic Tac Toe — vs AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse at 25% 0%, rgba(90,255,220,.12), transparent 50%),
      radial-gradient(ellipse at 85% 100%, rgba(255,90,200,.12), transparent 55%),
      linear-gradient(160deg, #141a2e 0%, #0a0d1a 70%);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }

  h1 {
    font-size: clamp(1.5rem, 6vw, 2.1rem);
    letter-spacing: 3px;
    font-weight: 800;
    margin-bottom: 10px;
    text-shadow: 0 0 22px rgba(90,255,220,.3);
  }
  h1 span { color: #5affdc; }

  .scoreboard { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
  .scoreboard .stat {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 12px;
    padding: 7px 16px;
    min-width: 80px;
    text-align: center;
    box-shadow: inset 0 0 14px rgba(0,0,0,.3);
  }
  .stat .label { display: block; font-size: .6rem; text-transform: uppercase; letter-spacing: 1.5px; color: #8fa3d8; }
  .stat .value { font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  #winsX .value { color: #5affdc; }
  #winsO .value { color: #ff9de2; }

  .diff-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .diff {
    background: rgba(255,255,255,.07);
    color: #cdd8f0;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px;
    padding: 7px 18px;
    font-size: .88rem;
    font-weight: 700;
    cursor: pointer;
    transition: all .15s;
  }
  .diff.active { background: linear-gradient(135deg, #5affdc, #3fd8b8); color: #0a1512; box-shadow: 0 0 16px rgba(90,255,220,.45); }

  #status {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 14px;
    min-height: 1.5em;
    letter-spacing: .5px;
  }
  #status .x { color: #5affdc; }
  #status .o { color: #ff9de2; }
  #status .thinking::after { content: '…'; animation: dots 1s steps(3) infinite; display: inline-block; width: 1.2em; text-align: left; }
  @keyframes dots { 0% { content: '·'; } 50% { content: '··'; } 100% { content: '···'; } }

  #board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, min(27vw, 116px));
    grid-template-rows: repeat(3, min(27vw, 116px));
    gap: 8px;
    background: rgba(255,255,255,.05);
    padding: 8px;
    border-radius: 16px;
    box-shadow: 0 18px 50px rgba(0,0,0,.55), inset 0 0 24px rgba(0,0,0,.35);
  }

  .cell {
    background: linear-gradient(145deg, #232c4a, #171e33);
    border: 1px solid rgba(140,170,255,.15);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) {
    .cell:not(.taken):hover { background: linear-gradient(145deg, #2e3a60, #202a48); border-color: rgba(140,190,255,.35); }
  }
  .cell.taken { cursor: default; }
  .cell svg { width: 72%; height: 72%; overflow: visible; }
  .cell .markX path, .cell .markO circle {
    stroke-dasharray: 130;
    stroke-dashoffset: 130;
    animation: draw .28s ease forwards;
  }
  .cell .markO circle { stroke-dasharray: 200; stroke-dashoffset: 200; animation-duration: .32s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .cell.winner { animation: winPulse .7s ease infinite alternate; }
  @keyframes winPulse {
    from { box-shadow: 0 0 8px rgba(90,255,220,.3); }
    to { box-shadow: 0 0 26px rgba(90,255,220,.75), inset 0 0 14px rgba(90,255,220,.25); }
  }

  #strike {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  #strike line {
    stroke: #ffd166;
    stroke-width: 7;
    stroke-linecap: round;
    filter: drop-shadow(0 0 8px rgba(255,209,102,.9));
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
  }
  #strike.show line { animation: strikeDraw .4s ease forwards; }
  @keyframes strikeDraw { to { stroke-dashoffset: 0; } }

  #againBtn {
    margin-top: 16px;
    background: linear-gradient(135deg, #5affdc, #3fd8b8);
    color: #0a1512;
    border: none;
    border-radius: 999px;
    padding: 11px 30px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(90,255,220,.4), 0 3px 0 #249a80;
    transition: transform .12s;
    opacity: 0;
    pointer-events: none;
  }
  #againBtn.show { opacity: 1; pointer-events: auto; }
  #againBtn:hover { transform: scale(1.05); }

  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
</style>
</head>
<body>

<h1>TIC TAC TOE <span>vs AI</span></h1>
<div class="scoreboard">
  <div class="stat" id="winsX"><span class="label">You (X)</span><span class="value" id="sX">0</span></div>
  <div class="stat"><span class="label">Draws</span><span class="value" id="sD">0</span></div>
  <div class="stat" id="winsO"><span class="label">AI (O)</span><span class="value" id="sO">0</span></div>
</div>
<div class="diff-row">
  <button class="diff" data-diff="easy">Easy</button>
  <button class="diff" data-diff="medium">Medium</button>
  <button class="diff active" data-diff="hard">Unbeatable</button>
</div>
<div id="status"></div>
<div id="board">
  <svg id="strike" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="0" y2="0"/></svg>
</div>
<button id="againBtn">Play Again</button>
<canvas id="fx"></canvas>

<script>
(function () {
  'use strict';

  var board = document.getElementById('board');
  var strike = document.getElementById('strike');
  var strikeLine = strike.querySelector('line');
  var statusEl = document.getElementById('status');
  var againBtn = document.getElementById('againBtn');
  var sX = document.getElementById('sX'), sD = document.getElementById('sD'), sO = document.getElementById('sO');
  var fx = document.getElementById('fx');
  var fxCtx = fx.getContext('2d');

  var cells = [];
  var state = [];
  var over = false, aiThinking = false;
  var diff = 'hard';
  var scores = { x: 0, o: 0, d: 0 };
  try { scores = JSON.parse(localStorage.getItem('ttt_scores') || 'null') || scores; } catch (e) {}

  var X_SVG = '<svg viewBox="0 0 100 100"><g class="markX" stroke="#5affdc" stroke-width="11" stroke-linecap="round" filter="drop-shadow(0 0 7px rgba(90,255,220,.8))"><path d="M22 22 L78 78"/><path d="M78 22 L22 78"/></g></svg>';
  var O_SVG = '<svg viewBox="0 0 100 100"><g class="markO" fill="none" stroke="#ff9de2" stroke-width="11" filter="drop-shadow(0 0 7px rgba(255,157,226,.8))"><circle cx="50" cy="50" r="31"/></g></svg>';

  for (var i = 0; i < 9; i++) {
    var el = document.createElement('div');
    el.className = 'cell';
    el.dataset.i = i;
    board.insertBefore(el, strike);
    cells.push(el);
  }

  // ---------- audio ----------
  var ACX = null;
  function ac() {
    try {
      if (!ACX) ACX = new (window.AudioContext || window.webkitAudioContext)();
      if (ACX.state === 'suspended') ACX.resume();
    } catch (e) {}
    return ACX;
  }
  function tone(f, d, type, v, slide, delay) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + (delay || 0);
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v || 0.05, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + d + 0.03);
    } catch (e) {}
  }
  var sfx = {
    placeX: function () { tone(520, 0.08, 'triangle', 0.06, 700); tone(1040, 0.07, 'sine', 0.04, null, 0.04); },
    placeO: function () { tone(340, 0.09, 'triangle', 0.055, 240); },
    win:    function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.16, 'triangle', 0.07, null, i * 0.09); }); },
    lose:   function () { [392, 330, 262, 196].forEach(function (f, i) { tone(f, 0.18, 'sawtooth', 0.05, null, i * 0.12); }); },
    draw:   function () { tone(392, 0.12, 'sine', 0.05); tone(392, 0.12, 'sine', 0.05, null, 0.16); },
    reset:  function () { tone(660, 0.07, 'sine', 0.05, 880); }
  };
  var bgm = {
    t: null, step: 0,
    seq: [196, 0, 233, 0, 262, 0, 233, 0, 196, 0, 175, 0, 147, 0, 165, 0],
    start: function () { this.stop(); var s = this; this.t = setInterval(function () { s.tickB(); }, 430); },
    tickB: function () {
      var c = ac(); if (!c || c.state !== 'running') return;
      try { if (localStorage.getItem('aaa_bgm') === '1') return; } catch (e) {}
      var n = this.seq[this.step++ % 16];
      if (n) tone(n, 0.32, 'sine', 0.018);
    },
    stop: function () { if (this.t) clearInterval(this.t); this.t = null; }
  };

  // confetti
  var parts = [], fxOn = false, fxLast = performance.now();
  function sizeFx() { fx.width = innerWidth; fx.height = innerHeight; }
  window.addEventListener('resize', sizeFx); sizeFx();
  function burst(x, y, colors) {
    for (var i = 0; i < 40; i++) {
      var a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 240;
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 90,
        life: .7 + Math.random() * .7, color: colors[i % colors.length], r: 2 + Math.random() * 3.5, rot: Math.random() * 6 });
    }
    if (!fxOn) { fxOn = true; fxLast = performance.now(); requestAnimationFrame(fxStep); }
  }
  function fxStep(now) {
    var dt = Math.min(.05, (now - fxLast) / 1000); fxLast = now;
    fxCtx.clearRect(0, 0, fx.width, fx.height);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.vx *= .99; p.life -= dt; p.rot += dt * 5;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      fxCtx.save();
      fxCtx.globalAlpha = Math.min(1, p.life * 1.6);
      fxCtx.translate(p.x, p.y); fxCtx.rotate(p.rot);
      fxCtx.fillStyle = p.color;
      fxCtx.fillRect(-p.r / 2, -p.r, p.r, p.r * 2);
      fxCtx.restore();
    }
    if (parts.length) requestAnimationFrame(fxStep); else { fxOn = false; fxCtx.clearRect(0,0,fx.width,fx.height); }
  }

  var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function winner(s) {
    for (var i = 0; i < LINES.length; i++) {
      var L = LINES[i];
      if (s[L[0]] && s[L[0]] === s[L[1]] && s[L[1]] === s[L[2]]) return { who: s[L[0]], line: L };
    }
    return null;
  }

  function minimax(s, isMax, depth) {
    var w = winner(s);
    if (w) return w.who === 'O' ? 10 - depth : depth - 10;
    if (s.every(function (c) { return c; })) return 0;
    var best = isMax ? -99 : 99;
    for (var i = 0; i < 9; i++) {
      if (s[i]) continue;
      s[i] = isMax ? 'O' : 'X';
      var v = minimax(s, !isMax, depth + 1);
      s[i] = null;
      best = isMax ? Math.max(best, v) : Math.min(best, v);
    }
    return best;
  }

  function aiMove() {
    var empties = state.map(function (c, i) { return c ? null : i; }).filter(function (x) { return x !== null; });
    if (!empties.length) return;
    var pick;
    if (diff === 'easy') {
      pick = empties[Math.floor(Math.random() * empties.length)];
    } else if (diff === 'medium' && Math.random() < 0.35) {
      pick = empties[Math.floor(Math.random() * empties.length)];
    } else {
      var best = -99, opts = [];
      for (var i = 0; i < 9; i++) {
        if (state[i]) continue;
        state[i] = 'O';
        var v = minimax(state, false, 0);
        state[i] = null;
        if (v > best) { best = v; opts = [i]; }
        else if (v === best) opts.push(i);
      }
      pick = opts[Math.floor(Math.random() * opts.length)];
    }
    state[pick] = 'O';
    cells[pick].innerHTML = O_SVG;
    cells[pick].classList.add('taken');
    sfx.placeO();
    aiThinking = false;
    finishCheck();
    if (!over) statusEl.innerHTML = 'Your turn — <span class="x">X</span>';
  }

  function finishCheck() {
    var w = winner(state);
    if (w) {
      over = true;
      w.line.forEach(function (i) { cells[i].classList.add('winner'); });
      drawStrike(w.line);
      if (w.who === 'X') {
        statusEl.innerHTML = '<span class="x">YOU WIN!</span>';
        scores.x++; sX.textContent = scores.x;
        sfx.win();
        var r = board.getBoundingClientRect();
        burst(r.left + r.width / 2, r.top + r.height / 2, ['#5affdc', '#ffd166', '#ff9de2', '#fff']);
      } else {
        statusEl.innerHTML = '<span class="o">AI WINS</span>';
        scores.o++; sO.textContent = scores.o;
        sfx.lose();
      }
    } else if (state.every(function (c) { return c; })) {
      over = true;
      statusEl.textContent = "IT'S A DRAW";
      scores.d++; sD.textContent = scores.d;
      sfx.draw();
    }
    if (over) {
      try { localStorage.setItem('ttt_scores', JSON.stringify(scores)); } catch (e) {}
      againBtn.classList.add('show');
    }
  }

  function drawStrike(line) {
    var g = board.getBoundingClientRect();
    function mid(i) {
      var r = cells[i].getBoundingClientRect();
      return { x: (r.left + r.width / 2 - g.left) / g.width * 100, y: (r.top + r.height / 2 - g.top) / g.height * 100 };
    }
    var a = mid(line[0]), b = mid(line[2]);
    strikeLine.setAttribute('x1', a.x); strikeLine.setAttribute('y1', a.y);
    strikeLine.setAttribute('x2', b.x); strikeLine.setAttribute('y2', b.y);
    strike.classList.add('show');
  }

  function reset() {
    state = [null,null,null,null,null,null,null,null,null];
    over = false; aiThinking = false;
    cells.forEach(function (c) { c.innerHTML = ''; c.classList.remove('taken', 'winner'); });
    strike.classList.remove('show');
    againBtn.classList.remove('show');
    statusEl.innerHTML = 'Your turn — <span class="x">X</span>';
    sfx.reset();
  }

  board.addEventListener('click', function (e) {
    var el = e.target.closest('.cell');
    if (!el || over || aiThinking) return;
    var i = +el.dataset.i;
    if (state[i]) return;
    ac(); bgm.start();
    state[i] = 'X';
    el.innerHTML = X_SVG;
    el.classList.add('taken');
    sfx.placeX();
    finishCheck();
    if (!over) {
      aiThinking = true;
      statusEl.innerHTML = '<span class="o thinking">AI thinking</span>';
      setTimeout(aiMove, 380 + Math.random() * 350);
    }
  });

  againBtn.addEventListener('click', reset);

  document.querySelectorAll('.diff').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.diff').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      diff = b.dataset.diff;
      ac();
      reset();
    });
  });

  sX.textContent = scores.x; sD.textContent = scores.d; sO.textContent = scores.o;
  reset();
})();
</script>


<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
