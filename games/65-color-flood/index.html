<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Flood</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #0e1120;
    color: #e8eaf2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: -20%; z-index: -2;
    background:
      radial-gradient(40% 50% at 18% 22%, rgba(232,72,85,.13), transparent 70%),
      radial-gradient(42% 52% at 82% 20%, rgba(77,150,255,.14), transparent 70%),
      radial-gradient(50% 55% at 30% 85%, rgba(62,193,167,.11), transparent 70%),
      radial-gradient(45% 55% at 75% 80%, rgba(155,93,229,.12), transparent 70%),
      radial-gradient(circle at 50% 0%, #20273a 0%, #12151f 70%);
    animation: aurora 22s ease-in-out infinite alternate;
  }
  @keyframes aurora { from { transform: rotate(-2deg) scale(1); } to { transform: rotate(2deg) scale(1.07); } }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(0,0,0,.5));
  }
  .game {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .game { animation: cardIn .45s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } }
  h1 {
    font-size: 30px;
    letter-spacing: 4px;
    font-weight: 800;
    background: linear-gradient(90deg, #e84855, #ffd166 40%, #3ec1a7 70%, #9b5de5);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 16px rgba(255, 209, 102, .25));
  }
  .subtitle {
    font-size: 13px;
    color: #9aa3bd;
    margin-top: -8px;
    text-align: center;
    max-width: 42ch;
  }
  .stats {
    display: flex;
    gap: 12px;
    font-size: 15px;
    width: 100%;
    justify-content: space-between;
    align-items: center;
  }
  .stats > span {
    background: rgba(10,14,26,.6);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 10px;
    padding: 7px 14px;
    backdrop-filter: blur(8px);
  }
  .moves-left {
    font-variant-numeric: tabular-nums;
    font-size: 18px;
    font-weight: 800;
    color: #ffd166;
  }
  .moves-left.low { color: #ff6b6b; animation: pulse 0.8s infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }
  .coverage { color: #9aa3bd; font-size: 13px; }
  #board {
    display: grid;
    gap: 3px;
    width: 100%;
    aspect-ratio: 1;
    background: #0b0e16;
    padding: 8px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 0 1px #2a3045;
  }
  .cell {
    border-radius: 3px;
    transition: background-color 0.25s ease;
  }
  .cell.owned {
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.35);
  }
  #palette {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .swatch {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    border: 3px solid transparent;
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45), inset 0 2px 4px rgba(255,255,255,.25), inset 0 -3px 6px rgba(0,0,0,.25);
  }
  .swatch:hover { transform: translateY(-3px) scale(1.05); }
  .swatch:active { transform: scale(0.95); }
  .swatch.current { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.18), 0 0 18px rgba(255,255,255,.22), 0 4px 10px rgba(0,0,0,0.4); }
  .swatch.disabled { pointer-events: none; opacity: 0.55; }
  button.new-game {
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #12151f;
    background: #ffd166;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  button.new-game:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .hint { font-size: 12px; color: #7a829c; }
  kbd {
    background: #2a3045;
    border-radius: 4px;
    padding: 1px 5px;
    font-family: inherit;
    font-size: 11px;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,12,20,0.78);
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(3px);
    z-index: 10;
  }
  #overlay.show { display: flex; }
  .dialog {
    background: #1b2030;
    border-radius: 14px;
    padding: 32px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 0 0 1px #333b55;
    animation: pop 0.25s ease;
  }
  @keyframes pop { from { transform: scale(0.85); opacity: 0; } }
  .dialog h2 { font-size: 26px; margin-bottom: 8px; letter-spacing: 1px; }
  .dialog p { color: #9aa3bd; margin-bottom: 8px; font-size: 15px; }
  .dialog .best { color: #ffd166; font-size: 13px; margin-bottom: 18px; }
  .newbest {
    display: inline-block; color: #12151f;
    background: linear-gradient(90deg, #ffd166, #f9a03f);
    font-weight: 900; font-size: .72rem; letter-spacing: 1.5px;
    padding: 3px 12px; border-radius: 999px; margin-bottom: 10px;
    animation: blink .9s infinite;
  }
  @keyframes blink { 50% { opacity: .6; } }
</style>
</head>
<body>
<div class="game">
  <h1>COLOR FLOOD</h1>
  <div class="subtitle">Fill the whole board with one color. You control the top-left region — pick a color to flood it outward.</div>
  <div class="stats">
    <span class="coverage" id="coverage">Filled: 0%</span>
    <span class="moves-left" id="moves">Moves: 30</span>
  </div>
  <div id="board"></div>
  <div id="palette"></div>
  <button class="new-game" id="restart">New Game</button>
  <div class="hint">Click a swatch or press <kbd>1</kbd>–<kbd>6</kbd></div>
</div>
<div id="overlay">
  <div class="dialog">
    <h2 id="overlayTitle"></h2>
    <div id="newBest" style="display:none"><span class="newbest">NEW BEST</span></div>
    <p id="overlayText"></p>
    <p class="best" id="bestLine"></p>
    <button class="new-game" id="overlayRestart">Play Again</button>
  </div>
</div>
<script>
(function () {
  /* ---------- procedural SFX (respects the overlay's speaker preference) ---------- */
  var Sfx = (function () {
    var ctx = null;
    function ac() { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} } return ctx; }
    function on() { try { return localStorage.getItem('aaa_sfx') !== '0'; } catch (e) { return true; } }
    function tone(f, d, type, vol, slide, delay) {
      if (!on()) return;
      var c = ac(); if (!c) return;
      try {
        var t = c.currentTime + (delay || 0);
        var o = c.createOscillator(), g = c.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(Math.max(30, f), t);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol || 0.05, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0006, t + d);
        o.connect(g); g.connect(c.destination);
        o.start(t); o.stop(t + d + 0.05);
      } catch (e) {}
    }
    return {
      unlock: ac,
      flood: function (grew) {
        tone(300 + Math.min(80, grew) * 6, .12, 'sine', .05, 480 + grew * 6);
        tone(180, .14, 'triangle', .03, 260);
      },
      deny: function () { tone(240, .07, 'square', .025, 220); },
      win: function () { [523, 659, 784, 1046].forEach(function (f, i) { tone(f, .28, 'triangle', .055, null, i * .12); }); },
      lose: function () { [392, 330, 262, 196].forEach(function (f, i) { tone(f, .24, 'sawtooth', .04, null, i * .12); }); }
    };
  })();

  var SIZE = 14;
  var MAX_MOVES = 30;
  var COLORS = ['#e84855', '#f9a03f', '#ffd166', '#3ec1a7', '#4d96ff', '#9b5de5'];

  var boardEl = document.getElementById('board');
  var paletteEl = document.getElementById('palette');
  var movesEl = document.getElementById('moves');
  var coverageEl = document.getElementById('coverage');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlayTitle');
  var overlayText = document.getElementById('overlayText');
  var restartBtn = document.getElementById('restart');
  var overlayRestartBtn = document.getElementById('overlayRestart');
  var newBestEl = document.getElementById('newBest');
  var bestLineEl = document.getElementById('bestLine');
  var best = { moves: 0, wins: 0 };
  try { best = JSON.parse(localStorage.getItem('cf_best') || 'null') || best; } catch (e) {}

  var board = [];
  var cellEls = [];
  var movesLeft = MAX_MOVES;
  var gameOver = false;

  function rand(n) { return Math.floor(Math.random() * n); }

  function newGame() {
    board = [];
    for (var r = 0; r < SIZE; r++) {
      var row = [];
      for (var c = 0; c < SIZE; c++) row.push(rand(COLORS.length));
      board.push(row);
    }
    movesLeft = MAX_MOVES;
    gameOver = false;
    overlay.classList.remove('show');
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (cellEls[r] && cellEls[r][c]) cellEls[r][c].style.transitionDelay = '0ms';
    render();
  }

  function buildDOM() {
    boardEl.style.gridTemplateColumns = 'repeat(' + SIZE + ', 1fr)';
    boardEl.innerHTML = '';
    cellEls = [];
    for (var r = 0; r < SIZE; r++) {
      var rowEls = [];
      for (var c = 0; c < SIZE; c++) {
        var d = document.createElement('div');
        d.className = 'cell';
        boardEl.appendChild(d);
        rowEls.push(d);
      }
      cellEls.push(rowEls);
    }
    paletteEl.innerHTML = '';
    COLORS.forEach(function (color, i) {
      var s = document.createElement('button');
      s.className = 'swatch';
      s.style.background = color;
      s.title = 'Color ' + (i + 1);
      s.addEventListener('click', function () { pick(i); });
      paletteEl.appendChild(s);
    });
  }

  // Returns the set of cells in the controlled region (connected to
  // (0,0) and matching its color) as a 2D boolean mask.
  function regionMask() {
    var target = board[0][0];
    var mask = [];
    for (var r = 0; r < SIZE; r++) mask.push(new Array(SIZE).fill(false));
    var stack = [[0, 0]];
    mask[0][0] = true;
    while (stack.length) {
      var p = stack.pop();
      var rr = p[0], cc = p[1];
      var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (var i = 0; i < dirs.length; i++) {
        var nr = rr + dirs[i][0], nc = cc + dirs[i][1];
        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && !mask[nr][nc] && board[nr][nc] === target) {
          mask[nr][nc] = true;
          stack.push([nr, nc]);
        }
      }
    }
    return mask;
  }

  // BFS distance map from (0,0) through the controlled region — used to
  // stagger the flood ripple animation outward from the corner.
  function regionDist() {
    var target = board[0][0];
    var dist = [];
    for (var r = 0; r < SIZE; r++) dist.push(new Array(SIZE).fill(-1));
    var q = [[0, 0]];
    dist[0][0] = 0;
    for (var h = 0; h < q.length; h++) {
      var rr = q[h][0], cc = q[h][1];
      var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (var i = 0; i < dirs.length; i++) {
        var nr = rr + dirs[i][0], nc = cc + dirs[i][1];
        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && dist[nr][nc] < 0 && board[nr][nc] === target) {
          dist[nr][nc] = dist[rr][cc] + 1;
          q.push([nr, nc]);
        }
      }
    }
    return dist;
  }

  function pick(colorIdx) {
    if (gameOver) return;
    if (board[0][0] === colorIdx) { Sfx.deny(); return; } // same color: free, no move used

    var dist = regionDist();
    var grew = 0;
    var mask = regionMask();
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (mask[r][c]) {
          board[r][c] = colorIdx;
          cellEls[r][c].style.transitionDelay = (dist[r][c] * 24) + 'ms';
        }
      }
    }
    // cells newly absorbed next tick get a delay just past their region edge
    var mask2 = regionMask();
    for (r = 0; r < SIZE; r++) {
      for (c = 0; c < SIZE; c++) {
        if (mask2[r][c] && !mask[r][c]) {
          grew++;
          cellEls[r][c].style.transitionDelay = '0ms';
        }
      }
    }
    Sfx.flood(grew);
    movesLeft--;
    render();

    var filled = countRegion();
    if (filled === SIZE * SIZE) {
      end(true);
    } else if (movesLeft <= 0) {
      end(false);
    }
  }

  function countRegion() {
    var mask = regionMask();
    var n = 0;
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (mask[r][c]) n++;
    return n;
  }

  function end(won) {
    gameOver = true;
    render();
    var used = MAX_MOVES - movesLeft;
    var isBest = false;
    if (won) {
      best.wins++;
      if (!best.moves || used < best.moves) { best.moves = used; isBest = true; }
      try { localStorage.setItem('cf_best', JSON.stringify(best)); } catch (e) {}
    }
    overlayTitle.textContent = won ? 'YOU WIN!' : 'OUT OF MOVES';
    overlayTitle.style.color = won ? '#3ec1a7' : '#e84855';
    newBestEl.style.display = isBest ? '' : 'none';
    overlayText.textContent = won
      ? 'Board flooded in ' + used + ' moves.'
      : 'The board wasn\'t fully flooded. Try again!';
    bestLineEl.textContent = best.moves
      ? 'Best: ' + best.moves + ' moves \u00B7 ' + best.wins + ' win' + (best.wins === 1 ? '' : 's')
      : 'No wins yet \u2014 flood the board in ' + MAX_MOVES + ' moves!';
    setTimeout(function () { overlay.classList.add('show'); }, won ? 350 : 500);
    if (won) Sfx.win(); else Sfx.lose();
    if (window.AAA && won) { AAA.flash(0.24); if (isBest) AAA.shockwave(innerWidth/2, innerHeight/2, '#3ec1a7', 160); }
  }

  function render() {
    var mask = regionMask();
    var filled = 0;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var el = cellEls[r][c];
        el.style.background = COLORS[board[r][c]];
        el.classList.toggle('owned', mask[r][c]);
        if (mask[r][c]) filled++;
      }
    }
    var swatches = paletteEl.children;
    for (var i = 0; i < swatches.length; i++) {
      swatches[i].classList.toggle('current', board[0][0] === i);
      swatches[i].classList.toggle('disabled', gameOver);
    }
    movesEl.textContent = 'Moves: ' + movesLeft;
    movesEl.classList.toggle('low', movesLeft <= 5 && !gameOver);
    coverageEl.textContent = 'Filled: ' + Math.round((filled / (SIZE * SIZE)) * 100) + '%';
  }

  restartBtn.addEventListener('click', newGame);
  overlayRestartBtn.addEventListener('click', newGame);
  document.addEventListener('keydown', function (e) {
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= COLORS.length) pick(n - 1);
    if (e.key === 'r' || e.key === 'R') newGame();
  });
  window.addEventListener('pointerdown', function once() {
    Sfx.unlock();
    window.removeEventListener('pointerdown', once);
  });

  buildDOM();
  newGame();
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
