<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dodger</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(77,208,225,.08), transparent 60%),
      radial-gradient(700px 500px at 85% 110%, rgba(243,104,224,.06), transparent 60%),
      #0a0a18;
    color: #eee;
    font-family: "Segoe UI", Tahoma, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
  }
  #wrap {
    position: relative;
    filter: drop-shadow(0 18px 46px rgba(0,0,0,.6));
  }
  canvas {
    display: block;
    background: linear-gradient(#0e0e22, #191936);
    border: 1px solid #3a3a6e;
    border-radius: 10px;
    box-shadow: 0 0 0 1px rgba(77,208,225,.10), 0 0 34px rgba(77,104,224,.18), inset 0 0 60px rgba(0,0,0,.4);
    max-width: 96vw;
    max-height: 92vh;
    height: auto;
    touch-action: none;
    cursor: pointer;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 12px;
    font-size: 18px;
    font-weight: 600;
    color: #8fd3ff;
    text-shadow: 0 0 10px rgba(77,208,225,.55), 0 1px 3px rgba(0,0,0,.9);
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #hud .best { color: #9aa4c8; font-size: 13px; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(8,8,22,.82);
    backdrop-filter: blur(3px);
    border-radius: 10px;
    text-align: center;
    padding: 16px;
  }
  #overlay h1 {
    font-size: clamp(34px, 8vw, 46px);
    color: #ffd75e;
    letter-spacing: 4px;
    margin-bottom: 10px;
    text-shadow: 0 0 18px rgba(255,215,94,.55), 0 0 44px rgba(255,160,60,.25);
  }
  #overlay p { font-size: 15px; margin: 6px 0; color: #c5cbe0; max-width: 340px; }
  #overlay .key {
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid #556;
    border-bottom-width: 3px;
    border-radius: 5px;
    background: #1d1d33;
    font-family: monospace;
    font-size: 13px;
  }
  #overlay button {
    margin-top: 18px;
    padding: 13px 38px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #0d0d1a;
    background: linear-gradient(135deg, #ffd75e, #ffb347);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 0 #b07d1e, 0 10px 26px rgba(255,183,71,.3);
    transition: transform .1s, box-shadow .15s, background .15s;
  }
  #overlay button:hover { background: linear-gradient(135deg, #ffe58a, #ffc95e); transform: translateY(-2px) scale(1.04); }
  #overlay button:active { transform: translateY(1px); box-shadow: 0 1px 0 #b07d1e; }
  #finalScore { color: #8fd3ff; font-size: 22px !important; font-weight: 700; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="hud">Time: <span id="time">0.0</span>s<br><span class="best">Best: <span id="best">0.0</span>s</span></div>
  <div id="overlay">
    <h1>DODGER</h1>
    <p id="msg">Dodge the falling meteors. Survive as long as you can!</p>
    <p id="finalScore" class="hidden"></p>
    <p>Move with <span class="key">&larr;</span> <span class="key">&rarr;</span> / <span class="key">A</span> <span class="key">D</span> or drag on touch</p>
    <button id="btn">Start</button>
  </div>
</div>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var timeEl = document.getElementById('time');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');
  var finalScore = document.getElementById('finalScore');

  var best = 0;
  try { best = parseFloat(localStorage.getItem('dodgerBest')) || 0; } catch (e) {}
  bestEl.textContent = best.toFixed(1);

  // ===== AAA audio kit (procedural; honors overlay prefs) =====
  var AC = null;
  function _ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
  function sfxOn(){ try{ return localStorage.getItem('aaa_sfx')!=='0'; }catch(e){ return true; } }
  function bgmOn(){ try{ return localStorage.getItem('aaa_bgm')!=='0'; }catch(e){ return true; } }
  function tone(f,d,type,v,sl,t){ if(!sfxOn())return; var c=_ac(); if(!c)return; try{ var n=c.currentTime+(t||0),o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,n); if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,sl),n+d); g.gain.setValueAtTime(.0008,n); g.gain.linearRampToValueAtTime(v||.08,n+.012); g.gain.exponentialRampToValueAtTime(.0006,n+d); o.connect(g); g.connect(c.destination); o.start(n); o.stop(n+d+.05); }catch(e){} }
  function nz(d,v,f,q,ty,t){ if(!sfxOn())return; var c=_ac(); if(!c)return; try{ var n=c.currentTime+(t||0),len=Math.ceil(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),dd=b.getChannelData(0); for(var i=0;i<len;i++)dd[i]=(Math.random()*2-1)*(1-i/len); var s=c.createBufferSource(); s.buffer=b; var fl=c.createBiquadFilter(); fl.type=ty||'bandpass'; fl.frequency.value=f||1400; fl.Q.value=q||.8; var g=c.createGain(); g.gain.setValueAtTime(v||.1,n); g.gain.exponentialRampToValueAtTime(.0006,n+d); s.connect(fl); fl.connect(g); g.connect(c.destination); s.start(n); }catch(e){} }
  function mtone(f,d,type,v,sl,t){ var c=_ac(); if(!c)return; try{ var n=c.currentTime+(t||0),o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,n); if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,sl),n+d); g.gain.setValueAtTime(.0008,n); g.gain.linearRampToValueAtTime(v||.05,n+.02); g.gain.exponentialRampToValueAtTime(.0006,n+d); o.connect(g); g.connect(c.destination); o.start(n); o.stop(n+d+.05); }catch(e){} }
  function mnz(d,v,f,q,ty,t){ var c=_ac(); if(!c)return; try{ var n=c.currentTime+(t||0),len=Math.ceil(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),dd=b.getChannelData(0); for(var i=0;i<len;i++)dd[i]=(Math.random()*2-1)*(1-i/len); var s=c.createBufferSource(); s.buffer=b; var fl=c.createBiquadFilter(); fl.type=ty||'highpass'; fl.frequency.value=f||8000; fl.Q.value=q||1; var g=c.createGain(); g.gain.setValueAtTime(v||.05,n); g.gain.exponentialRampToValueAtTime(.0006,n+d); s.connect(fl); fl.connect(g); g.connect(c.destination); s.start(n); }catch(e){} }

  // adaptive groove — layers under the overlay melody, shares the aaa_bgm pref
  var bgmI = 0, bgmNext = -1, BGM_STEP = 60/132/2, bgmHeat = .45;
  var BASS = [55,55,82.41,65.41,55,55,98,73.42];
  var ARP  = [220,261.63,329.63,261.63,440,392,329.63,246.94];
  setInterval(function () {
    if (!bgmOn()) { bgmNext = -1; return; }
    var c = _ac(); if (!c || c.state !== 'running') return;
    if (bgmNext < 0) bgmNext = c.currentTime + .06;
    var ahead = c.currentTime + .32;
    while (bgmNext < ahead) {
      var s = bgmI % 16, t = bgmNext;
      if (s === 0 || s === 8 || (bgmHeat > .6 && (s === 4 || s === 12))) mtone(150,.16,'sine',.2,44,t);
      if (s % 4 === 2) mnz(.045,.03*(0.5+bgmHeat),8500,1.2,'highpass',t);
      if (s % 2 === 0) mtone(BASS[(bgmI>>1)%8]*.5,.24,'triangle',.045+.035*bgmHeat,null,t);
      if (bgmHeat > .35 && s % 4 === 0) mtone(ARP[(bgmI>>2)%8],.12,'sine',.026,null,t);
      if (bgmHeat > .8 && s % 2 === 1) mtone(ARP[(bgmI>>1)%8]*2,.09,'sine',.018,null,t);
      bgmNext += BGM_STEP; bgmI++;
    }
  }, 80);

  var keys = {};
  var pointer = { active: false, x: 0 };
  var player, blocks, particles, stars, running, startTime, lastSpawn, spawnInterval, lastFrame;
  var shakeT = 0, nextMile = 10, nearMissCd = 0;

  var COLORS = ['#ff5e5e', '#ff9f43', '#ee5253', '#ff6b81', '#f368e0'];

  function reset() {
    player = { x: W / 2 - 20, y: H - 70, w: 40, h: 18, speed: 340, tilt: 0 };
    blocks = [];
    particles = [];
    stars = [];
    for (var i = 0; i < 90; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, z: 0.25 + Math.random() * 0.75, r: 0.6 + Math.random() * 1.6 });
    }
    spawnInterval = 700;
    lastSpawn = 0;
    nextMile = 10;
    nearMissCd = 0;
  }

  function start() {
    reset();
    running = true;
    startTime = performance.now();
    lastFrame = startTime;
    overlay.classList.add('hidden');
    _ac();
    tone(200,.3,'sine',.09,720);
    tone(400,.2,'triangle',.05,900,.08);
  }

  function gameOver() {
    running = false;
    shakeT = .5;
    var t = (performance.now() - startTime) / 1000;
    if (t > best) {
      best = t;
      try { localStorage.setItem('dodgerBest', best); } catch (e) {}
    }
    bestEl.textContent = best.toFixed(1);
    nz(.5,.28,500,.7,'lowpass');
    tone(160,.5,'sawtooth',.1,60);
    // explosion particles
    for (var i = 0; i < 46; i++) {
      particles.push({
        x: player.x + player.w / 2,
        y: player.y + player.h / 2,
        vx: (Math.random() - 0.5) * 440,
        vy: (Math.random() - 0.5) * 440,
        life: 1,
        color: i % 3 ? '#4dd0e1' : '#ffd75e'
      });
    }
    msg.textContent = 'GAME OVER — you got hit!';
    finalScore.textContent = 'Survived ' + t.toFixed(1) + 's';
    finalScore.classList.remove('hidden');
    btn.textContent = 'Restart';
    setTimeout(function () { overlay.classList.remove('hidden'); }, 650);
  }

  function spawnBlock(now) {
    var elapsed = (now - startTime) / 1000;
    var w = 24 + Math.random() * 40;
    // irregular meteor polygon
    var verts = [];
    var nv = 7 + (Math.random() * 4 | 0);
    for (var i = 0; i < nv; i++) {
      var a = i / nv * Math.PI * 2;
      verts.push(0.7 + Math.random() * 0.45);
    }
    blocks.push({
      x: Math.random() * (W - w),
      y: -60,
      w: w,
      h: w * (0.6 + Math.random() * 0.6),
      speed: 160 + Math.random() * 120 + elapsed * 8,
      color: COLORS[(Math.random() * COLORS.length) | 0],
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 3,
      verts: verts,
      passed: false
    });
  }

  function update(dt, now) {
    var elapsed = (now - startTime) / 1000;

    // player movement (keys + touch drag)
    var dir = 0;
    if (keys.ArrowLeft || keys.a || keys.A) dir -= 1;
    if (keys.ArrowRight || keys.d || keys.D) dir += 1;
    player.x += dir * player.speed * dt;
    if (pointer.active) {
      var px = pointer.x * W / canvas.clientWidth;
      player.x += Math.max(-player.speed * 1.5 * dt, Math.min(player.speed * 1.5 * dt, px - player.w / 2 - player.x));
      dir = Math.sign(px - player.w / 2 - player.x) * .6;
    }
    player.tilt += (dir * 0.35 - player.tilt) * Math.min(1, dt * 12);
    if (player.x < 0) player.x = 0;
    if (player.x > W - player.w) player.x = W - player.w;

    // starfield scroll
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      st.y += (20 + elapsed * 3) * st.z * dt;
      if (st.y > H + 2) { st.y = -2; st.x = Math.random() * W; }
    }

    // spawn blocks, accelerating over time
    spawnInterval = Math.max(180, 700 - elapsed * 22);
    if (now - lastSpawn > spawnInterval) {
      spawnBlock(now);
      lastSpawn = now;
    }

    // survival milestones
    if (elapsed >= nextMile) {
      nextMile += 10;
      tone(660,.09,'sine',.05); tone(880,.14,'sine',.05,null,.09);
    }
    bgmHeat = Math.min(1, .45 + elapsed / 90);

    // move blocks
    nearMissCd -= dt;
    for (var i = blocks.length - 1; i >= 0; i--) {
      var b = blocks[i];
      b.y += b.speed * dt;
      b.rot += b.rotSpeed * dt;
      if (b.y > H + 80) { blocks.splice(i, 1); continue; }
      // near-miss whoosh
      if (!b.passed && b.y > player.y + player.h + 6) {
        b.passed = true;
        if (nearMissCd <= 0 && Math.abs(b.x + b.w / 2 - (player.x + player.w / 2)) < b.w / 2 + 46) {
          nearMissCd = .35;
          nz(.12,.09,900,1.4);
          tone(320,.1,'sine',.04,720);
        }
      }
      // collision (bounding box, slightly forgiving)
      var pad = 3;
      if (b.x + pad < player.x + player.w && b.x + b.w - pad > player.x &&
          b.y + pad < player.y + player.h && b.y + b.h - pad > player.y) {
        gameOver();
        return;
      }
    }

    // particles
    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 300 * dt;
      p.life -= dt * 1.4;
      if (p.life <= 0) particles.splice(j, 1);
    }

    timeEl.textContent = elapsed.toFixed(1);
  }

  function drawPlayer(now) {
    var x = player.x, y = player.y, w = player.w, h = player.h;
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    ctx.rotate(player.tilt);
    ctx.translate(-w / 2, -h / 2);
    // engine flame
    var fl = 8 + Math.random() * 7;
    var fg = ctx.createLinearGradient(0, h, 0, h + fl + 8);
    fg.addColorStop(0, 'rgba(255,200,80,.95)');
    fg.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(w * .3, h);
    ctx.lineTo(w * .5, h + fl + 8);
    ctx.lineTo(w * .7, h);
    ctx.closePath();
    ctx.fill();
    // hull
    var hg = ctx.createLinearGradient(0, -8, 0, h);
    hg.addColorStop(0, '#bdf3ff');
    hg.addColorStop(.4, '#4dd0e1');
    hg.addColorStop(1, '#1789a8');
    ctx.fillStyle = hg;
    ctx.shadowColor = '#4dd0e1';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(w / 2, -8);
    ctx.lineTo(w, h);
    ctx.lineTo(w * 0.65, h * 0.7);
    ctx.lineTo(w * 0.35, h * 0.7);
    ctx.lineTo(0, h);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // cockpit
    ctx.fillStyle = '#0e3a4d';
    ctx.beginPath();
    ctx.ellipse(w / 2, h * .28, 4, 6.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath();
    ctx.ellipse(w / 2 - 1, h * .24, 1.4, 2.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    var now = performance.now();
    ctx.save();
    if (shakeT > 0) {
      shakeT -= 1 / 60;
      ctx.translate((Math.random() - .5) * shakeT * 14, (Math.random() - .5) * shakeT * 14);
    }
    // nebula wash
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0e0e24');
    bg.addColorStop(.6, '#141430');
    bg.addColorStop(1, '#1d1638');
    ctx.fillStyle = bg;
    ctx.fillRect(-20, -20, W + 40, H + 40);
    var neb = ctx.createRadialGradient(W * .78, H * .18, 10, W * .78, H * .18, W * .7);
    neb.addColorStop(0, 'rgba(120,80,220,.14)');
    neb.addColorStop(1, 'rgba(120,80,220,0)');
    ctx.fillStyle = neb;
    ctx.fillRect(0, 0, W, H);
    var neb2 = ctx.createRadialGradient(W * .15, H * .8, 10, W * .15, H * .8, W * .6);
    neb2.addColorStop(0, 'rgba(40,160,200,.10)');
    neb2.addColorStop(1, 'rgba(40,160,200,0)');
    ctx.fillStyle = neb2;
    ctx.fillRect(0, 0, W, H);

    // parallax starfield
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      ctx.globalAlpha = .35 + st.z * .6;
      ctx.fillStyle = st.z > .7 ? '#fff' : '#9db8ff';
      ctx.fillRect(st.x, st.y, st.r, st.r);
    }
    ctx.globalAlpha = 1;

    // meteors
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      ctx.rotate(b.rot);
      // glow trail
      var tg = ctx.createLinearGradient(0, -b.h * 2.2, 0, 0);
      tg.addColorStop(0, 'rgba(255,120,60,0)');
      tg.addColorStop(1, 'rgba(255,140,70,.28)');
      ctx.fillStyle = tg;
      ctx.fillRect(-b.w / 3, -b.h * 2.2, b.w * .66, b.h * 2.2);
      // irregular rock body
      ctx.beginPath();
      var nv = b.verts.length;
      for (var v = 0; v < nv; v++) {
        var a = v / nv * Math.PI * 2, rr = b.verts[v] * b.w / 2;
        var vx = Math.cos(a) * rr, vy = Math.sin(a) * rr * (b.h / b.w);
        if (v === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
      }
      ctx.closePath();
      var rg = ctx.createRadialGradient(-b.w * .18, -b.h * .18, 2, 0, 0, b.w * .6);
      rg.addColorStop(0, '#ffd2a8');
      rg.addColorStop(.35, b.color);
      rg.addColorStop(1, 'rgba(60,20,20,.95)');
      ctx.fillStyle = rg;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
      // craters
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.arc(-b.w * .12, -b.h * .1, b.w * .1, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(b.w * .16, b.h * .14, b.w * .07, 0, 7); ctx.fill();
      ctx.restore();
    }

    if (running) drawPlayer(now);

    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
      ctx.globalAlpha = 1;
    }

    // danger vignette as speed ramps
    if (running) {
      var elapsed = (now - startTime) / 1000;
      var danger = Math.min(.22, Math.max(0, (elapsed - 20) / 220));
      if (danger > 0.01) {
        var vg = ctx.createRadialGradient(W/2, H/2, W*.3, W/2, H/2, W*.75);
        vg.addColorStop(0, 'rgba(255,40,40,0)');
        vg.addColorStop(1, 'rgba(255,30,30,' + danger.toFixed(3) + ')');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
      }
    }
    ctx.restore();
  }

  function loop(now) {
    var dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;
    if (running) update(dt, now);
    else {
      // keep particles + stars animating on game-over screen
      for (var j = particles.length - 1; j >= 0; j--) {
        var p = particles[j];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += 300 * dt; p.life -= dt * 1.4;
        if (p.life <= 0) particles.splice(j, 1);
      }
      for (var s = 0; s < stars.length; s++) {
        stars[s].y += 14 * stars[s].z * dt;
        if (stars[s].y > H + 2) { stars[s].y = -2; stars[s].x = Math.random() * W; }
      }
      if (shakeT > 0) shakeT -= dt;
    }
    draw();
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if ((e.key === ' ' || e.key === 'Enter') && !running) start();
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].indexOf(e.key) !== -1) e.preventDefault();
  });
  document.addEventListener('keyup', function (e) { keys[e.key] = false; });
  btn.addEventListener('click', start);
  // touch / pointer drag steering
  canvas.addEventListener('pointerdown', function (e) {
    if (!running) { start(); return; }
    pointer.active = true; pointer.x = e.clientX - canvas.getBoundingClientRect().left;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (e) {
    if (pointer.active) pointer.x = e.clientX - canvas.getBoundingClientRect().left;
  });
  function endPointer() { pointer.active = false; }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  reset();
  requestAnimationFrame(loop);
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
