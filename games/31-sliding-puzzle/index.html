<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>15 Sliding Puzzle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --size: min(88vw, 420px);
    --gap: 8px;
    --radius: 14px;
    --n: 4;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 20%, #1d2b4f 0%, #0d1226 70%);
    color: #e8ecf8;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #7dd3fc, #c4b5fd);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stats {
    display: flex;
    gap: 24px;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .stats .label { color: #8b93b0; margin-right: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .stats .value { font-weight: 600; }
  #board {
    position: relative;
    width: var(--size);
    height: var(--size);
    background: #131a33;
    border-radius: var(--radius);
    border: 1px solid #2a3358;
    box-shadow: 0 20px 50px rgba(0,0,0,.5), inset 0 0 30px rgba(0,0,0,.35);
    touch-action: manipulation;
  }
  .tile {
    position: absolute;
    width: calc((var(--size) - (var(--n) - 1) * var(--gap)) / var(--n));
    height: calc((var(--size) - (var(--n) - 1) * var(--gap)) / var(--n));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--size) / var(--n) * 0.42);
    font-weight: 700;
    border-radius: 10px;
    background: linear-gradient(145deg, #3b4a7d, #2a3760);
    border: 1px solid #4a5a94;
    color: #f0f3ff;
    cursor: pointer;
    transition: transform .16s ease, left .16s ease, top .16s ease, background .15s;
    box-shadow: 0 4px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
    margin: 3px;
    left: calc(var(--c) * (100% / var(--n)));
    top: calc(var(--r) * (100% / var(--n)));
  }
  .tile:hover { background: linear-gradient(145deg, #48599a, #33447a); }
  .tile.hint { outline: 2px solid #7dd3fc; outline-offset: -2px; }
  .tile.won { animation: pop .5s ease; background: linear-gradient(145deg, #16a34a, #15803d); border-color: #4ade80; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .controls { display: flex; gap: 12px; }
  .sizes { display: flex; gap: 8px; }
  .sizes button { padding: 7px 14px; font-size: 12px; background: linear-gradient(135deg, #2a3760, #1d2b4f); color: #aab4d8; border: 1px solid #3a4470; box-shadow: none; }
  .sizes button.on { background: linear-gradient(135deg, #7dd3fc, #818cf8); color: #0d1226; border-color: transparent; }
  button {
    padding: 10px 26px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    color: #0d1226;
    background: linear-gradient(135deg, #7dd3fc, #818cf8);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .1s, box-shadow .15s;
    box-shadow: 0 4px 14px rgba(125, 211, 252, .3);
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(125, 211, 252, .45); }
  button:active { transform: translateY(1px); }
  button.secondary {
    background: transparent;
    color: #aab4d8;
    border: 1px solid #3a4470;
    box-shadow: none;
  }
  button.secondary:hover { color: #e8ecf8; border-color: #5a67a0; }
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(8, 11, 25, .8);
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  #overlay.show { display: flex; }
  .panel {
    text-align: center;
    padding: 40px 50px;
    background: #171f3d;
    border: 1px solid #3a4470;
    border-radius: 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    animation: rise .3s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  .panel h2 { font-size: 30px; margin-bottom: 10px; color: #4ade80; }
  .panel p { color: #aab4d8; margin-bottom: 24px; font-size: 16px; }
  .hint-text { font-size: 12px; color: #5a6490; }
</style>

<style>
/*AAA-INJECT-CSS*/
html{touch-action:manipulation}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{touch-action:none}
button,input,select,textarea{touch-action:manipulation}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:2147483000;background:radial-gradient(ellipse at 50% 40%,transparent 58%,rgba(0,0,0,.28) 100%)}
</style>

<script>
/*AAA-INJECT-SFX*/
window.__gsfx = (function(){
  var ctx=null;
  function ac(){ if(ctx===null){var A=window.AudioContext||window.webkitAudioContext;ctx=A?new A():false;} if(ctx&&ctx.state==='suspended')ctx.resume().catch(function(){}); return ctx||null; }
  function ok(){ return localStorage.getItem('aaa_sfx')!=='0'; }
  function tone(f,d,type,v,slide,when){ if(!ok())return; var c=ac(); if(!c)return; try{ var t=c.currentTime+(when||0); var o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d); g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(v||0.08,t+0.012); g.gain.exponentialRampToValueAtTime(0.0006,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.03);}catch(e){} }
  function noise(dur,v,fq,when,type){ if(!ok())return; var c=ac(); if(!c)return; try{ var t=c.currentTime+(when||0),n=Math.floor(c.sampleRate*dur); var b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0); for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n); var s=c.createBufferSource(); s.buffer=b; var f=c.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=fq||1200; var g=c.createGain(); g.gain.value=v||0.1; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);}catch(e){} }
  var api={
    unlock:ac, tone:tone, noise:noise,
    tap:function(){tone(520,0.05,'triangle',0.05);},
    key:function(){tone(680+Math.random()*60,0.035,'triangle',0.04);},
    deal:function(){noise(0.09,0.09,2600,0,'highpass');tone(300,0.06,'sine',0.04);},
    flip:function(){noise(0.07,0.08,3200,0,'highpass');},
    chip:function(){tone(1900,0.04,'square',0.03);tone(2400,0.03,'square',0.025,null,0.03);noise(0.04,0.05,5000,0,'highpass');},
    clack:function(){noise(0.045,0.1,1600);tone(220,0.05,'triangle',0.07,150);},
    step:function(){tone(330,0.04,'triangle',0.045,280);},
    slide:function(){noise(0.08,0.06,900);tone(260,0.07,'sine',0.045,200);},
    pop:function(i){i=i||0;tone(500+i*80,0.07,'sine',0.07,900+i*120);noise(0.03,0.04,3000,0,'highpass');},
    shoot:function(){tone(700,0.09,'sawtooth',0.05,1400);},
    thud:function(){tone(120,0.12,'sine',0.12,60);noise(0.07,0.08,600);},
    sonar:function(){tone(880,0.35,'sine',0.06);tone(880,0.2,'sine',0.03,null,0.18);},
    splash:function(){noise(0.3,0.1,1200);},
    boom:function(){tone(80,0.5,'sine',0.2,35);noise(0.4,0.16,400);},
    coin:function(){tone(1318,0.06,'square',0.05);tone(1760,0.12,'square',0.05,null,0.06);},
    ding:function(){tone(1046,0.15,'triangle',0.07);tone(1568,0.18,'triangle',0.06,null,0.08);},
    good:function(){tone(659,0.08,'triangle',0.06);tone(880,0.1,'triangle',0.06,null,0.06);},
    bad:function(){tone(180,0.12,'square',0.05,120);},
    win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,0.2,'triangle',0.08,null,i*0.09);});},
    lose:function(){[392,330,262,196].forEach(function(f,i){tone(f,0.26,'sawtooth',0.05,f*0.92,i*0.13);});},
    chord:function(){tone(523,0.14,'sine',0.05);tone(659,0.14,'sine',0.045,null,0.01);tone(784,0.16,'sine',0.04,null,0.02);}
  };
  function unl(){ac();}
  window.addEventListener('pointerdown',unl,{passive:true});
  window.addEventListener('keydown',unl);
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest?e.target.closest('button'):null; if(b&&!b.disabled)api.tap();},true);
  return api;
})();
</script>
</head>
<body>
  <h1>15 Sliding Puzzle</h1>
  <div class="stats">
    <div><span class="label">Moves</span><span class="value" id="moves">0</span></div>
    <div><span class="label">Time</span><span class="value" id="time">0:00</span></div>
    <div><span class="label">Best</span><span class="value" id="best">—</span></div>
  </div>
  <div id="board"></div>
  <div class="sizes">
    <button class="sz" data-n="3">3&times;3</button>
    <button class="sz on" data-n="4">4&times;4</button>
    <button class="sz" data-n="5">5&times;5</button>
  </div>
  <div class="controls">
    <button id="shuffleBtn">Shuffle</button>
    <button class="secondary" id="hintBtn">Hint</button>
  </div>
  <p class="hint-text">Click a tile in the same row/column as the empty space to slide it.</p>

  <div id="overlay">
    <div class="panel">
      <h2>Solved!</h2>
      <p id="winStats"></p>
      <button id="againBtn">Play Again</button>
    </div>
  </div>

<script>
(function () {
  var N = 4, TOTAL = 16;
  var bestEl = document.getElementById('best');
  var bestData = {};
  try { bestData = JSON.parse(localStorage.getItem('sp_best') || '{}'); } catch (e) {}
  function fmtT(s) { return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function showBest() {
    var b = bestData[N];
    bestEl.textContent = b ? b.m + ' / ' + fmtT(b.t) : '—';
  }
  function setN(n) {
    if (n === N) return;
    N = n; TOTAL = n * n;
    board.style.setProperty('--n', n);
    document.querySelectorAll('.sizes .sz').forEach(function (b) {
      b.classList.toggle('on', +b.dataset.n === n);
    });
    buildTiles();
    newGame();
    showBest();
  }
  document.querySelectorAll('.sizes .sz').forEach(function (b) {
    b.addEventListener('click', function () { setN(+b.dataset.n); });
  });
  var board = document.getElementById('board');
  var movesEl = document.getElementById('moves');
  var timeEl = document.getElementById('time');
  var overlay = document.getElementById('overlay');
  var winStats = document.getElementById('winStats');
  var hintBtn = document.getElementById('hintBtn');

  var cells = [];        // cells[i] = tile value (0 = empty) at position i
  var tiles = {};        // value -> DOM element
  var moves = 0;
  var seconds = 0;
  var timerId = null;
  var started = false;
  var solved = false;

  function posToRC(i) { return { r: Math.floor(i / N), c: i % N }; }

  function buildTiles() {
    board.innerHTML = '';
    tiles = {};
    for (var v = 1; v < TOTAL; v++) {
      var t = document.createElement('div');
      t.className = 'tile';
      t.textContent = v;
      t.dataset.v = v;
      t.addEventListener('click', function () { onTileClick(Number(this.dataset.v)); });
      board.appendChild(t);
      tiles[v] = t;
    }
  }

  function render() {
    for (var i = 0; i < TOTAL; i++) {
      var v = cells[i];
      if (v === 0) continue;
      var p = posToRC(i);
      var t = tiles[v];
      t.style.setProperty('--r', p.r);
      t.style.setProperty('--c', p.c);
    }
  }

  function updateStats() {
    movesEl.textContent = moves;
    timeEl.textContent = Math.floor(seconds / 60) + ':' + ('0' + (seconds % 60)).slice(-2);
  }

  function startTimer() {
    if (timerId) return;
    timerId = setInterval(function () {
      seconds++;
      updateStats();
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerId);
    timerId = null;
  }

  // Fisher-Yates on 1..15, then fix parity so the puzzle is always solvable.
  // With the empty cell on the last row, solvable iff inversion count is even.
  function shuffledCells() {
    var vals = [];
    for (var v = 1; v < TOTAL; v++) vals.push(v);
    for (var i = vals.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = vals[i]; vals[i] = vals[j]; vals[j] = tmp;
    }
    var inv = 0;
    for (var a = 0; a < vals.length; a++)
      for (var b = a + 1; b < vals.length; b++)
        if (vals[a] > vals[b]) inv++;
    if (inv % 2 !== 0) { var t = vals[0]; vals[0] = vals[1]; vals[1] = t; }
    vals.push(0);
    return vals;
  }

  function newGame() {
    stopTimer();
    moves = 0;
    seconds = 0;
    started = false;
    solved = false;
    overlay.classList.remove('show');
    cells = shuffledCells();
    // Avoid the astronomically unlucky already-solved shuffle.
    if (isSolved()) cells = shuffledCells();
    for (var k in tiles) tiles[k].classList.remove('won', 'hint');
    render();
    updateStats();
    showBest();
  }

  function onTileClick(v) {
    if (solved) return;
    var idx = cells.indexOf(v);
    var empty = cells.indexOf(0);
    var tp = posToRC(idx), ep = posToRC(empty);
    if (tp.r !== ep.r && tp.c !== ep.c) return; // not in line with gap

    // Slide every tile between clicked tile and the gap, starting
    // from the tile adjacent to the gap so nothing is overwritten.
    var dr = Math.sign(ep.r - tp.r), dc = Math.sign(ep.c - tp.c);
    var d = dr * N + dc;
    for (var cur = empty; cur !== idx; cur -= d)
      cells[cur] = cells[cur - d];
    cells[idx] = 0;

    if (!started) { started = true; startTimer(); }
    moves++;
    if (window.__gsfx) __gsfx.slide();
    render();
    updateStats();
    if (isSolved()) onWin();
  }

  function isSolved() {
    for (var i = 0; i < TOTAL - 1; i++)
      if (cells[i] !== i + 1) return false;
    return cells[TOTAL - 1] === 0;
  }

  function onWin() {
    solved = true;
    stopTimer();
    for (var k in tiles) tiles[k].classList.add('won');
    if (window.__gsfx) __gsfx.win();
    var nb = false;
    var cur = { m: moves, t: seconds };
    if (!bestData[N] || cur.m < bestData[N].m || (cur.m === bestData[N].m && cur.t < bestData[N].t)) {
      bestData[N] = cur; nb = true;
      try { localStorage.setItem('sp_best', JSON.stringify(bestData)); } catch (e) {}
      showBest();
    }
    setTimeout(function () {
      winStats.textContent = moves + ' moves in ' + timeEl.textContent + (nb ? ' — NEW BEST!' : '');
      if (nb && window.__gsfx) __gsfx.coin();
      overlay.classList.add('show');
    }, 550);
  }

  var hintTimer = null;
  hintBtn.addEventListener('click', function () {
    if (solved) return;
    clearTimeout(hintTimer);
    var empty = cells.indexOf(0);
    var ep = posToRC(empty);
    for (var k in tiles) tiles[k].classList.remove('hint');
    // Highlight tiles movable this turn (same row or column as gap).
    for (var i = 0; i < TOTAL; i++) {
      var p = posToRC(i);
      if (cells[i] !== 0 && (p.r === ep.r || p.c === ep.c))
        tiles[cells[i]].classList.add('hint');
    }
    hintTimer = setTimeout(function () {
      for (var k in tiles) tiles[k].classList.remove('hint');
    }, 1200);
  });

  document.getElementById('shuffleBtn').addEventListener('click', newGame);
  document.getElementById('againBtn').addEventListener('click', newGame);

  buildTiles();
  newGame();
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
