<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Treasure Dive</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;color:#fff;font-family:system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:12px;
    background:
      radial-gradient(900px 600px at 50% -14%, rgba(8,74,110,.55), transparent 62%),
      radial-gradient(800px 500px at 95% 110%, rgba(12,36,74,.6), transparent 60%),
      #03101c;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{position:relative;width:min(540px,100%);display:flex;flex-direction:column;gap:9px}
  .hud{
    display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;align-items:center;
    background:rgba(6,32,54,.85);border:1px solid rgba(56,189,248,.3);
    padding:9px 14px;border-radius:13px;font-weight:800;font-size:.9rem;
    box-shadow:0 10px 28px rgba(0,0,0,.45);backdrop-filter:blur(6px);
  }
  .hud .lab{font-size:.58rem;letter-spacing:.15em;color:#6d9dc4;display:block;text-transform:uppercase}
  .hud b{font-variant-numeric:tabular-nums}
  #score{color:#fde047;text-shadow:0 0 12px rgba(253,224,71,.5)}
  #bag{color:#7ef3c8;text-shadow:0 0 12px rgba(94,234,212,.5)}
  .o2-bar{height:11px;background:#07263d;border-radius:99px;overflow:hidden;margin-top:4px;border:1px solid rgba(125,211,252,.25)}
  .o2-fill{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#38bdf8);transition:width .1s linear,background .3s}
  .o2-fill.low{background:linear-gradient(90deg,#f43f5e,#fb923c)}
  canvas{
    width:100%;height:auto;aspect-ratio:520/580;border-radius:15px;display:block;
    border:1px solid rgba(56,189,248,.35);touch-action:none;
    box-shadow:0 20px 55px rgba(0,0,0,.6),0 0 50px -14px rgba(56,189,248,.35);
  }
  .ov{
    position:absolute;inset:58px 0 0 0;border-radius:15px;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:22px;gap:14px;
    background:radial-gradient(ellipse at 50% 40%, rgba(10,45,75,.55), rgba(3,13,24,.92) 75%);
    backdrop-filter:blur(4px);transition:opacity .3s,visibility .3s;
  }
  .ov.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .title{
    font-size:clamp(2rem,7.5vw,3rem);font-weight:900;letter-spacing:.04em;line-height:.95;
    background:linear-gradient(180deg,#fff,#7dd3fc 55%,#0284c7);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(56,189,248,.45));
  }
  .title.hot{background:linear-gradient(180deg,#fff,#fda4af 55%,#f43f5e);filter:drop-shadow(0 0 22px rgba(244,63,94,.45))}
  .ov p{color:#bcd8ec;max-width:340px;font-size:.93rem;line-height:1.55}
  .statline{display:flex;gap:18px;font-weight:800;font-size:1.02rem}
  .statline b{color:#fde047}
  .keys{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;color:#7fa3c2;font-size:.76rem;font-weight:700}
  kbd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-bottom-width:3px;border-radius:7px;padding:2px 8px;font-family:ui-monospace,monospace;font-size:.7rem;font-weight:800;color:#e0f2fe}
  .btn{
    padding:13px 36px;border:none;border-radius:999px;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#04121f;
    font-weight:900;font-size:1rem;letter-spacing:.05em;
    box-shadow:0 12px 30px -8px rgba(34,211,238,.6),inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .12s;
  }
  .btn:active{transform:scale(.96)}
  .hint{font-size:.75rem;color:#5f85a3;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div><span class="lab">Banked</span><b id="score">0</b></div>
    <div><span class="lab">Bag</span><b id="bag">0</b></div>
    <div><span class="lab">Oxygen</span><div class="o2-bar"><div class="o2-fill" id="o2"></div></div></div>
  </div>
  <canvas id="c" width="520" height="580"></canvas>
  <div class="ov" id="ov">
    <h1 class="title" id="ovT">TREASURE<br>DIVE</h1>
    <p id="ovP">Plunge for pearls, gems and sunken chests — deeper loot pays more! Watch your O₂, grab <b style="color:#a5f3fc">air bubbles</b>, dodge jellyfish &amp; sharks, and surface to bank your haul.</p>
    <div class="statline" id="ovStats" style="display:none"></div>
    <div class="keys"><span><kbd>WASD</kbd>/<kbd>Arrows</kbd> swim</span><span>or drag to steer</span></div>
    <button class="btn" id="startBtn">DIVE IN</button>
    <div class="hint">The bag only counts once you surface!</div>
  </div>
</div>
<script>
(() => {
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const W = c.width, H = c.height, SURF = 74;
  const scoreEl = document.getElementById('score'), bagEl = document.getElementById('bag'), o2El = document.getElementById('o2');
  const ov = document.getElementById('ov'), ovT = document.getElementById('ovT'), ovP = document.getElementById('ovP'), ovStats = document.getElementById('ovStats'), startBtn = document.getElementById('startBtn');

  let ac = null;
  const audio = () => { const A = window.AudioContext || window.webkitAudioContext; if (!ac && A) ac = new A(); if (ac && ac.state === 'suspended') ac.resume().catch(()=>{}); return ac; };
  const sfxOn = () => localStorage.getItem('aaa_sfx') !== '0';
  function tone(f, d, type='sine', vol=0.06, slide=null){
    if (!sfxOn()) return; const x = audio(); if (!x) return;
    try {
      const t = x.currentTime, o = x.createOscillator(), g = x.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
      g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0006, t + d);
      o.connect(g); g.connect(x.destination); o.start(t); o.stop(t + d + 0.03);
    } catch {}
  }
  function splash(){
    const x = audio(); if (!x || !sfxOn()) return;
    try {
      const n = x.createBufferSource(), b = x.createBuffer(1, x.sampleRate * .3, x.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 1.8);
      n.buffer = b;
      const f = x.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700;
      const g = x.createGain(); g.gain.value = .16;
      n.connect(f); f.connect(g); g.connect(x.destination); n.start();
    } catch {}
  }

  let best = Number(localStorage.getItem('dive_best') || 0);
  let state = 'idle', diver, items, foes, bubbles, airs, score = 0, bag = 0, o2 = 100, keys = {}, pointer = null, hurtT = 0, depth = 0;

  function spawnItem() {
    const deep = Math.random();
    const y = SURF + 60 + deep * (H - SURF - 90);
    const val = deep > .72 ? 50 : deep > .35 ? 25 : 10;
    const type = val === 50 ? 'chest' : val === 25 ? 'gem' : 'pearl';
    items.push({ x: 30 + Math.random()*(W - 60), y, val, type, r: type === 'chest' ? 16 : 12, ph: Math.random()*6 });
  }
  function spawnAir() {
    airs.push({ x: 30 + Math.random()*(W - 60), y: SURF + 90 + Math.random()*(H - SURF - 140), r: 11, vy: -18 - Math.random()*14, ph: Math.random()*6 });
  }
  function spawnFoe(i) {
    const y = SURF + 95 + i * 72 + Math.random()*25;
    const dir = Math.random() < .5 ? 1 : -1;
    const isShark = i % 2 === 1;
    foes.push({
      x: Math.random()*W, y: Math.min(H - 40, y),
      vx: dir * (isShark ? 95 + Math.random()*55 : 42 + Math.random()*30),
      r: isShark ? 20 : 15, kind: isShark ? 'shark' : 'jelly', ph: Math.random()*6, flip: dir < 0
    });
  }

  function reset() {
    diver = { x: W/2, y: SURF - 6, r: 14, face: 1 };
    score = 0; bag = 0; o2 = 100; hurtT = 0;
    items = []; foes = []; bubbles = []; airs = [];
    for (let i = 0; i < 12; i++) spawnItem();
    for (let i = 0; i < 6; i++) spawnFoe(i);
    for (let i = 0; i < 3; i++) spawnAir();
    scoreEl.textContent = '0'; bagEl.textContent = '0';
    o2El.style.width = '100%'; o2El.classList.remove('low');
    state = 'play';
    ov.classList.add('hidden');
    audio();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.04, (now - last) / 1000);
    last = now;
    if (state === 'play') update(dt);
    draw(now / 1000);
    requestAnimationFrame(loop);
  }

  function update(dt) {
    let dx = 0, dy = 0;
    if (keys.ArrowLeft || keys.KeyA) dx -= 1;
    if (keys.ArrowRight || keys.KeyD) dx += 1;
    if (keys.ArrowUp || keys.KeyW) dy -= 1;
    if (keys.ArrowDown || keys.KeyS) dy += 1;
    if (pointer) {
      const pdx = pointer.x - diver.x, pdy = pointer.y - diver.y;
      const dist = Math.hypot(pdx, pdy);
      if (dist > 8) { dx = pdx / dist; dy = pdy / dist; }
    }
    const mag = Math.hypot(dx, dy) || 1;
    const spd = 218;
    if (dx || dy) {
      diver.x = Math.max(16, Math.min(W - 16, diver.x + (dx/mag)*spd*dt));
      diver.y = Math.max(SURF - 8, Math.min(H - 18, diver.y + (dy/mag)*spd*dt));
      if (dx) diver.face = Math.sign(dx);
    }
    depth = Math.max(0, Math.floor((diver.y - SURF) / 12));

    if (diver.y <= SURF + 4) {
      const was = o2;
      o2 = Math.min(100, o2 + 58 * dt);
      if (bag > 0) {
        score += bag;
        scoreEl.textContent = score;
        bagEl.textContent = '0';
        splash();
        if (o2 > 60 || was < 30) tone(700, .12, 'triangle', .05, 980);
        bag = 0;
      }
    } else {
      const depthFactor = 1 + (diver.y - SURF) / H * .95;
      o2 -= 7.5 * depthFactor * dt;
      if (Math.random() < .2) bubbles.push({ x: diver.x + diver.face * -6, y: diver.y - 12, r: 1.5 + Math.random()*3, vy: -60 });
    }
    o2El.style.width = Math.max(0, o2) + '%';
    o2El.classList.toggle('low', o2 < 30);
    if (hurtT > 0) hurtT -= dt;

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (Math.hypot(diver.x - it.x, diver.y - it.y) < diver.r + it.r) {
        bag += it.val;
        bagEl.textContent = bag;
        tone(660 + Math.min(300, bag), .1, 'triangle', .06, 900);
        items.splice(i, 1);
        spawnItem();
      }
    }

    for (let i = airs.length - 1; i >= 0; i--) {
      const a = airs[i];
      a.y += a.vy * dt;
      if (a.y < SURF + 8) { airs.splice(i, 1); spawnAir(); continue; }
      if (Math.hypot(diver.x - a.x, diver.y - a.y) < diver.r + a.r) {
        o2 = Math.min(100, o2 + 26);
        tone(980, .12, 'sine', .06, 1400);
        airs.splice(i, 1);
        spawnAir();
      }
    }

    for (const f of foes) {
      f.x += f.vx * dt;
      if (f.x < 16 || f.x > W - 16) { f.vx *= -1; f.flip = f.vx < 0; }
      if (Math.hypot(diver.x - f.x, diver.y - f.y) < diver.r + f.r - 4 && hurtT <= 0) {
        hurtT = .9;
        o2 -= f.kind === 'shark' ? 30 : 20;
        diver.y = Math.max(SURF - 8, diver.y - 30);
        tone(160, .3, 'sawtooth', .09, 60);
        for (let k = 0; k < 8; k++) bubbles.push({ x: diver.x + (Math.random()-.5)*30, y: diver.y + (Math.random()-.5)*20, r: 2 + Math.random()*3, vy: -80 });
      }
    }

    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.y += (b.vy || -60) * dt;
      b.x += Math.sin(b.y * .06) * .5;
      if (b.y < SURF) bubbles.splice(i, 1);
    }

    if (o2 <= 0) {
      o2 = 0;
      state = 'over';
      const fs = score;
      if (fs > best) { best = fs; localStorage.setItem('dive_best', String(best)); }
      tone(320, .5, 'sine', .1, 80);
      setTimeout(() => {
        ovT.textContent = 'OUT OF AIR!';
        ovT.classList.add('hot');
        ovP.innerHTML = `The deep kept your bag of <b>${bag}</b> pts.`;
        ovStats.style.display = 'flex';
        ovStats.innerHTML = `<div>Banked <b>${fs}</b></div><div>Best <b>${best}</b></div>`;
        startBtn.textContent = 'DIVE AGAIN';
        ov.classList.remove('hidden');
      }, 600);
    }
  }

  // ---------- hand-drawn sprites ----------
  function drawDiver(x, y, face, t) {
    ctx.save(); ctx.translate(x, y); ctx.scale(face, 1);
    const kick = Math.sin(t * 9) * 5;
    // fins
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath(); ctx.ellipse(-16, 6 + kick, 9, 3.6, .5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-16, -2 - kick, 9, 3.6, -.4, 0, Math.PI*2); ctx.fill();
    // body suit
    ctx.fillStyle = '#fde047';
    ctx.beginPath(); ctx.roundRect(-12, -8, 22, 16, 7); ctx.fill();
    // tank
    ctx.fillStyle = '#94a3b8';
    ctx.beginPath(); ctx.roundRect(-13, -12, 10, 20, 4); ctx.fill();
    ctx.fillStyle = '#64748b'; ctx.fillRect(-13, -4, 10, 4);
    // head + mask
    ctx.fillStyle = '#fcd7b0'; ctx.beginPath(); ctx.arc(12, 0, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0ea5e9'; ctx.beginPath(); ctx.roundRect(10, -5, 12, 9, 4); ctx.fill();
    ctx.strokeStyle = '#164e63'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.restore();
  }
  function drawShark(x, y, flip, t) {
    ctx.save(); ctx.translate(x, y); ctx.scale(flip ? -1 : 1, 1);
    const wag = Math.sin(t * 7) * .12;
    ctx.fillStyle = '#7d93a8';
    // tail
    ctx.save(); ctx.translate(-26, 0); ctx.rotate(wag);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-14, -10); ctx.lineTo(-10, 0); ctx.lineTo(-14, 10); ctx.closePath(); ctx.fill();
    ctx.restore();
    // body
    ctx.beginPath(); ctx.ellipse(0, 0, 28, 10, 0, 0, Math.PI*2); ctx.fill();
    // dorsal
    ctx.beginPath(); ctx.moveTo(-4, -8); ctx.lineTo(4, -20); ctx.lineTo(10, -8); ctx.closePath(); ctx.fill();
    // belly
    ctx.fillStyle = '#c7d6e2';
    ctx.beginPath(); ctx.ellipse(2, 4, 22, 5.4, 0, 0, Math.PI); ctx.fill();
    // eye + gills + mouth
    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(20, -3, 2, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#5b7386'; ctx.lineWidth = 1.4;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(8 + i*3, -4); ctx.lineTo(8 + i*3, 4); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(20, 4); ctx.quadraticCurveTo(26, 7, 28, 4); ctx.stroke();
    ctx.restore();
  }
  function drawJelly(x, y, t) {
    ctx.save(); ctx.translate(x, y);
    // tentacles
    ctx.strokeStyle = 'rgba(244,114,182,.75)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 6, 6);
      ctx.quadraticCurveTo(i * 6 + Math.sin(t * 4 + i) * 5, 18, i * 6 + Math.sin(t * 4 + i * 2) * 7, 28);
      ctx.stroke();
    }
    // bell
    const g = ctx.createRadialGradient(-4, -6, 2, 0, 0, 16);
    g.addColorStop(0, '#fbcfe8'); g.addColorStop(.6, '#f472b6'); g.addColorStop(1, 'rgba(190,24,93,.85)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 15, Math.PI, 0); ctx.quadraticCurveTo(15, 8, 8, 8); ctx.lineTo(-8, 8); ctx.quadraticCurveTo(-15, 8, -15, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.ellipse(-5, -6, 4, 3, -.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawItem(it, t) {
    const bob = Math.sin(t * 3 + it.ph) * 3;
    ctx.save(); ctx.translate(it.x, it.y + bob);
    if (it.type === 'chest') {
      ctx.fillStyle = '#78350f';
      ctx.beginPath(); ctx.roundRect(-14, -8, 28, 18, 3); ctx.fill();
      ctx.fillStyle = '#92400e';
      ctx.beginPath(); ctx.roundRect(-14, -12, 28, 9, 4); ctx.fill();
      ctx.strokeStyle = '#fde047'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-14, -3); ctx.lineTo(14, -3); ctx.stroke();
      ctx.fillStyle = '#fde047';
      ctx.beginPath(); ctx.roundRect(-3, -6, 6, 8, 2); ctx.fill();
    } else if (it.type === 'gem') {
      ctx.rotate(Math.sin(t * 2 + it.ph) * .15);
      ctx.fillStyle = '#22d3ee';
      ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(9, 0); ctx.lineTo(0, 11); ctx.lineTo(-9, 0); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,.6)';
      ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(4, -2); ctx.lineTo(0, 0); ctx.lineTo(-4, -2); ctx.closePath(); ctx.fill();
    } else { // pearl in shell
      ctx.fillStyle = '#a78bfa';
      ctx.beginPath(); ctx.arc(0, 4, 10, 0, Math.PI); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1.4;
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(i * 8, 10); ctx.stroke(); }
      ctx.fillStyle = '#fdf4ff';
      ctx.shadowColor = '#f0abfc'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.arc(-2, -2, 2, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  function drawAir(a, t) {
    const bob = Math.sin(t * 2.5 + a.ph) * 4;
    ctx.save(); ctx.translate(a.x, a.y + bob);
    const g = ctx.createRadialGradient(-3, -3, 1, 0, 0, a.r);
    g.addColorStop(0, 'rgba(224,242,254,.9)');
    g.addColorStop(.7, 'rgba(125,211,252,.45)');
    g.addColorStop(1, 'rgba(56,189,248,.12)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, a.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(224,242,254,.8)'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(-3, -4, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function draw(t) {
    // sky + surface
    const sky = ctx.createLinearGradient(0, 0, 0, SURF);
    sky.addColorStop(0, '#7dd3fc'); sky.addColorStop(1, '#bae6fd');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, SURF);
    // sun
    ctx.fillStyle = 'rgba(254,240,138,.9)';
    ctx.beginPath(); ctx.arc(W - 70, 30, 18, 0, Math.PI*2); ctx.fill();

    const water = ctx.createLinearGradient(0, SURF, 0, H);
    water.addColorStop(0, '#0291d1');
    water.addColorStop(.5, '#075985');
    water.addColorStop(1, '#041c2e');
    ctx.fillStyle = water;
    ctx.fillRect(0, SURF, W, H - SURF);

    // surface waves
    ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 8) {
      const wy = SURF + Math.sin(x * .05 + t * 3) * 3;
      x === 0 ? ctx.moveTo(x, wy) : ctx.lineTo(x, wy);
    }
    ctx.stroke();

    // god rays
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 4; i++) {
      const rx = 60 + i * 130 + Math.sin(t * .4 + i * 2) * 40;
      const grad = ctx.createLinearGradient(rx, SURF, rx + 60, H);
      grad.addColorStop(0, 'rgba(186,230,253,.16)');
      grad.addColorStop(1, 'rgba(186,230,253,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(rx - 12, SURF); ctx.lineTo(rx + 34, SURF);
      ctx.lineTo(rx + 130, H); ctx.lineTo(rx + 60, H);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    // seabed
    ctx.fillStyle = '#0a2a20';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 40) ctx.lineTo(x, H - 12 - Math.sin(x * .04) * 8);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    // coral silhouettes
    ctx.strokeStyle = '#134e4a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const cx = 40 + i * 110;
      ctx.beginPath(); ctx.moveTo(cx, H - 10);
      ctx.quadraticCurveTo(cx - 8, H - 34, cx - 14, H - 44);
      ctx.moveTo(cx, H - 10); ctx.quadraticCurveTo(cx + 8, H - 30, cx + 16, H - 40);
      ctx.stroke();
    }

    // boat
    ctx.save(); ctx.translate(W/2, Math.sin(t * 1.6) * 2);
    ctx.fillStyle = '#b45309';
    ctx.beginPath();
    ctx.moveTo(-44, SURF - 16); ctx.lineTo(44, SURF - 16);
    ctx.lineTo(30, SURF + 6); ctx.lineTo(-30, SURF + 6);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f59e0b'; ctx.fillRect(-44, SURF - 20, 88, 6);
    ctx.fillStyle = '#78350f'; ctx.fillRect(-8, SURF - 44, 5, 26); // mast
    ctx.fillStyle = '#f8fafc';
    ctx.beginPath(); ctx.moveTo(-3, SURF - 42); ctx.lineTo(24, SURF - 24); ctx.lineTo(-3, SURF - 24); ctx.closePath(); ctx.fill();
    ctx.restore();

    if (items) for (const it of items) drawItem(it, t);
    if (airs) for (const a of airs) drawAir(a, t);
    if (foes) for (const f of foes) (f.kind === 'shark' ? drawShark : drawJelly)(f.x, f.y, f.flip, t + f.ph);

    if (bubbles) {
      ctx.strokeStyle = 'rgba(224,242,254,.6)'; ctx.lineWidth = 1.4;
      for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.stroke(); }
    }

    if (diver && state === 'play') {
      if (hurtT > 0 && Math.floor(hurtT * 12) % 2 === 0) ctx.globalAlpha = .35;
      drawDiver(diver.x, diver.y, diver.face, t);
      ctx.globalAlpha = 1;
    }

    // pressure vignette
    const vg = ctx.createRadialGradient(W/2, H/2, H*.4, W/2, H/2, H*.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(1,8,18,.5)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    // low O2 pulse
    if (state === 'play' && o2 < 30) {
      ctx.fillStyle = `rgba(244,63,94,${.1 + .08 * Math.sin(t * 6)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'Enter' && state !== 'play') startBtn.click();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  const setPointer = e => {
    const r = c.getBoundingClientRect();
    pointer = { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  };
  c.addEventListener('pointerdown', e => { e.preventDefault(); c.setPointerCapture(e.pointerId); setPointer(e); });
  c.addEventListener('pointermove', e => { if (pointer) setPointer(e); });
  window.addEventListener('pointerup', () => pointer = null);
  window.addEventListener('pointercancel', () => pointer = null);
  startBtn.onclick = () => { ovT.classList.remove('hot'); ovStats.style.display = 'none'; reset(); };
  draw(0);
  requestAnimationFrame(loop);
})();
</script>
