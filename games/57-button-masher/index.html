<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Button Masher</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    background:
      radial-gradient(1000px 700px at 50% -12%, rgba(255,210,63,.12), transparent 60%),
      radial-gradient(800px 600px at 88% 112%, rgba(108,92,231,.16), transparent 62%),
      radial-gradient(circle at 50% 45%, #181826 0%, #0b0b14 80%);
  }
  /* animated grid floor */
  body::before {
    content: '';
    position: fixed;
    left: -20vw; right: -20vw; bottom: -4vh;
    height: 42vh;
    background:
      linear-gradient(transparent 0%, rgba(255,210,63,.05) 96%, rgba(255,210,63,.16) 100%),
      repeating-linear-gradient(90deg, rgba(255,210,63,.10) 0 2px, transparent 2px 64px),
      repeating-linear-gradient(0deg, rgba(255,210,63,.09) 0 2px, transparent 2px 44px);
    transform: perspective(300px) rotateX(52deg);
    transform-origin: bottom;
    animation: gridScroll 2.4s linear infinite;
    pointer-events: none;
  }
  @keyframes gridScroll {
    from { background-position: 0 0, 0 0, 0 0; }
    to   { background-position: 0 0, 0 0, 0 44px; }
  }
  /* pulsing halo behind the counter */
  #halo {
    position: fixed;
    left: 50%; top: 46%;
    width: min(64vmin, 420px); height: min(64vmin, 420px);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,210,63,.16) 0%, rgba(255,107,53,.07) 45%, transparent 70%);
    pointer-events: none;
    transition: transform .06s;
  }
  #halo.pump { transform: translate(-50%,-50%) scale(1.12); }

  h1 {
    font-size: clamp(1.5rem, 5vw, 2.4rem);
    letter-spacing: 5px;
    margin-bottom: 6px;
    text-transform: uppercase;
    font-weight: 900;
    background: linear-gradient(180deg, #fff, #ffd23f);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(255,210,63,.4));
    z-index: 2;
  }
  .sub { color: #98a0b8; margin-bottom: 26px; font-size: clamp(.85rem, 2.6vw, 1rem); z-index: 2; text-align: center; padding: 0 16px; }
  .sub b { color: #ffd23f; }

  #count {
    font-size: clamp(5rem, 22vw, 8.5rem);
    font-weight: 900;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: #fff;
    text-shadow: 0 0 34px rgba(255,210,63,.5), 0 4px 0 rgba(0,0,0,.4);
    transition: transform .05s;
    z-index: 2;
    cursor: pointer;
  }
  #count.pop { transform: scale(1.14); }
  #count.hot { color: #ffd23f; }

  #cps {
    margin-top: 8px;
    height: 20px;
    font-size: .95rem;
    font-weight: 700;
    letter-spacing: 1px;
    color: #7ee787;
    z-index: 2;
    font-variant-numeric: tabular-nums;
  }

  #timer-wrap {
    width: min(480px, 84vw);
    height: 16px;
    background: rgba(255,255,255,.07);
    border-radius: 999px;
    margin: 26px 0 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.5);
    z-index: 2;
  }
  #timer-bar {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #ffd23f, #ff6b35);
    box-shadow: 0 0 14px rgba(255,140,50,.55);
    transition: width .1s linear;
  }
  #time-left { font-size: 1.1rem; color: #aab2c8; font-variant-numeric: tabular-nums; z-index: 2; }
  #time-left.urgent { color: #ff6b5e; animation: urg .5s infinite alternate; }
  @keyframes urg { from { opacity: 1; } to { opacity: .45; } }

  #best { margin-top: 16px; font-size: 1.05rem; color: #7ee787; z-index: 2; letter-spacing: 1px; }
  #message {
    margin-top: 12px;
    font-size: clamp(1rem, 3.4vw, 1.35rem);
    min-height: 1.8em;
    color: #ffd23f;
    font-weight: 700;
    z-index: 2;
    text-align: center;
    padding: 0 14px;
  }
  #rank { font-size: clamp(.85rem, 3vw, 1.05rem); color: #f472b6; min-height: 1.4em; z-index: 2; font-weight: 700; letter-spacing: 1px; }

  button {
    margin-top: 20px;
    padding: 15px 46px;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: 2px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    background: linear-gradient(160deg, #ffe27a, #f5a01e);
    color: #221a05;
    text-transform: uppercase;
    box-shadow: 0 8px 26px rgba(255,190,50,.35), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .1s, box-shadow .1s, filter .1s;
    z-index: 2;
    touch-action: manipulation;
  }
  button:hover { filter: brightness(1.07); transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255,190,50,.5), inset 0 1px 0 rgba(255,255,255,.5); }
  button:active { transform: translateY(1px) scale(.98); }
  #restart-btn { display: none; }
  #restart-btn.show { display: inline-block; }

  /* big countdown numeral */
  #cd {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: clamp(6rem, 30vw, 11rem);
    font-weight: 900;
    color: #ffd23f;
    text-shadow: 0 0 60px rgba(255,210,63,.7);
    pointer-events: none;
    z-index: 10;
  }
  #cd.show { display: flex; animation: cdPop .7s ease-out; }
  @keyframes cdPop {
    0% { opacity: 0; transform: scale(1.7); }
    25% { opacity: 1; transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: scale(.8); }
  }

  #tapZoneHint {
    margin-top: 14px;
    font-size: .78rem;
    color: #5c6478;
    letter-spacing: 1px;
    z-index: 2;
  }

  /* screen shake while mashing hard */
  body.shake #count { animation: shk .07s; }
  @keyframes shk {
    25% { transform: translate(-3px, 1px) scale(1.14); }
    75% { transform: translate(3px, -1px) scale(1.14); }
  }
</style>
</head>
<body>
  <div id="halo"></div>
  <h1>Button Masher</h1>
  <div class="sub">Mash <b>SPACE</b> or <b>TAP anywhere</b> as fast as you can for 10 seconds!</div>
  <div id="count">0</div>
  <div id="cps"></div>
  <div id="timer-wrap"><div id="timer-bar"></div></div>
  <div id="time-left">10.0s</div>
  <div id="best">Best: 0</div>
  <div id="rank"></div>
  <div id="message">Press SPACE or tap to start</div>
  <button id="restart-btn">Mash Again</button>
  <div id="tapZoneHint">every press counts &mdash; keys or taps</div>
  <div id="cd"></div>

<script>
(function () {
  'use strict';
  var DURATION = 10000;
  var countEl = document.getElementById('count');
  var cpsEl = document.getElementById('cps');
  var barEl = document.getElementById('timer-bar');
  var timeEl = document.getElementById('time-left');
  var bestEl = document.getElementById('best');
  var rankEl = document.getElementById('rank');
  var msgEl = document.getElementById('message');
  var restartBtn = document.getElementById('restart-btn');
  var halo = document.getElementById('halo');
  var cdEl = document.getElementById('cd');

  var count = 0;
  var running = false;
  var finished = false;
  var counting = false;
  var startTime = 0;
  var rafId = null;
  var best = 0;
  var hits = [];            // timestamps for CPS readout
  var lastTick = -1;
  var lastHitSfx = 0;

  try { best = parseInt(localStorage.getItem('buttonMasherBest'), 10) || 0; } catch (e) {}
  bestEl.textContent = 'Best: ' + best;

  function sfx() { return window.AAA || null; }
  function tone(f, d, ty, v, sl) {
    var a = sfx();
    if (a) a.tone(f, d, ty, v, sl);
  }

  function pop() {
    countEl.classList.remove('pop');
    void countEl.offsetWidth;
    countEl.classList.add('pop');
    halo.classList.remove('pump');
    void halo.offsetWidth;
    halo.classList.add('pump');
  }

  function rank(n) {
    if (n < 40)  return 'Warm-up Fingers';
    if (n < 70)  return 'Click Cadet';
    if (n < 100) return 'Mash Machine';
    if (n < 140) return 'Turbo Tapper';
    return 'FINGER OF FURY';
  }

  function press(cx, cy) {
    if (finished || counting) return;
    if (!running) { countdown(); return; }
    count++;
    hits.push(performance.now());
    countEl.textContent = count;
    countEl.classList.toggle('hot', count >= 100);
    pop();
    var now = performance.now();
    if (now - lastHitSfx > 45) {
      lastHitSfx = now;
      tone(420 + Math.min(600, count * 3), 0.05, 'triangle', 0.045, 620);
      if (count % 25 === 0 && sfx()) {
        sfx().burst(cx || window.innerWidth / 2, cy || window.innerHeight * 0.45, '#ffd23f', 10);
      }
    }
  }

  function countdown() {
    counting = true;
    msgEl.textContent = 'Get ready...';
    restartBtn.classList.remove('show');
    rankEl.textContent = '';
    var seq = ['3', '2', '1', 'GO!'];
    var i = 0;
    function step() {
      if (i < seq.length) {
        cdEl.textContent = seq[i];
        cdEl.classList.remove('show');
        void cdEl.offsetWidth;
        cdEl.classList.add('show');
        if (i === 3) tone(880, 0.18, 'triangle', 0.09, 1180);
        else tone(440 + i * 90, 0.1, 'square', 0.05);
        i++;
        setTimeout(step, i === 4 ? 500 : 700);
      } else {
        counting = false;
        start();
      }
    }
    step();
  }

  function start() {
    running = true;
    count = 0;
    hits = [];
    lastTick = -1;
    countEl.textContent = '0';
    countEl.classList.remove('hot');
    cpsEl.textContent = '';
    msgEl.textContent = 'MASH!';
    timeEl.classList.remove('urgent');
    restartBtn.classList.remove('show');
    startTime = performance.now();
    rafId = requestAnimationFrame(tick);
  }

  function tick(now) {
    var elapsed = now - startTime;
    var remaining = Math.max(0, DURATION - elapsed);
    var secs = remaining / 1000;
    timeEl.textContent = secs.toFixed(1) + 's';
    barEl.style.width = (remaining / DURATION * 100) + '%';

    // live CPS over trailing second
    var cutoff = now - 1000;
    while (hits.length && hits[0] < cutoff) hits.shift();
    cpsEl.textContent = hits.length > 0 ? hits.length + ' presses/sec' : '';

    if (secs <= 3.05 && secs > 0) {
      timeEl.classList.add('urgent');
      var w = Math.ceil(secs);
      if (w !== lastTick) { lastTick = w; if (sfx()) sfx().sfx.tick(); }
    }
    if (remaining <= 0) { end(); return; }
    rafId = requestAnimationFrame(tick);
  }

  function end() {
    running = false;
    finished = true;
    var isBest = count > best;
    if (isBest) {
      best = count;
      bestEl.textContent = 'Best: ' + best;
      try { localStorage.setItem('buttonMasherBest', String(best)); } catch (e) {}
    }
    msgEl.textContent = 'Time! You pressed ' + count + ' times' + (isBest ? ' — NEW BEST!' : '.');
    rankEl.textContent = rank(count);
    var a = sfx();
    if (a) {
      if (isBest) { a.sfx.win(); a.flash(0.28); }
      else a.sfx.over();
      a.burst(window.innerWidth / 2, window.innerHeight * 0.42, isBest ? '#ffd23f' : '#8a93b8', isBest ? 26 : 10);
    }
    timeEl.classList.remove('urgent');
    cpsEl.textContent = 'avg ' + (count / (DURATION / 1000)).toFixed(1) + ' presses/sec';
    restartBtn.classList.add('show');
  }

  function reset() {
    finished = false;
    running = false;
    counting = false;
    count = 0;
    hits = [];
    countEl.textContent = '0';
    countEl.classList.remove('hot');
    cpsEl.textContent = '';
    barEl.style.width = '100%';
    timeEl.textContent = '10.0s';
    timeEl.classList.remove('urgent');
    msgEl.textContent = 'Press SPACE or tap to start';
    rankEl.textContent = '';
    restartBtn.classList.remove('show');
    countdown();
  }

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      if (e.repeat) return;
      if (finished) { reset(); return; }
      press();
    }
  });

  // tap / click anywhere mashes
  document.addEventListener('pointerdown', function (e) {
    if (e.target === restartBtn || e.target.closest('#aaa-arcade-host')) return;
    e.preventDefault();
    if (finished) return;
    press(e.clientX, e.clientY);
  });

  restartBtn.addEventListener('click', function () {
    reset();
    this.blur();
  });
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
