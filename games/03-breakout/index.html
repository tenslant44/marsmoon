<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Breakout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background:
      radial-gradient(ellipse at 50% -10%, rgba(88,166,255,.14), transparent 55%),
      radial-gradient(ellipse at 50% 115%, rgba(210,168,255,.1), transparent 55%),
      #060a13;
    color: #e6edf3;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    touch-action: none;
    padding: 8px;
  }

  h1 {
    font-size: clamp(1.2rem, 5vw, 1.5rem);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #58a6ff;
    margin-bottom: 10px;
    text-shadow: 0 0 18px rgba(88,166,255,.7), 0 0 46px rgba(88,166,255,.25);
  }

  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 720px;
    max-width: 95vw;
    margin-bottom: 8px;
    font-size: clamp(0.85rem, 3vw, 1rem);
  }

  #hud .stat { font-weight: 600; }
  #hud .label { color: #6e7681; font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; }
  #lives { color: #ff7b72; text-shadow: 0 0 10px rgba(255,123,114,.6); letter-spacing: 2px; }
  #score { color: #d2a8ff; text-shadow: 0 0 10px rgba(210,168,255,.6); }
  #level { color: #79c0ff; text-shadow: 0 0 10px rgba(121,192,255,.6); }
  #best { color: #f2cc60; text-shadow: 0 0 10px rgba(242,204,96,.5); }

  #wrap {
    position: relative;
    width: 720px;
    max-width: 95vw;
  }

  canvas {
    display: block;
    width: 100%;
    background: #04060c;
    border: 1px solid #253046;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(88,166,255,.14), inset 0 0 60px rgba(0,0,0,.55);
    cursor: none;
    touch-action: none;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(4, 7, 14, 0.85);
    backdrop-filter: blur(3px);
    border-radius: 10px;
    text-align: center;
    cursor: default;
    transition: opacity 0.25s;
  }

  #overlay.hidden { opacity: 0; pointer-events: none; }

  #overlay h2 { font-size: clamp(1.5rem, 6vw, 2.1rem); color: #58a6ff; letter-spacing: 0.12em; text-shadow: 0 0 24px rgba(88,166,255,.6); }
  #overlay p  { color: #8b949e; font-size: clamp(0.8rem, 2.6vw, 0.95rem); line-height: 1.7; padding: 0 12px; }
  #overlay kbd {
    background: #21262d;
    border: 1px solid #30363d;
    border-bottom-width: 3px;
    border-radius: 5px;
    padding: 1px 7px;
    font-family: inherit;
    font-size: 0.85rem;
  }

  #restartBtn {
    margin-top: 4px;
    padding: 12px 38px;
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: #060a13;
    background: linear-gradient(135deg, #79c0ff, #58a6ff);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(88,166,255,.5), 0 4px 0 #2f5c9e;
    transition: transform 0.12s;
  }
  #restartBtn:hover { transform: translateY(-2px); }
  #restartBtn:active { transform: translateY(2px); }

  #hint {
    margin-top: 10px;
    font-size: 0.72rem;
    color: #484f58;
    letter-spacing: 0.1em;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Breakout</h1>

<div id="hud">
  <div class="stat"><span class="label">Score&nbsp;</span><span id="score">0</span></div>
  <div class="stat"><span class="label">Best&nbsp;</span><span id="best">0</span></div>
  <div class="stat"><span class="label">Level&nbsp;</span><span id="level">1</span></div>
  <div class="stat"><span class="label">Lives&nbsp;</span><span id="lives"></span></div>
</div>

<div id="wrap">
  <canvas id="game" width="720" height="480"></canvas>
  <div id="overlay">
    <h2 id="overlayTitle">BREAKOUT</h2>
    <p id="overlayText">
      Move with the <kbd>Mouse</kbd>, <kbd>finger</kbd> or <kbd>&larr;</kbd> <kbd>&rarr;</kbd><br>
      Launch with <kbd>Space</kbd> / tap &nbsp;•&nbsp; Restart with <kbd>R</kbd>
    </p>
    <button id="restartBtn">START</button>
  </div>
</div>

<div id="hint">Clear every brick. Chain hits for combo bonus. Don't drop the ball.</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlayTitle');
  var overlayText = document.getElementById('overlayText');
  var restartBtn = document.getElementById('restartBtn');
  var scoreEl = document.getElementById('score');
  var livesEl = document.getElementById('lives');
  var levelEl = document.getElementById('level');
  var bestEl = document.getElementById('best');

  var W = canvas.width;
  var H = canvas.height;

  var PADDLE_W = 90;
  var PADDLE_H = 12;
  var PADDLE_Y = H - 28;
  var PADDLE_SPEED = 9;
  var BALL_R = 7;
  var BRICK_ROWS = 5;
  var BRICK_COLS = 10;
  var BRICK_H = 20;
  var BRICK_GAP = 6;
  var BRICK_TOP = 55;
  var BRICK_SIDE = 30;
  var BRICK_COLORS = ['#ff7b72', '#ffa657', '#f2cc60', '#7ee787', '#79c0ff'];

  var paddle, ball, bricks, score, lives, level, best = 0;
  var state;
  var keys = {};
  var particles = [];
  var trail = [];
  var combo = 0, comboFlash = 0;
  var shake = 0, animT = 0;
  var stars = [];

  for (var i = 0; i < 70; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + 0.4, p: Math.random() * 6.3 });
  }

  try { best = parseInt(localStorage.getItem('breakout_best'), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  // ---------- AAA audio ----------
  var ACX = null;
  function ac() {
    try {
      if (!ACX) ACX = new (window.AudioContext || window.webkitAudioContext)();
      if (ACX.state === 'suspended') ACX.resume();
    } catch (e) {}
    return ACX;
  }
  function tone(f, d, type, v, slide, delay) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + (delay || 0);
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v || 0.05, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + d + 0.03);
    } catch (e) {}
  }
  function noiseSfx(d, v, fc) {
    var c = ac(); if (!c) return;
    try {
      var n = Math.floor(c.sampleRate * d), b = c.createBuffer(1, n, c.sampleRate), ch = b.getChannelData(0);
      for (var i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var s = c.createBufferSource(); s.buffer = b;
      var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fc;
      var g = c.createGain(); g.gain.value = v;
      s.connect(f); f.connect(g); g.connect(c.destination); s.start();
    } catch (e) {}
  }
  var sfx = {
    paddle: function (rel) { tone(320 + Math.abs(rel) * 160, 0.07, 'square', 0.06, 480); },
    brick:  function (row, cb) { tone(420 + (BRICK_ROWS - row) * 90 + cb * 20, 0.08, 'triangle', 0.07, 900); noiseSfx(0.05, 0.04, 3000); },
    wall:   function () { tone(260, 0.04, 'square', 0.035, 320); },
    launch: function () { tone(440, 0.12, 'sine', 0.06, 880); },
    lose:   function () { tone(330, 0.2, 'sawtooth', 0.07, 120); tone(220, 0.3, 'sawtooth', 0.06, 80, 0.15); },
    level:  function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.12, 'triangle', 0.07, null, i * 0.08); }); },
    over:   function () { [392, 330, 262, 196].forEach(function (f, i) { tone(f, 0.22, 'sawtooth', 0.05, null, i * 0.12); }); },
    combo:  function (cb) { tone(700 + cb * 60, 0.1, 'sine', 0.05, 1100); }
  };
  var bgm = {
    t: null, step: 0,
    bass: [55, 55, 65.4, 55, 73.4, 65.4, 55, 49],
    arp:  [220, 0, 330, 0, 262, 0, 392, 330],
    start: function () {
      this.stop(); this.step = 0; var self = this;
      this.t = setInterval(function () { self.tickB(); }, 165);
    },
    tickB: function () {
      var c = ac(); if (!c || c.state !== 'running') return;
      try { if (localStorage.getItem('aaa_bgm') === '1') return; } catch (e) {}
      var st = this.step++;
      tone(this.bass[st % 8], 0.26, 'sawtooth', 0.03);
      var n = this.arp[st % 8];
      if (n) tone(n * (level > 2 ? 2 : 1), 0.09, 'square', 0.014);
      if (st % 4 === 2) noiseSfx(0.03, 0.012, 6000);
    },
    stop: function () { if (this.t) clearInterval(this.t); this.t = null; }
  };

  function brickWidth() {
    return (W - BRICK_SIDE * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;
  }

  function buildBricks() {
    bricks = [];
    var bw = brickWidth();
    for (var r = 0; r < BRICK_ROWS; r++) {
      for (var c = 0; c < BRICK_COLS; c++) {
        bricks.push({
          x: BRICK_SIDE + c * (bw + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: bw,
          h: BRICK_H,
          row: r,
          color: BRICK_COLORS[r],
          points: (BRICK_ROWS - r) * 10,
          alive: true,
          flash: 0
        });
      }
    }
  }

  function resetBall() {
    ball = {
      x: paddle.x + paddle.w / 2,
      y: PADDLE_Y - BALL_R - 1,
      dx: 0,
      dy: 0,
      speed: 4.2 + (level - 1) * 0.6
    };
    trail = [];
  }

  function launchBall() {
    var angle = -Math.PI / 2 + (Math.random() * 0.5 - 0.25);
    ball.dx = Math.cos(angle) * ball.speed;
    ball.dy = Math.sin(angle) * ball.speed;
    state = 'play';
    sfx.launch();
  }

  function init(keepScore) {
    paddle = { x: W / 2 - PADDLE_W / 2, w: PADDLE_W, h: PADDLE_H, squash: 0 };
    if (!keepScore) { score = 0; lives = 3; level = 1; }
    combo = 0; comboFlash = 0;
    buildBricks();
    resetBall();
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    var hearts = '';
    var heartSvg = '<svg width="15" height="14" viewBox="0 0 16 15" style="vertical-align:-1px"><path d="M8 14 C3 9.5 0.5 6.8 0.5 4 C0.5 1.8 2.2 0.5 4 0.5 C5.5 0.5 7 1.4 8 3 C9 1.4 10.5 0.5 12 0.5 C13.8 0.5 15.5 1.8 15.5 4 C15.5 6.8 13 9.5 8 14 Z" fill="#ff7b72"/></svg>';
    for (var i = 0; i < lives; i++) hearts += heartSvg;
    livesEl.innerHTML = hearts || '&mdash;';
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('breakout_best', String(best)); } catch (e) {}
    }
  }

  function showOverlay(title, text, btn) {
    overlayTitle.textContent = title;
    overlayText.innerHTML = text;
    restartBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }

  function hideOverlay() {
    overlay.classList.add('hidden');
  }

  function spawnParticles(b) {
    for (var i = 0; i < 12; i++) {
      particles.push({
        x: b.x + b.w / 2,
        y: b.y + b.h / 2,
        dx: (Math.random() - 0.5) * 6,
        dy: (Math.random() - 0.5) * 6 - 1,
        life: 1,
        color: b.color,
        r: 2 + Math.random() * 2.5
      });
    }
  }

  function update() {
    animT += 0.016;
    shake = Math.max(0, shake - 0.6);
    comboFlash = Math.max(0, comboFlash - 0.02);
    if (paddle.squash > 0) paddle.squash -= 0.08;

    if (keys['ArrowLeft'])  paddle.x -= PADDLE_SPEED;
    if (keys['ArrowRight']) paddle.x += PADDLE_SPEED;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (state === 'serve') {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = PADDLE_Y - BALL_R - 1;
    }

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.dx; p.y += p.dy; p.dy += 0.12; p.life -= 0.035;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (state !== 'play') return;

    // ball trail
    trail.push({ x: ball.x, y: ball.y, life: 0.5 });
    if (trail.length > 22) trail.shift();
    for (var i = trail.length - 1; i >= 0; i--) {
      trail[i].life -= 0.05;
      if (trail[i].life <= 0) trail.splice(i, 1);
    }

    ball.x += ball.dx;
    ball.y += ball.dy;

    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.dx = Math.abs(ball.dx); sfx.wall(); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.dx = -Math.abs(ball.dx); sfx.wall(); }
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.dy = Math.abs(ball.dy); sfx.wall(); }

    if (ball.dy > 0 &&
        ball.y + BALL_R >= PADDLE_Y &&
        ball.y + BALL_R <= PADDLE_Y + PADDLE_H + Math.abs(ball.dy) &&
        ball.x >= paddle.x - BALL_R &&
        ball.x <= paddle.x + paddle.w + BALL_R) {
      var hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      var ang = hit * (Math.PI / 3);
      ball.dx = Math.sin(ang) * ball.speed;
      ball.dy = -Math.cos(ang) * ball.speed;
      ball.y = PADDLE_Y - BALL_R;
      paddle.squash = 1;
      combo = 0;
      sfx.paddle(hit);
    }

    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + b.w &&
          ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + b.h) {
        b.alive = false;
        combo++;
        comboFlash = 1;
        var bonus = Math.floor(b.points * (1 + Math.min(combo - 1, 8) * 0.25));
        score += bonus;
        spawnParticles(b);
        shake = Math.min(5, 1.5 + combo * 0.4);
        sfx.brick(b.row, combo);
        if (combo >= 3) sfx.combo(combo);
        updateHud();
        var ox = Math.min(ball.x + BALL_R - b.x, b.x + b.w - (ball.x - BALL_R));
        var oy = Math.min(ball.y + BALL_R - b.y, b.y + b.h - (ball.y - BALL_R));
        if (ox < oy) ball.dx = -ball.dx; else ball.dy = -ball.dy;
        break;
      }
    }

    if (bricks.every(function (b) { return !b.alive; })) {
      level++;
      score += 100;
      sfx.level();
      buildBricks();
      resetBall();
      state = 'serve';
      updateHud();
      showOverlay('LEVEL ' + level, 'Faster ball. Keep going!<br>Press <kbd>Space</kbd> or tap to launch', 'CONTINUE');
    }

    if (ball.y - BALL_R > H) {
      lives--;
      combo = 0;
      sfx.lose();
      updateHud();
      if (lives <= 0) {
        state = 'over';
        sfx.over();
        bgm.stop();
        showOverlay('GAME OVER', 'Final score: <b>' + score + '</b>' + (score >= best && score > 0 ? ' — NEW BEST!' : '') + '<br>Press <kbd>R</kbd> to play again', 'RESTART');
      } else {
        resetBall();
        state = 'serve';
      }
    }
  }

  function drawBricks() {
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      var g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
      g.addColorStop(0, b.color);
      g.addColorStop(1, shade(b.color));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      // gloss + edge
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, 4);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    }
  }

  function shade(hex) {
    var n = parseInt(hex.slice(1), 16);
    var r = Math.max(0, (n >> 16) - 90), g = Math.max(0, ((n >> 8) & 255) - 90), b = Math.max(0, (n & 255) - 90);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // starfield
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = 0.25 + 0.35 * Math.abs(Math.sin(animT + s.p));
      ctx.fillStyle = '#9db8ff';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    drawBricks();

    // particles
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ball trail
    for (var i = 0; i < trail.length; i++) {
      var t = trail[i];
      ctx.globalAlpha = t.life * 0.3;
      ctx.fillStyle = '#9fd0ff';
      ctx.beginPath(); ctx.arc(t.x, t.y, BALL_R * t.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // paddle
    var sq = 1 + Math.max(0, paddle.squash) * 0.25;
    ctx.save();
    ctx.translate(paddle.x + paddle.w / 2, PADDLE_Y + PADDLE_H / 2);
    ctx.scale(sq, 1 / sq);
    var pg = ctx.createLinearGradient(0, -PADDLE_H / 2, 0, PADDLE_H / 2);
    pg.addColorStop(0, '#9fd0ff');
    pg.addColorStop(1, '#2f5c9e');
    ctx.shadowColor = 'rgba(88,166,255,0.9)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.roundRect(-paddle.w / 2, -PADDLE_H / 2, paddle.w, PADDLE_H, 6);
    ctx.fill();
    ctx.restore();

    // ball
    ctx.save();
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 16;
    var bg = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, BALL_R + 1);
    bg.addColorStop(0, '#ffffff');
    bg.addColorStop(1, '#79c0ff');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // combo readout
    if (combo >= 2 && state === 'play') {
      ctx.globalAlpha = Math.min(1, comboFlash * 2 + 0.4);
      ctx.font = '800 18px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#f2cc60';
      ctx.shadowColor = 'rgba(242,204,96,.8)';
      ctx.shadowBlur = 10;
      ctx.fillText('COMBO ×' + combo, W / 2, BRICK_TOP - 22);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    if (state === 'serve') {
      ctx.globalAlpha = 0.5 + 0.3 * Math.sin(animT * 4);
      ctx.fillStyle = '#e6edf3';
      ctx.font = '14px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('SPACE / TAP to launch', W / 2, H - 70);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // ---- Input ----
  document.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if (e.key === ' ') {
      e.preventDefault();
      if (state === 'serve') { hideOverlay(); launchBall(); }
      else if (state === 'paused') { state = 'play'; hideOverlay(); }
    }
    if (e.key === 'r' || e.key === 'R') {
      if (state === 'over' || state === 'win' || state === 'menu') {
        startGame();
      }
    }
    if (e.key === 'p' || e.key === 'P') {
      if (state === 'play') {
        state = 'paused';
        showOverlay('PAUSED', 'Press <kbd>Space</kbd> to resume', 'RESUME');
      } else if (state === 'paused') {
        state = 'play';
        hideOverlay();
      }
    }
  });
  document.addEventListener('keyup', function (e) { keys[e.key] = false; });

  function pointToPaddle(clientX) {
    var rect = canvas.getBoundingClientRect();
    var scale = W / rect.width;
    paddle.x = (clientX - rect.left) * scale - paddle.w / 2;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  canvas.addEventListener('mousemove', function (e) { pointToPaddle(e.clientX); });
  canvas.addEventListener('click', function () {
    if (state === 'serve') { hideOverlay(); launchBall(); }
  });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    pointToPaddle(e.touches[0].clientX);
  }, { passive: false });
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    pointToPaddle(e.touches[0].clientX);
    if (state === 'serve') { hideOverlay(); launchBall(); }
  }, { passive: false });

  restartBtn.addEventListener('click', function () {
    if (state === 'over' || state === 'menu') startGame();
    else if (state === 'paused') { state = 'play'; hideOverlay(); }
    else if (state === 'serve') { hideOverlay(); if (ball.dx === 0) launchBall(); }
  });

  function startGame() {
    ac();
    init(false);
    state = 'serve';
    bgm.start();
    hideOverlay();
  }

  if (!ctx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      this.closePath();
      return this;
    };
  }

  state = 'menu';
  init(false);
  loop();
})();
</script>
