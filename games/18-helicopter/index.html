<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Helicopter Cave Flyer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0d18; overflow: hidden; }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';

var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');

var W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- Game state ----------
var STATE_READY = 0, STATE_FLY = 1, STATE_DEAD = 2;
var state = STATE_READY;

var HELI_X_FRAC = 0.28;
var COL_W = 5;               // terrain column width in px
var terrain = [];            // [{top, bot}]
var droppedCols = 0;         // columns shifted out = absolute index of terrain[0]
var scrollPx = 0;            // total pixels scrolled
var speed = 240;             // px/s
var heli = { y: 0, vy: 0, r: 12 };
var thrust = false;
var score = 0, best = 0;
var rotor = 0;
var particles = [];
var caveCenter = 0, caveGap = 0, wobbleT = 0;
var deadTimer = 0, shake = 0;

try { best = parseInt(localStorage.getItem('heli_best') || '0', 10) || 0; } catch (e) { best = 0; }

// ---------- Audio ----------
var ACX = null;
function ac() {
  try {
    if (!ACX) ACX = new (window.AudioContext || window.webkitAudioContext)();
    if (ACX.state === 'suspended') ACX.resume();
  } catch (e) {}
  return ACX;
}
function tone(f, d, type, v, slide, delay) {
  var c = ac(); if (!c) return;
  d = d || 0.1; type = type || 'sine'; v = v || 0.05;
  var t = c.currentTime + (delay || 0);
  try {
    var o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(24, slide), t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + d + 0.04);
  } catch (e) {}
}
var noiseBuf = null;
function getNoiseBuf() {
  var c = ac(); if (!c) return null;
  if (!noiseBuf) {
    var n = Math.floor(c.sampleRate * 1.2);
    noiseBuf = c.createBuffer(1, n, c.sampleRate);
    var ch = noiseBuf.getChannelData(0);
    for (var i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
function noiseSfx(d, v, fc) {
  var c = ac(); if (!c) return;
  var b = getNoiseBuf(); if (!b) return;
  try {
    var s = c.createBufferSource(); s.buffer = b;
    var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc || 1200;
    var g = c.createGain(); g.gain.value = v || 0.1;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(); s.stop(c.currentTime + (d || 0.3));
  } catch (e) {}
}
// rotor hum — looping while thrust held
var rotorNodes = null;
function rotorOn() {
  var c = ac(); if (!c || rotorNodes) return;
  var b = getNoiseBuf(); if (!b) return;
  try {
    var s = c.createBufferSource(); s.buffer = b; s.loop = true;
    var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 300; f.Q.value = 0.8;
    var g = c.createGain(); g.gain.value = 0.0001;
    g.gain.setTargetAtTime(0.05, c.currentTime, 0.04);
    var o = c.createOscillator(), g2 = c.createGain();
    o.type = 'sawtooth'; o.frequency.value = 70;
    g2.gain.value = 0.0001;
    g2.gain.setTargetAtTime(0.016, c.currentTime, 0.04);
    s.connect(f); f.connect(g); g.connect(c.destination);
    o.connect(g2); g2.connect(c.destination);
    s.start(); o.start();
    rotorNodes = { s: s, o: o, g: g, g2: g2 };
  } catch (e) {}
}
function rotorOff() {
  if (!rotorNodes || !ACX) { rotorNodes = null; return; }
  try {
    var t = ACX.currentTime;
    rotorNodes.g.gain.setTargetAtTime(0.0001, t, 0.04);
    rotorNodes.g2.gain.setTargetAtTime(0.0001, t, 0.04);
    var s = rotorNodes.s, o = rotorNodes.o;
    setTimeout(function () { try { s.stop(); o.stop(); } catch (e) {} }, 220);
  } catch (e) {}
  rotorNodes = null;
}
var sfx = {
  crash: function () { noiseSfx(0.5, 0.26, 600); tone(150, 0.4, 'sawtooth', 0.09, 45); tone(95, 0.5, 'square', 0.05, 32, 0.09); },
  mark:  function () { tone(880, 0.09, 'triangle', 0.06); tone(1320, 0.13, 'sine', 0.05, null, 0.07); },
  blip:  function () { tone(720, 0.06, 'sine', 0.05, 980); },
  over:  function () { [392, 330, 262].forEach(function (f, i) { tone(f, 0.22, 'triangle', 0.05, null, i * 0.12); }); }
};
// quiet pulse BGM while flying — ducks when overlay music is enabled
var bgm = {
  t: null, step: 0,
  bass: [98, 98, 110, 87.3],
  start: function () {
    this.stop(); this.step = 0; var self = this;
    this.t = setInterval(function () { self.tick(); }, 240);
  },
  tick: function () {
    var c = ac(); if (!c || c.state !== 'running') return;
    try { if (localStorage.getItem('aaa_bgm') === '1') return; } catch (e) {}
    var st = this.step++;
    if (st % 2 === 0) tone(this.bass[(st >> 3) % 4], 0.2, 'triangle', 0.038);
    if (st % 8 === 4) tone(392 + (st % 16) * 12, 0.1, 'square', 0.012);
  },
  stop: function () { if (this.t) clearInterval(this.t); this.t = null; }
};

var nextMark = 100;

function heliX() { return Math.floor(W * HELI_X_FRAC); }

function reset() {
  state = STATE_READY;
  scrollPx = 0;
  speed = 240;
  score = 0;
  caveGap = Math.min(H * 0.42, 300);
  caveCenter = H * 0.5;
  wobbleT = 0;
  heli.y = caveCenter;
  heli.vy = 0;
  particles = [];
  deadTimer = 0;
  shake = 0;
  terrain = [];
  droppedCols = 0;
  nextMark = 100;
  for (var x = -10; x < W + COL_W * 4; x += COL_W) genColumn();
}

function genColumn() {
  wobbleT += 0.07;
  var drift = Math.sin(wobbleT * 0.9) * 3.2 + Math.sin(wobbleT * 2.7) * 1.4;
  caveCenter += drift + (Math.random() - 0.5) * 6;
  var targetGap = Math.max(H * 0.16, Math.min(H * 0.42, 300) - scrollPx * 0.012);
  caveGap += (targetGap - caveGap) * 0.05;
  var pad = 30;
  var lo = pad + caveGap / 2, hi = H - pad - caveGap / 2;
  if (caveCenter < lo) caveCenter = lo;
  if (caveCenter > hi) caveCenter = hi;
  terrain.push({ top: caveCenter - caveGap / 2, bot: caveCenter + caveGap / 2 });
}

function wallAt(sx) {
  var idx = Math.floor((scrollPx + sx) / COL_W) - droppedCols;
  if (idx < 0) idx = 0;
  if (idx >= terrain.length) idx = terrain.length - 1;
  return terrain[idx] || { top: 0, bot: H };
}

// ---------- Input ----------
function press(e) {
  if (e) e.preventDefault();
  // ignore taps on the shared arcade HUD
  if (e && e.composedPath && e.composedPath().some(function (n) { return n && n.id === 'aaa-arcade-host'; })) return;
  ac();
  if (state === STATE_READY) { state = STATE_FLY; thrust = true; sfx.blip(); bgm.start(); }
  else if (state === STATE_FLY) { thrust = true; }
  else if (state === STATE_DEAD && deadTimer > 0.6) { reset(); state = STATE_FLY; thrust = true; sfx.blip(); bgm.start(); }
}
function release() { thrust = false; }

window.addEventListener('mousedown', press);
window.addEventListener('touchstart', press, { passive: false });
window.addEventListener('mouseup', release);
window.addEventListener('touchend', release);
window.addEventListener('touchcancel', release);
window.addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    if (!e.repeat) press(e);
  }
});
window.addEventListener('keyup', function (e) {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') release();
});
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
window.addEventListener('blur', release);

// ---------- Update ----------
var GRAV = 1500, LIFT = 2600, MAX_VY = 520;

function die() {
  state = STATE_DEAD;
  deadTimer = 0;
  shake = 14;
  rotorOff();
  bgm.stop();
  sfx.crash();
  sfx.over();
  if (window.AAA) { AAA.flash(0.28); AAA.shockwave(heliX(), heli.y, '#ff7043', 110); }
  for (var i = 0; i < 40; i++) {
    var a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 340;
    particles.push({
      x: heliX(), y: heli.y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80,
      life: 0.5 + Math.random() * 0.9, t: 0,
      size: 2 + Math.random() * 5,
      color: Math.random() < 0.5 ? '#ffb03a' : (Math.random() < 0.5 ? '#ff5540' : '#8a93a8')
    });
  }
  if (score > best) {
    best = score;
    try { localStorage.setItem('heli_best', String(best)); } catch (e) {}
  }
}

function update(dt) {
  rotor += dt * (thrust ? 55 : 25);

  // rotor hum follows the throttle
  if (thrust && state === STATE_FLY) rotorOn(); else rotorOff();

  // keep terrain aligned with scrollPx and covering the screen
  var colsDone = Math.floor(scrollPx / COL_W);
  while (droppedCols < colsDone) {
    terrain.shift();
    genColumn();
    droppedCols++;
  }
  var need = Math.ceil(W / COL_W) + 14;
  while (terrain.length < need) genColumn();

  if (state === STATE_FLY) {
    speed = 240 + Math.min(scrollPx * 0.02, 260);
    scrollPx += speed * dt;
    score = Math.floor(scrollPx / 45);

    heli.vy += (thrust ? -LIFT : GRAV) * dt;
    if (heli.vy > MAX_VY) heli.vy = MAX_VY;
    if (heli.vy < -MAX_VY) heli.vy = -MAX_VY;
    heli.y += heli.vy * dt;

    // distance milestones
    if (score >= nextMark) {
      sfx.mark();
      if (window.AAA) AAA.popup(heliX(), heli.y - 40, nextMark + 'm', '#7fe8ff');
      nextMark += 100;
    }

    // exhaust particles while thrusting
    if (thrust && Math.random() < 0.6) {
      particles.push({
        x: heliX() - 18, y: heli.y + 8 + Math.random() * 4,
        vx: -120 - Math.random() * 80, vy: 60 + Math.random() * 60,
        life: 0.4 + Math.random() * 0.3, t: 0,
        size: 2 + Math.random() * 3, color: '#5d6b8c'
      });
    }

    // collision
    var hx = heliX(), r = heli.r;
    var wFront = wallAt(hx + r);
    var wBack = wallAt(hx - r);
    var top = Math.max(wFront.top, wBack.top);
    var bot = Math.min(wFront.bot, wBack.bot);
    if (heli.y - r <= top || heli.y + r >= bot) die();
  } else if (state === STATE_DEAD) {
    deadTimer += dt;
    scrollPx += speed * dt * Math.max(0, 1 - deadTimer * 2);
    shake *= Math.pow(0.02, dt);
    heli.vy += GRAV * dt;
    heli.y += heli.vy * dt * 0.3;
  }

  // particles
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.t += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 500 * dt;
    if (p.t >= p.life) particles.splice(i, 1);
  }
}

// ---------- Render ----------
function draw() {
  var sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  ctx.save();
  ctx.translate(sx, sy);

  // sky
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d1226');
  g.addColorStop(1, '#1a1430');
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // parallax stars
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (var i = 0; i < 60; i++) {
    var px = ((i * 173.3 - scrollPx * 0.15) % (W + 40) + W + 40) % (W + 40) - 20;
    var py = ((i * 97.7) % (H * 0.9)) + 10;
    var tw = 0.3 + 0.7 * Math.abs(Math.sin(i * 3.7 + scrollPx * 0.002));
    ctx.globalAlpha = tw * 0.6;
    ctx.fillRect(px, py, 2, 2);
  }
  ctx.globalAlpha = 1;

  // cave walls
  var offset = scrollPx % COL_W;
  ctx.beginPath();
  ctx.moveTo(-10, -20);
  for (var i = 0; i < terrain.length; i++) ctx.lineTo(i * COL_W - offset, terrain[i].top);
  ctx.lineTo(W + 10, -20);
  ctx.closePath();
  var gTop = ctx.createLinearGradient(0, 0, 0, H * 0.4);
  gTop.addColorStop(0, '#3a2f52');
  gTop.addColorStop(1, '#241d38');
  ctx.fillStyle = gTop;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-10, H + 20);
  for (var i = 0; i < terrain.length; i++) ctx.lineTo(i * COL_W - offset, terrain[i].bot);
  ctx.lineTo(W + 10, H + 20);
  ctx.closePath();
  var gBot = ctx.createLinearGradient(0, H * 0.6, 0, H);
  gBot.addColorStop(0, '#241d38');
  gBot.addColorStop(1, '#3a2f52');
  ctx.fillStyle = gBot;
  ctx.fill();

  // wall edge highlights
  ctx.strokeStyle = '#7a68b8';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (var i = 0; i < terrain.length; i++) {
    var x = i * COL_W - offset;
    if (i === 0) ctx.moveTo(x, terrain[i].top); else ctx.lineTo(x, terrain[i].top);
  }
  ctx.stroke();
  ctx.beginPath();
  for (var i = 0; i < terrain.length; i++) {
    var x = i * COL_W - offset;
    if (i === 0) ctx.moveTo(x, terrain[i].bot); else ctx.lineTo(x, terrain[i].bot);
  }
  ctx.stroke();

  // particles
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (1 - p.t / p.life), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // helicopter
  var hx = heliX(), hy = heli.y;
  var tilt = Math.max(-0.35, Math.min(0.45, heli.vy / 900));
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(tilt);

  // engine glow while climbing
  if (thrust && state === STATE_FLY) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var eg = ctx.createRadialGradient(-14, 6, 2, -14, 6, 22);
    eg.addColorStop(0, 'rgba(255,180,90,0.5)');
    eg.addColorStop(1, 'rgba(255,120,50,0)');
    ctx.fillStyle = eg;
    ctx.fillRect(-40, -18, 52, 48);
    ctx.restore();
  }

  // tail
  ctx.fillStyle = '#e8623a';
  ctx.fillRect(-34, -4, 22, 6);
  ctx.fillRect(-38, -10, 6, 14);
  // body
  ctx.beginPath();
  ctx.ellipse(0, 0, 18, 11, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#ff7a3d';
  ctx.fill();
  // cockpit
  ctx.beginPath();
  ctx.ellipse(8, -2, 7, 6, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#9fd8ff';
  ctx.fill();
  // skid
  ctx.strokeStyle = '#c9cede';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-10, 10); ctx.lineTo(-8, 15); ctx.lineTo(12, 15); ctx.lineTo(14, 10);
  ctx.stroke();
  // rotor mast + blade
  ctx.fillStyle = '#2c2438';
  ctx.fillRect(-1.5, -14, 3, 5);
  var rw = 24 + Math.sin(rotor) * 8;
  ctx.strokeStyle = '#dfe6f5';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-rw, -14); ctx.lineTo(rw, -14);
  ctx.stroke();
  ctx.restore();

  ctx.restore(); // shake

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(score + 'm', 20, 44);
  ctx.font = '14px monospace';
  ctx.fillStyle = '#8a93b8';
  ctx.fillText('BEST ' + best + 'm', 20, 66);

  if (state === STATE_READY) {
    centerText('HELICOPTER', Math.min(64, W * 0.09), '#fff', H * 0.34);
    centerText('Hold SPACE / click / touch to fly', 20, '#9fd8ff', H * 0.34 + 52);
    centerText('Release to fall. Don\'t touch the walls!', 16, '#8a93b8', H * 0.34 + 84);
    if (Math.sin(performance.now() / 300) > -0.2)
      centerText('— press to start —', 18, '#ffb03a', H * 0.34 + 130);
  } else if (state === STATE_DEAD && deadTimer > 0.3) {
    ctx.fillStyle = 'rgba(10,13,24,0.55)';
    ctx.fillRect(0, 0, W, H);
    centerText('CRASHED!', Math.min(56, W * 0.08), '#ff5540', H * 0.36);
    centerText(score + 'm   (best ' + best + 'm)', 22, '#fff', H * 0.36 + 52);
    if (deadTimer > 0.6 && Math.sin(performance.now() / 300) > -0.2)
      centerText('press to fly again', 18, '#ffb03a', H * 0.36 + 96);
  }
}

function centerText(t, size, color, y) {
  ctx.font = 'bold ' + size + 'px monospace';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.fillText(t, W / 2, y);
  ctx.textAlign = 'left';
}

// ---------- Main loop ----------
var last = performance.now();
function frame(now) {
  var dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

reset();
requestAnimationFrame(frame);
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
