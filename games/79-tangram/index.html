<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tangram Puzzle</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:radial-gradient(900px 500px at 50% -10%,#232a52,transparent 60%),radial-gradient(700px 500px at 100% 110%,#1a1438,transparent 60%),#0e1020;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:12px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  .wrap{width:min(640px,100%);display:flex;flex-direction:column;gap:8px}
  .hud{display:flex;justify-content:space-between;align-items:center;background:rgba(31,35,59,.85);border:1px solid #38416b;padding:9px 14px;border-radius:12px;font-weight:800;flex-wrap:wrap;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .hud span{color:#fbbf24;text-shadow:0 0 12px rgba(251,191,36,.5)}
  canvas{width:100%;height:auto;aspect-ratio:600/430;background:#141830;border-radius:14px;border:2px solid #38416b;cursor:grab;display:block;touch-action:none;box-shadow:0 20px 50px rgba(0,0,0,.45)}
  canvas:active{cursor:grabbing}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:#cbd5e1}
  button{padding:10px 16px;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-family:inherit;transition:transform .12s,filter .15s;touch-action:manipulation;min-height:42px}
  button:hover{filter:brightness(1.1)}
  button:active{transform:scale(.96)}
  .b-rot{background:linear-gradient(180deg,#7dd3fc,#0284c7);color:#04121f;box-shadow:0 6px 18px -6px rgba(56,189,248,.7)}
  .b-nxt{background:linear-gradient(180deg,#fde68a,#f59e0b);color:#1c1002;box-shadow:0 6px 18px -6px rgba(251,191,36,.7)}
  .b-res{background:#334155;color:#fff;border:1px solid #475569}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div>Puzzle: <span id="pname">House</span></div>
    <div>Placed: <span id="placed">0/5</span></div>
    <div>Moves: <span id="moves">0</span></div>
    <div>Solved: <span id="solved">0</span></div>
  </div>
  <canvas id="c" width="600" height="430"></canvas>
  <div class="bar">
    <span id="msg">Drag pieces into the silhouette. Tap a piece or press R to rotate 45°.</span>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="b-rot" id="rotBtn">Rotate 45°</button>
      <button class="b-nxt" id="nextBtn">Next</button>
      <button class="b-res" id="resetBtn">Reset</button>
    </div>
  </div>
</div>
<script>
(() => {
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const pnameEl = document.getElementById('pname'), placedEl = document.getElementById('placed'), solvedEl = document.getElementById('solved'), msgEl = document.getElementById('msg');

  // Shapes defined around (0,0) centroid
  const SHAPES = {
    sq:   { pts: [[-35,-35],[35,-35],[35,35],[-35,35]], col: '#f43f5e', sym: 90 },
    triL: { pts: [[-50,35],[50,35],[0,-35]], col: '#38bdf8', sym: 360 },
    triM: { pts: [[-35,25],[35,25],[0,-25]], col: '#a855f7', sym: 360 },
    rect: { pts: [[-45,-20],[45,-20],[45,20],[-45,20]], col: '#22c55e', sym: 180 },
    triS: { pts: [[-25,20],[25,20],[0,-20]], col: '#fbbf24', sym: 360 }
  };

  const PUZZLES = [
    {
      name: 'Rocket',
      slots: [
        { k:'triL', tx:300, ty:115, tang:0 },
        { k:'sq',   tx:300, ty:185, tang:0 },
        { k:'rect', tx:300, ty:240, tang:0 },
        { k:'triS', tx:245, ty:245, tang:270 },
        { k:'triS', tx:355, ty:245, tang:90 }
      ]
    },
    {
      name: 'House',
      slots: [
        { k:'triL', tx:300, ty:125, tang:0 },
        { k:'sq',   tx:300, ty:195, tang:0 },
        { k:'rect', tx:300, ty:250, tang:0 },
        { k:'triS', tx:235, ty:195, tang:270 },
        { k:'triM', tx:370, ty:235, tang:0 }
      ]
    },
    {
      name: 'Sailboat',
      slots: [
        { k:'triL', tx:300, ty:140, tang:0 },
        { k:'triM', tx:255, ty:185, tang:0 },
        { k:'rect', tx:300, ty:245, tang:0 },
        { k:'triS', tx:235, ty:245, tang:180 },
        { k:'triS', tx:365, ty:245, tang:180 }
      ]
    },
    {
      name: 'Tower',
      slots: [
        { k:'triS', tx:300, ty:95,  tang:0 },
        { k:'sq',   tx:300, ty:150, tang:0 },
        { k:'rect', tx:300, ty:205, tang:0 },
        { k:'triM', tx:300, ty:250, tang:180 },
        { k:'triL', tx:300, ty:310, tang:0 }
      ]
    }
  ];

  let pIdx = 0, moves = 0, pieces = [], drag = null, selected = null, won = false;
  let solved = 0;
  try { solved = Math.max(0, parseInt(localStorage.getItem('tangram.solved') || '0', 10) || 0); } catch (e) {}
  const movesEl = document.getElementById('moves');
  solvedEl.textContent = solved;

  /* ---- audio ---- */
  let actx = null;
  function ac() {
    if (window.AAA && AAA.ensureAudio) { try { return AAA.ensureAudio(); } catch (e) {} }
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(f, d, type, vol, at) {
    const c = ac(); if (!c) return;
    try {
      const t = c.currentTime + (at || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.06, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + d + 0.03);
    } catch (e) {}
  }
  const sfxSnap = () => { tone(660, .09, 'triangle', .06); tone(990, .12, 'sine', .05, .06); };
  const sfxRotate = () => tone(440, .05, 'square', .03);
  const sfxPick = () => tone(330, .05, 'sine', .03);
  const sfxWin = () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, 'triangle', .06, i * .08));

  // confetti particles
  const confetti = [];
  function boom(x, y) {
    for (let i = 0; i < 60; i++) {
      const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 4;
      confetti.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
        life: 50 + Math.random() * 40, hue: Math.random() * 360, s: 2 + Math.random() * 3 });
    }
  }

  function loadPuzzle(i) {
    pIdx = (i + PUZZLES.length) % PUZZLES.length;
    const P = PUZZLES[pIdx];
    won = false;
    pnameEl.textContent = P.name;
    const trayX = [85, 85, 85, 515, 515];
    const trayY = [90, 200, 320, 140, 280];
    pieces = P.slots.map((s, idx) => ({
      ...s,
      ...SHAPES[s.k],
      x: trayX[idx],
      y: trayY[idx],
      ang: ((s.tang + (idx % 2 === 0 ? 45 : 90)) % 360),
      snapped: false
    }));
    selected = pieces[0];
    moves = 0;
    movesEl.textContent = '0';
    updateCount();
    msgEl.textContent = 'Drag pieces into the target silhouette. Tap a piece or press R to rotate.';
  }

  function updateCount() {
    const cnt = pieces.filter(p => p.snapped).length;
    placedEl.textContent = cnt + '/' + pieces.length;
    if (cnt === pieces.length && !won) {
      won = true;
      solved++;
      solvedEl.textContent = solved;
      try { localStorage.setItem('tangram.solved', String(solved)); } catch (e) {}
      msgEl.textContent = `${PUZZLES[pIdx].name} complete in ${moves} moves — hit Next for another!`;
      boom(300, 210);
      sfxWin();
      if (window.AAA) {
        try { AAA.flash && AAA.flash('rgba(255,220,120,.25)'); AAA.shockwave && AAA.shockwave(); } catch (e) {}
      }
    }
  }

  function polyPts(pts, x, y, angDeg) {
    const rad = angDeg * Math.PI / 180;
    const ca = Math.cos(rad), sa = Math.sin(rad);
    return pts.map(([px, py]) => [x + px*ca - py*sa, y + px*sa + py*ca]);
  }

  function pointInPoly(x, y, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi)*(y - yi)/(yj - yi + 1e-9) + xi)) inside = !inside;
    }
    return inside;
  }

  function snapReady(p) {
    const diffAng = Math.abs(((p.ang - p.tang) % p.sym + p.sym) % p.sym);
    const angOk = diffAng < 1 || Math.abs(diffAng - p.sym) < 1;
    return angOk && Math.hypot(p.x - p.tx, p.y - p.ty) < 34;
  }

  function checkSnap(p) {
    const wasSnapped = p.snapped;
    if (snapReady(p) && Math.hypot(p.x - p.tx, p.y - p.ty) < 26) {
      p.x = p.tx; p.y = p.ty; p.ang = p.tang; p.snapped = true;
    } else {
      p.snapped = false;
    }
    if (p.snapped && !wasSnapped) sfxSnap();
    updateCount();
  }

  function drawPoly(poly, fill, stroke, lw = 2) {
    ctx.beginPath();
    poly.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }

  function draw() {
    ctx.fillStyle = '#1a1e33';
    ctx.fillRect(0, 0, c.width, c.height);

    // Target silhouette
    const P = PUZZLES[pIdx];
    for (const s of P.slots) {
      const sh = SHAPES[s.k];
      drawPoly(polyPts(sh.pts, s.tx, s.ty, s.tang), '#0d101d', '#334155', 1.5);
    }

    // snap-preview highlight on the dragged/selected piece
    const active = drag ? drag.p : null;
    if (active && !active.snapped && snapReady(active)) {
      const sh = SHAPES[active.k];
      drawPoly(polyPts(sh.pts, active.tx, active.ty, active.tang), 'rgba(74,222,128,0.18)', '#4ade80', 2);
    }

    // Pieces
    for (const p of pieces) {
      const isSel = p === selected;
      if (p.snapped) {
        ctx.save();
        ctx.shadowColor = p.col;
        ctx.shadowBlur = 18;
        drawPoly(polyPts(p.pts, p.x, p.y, p.ang), p.col, 'rgba(255,255,255,.5)', 1.5);
        ctx.restore();
      } else {
        drawPoly(polyPts(p.pts, p.x, p.y, p.ang), p.col, isSel ? '#ffffff' : 'rgba(0,0,0,.4)', isSel ? 3 : 1.5);
      }
    }

    // confetti
    for (let i = confetti.length - 1; i >= 0; i--) {
      const cf = confetti[i];
      cf.x += cf.vx; cf.y += cf.vy; cf.vy += 0.12; cf.life--;
      if (cf.life <= 0 || cf.y > c.height + 10) { confetti.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, cf.life / 30);
      ctx.fillStyle = `hsl(${cf.hue},90%,65%)`;
      ctx.fillRect(cf.x, cf.y, cf.s, cf.s);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }

  function getPos(e) {
    const r = c.getBoundingClientRect();
    return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height };
  }

  c.addEventListener('pointerdown', e => {
    e.preventDefault();
    const { x, y } = getPos(e);
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      if (pointInPoly(x, y, polyPts(p.pts, p.x, p.y, p.ang))) {
        selected = p;
        drag = { p, ox: x - p.x, oy: y - p.y, moved: false };
        pieces.splice(i, 1); pieces.push(p);
        sfxPick();
        break;
      }
    }
  });
  c.addEventListener('pointermove', e => {
    if (!drag) return;
    const { x, y } = getPos(e);
    drag.p.x = x - drag.ox;
    drag.p.y = y - drag.oy;
    drag.p.snapped = false;
    drag.moved = true;
  });
  window.addEventListener('pointerup', () => {
    if (!drag) return;
    if (!drag.moved) {
      drag.p.ang = (drag.p.ang + 45) % 360;
      sfxRotate();
    }
    moves++;
    movesEl.textContent = moves;
    checkSnap(drag.p);
    drag = null;
  });

  function rotateSelected() {
    if (!selected) return;
    selected.ang = (selected.ang + 45) % 360;
    sfxRotate();
    checkSnap(selected);
  }

  document.getElementById('rotBtn').onclick = rotateSelected;
  document.getElementById('nextBtn').onclick = () => loadPuzzle(pIdx + 1);
  document.getElementById('resetBtn').onclick = () => loadPuzzle(pIdx);
  window.addEventListener('keydown', e => { if (e.code === 'KeyR') rotateSelected(); });
  loadPuzzle(0);
  draw();
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
