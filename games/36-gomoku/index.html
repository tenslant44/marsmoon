<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gomoku — Five in a Row</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(circle at 50% 30%, #2b3a4a 0%, #1a2430 70%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e8eef4;
    padding: 20px;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #f0d9a8;
  }
  .subtitle { font-size: 13px; color: #9fb0bf; letter-spacing: 1px; margin-top: -8px; }
  #board {
    background: #e0aa6a;
    border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55), inset 0 0 60px rgba(120,60,10,.25);
    cursor: pointer;
    touch-action: manipulation;
    display: block;
    width: min(92vw, 92vmin, 620px) !important;
    height: auto !important;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    padding: 10px 18px;
    border-radius: 8px;
    min-width: 560px;
    max-width: 90vw;
    justify-content: space-between;
  }
  #status { font-size: 15px; font-weight: 500; }
  .dot {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 50%;
    vertical-align: -2px;
    margin-right: 6px;
  }
  .dot.black { background: radial-gradient(circle at 35% 30%, #666, #000 70%); }
  .dot.white { background: radial-gradient(circle at 35% 30%, #fff, #bbb 75%); }
  button {
    background: #c98f3f;
    border: none;
    color: #1a1208;
    font-weight: 700;
    font-size: 14px;
    padding: 8px 20px;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background .15s, transform .1s;
  }
  button:hover { background: #e0a950; }
  button:active { transform: scale(.96); }
  .score { font-size: 13px; color: #9fb0bf; }
  .score b { color: #e8eef4; }
  @media (max-width: 640px) { .bar { min-width: 0; width: 100%; flex-wrap: wrap; justify-content: center; } }
</style>

<style>
/*AAA-INJECT-CSS*/
html{touch-action:manipulation}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{touch-action:none}
button,input,select,textarea{touch-action:manipulation}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:2147483000;background:radial-gradient(ellipse at 50% 40%,transparent 58%,rgba(0,0,0,.28) 100%)}
</style>

<script>
/*AAA-INJECT-SFX*/
window.__gsfx = (function(){
  var ctx=null;
  function ac(){ if(ctx===null){var A=window.AudioContext||window.webkitAudioContext;ctx=A?new A():false;} if(ctx&&ctx.state==='suspended')ctx.resume().catch(function(){}); return ctx||null; }
  function ok(){ return localStorage.getItem('aaa_sfx')!=='0'; }
  function tone(f,d,type,v,slide,when){ if(!ok())return; var c=ac(); if(!c)return; try{ var t=c.currentTime+(when||0); var o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d); g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(v||0.08,t+0.012); g.gain.exponentialRampToValueAtTime(0.0006,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.03);}catch(e){} }
  function noise(dur,v,fq,when,type){ if(!ok())return; var c=ac(); if(!c)return; try{ var t=c.currentTime+(when||0),n=Math.floor(c.sampleRate*dur); var b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0); for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n); var s=c.createBufferSource(); s.buffer=b; var f=c.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=fq||1200; var g=c.createGain(); g.gain.value=v||0.1; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);}catch(e){} }
  var api={
    unlock:ac, tone:tone, noise:noise,
    tap:function(){tone(520,0.05,'triangle',0.05);},
    key:function(){tone(680+Math.random()*60,0.035,'triangle',0.04);},
    deal:function(){noise(0.09,0.09,2600,0,'highpass');tone(300,0.06,'sine',0.04);},
    flip:function(){noise(0.07,0.08,3200,0,'highpass');},
    chip:function(){tone(1900,0.04,'square',0.03);tone(2400,0.03,'square',0.025,null,0.03);noise(0.04,0.05,5000,0,'highpass');},
    clack:function(){noise(0.045,0.1,1600);tone(220,0.05,'triangle',0.07,150);},
    step:function(){tone(330,0.04,'triangle',0.045,280);},
    slide:function(){noise(0.08,0.06,900);tone(260,0.07,'sine',0.045,200);},
    pop:function(i){i=i||0;tone(500+i*80,0.07,'sine',0.07,900+i*120);noise(0.03,0.04,3000,0,'highpass');},
    shoot:function(){tone(700,0.09,'sawtooth',0.05,1400);},
    thud:function(){tone(120,0.12,'sine',0.12,60);noise(0.07,0.08,600);},
    sonar:function(){tone(880,0.35,'sine',0.06);tone(880,0.2,'sine',0.03,null,0.18);},
    splash:function(){noise(0.3,0.1,1200);},
    boom:function(){tone(80,0.5,'sine',0.2,35);noise(0.4,0.16,400);},
    coin:function(){tone(1318,0.06,'square',0.05);tone(1760,0.12,'square',0.05,null,0.06);},
    ding:function(){tone(1046,0.15,'triangle',0.07);tone(1568,0.18,'triangle',0.06,null,0.08);},
    good:function(){tone(659,0.08,'triangle',0.06);tone(880,0.1,'triangle',0.06,null,0.06);},
    bad:function(){tone(180,0.12,'square',0.05,120);},
    win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,0.2,'triangle',0.08,null,i*0.09);});},
    lose:function(){[392,330,262,196].forEach(function(f,i){tone(f,0.26,'sawtooth',0.05,f*0.92,i*0.13);});},
    chord:function(){tone(523,0.14,'sine',0.05);tone(659,0.14,'sine',0.045,null,0.01);tone(784,0.16,'sine',0.04,null,0.02);}
  };
  function unl(){ac();}
  window.addEventListener('pointerdown',unl,{passive:true});
  window.addEventListener('keydown',unl);
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest?e.target.closest('button'):null; if(b&&!b.disabled)api.tap();},true);
  return api;
})();
</script>
</head>
<body>
<div class="wrap">
  <h1>Gomoku</h1>
  <div class="subtitle">Five in a row wins &mdash; you are Black, AI is White</div>
  <canvas id="board" width="620" height="620"></canvas>
  <div class="bar">
    <span id="status"><span class="dot black"></span>Your move</span>
    <span class="score">You <b id="pw">0</b> &middot; AI <b id="aw">0</b> &middot; Draws <b id="dr">0</b></span>
    <button id="restart">Restart</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var N = 15;                 // board size
  var EMPTY = 0, BLACK = 1, WHITE = 2;   // BLACK = human, WHITE = AI
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var statusEl = document.getElementById('status');
  var pwEl = document.getElementById('pw');
  var awEl = document.getElementById('aw');
  var drEl = document.getElementById('dr');

  var dpr = window.devicePixelRatio || 1;
  var CSS_SIZE = 620;
  if (dpr > 1) {
    canvas.width = CSS_SIZE * dpr;
    canvas.height = CSS_SIZE * dpr;
    canvas.style.width = CSS_SIZE + 'px';
    canvas.style.height = CSS_SIZE + 'px';
    ctx.scale(dpr, dpr);
  }

  var MARGIN = 30;                     // px margin around grid
  var CELL = (CSS_SIZE - MARGIN * 2) / (N - 1);  // spacing between lines

  var board, gameOver, thinking, lastMove, winLine, hover;
  var scores = { p: 0, a: 0, d: 0 };
  function sfx(n, a) { try { if (window.__gsfx && __gsfx[n]) __gsfx[n](a); } catch (e) {} }
  try { var ss = JSON.parse(localStorage.getItem('gomokuScores') || 'null'); if (ss) scores = ss; } catch (e) {}
  pwEl.textContent = scores.p; awEl.textContent = scores.a; drEl.textContent = scores.d;
  function saveScores() { try { localStorage.setItem('gomokuScores', JSON.stringify(scores)); } catch (e) {} }

  function reset() {
    board = [];
    for (var r = 0; r < N; r++) {
      board.push(new Array(N).fill(EMPTY));
    }
    gameOver = false;
    thinking = false;
    lastMove = null;
    winLine = null;
    hover = null;
    setStatus('<span class="dot black"></span>Your move');
    draw();
  }

  function setStatus(html) { statusEl.innerHTML = html; }

  function cellXY(r, c) {
    return { x: MARGIN + c * CELL, y: MARGIN + r * CELL };
  }

  function draw() {
    // wood board
    ctx.fillStyle = '#e0aa6a';
    ctx.fillRect(0, 0, CSS_SIZE, CSS_SIZE);

    // grid
    ctx.strokeStyle = '#5a3a18';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 0; i < N; i++) {
      var p = cellXY(i, 0), q = cellXY(i, N - 1);
      ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
      var p2 = cellXY(0, i), q2 = cellXY(N - 1, i);
      ctx.moveTo(p2.x, p2.y); ctx.lineTo(q2.x, q2.y);
    }
    ctx.stroke();

    // star points
    var stars = [[3,3],[3,11],[7,7],[11,3],[11,11]];
    ctx.fillStyle = '#5a3a18';
    stars.forEach(function (s) {
      var p = cellXY(s[0], s[1]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });

    // hover ghost
    if (hover && !gameOver && !thinking && board[hover.r][hover.c] === EMPTY) {
      var hp = cellXY(hover.r, hover.c);
      ctx.beginPath();
      ctx.arc(hp.x, hp.y, CELL * 0.42, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fill();
    }

    // stones
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        if (board[r][c] !== EMPTY) drawStone(r, c, board[r][c]);
      }
    }

    // last move marker
    if (lastMove) {
      var lp = cellXY(lastMove.r, lastMove.c);
      ctx.strokeStyle = board[lastMove.r][lastMove.c] === BLACK ? '#f0d9a8' : '#c0392b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(lp.x, lp.y, CELL * 0.18, 0, Math.PI * 2);
      ctx.stroke();
    }

    // winning line
    if (winLine) {
      var a = cellXY(winLine[0].r, winLine[0].c);
      var b = cellXY(winLine[4].r, winLine[4].c);
      ctx.save();
      ctx.strokeStyle = '#e74c3c';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(231,76,60,.9)';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawStone(r, c, color) {
    var p = cellXY(r, c);
    var rad = CELL * 0.44;
    var g = ctx.createRadialGradient(p.x - rad * 0.35, p.y - rad * 0.35, rad * 0.1, p.x, p.y, rad);
    if (color === BLACK) {
      g.addColorStop(0, '#777');
      g.addColorStop(1, '#000');
    } else {
      g.addColorStop(0, '#fff');
      g.addColorStop(1, '#b8b8b8');
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // --- win detection ---
  var DIRS = [[0,1],[1,0],[1,1],[1,-1]];
  function inBounds(r, c) { return r >= 0 && r < N && c >= 0 && c < N; }

  function checkWin(r, c, color) {
    for (var d = 0; d < 4; d++) {
      var dr = DIRS[d][0], dc = DIRS[d][1];
      var cells = [{r: r, c: c}];
      var i, rr, cc;
      for (i = 1; i < 5; i++) {
        rr = r + dr * i; cc = c + dc * i;
        if (inBounds(rr, cc) && board[rr][cc] === color) cells.push({r: rr, c: cc});
        else break;
      }
      for (i = 1; i < 5; i++) {
        rr = r - dr * i; cc = c - dc * i;
        if (inBounds(rr, cc) && board[rr][cc] === color) cells.unshift({r: rr, c: cc});
        else break;
      }
      if (cells.length >= 5) return cells.slice(0, 5);
    }
    return null;
  }

  function boardFull() {
    for (var r = 0; r < N; r++)
      for (var c = 0; c < N; c++)
        if (board[r][c] === EMPTY) return false;
    return true;
  }

  // --- AI ---
  // Score a line pattern for `color` at (r,c) in direction (dr,dc).
  function lineScore(r, c, dr, dc, color) {
    var count = 1, open = 0, i, rr, cc;
    for (i = 1; i < 5; i++) {
      rr = r + dr * i; cc = c + dc * i;
      if (!inBounds(rr, cc)) break;
      if (board[rr][cc] === color) count++;
      else { if (board[rr][cc] === EMPTY) open++; break; }
      if (i === 4) break;
    }
    for (i = 1; i < 5; i++) {
      rr = r - dr * i; cc = c - dc * i;
      if (!inBounds(rr, cc)) break;
      if (board[rr][cc] === color) count++;
      else { if (board[rr][cc] === EMPTY) open++; break; }
    }
    if (count >= 5) return 1000000;
    if (count === 4) return open === 2 ? 200000 : (open === 1 ? 20000 : 0);
    if (count === 3) return open === 2 ? 8000 : (open === 1 ? 400 : 0);
    if (count === 2) return open === 2 ? 500 : (open === 1 ? 50 : 0);
    if (count === 1) return open === 2 ? 20 : (open === 1 ? 4 : 0);
    return 0;
  }

  function cellScore(r, c, color) {
    var s = 0;
    for (var d = 0; d < 4; d++) {
      s += lineScore(r, c, DIRS[d][0], DIRS[d][1], color);
    }
    return s;
  }

  // Collect empty cells near existing stones (distance <= 2).
  function candidates() {
    var list = [], hasStone = false;
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        if (board[r][c] !== EMPTY) { hasStone = true; continue; }
        var near = false;
        for (var dr = -2; dr <= 2 && !near; dr++) {
          for (var dc = -2; dc <= 2; dc++) {
            var rr = r + dr, cc = c + dc;
            if (inBounds(rr, cc) && board[rr][cc] !== EMPTY) { near = true; break; }
          }
        }
        if (near) list.push({r: r, c: c});
      }
    }
    if (!hasStone) return [{r: 7, c: 7}];
    return list;
  }

  function aiMove() {
    var cand = candidates();
    var best = null, bestScore = -1;
    for (var i = 0; i < cand.length; i++) {
      var cell = cand[i];
      var attack = cellScore(cell.r, cell.c, WHITE);
      var defend = cellScore(cell.r, cell.c, BLACK);
      // prioritize winning, then blocking opponent wins, then building
      var score = attack * 1.0 + defend * 1.15 + Math.random() * 2;
      if (score > bestScore) { bestScore = score; best = cell; }
    }
    return best;
  }

  function place(r, c, color) {
    board[r][c] = color;
    lastMove = {r: r, c: c};
    var win = checkWin(r, c, color);
    if (win) {
      winLine = win;
      gameOver = true;
      if (color === BLACK) {
        scores.p++; pwEl.textContent = scores.p;
        setStatus('<span class="dot black"></span>You win! Press Restart to play again.');
        sfx('win');
      } else {
        scores.a++; awEl.textContent = scores.a;
        setStatus('<span class="dot white"></span>AI wins. Press Restart to try again.');
        sfx('lose');
      }
      saveScores();
      draw();
      return true;
    }
    if (boardFull()) {
      gameOver = true;
      scores.d++; drEl.textContent = scores.d;
      setStatus('Draw. Press Restart to play again.');
      saveScores();
      sfx('ding');
      draw();
      return true;
    }
    return false;
  }

  function canvasPos(e) {
    var rect = canvas.getBoundingClientRect();
    var x = (e.clientX - rect.left) * (CSS_SIZE / rect.width);
    var y = (e.clientY - rect.top) * (CSS_SIZE / rect.height);
    var c = Math.round((x - MARGIN) / CELL);
    var r = Math.round((y - MARGIN) / CELL);
    if (!inBounds(r, c)) return null;
    var p = cellXY(r, c);
    if (Math.abs(p.x - x) > CELL * 0.48 || Math.abs(p.y - y) > CELL * 0.48) return null;
    return {r: r, c: c};
  }

  canvas.addEventListener('click', function (e) {
    if (gameOver || thinking) return;
    var pos = canvasPos(e);
    if (!pos || board[pos.r][pos.c] !== EMPTY) return;
    sfx('clack');
    if (place(pos.r, pos.c, BLACK)) return;
    thinking = true;
    setStatus('<span class="dot white"></span>AI thinking...');
    draw();
    setTimeout(function () {
      var mv = aiMove();
      thinking = false;
      if (mv) {
        var ended = place(mv.r, mv.c, WHITE);
        if (!ended) { setStatus('<span class="dot black"></span>Your move'); sfx('step'); }
      }
      draw();
    }, 120);
  });

  canvas.addEventListener('mousemove', function (e) {
    var pos = canvasPos(e);
    if ((pos && (!hover || hover.r !== pos.r || hover.c !== pos.c)) || (!pos && hover)) {
      hover = pos;
      draw();
    }
  });

  canvas.addEventListener('mouseleave', function () {
    hover = null;
    draw();
  });

  // touch support
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    canvas.dispatchEvent(new MouseEvent('click', {clientX: t.clientX, clientY: t.clientY}));
  }, {passive: false});

  document.getElementById('restart').addEventListener('click', reset);

  reset();
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
