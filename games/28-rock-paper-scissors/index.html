<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rock Paper Scissors — First to 5</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse 75% 45% at 50% -8%, rgba(239,71,111,0.20) 0%, transparent 60%),
      radial-gradient(ellipse 45% 35% at 10% 105%, rgba(6,214,160,0.12) 0%, transparent 55%),
      radial-gradient(ellipse 45% 35% at 90% 105%, rgba(255,209,102,0.10) 0%, transparent 55%),
      linear-gradient(170deg, #0c1226 0%, #131b3a 55%, #080c1c 100%);
    color: #e8ecf4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  h1 {
    font-size: clamp(1.4rem, 5.5vw, 2.3rem);
    letter-spacing: 0.14em;
    margin-bottom: 4px;
    font-weight: 900;
    background: linear-gradient(90deg, #ffd166, #ef476f 50%, #06d6a0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align: center;
    filter: drop-shadow(0 0 20px rgba(239,71,111,0.35));
  }

  .subtitle {
    color: #7d88a8;
    font-size: .75rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    margin-bottom: 20px;
    text-align: center;
  }

  /* ---------- Scoreboard ---------- */
  .scoreboard {
    display: flex;
    align-items: center;
    gap: 26px;
    margin-bottom: 26px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 12px 30px;
    box-shadow: 0 12px 34px rgba(0,0,0,0.4);
  }

  .score-box { text-align: center; min-width: 64px; }
  .score-box .label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.18em; color: #7d88a8; font-weight: 800; }
  .score-box .value { font-size: 2.3rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  #playerScore { color: #06d6a0; text-shadow: 0 0 18px rgba(6,214,160,0.5); }
  #aiScore { color: #ef476f; text-shadow: 0 0 18px rgba(239,71,111,0.5); }
  .score-vs { font-size: .95rem; color: #556; font-weight: 900; letter-spacing: .1em; }

  /* ---------- Arena ---------- */
  .arena {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 7vw, 72px);
    margin-bottom: 20px;
    min-height: 150px;
  }

  .hand-slot { text-align: center; }
  .hand {
    width: clamp(84px, 22vw, 124px);
    height: clamp(84px, 22vw, 124px);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.55));
    user-select: none;
  }
  .hand svg { width: 100%; height: 100%; }
  #playerHand { color: #06d6a0; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.55)) drop-shadow(0 0 16px rgba(6,214,160,0.4)); }
  #aiHand { color: #ef476f; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.55)) drop-shadow(0 0 16px rgba(239,71,111,0.4)); }
  .hand-name {
    margin-top: 8px;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #7d88a8;
    font-weight: 800;
    min-height: 1.2em;
  }

  #playerHand .fl { transform: scaleX(-1); transform-origin: center; }
  .vs {
    font-size: 1.3rem;
    font-weight: 900;
    color: #4a5578;
    letter-spacing: .1em;
  }

  .shaking #playerHand { animation: shakeL 0.5s ease-in-out; }
  .shaking #aiHand     { animation: shakeR 0.5s ease-in-out; }
  @keyframes shakeL {
    0%,100% { transform: scaleX(-1) translateY(0); }
    25%     { transform: scaleX(-1) translateY(-30px) rotate(-10deg); }
    75%     { transform: scaleX(-1) translateY(7px); }
  }
  @keyframes shakeR {
    0%,100% { transform: translateY(0); }
    25%     { transform: translateY(-30px) rotate(10deg); }
    75%     { transform: translateY(7px); }
  }

  .pop { animation: pop 0.45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop {
    0%   { transform: scale(0.3) rotate(-20deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  #playerHand.pop { animation: popFlip 0.45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes popFlip {
    0%   { transform: scaleX(-1) scale(0.3) rotate(20deg); opacity: 0; }
    100% { transform: scaleX(-1) scale(1) rotate(0); opacity: 1; }
  }

  .arena.impact { animation: impact .3s ease; }
  @keyframes impact { 30% { transform: scale(1.02); } 60% { transform: scale(0.995); } }

  /* ---------- Result banner ---------- */
  .result {
    min-height: 2.2em;
    font-size: clamp(1.05rem, 3.4vw, 1.5rem);
    font-weight: 800;
    letter-spacing: .04em;
    margin-bottom: 20px;
    text-align: center;
    transition: opacity 0.2s;
  }
  .result.win  { color: #06d6a0; text-shadow: 0 0 22px rgba(6,214,160,0.55); }
  .result.lose { color: #ef476f; text-shadow: 0 0 22px rgba(239,71,111,0.55); }
  .result.tie  { color: #ffd166; text-shadow: 0 0 22px rgba(255,209,102,0.5); }

  /* ---------- Choice buttons ---------- */
  .choices { display: flex; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; justify-content: center; }
  .choice {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.14);
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.09), rgba(255,255,255,0.03) 70%);
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-family: inherit;
    color: #cdd6ee;
    touch-action: manipulation;
  }
  .choice svg { width: 44px; height: 44px; }
  .choice .lbl { font-size: .58rem; font-weight: 800; letter-spacing: .14em; }
  .choice[data-choice="rock"] { color: #ffd166; }
  .choice[data-choice="paper"] { color: #56ccf2; }
  .choice[data-choice="scissors"] { color: #f472b6; }
  @media (hover: hover) {
    .choice:hover:not(:disabled) {
      transform: translateY(-6px) scale(1.07);
      border-color: currentColor;
      box-shadow: 0 12px 28px rgba(0,0,0,0.4), 0 0 22px currentColor;
    }
  }
  .choice:active:not(:disabled) { transform: scale(0.92); }
  .choice:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ---------- Restart ---------- */
  #restart {
    font: inherit;
    font-weight: 800;
    font-size: .85rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #2a1a00;
    background: linear-gradient(135deg, #ffd166, #f4a800);
    border: none;
    border-radius: 999px;
    padding: 13px 36px;
    cursor: pointer;
    transition: transform 0.15s, filter 0.15s;
    display: none;
    box-shadow: 0 8px 24px rgba(255,209,102,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    touch-action: manipulation;
  }
  #restart:active { transform: translateY(1px); }
  @media (hover: hover) { #restart:hover { filter: brightness(1.1); transform: translateY(-2px); } }

  .round-log {
    font-size: 0.8rem;
    color: #5a6488;
    min-height: 1.2em;
    margin-top: 6px;
    text-align: center;
  }
  #matchRecord { margin-top: 10px; font-size: .74rem; font-weight: 800; letter-spacing: .14em; color: #7d88a8; }
  #matchRecord b { color: #ffd166; }
  .kbd { margin-top: 8px; font-size: .68rem; color: #4a5578; letter-spacing: .2em; text-transform: uppercase; }
</style>
</head>
<body>
  <h1>ROCK &middot; PAPER &middot; SCISSORS</h1>
  <div class="subtitle">First to 5 wins the match</div>

  <div class="scoreboard">
    <div class="score-box">
      <div class="label">You</div>
      <div class="value" id="playerScore">0</div>
    </div>
    <div class="score-vs">VS</div>
    <div class="score-box">
      <div class="label">AI</div>
      <div class="value" id="aiScore">0</div>
    </div>
  </div>

  <div class="arena" id="arena">
    <div class="hand-slot">
      <div class="hand" id="playerHand"><span class="fl" id="playerIcon"></span></div>
      <div class="hand-name" id="playerLabel">You</div>
    </div>
    <div class="vs">VS</div>
    <div class="hand-slot">
      <div class="hand" id="aiHand"><span id="aiIcon"></span></div>
      <div class="hand-name" id="aiLabel">AI</div>
    </div>
  </div>

  <div class="result" id="result">Pick your weapon!</div>

  <div class="choices" id="choices">
    <button class="choice" data-choice="rock"><span class="ic"></span><span class="lbl">ROCK</span></button>
    <button class="choice" data-choice="paper"><span class="ic"></span><span class="lbl">PAPER</span></button>
    <button class="choice" data-choice="scissors"><span class="ic"></span><span class="lbl">SCISSORS</span></button>
  </div>

  <button id="restart">Play Again</button>
  <div class="round-log" id="roundLog"></div>
  <div id="matchRecord"></div>
  <div class="kbd">R &middot; P &middot; S to throw</div>

<script>
(function () {
  'use strict';

  // Hand-drawn SVG hands (fist / open palm / scissored fingers)
  var ICONS = {
    rock: '<svg viewBox="0 0 64 64" fill="none"><g fill="currentColor"><rect x="17" y="12" width="8" height="16" rx="4"/><rect x="26.5" y="9" width="8" height="19" rx="4"/><rect x="36" y="12" width="8" height="16" rx="4"/><rect x="44.5" y="16" width="7" height="13" rx="3.5"/><path d="M14 32 Q14 24 22 24 L42 24 Q52 24 52 34 L52 46 Q52 56 42 56 L24 56 Q14 56 14 46 Z"/><rect x="14" y="30" width="10" height="18" rx="5" transform="rotate(-18 19 39)"/></g><path d="M20 34 H46 M20 41 H46 M20 48 H42" stroke="rgba(0,0,0,0.28)" stroke-width="2.4" stroke-linecap="round"/></svg>',
    paper: '<svg viewBox="0 0 64 64" fill="none"><g fill="currentColor"><rect x="18" y="8" width="7.5" height="24" rx="3.75"/><rect x="27" y="5" width="7.5" height="27" rx="3.75"/><rect x="36" y="8" width="7.5" height="24" rx="3.75"/><rect x="44.5" y="13" width="7" height="19" rx="3.5"/><path d="M17 30 Q17 27 20 27 L46 27 Q52 27 52 34 L52 46 Q52 58 40 58 L30 58 Q17 58 17 46 Z"/><rect x="10" y="30" width="9" height="16" rx="4.5" transform="rotate(-24 14.5 38)"/></g><path d="M24 36 H48 M24 43 H48 M24 50 H44" stroke="rgba(0,0,0,0.25)" stroke-width="2.2" stroke-linecap="round"/></svg>',
    scissors: '<svg viewBox="0 0 64 64" fill="none"><g fill="currentColor"><rect x="24" y="4" width="8" height="26" rx="4" transform="rotate(-14 28 17)"/><rect x="36" y="4" width="8" height="26" rx="4" transform="rotate(14 40 17)"/><path d="M16 30 Q16 24 24 24 L40 24 Q50 24 50 34 L50 46 Q50 58 38 58 L28 58 Q16 58 16 46 Z"/><circle cx="20" cy="27" r="4.6"/><circle cx="14" cy="34" r="4"/></g><path d="M23 40 H45 M23 47 H42" stroke="rgba(0,0,0,0.25)" stroke-width="2.2" stroke-linecap="round"/></svg>'
  };
  var BEATS = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
  var WIN_SCORE = 5;

  var playerScoreEl = document.getElementById('playerScore');
  var aiScoreEl     = document.getElementById('aiScore');
  var playerHand    = document.getElementById('playerHand');
  var aiHand        = document.getElementById('aiHand');
  var playerIcon    = document.getElementById('playerIcon');
  var aiIcon        = document.getElementById('aiIcon');
  var playerLabel   = document.getElementById('playerLabel');
  var aiLabel       = document.getElementById('aiLabel');
  var resultEl      = document.getElementById('result');
  var arena         = document.getElementById('arena');
  var choicesEl     = document.getElementById('choices');
  var restartBtn    = document.getElementById('restart');
  var roundLog      = document.getElementById('roundLog');
  var matchRec      = document.getElementById('matchRecord');

  var playerScore = 0;
  var aiScore = 0;
  var busy = false;
  var gameOver = false;
  var timers = [];
  var record = { w: 0, l: 0 };
  try { Object.assign(record, JSON.parse(localStorage.getItem('rps_record') || '{}')); } catch (e) {}

  // ---------- Procedural SFX ----------
  var SFX = (function () {
    var ctx = null;
    function ac() {
      if (ctx === null) { var A = window.AudioContext || window.webkitAudioContext; ctx = A ? new A() : false; }
      if (ctx && ctx.state === 'suspended') ctx.resume().catch(function () {});
      return ctx || null;
    }
    var ok = function () { return localStorage.getItem('aaa_sfx') !== '0'; };
    function tone(f, d, type, v, slide, when) {
      if (!ok()) return; var c = ac(); if (!c) return;
      try {
        var t = c.currentTime + (when || 0);
        var o = c.createOscillator(), g = c.createGain();
        o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(v || 0.08, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0006, t + d);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.03);
      } catch (e) {}
    }
    function noise(dur, v, fq, when) {
      if (!ok()) return; var c = ac(); if (!c) return;
      try {
        var t = c.currentTime + (when || 0), n = Math.floor(c.sampleRate * dur);
        var b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
        for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
        var s = c.createBufferSource(); s.buffer = b;
        var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fq || 1200;
        var g = c.createGain(); g.gain.value = v || 0.1;
        s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      } catch (e) {}
    }
    return {
      unlock: ac,
      pump: function (i) { tone(240 + i * 90, 0.1, 'triangle', 0.06, 200 + i * 90); noise(0.06, 0.04, 800); },
      slam: function () { tone(95, 0.22, 'sine', 0.16, 45); noise(0.12, 0.14, 1400); },
      win: function () { [659, 784, 988, 1319].forEach(function (f, i) { tone(f, 0.16, 'triangle', 0.08, null, i * 0.07); }); },
      lose: function () { tone(220, 0.24, 'sawtooth', 0.07, 130); tone(160, 0.3, 'sawtooth', 0.06, 95, 0.14); },
      tie: function () { tone(440, 0.12, 'triangle', 0.06); tone(440, 0.14, 'triangle', 0.05, null, 0.14); },
      matchWin: function () { [523, 659, 784, 1047, 1319, 1568].forEach(function (f, i) { tone(f, 0.22, 'triangle', 0.09, null, i * 0.09); }); },
      matchLose: function () { [392, 330, 262, 196].forEach(function (f, i) { tone(f, 0.28, 'sawtooth', 0.055, f * 0.92, i * 0.14); }); }
    };
  })();
  window.addEventListener('pointerdown', SFX.unlock, { passive: true });
  window.addEventListener('keydown', SFX.unlock);

  function renderRecord() {
    matchRec.innerHTML = 'MATCH RECORD &mdash; W <b>' + record.w + '</b> &middot; L <b>' + record.l + '</b>';
  }

  function schedule(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function setButtonsEnabled(enabled) {
    var btns = choicesEl.querySelectorAll('.choice');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = !enabled;
  }

  function updateScore() {
    playerScoreEl.textContent = playerScore;
    aiScoreEl.textContent = aiScore;
  }

  function setResult(text, cls) {
    resultEl.textContent = text;
    resultEl.className = 'result' + (cls ? ' ' + cls : '');
  }

  function resetHands() {
    playerIcon.innerHTML = ICONS.rock;
    aiIcon.innerHTML = ICONS.rock;
    playerHand.classList.remove('pop');
    aiHand.classList.remove('pop');
    playerLabel.textContent = 'You';
    aiLabel.textContent = 'AI';
  }

  function play(playerChoice) {
    if (busy || gameOver) return;
    busy = true;
    setButtonsEnabled(false);
    resetHands();
    setResult('Rock… Paper… Scissors…', '');

    var pumps = 0;
    function pump() {
      arena.classList.remove('shaking');
      void arena.offsetWidth;
      arena.classList.add('shaking');
      SFX.pump(pumps);
      pumps++;
      if (pumps < 3) schedule(pump, 500);
      else schedule(function () { reveal(playerChoice); }, 500);
    }
    pump();
  }

  function reveal(playerChoice) {
    arena.classList.remove('shaking');
    arena.classList.remove('impact'); void arena.offsetWidth;
    arena.classList.add('impact');
    SFX.slam();

    var options = ['rock', 'paper', 'scissors'];
    var aiChoice = options[Math.floor(Math.random() * 3)];

    playerIcon.innerHTML = ICONS[playerChoice];
    aiIcon.innerHTML = ICONS[aiChoice];
    playerHand.classList.add('pop');
    aiHand.classList.add('pop');
    playerLabel.textContent = capitalize(playerChoice);
    aiLabel.textContent = capitalize(aiChoice);

    if (playerChoice === aiChoice) {
      setResult("It's a tie!", 'tie');
      roundLog.textContent = 'Both threw ' + playerChoice + '.';
      SFX.tie();
    } else if (BEATS[playerChoice] === aiChoice) {
      playerScore++;
      setResult('You win the round!', 'win');
      roundLog.textContent = capitalize(playerChoice) + ' beats ' + aiChoice + '.';
      SFX.win();
    } else {
      aiScore++;
      setResult('AI wins the round!', 'lose');
      roundLog.textContent = capitalize(aiChoice) + ' beats ' + playerChoice + '.';
      SFX.lose();
    }
    updateScore();

    schedule(function () {
      if (playerScore >= WIN_SCORE || aiScore >= WIN_SCORE) endMatch();
      else { busy = false; setButtonsEnabled(true); }
    }, 750);
  }

  function endMatch() {
    gameOver = true;
    var won = playerScore >= WIN_SCORE;
    if (won) { record.w++; SFX.matchWin(); } else { record.l++; SFX.matchLose(); }
    localStorage.setItem('rps_record', JSON.stringify(record));
    renderRecord();
    setResult(won ? 'YOU WIN THE MATCH ' + playerScore + '–' + aiScore + '!'
                  : 'AI TAKES THE MATCH ' + aiScore + '–' + playerScore + '.',
              won ? 'win' : 'lose');
    roundLog.textContent = '';
    restartBtn.style.display = 'inline-block';
    busy = false;
  }

  function restart() {
    clearTimers();
    playerScore = 0;
    aiScore = 0;
    busy = false;
    gameOver = false;
    updateScore();
    resetHands();
    arena.classList.remove('shaking');
    setResult('Pick your weapon!', '');
    roundLog.textContent = '';
    restartBtn.style.display = 'none';
    setButtonsEnabled(true);
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // inject SVG icons into choice buttons
  choicesEl.querySelectorAll('.choice').forEach(function (b) {
    b.querySelector('.ic').innerHTML = ICONS[b.dataset.choice];
  });

  choicesEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.choice');
    if (btn) play(btn.getAttribute('data-choice'));
  });
  restartBtn.addEventListener('click', restart);

  document.addEventListener('keydown', function (e) {
    if (busy || gameOver) {
      if (gameOver && (e.key === 'Enter' || e.key === ' ')) restart();
      return;
    }
    var k = e.key.toLowerCase();
    if (k === 'r') play('rock');
    else if (k === 'p') play('paper');
    else if (k === 's') play('scissors');
  });

  resetHands();
  renderRecord();
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
